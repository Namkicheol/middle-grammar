## CHECKLIST — 학생으로서 매번 본다

### 1. 첫 30초 (Onboarding)
- 게임 시작하면 **뭘 눌러야 하는지 바로 이해되나?** 튜토리얼/안내가 있나?
- HUD에 버튼·게이지·아이템이 많은데 각각 뭔지 설명 없이 방치하나?
- 헷갈리는 UI 문구, 정체불명 아이콘이 있나?

### 2. 재미·재방문 동기 (Fun & Retention)
- 어디서 신나고(타격감·연출·반전) 어디서 **지루하거나 짜증나나?**
- **"한 판 더!" 누르게 만드는 요소**가 충분한가? (진행감·보상·변화·기록)
- 같은 패턴 반복으로 금방 질리는 구간은?

### 3. 난이도·공정성 (Difficulty & Fairness)
- 너무 쉽거나(찍어도 됨) 너무 어려운(순삭) 구간은?
- 시간제한·상태이상(빙결/감전/화염)이 **불공평하게** 느껴지나? 내 실력이 아니라 운/렉으로 지나?
- 고위험 선택(정예 보스 등)이 초반에 너무 가혹한가? 학생이 그게 얼마나 센지 모르고 고르나?
- 패배 페널티가 과한가? (처음부터 리셋 등)

### 4. 학습 vs 재미 균형 (Learn vs Play)
- 문제 풀이가 **'숙제'처럼 느껴지나, '게임'처럼 느껴지나?**
- 복습·약점 보완 장치가 **보상처럼** 느껴지나 **벌처럼** 느껴지나?
- 틀렸을 때 "왜 틀렸는지"를 알려주나, 그냥 틀렸다고만 하나?

### 5. 선택의 의미 (Meaningful Choices)
- 스탠스/갈림길/강화카드/모드 선택이 **실제로 고민되는 선택**인가, 아니면 정답이 하나라 그냥 클릭하고 넘어가나?
- 수치를 따져봤을 때 **늘 우월한 한 선택지**가 있어서 나머지가 함정인 경우는? (예: 항상 강타가 이득)
- 학생이 "이번엔 이렇게 가볼까?" 전략을 고민하게 되나?

### 6. 모바일 사용성 (Mobile UX)
- 탭 타깃이 충분히 큰가(손가락으로 누르기)? 텍스트가 작은 폰에서 읽히나(`rem` 값 확인)?
- 화면이 꽉 차서 답답하거나, 반대로 텅 비어 허전한가?
- 문제 풀 때 다른 요소(아이템·보스)가 가려지거나 집중을 방해하나?

### 7. 빠진 것 (Missing for a Student)
- 중학생이 기대하는데 없는 것: **친구와 경쟁**(랭킹·자랑)? **수집**(도감·스킨·도장)? **진도 가시화**(몇 단원 깼는지)? **꾸미기**?
- 거창한 서버 없이 가능한 가벼운 버전으로 제안한다 (예: 기록 공유 버튼, 단원 클리어 ⭐ 스탬프).

