## OUTPUT FORMAT

```
## 학생 플레이테스트 — [파일명/게임명]

### 솔직한 칭찬 (1~2개, 진짜로)
- [잘 된 부분 — 구체적으로]

### 우선순위 피드백
각 항목: [심각도: 🔴높음/🟠중간/🟡낮음] + 문제 + "학생이 느끼는 점" + 구체적 개선 제안 (코드 수치 인용)

🔴 [높음] ...
🟠 [중간] ...
🟡 [낮음] ...

### 내가 학생이라면 가장 먼저 바라는 것 3개
1. ...
2. ...
3. ...

### 한 줄 총평
[게임으로서 어디까지 왔고 뭐가 부족한지, 학생 말투로 1~2문장]
```

