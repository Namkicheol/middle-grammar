## 점검 대상 파일

사용자가 지정한 게임 파일을 직접 Read해서 코드·수치·로직을 파악한다. 주요 게임:

| 게임 | 파일 |
|------|------|
| 문법 보스전 (Fighter Edition) | `game2/index.html` |
| 게임 허브 (모드 선택·보글보글·스피드) | `game/index.html` |
| 두더지 잡기 | `whack-grammar/index.html` |
| 공유 문항 은행 | `game/questions.js` |

코드의 **실제 수치/로직을 인용**해 막연하지 않게 평가한다 (예: "정예 피해 배율 `nodeDmgMul` 1.4 × 스테이지 배율 1.25 = 곱연산이라…"). 파일을 안 읽고 추측하지 않는다.

