<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>문법 보스전 — Fighter Edition</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#000;overflow:hidden;font-family:'Baloo 2','Noto Sans KR',sans-serif;touch-action:none;}

/* ── SELECT SCREEN ── */
#sel{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e1b4b 45%,#0f172a);overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.sel-head{width:100%;max-width:560px;padding:28px 20px 0;text-align:center;}
.sel-title{font-size:1.9rem;font-weight:900;color:#fff;text-shadow:0 0 24px rgba(124,58,237,.8);}
.sel-sub{font-size:.85rem;color:#a78bfa;margin-top:4px;}
.sel-boss-row{display:flex;justify-content:center;gap:14px;margin:18px 0 10px;align-items:flex-end;}
.sel-boss-row img{height:80px;width:auto;filter:drop-shadow(0 4px 16px rgba(124,58,237,.6));transition:.2s;}
.sel-boss-row img:hover{transform:scale(1.08);}
.sel-units{width:100%;max-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 20px 40px;}
.unit-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;cursor:pointer;transition:all .16s;color:#fff;}
.unit-card:hover,.unit-card:active{background:rgba(124,58,237,.22);border-color:#7c3aed;transform:translateY(-2px);}
.unit-card .uc-lbl{font-size:.68rem;font-weight:900;letter-spacing:.8px;color:#a78bfa;margin-bottom:5px;}
.unit-card h3{font-size:.95rem;font-weight:900;line-height:1.3;}
.unit-card .uc-cnt{font-size:.7rem;color:#94a3b8;margin-top:6px;}
.all-card{grid-column:1/-1;background:linear-gradient(135deg,#4c1d95,#7c3aed,#1d4ed8);border:none;border-radius:18px;padding:18px;text-align:center;cursor:pointer;color:#fff;font-weight:900;font-size:1.05rem;box-shadow:0 12px 28px rgba(124,58,237,.4);transition:all .16s;}
.all-card:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(124,58,237,.5);}
.back-link{text-align:center;padding-bottom:14px;}
.back-link a{color:#94a3b8;font-size:.82rem;text-decoration:none;}

/* ── GAME SCREEN ── */
#game{position:fixed;inset:0;display:none;}
canvas#c{position:absolute;inset:0;width:100%;height:100%;}

/* ── ARENA (character stage) ── */
#arena{position:absolute;left:0;right:0;bottom:0;height:72%;pointer-events:none;}

/* ── CHARACTERS ── */
#hero-wrap{position:absolute;left:8%;bottom:26%;transform-origin:bottom center;transition:transform .15s;}
#boss-wrap{position:absolute;right:8%;bottom:26%;transform-origin:bottom center;transition:transform .15s;}
#hero-img{height:clamp(140px,22vw,240px);width:auto;filter:drop-shadow(0 8px 24px rgba(14,165,233,.5));transform-origin:bottom center;}
#boss-img{height:clamp(140px,22vw,240px);width:auto;filter:drop-shadow(0 8px 24px rgba(239,68,68,.5));transform-origin:bottom center;}

/* Idle float animation */
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#hero-img.idle{animation:heroFloat 2.2s ease-in-out infinite;}
#boss-img.idle{animation:bossFloat 2.6s ease-in-out infinite;}

/* Attack */
@keyframes heroAttack{0%{transform:translateX(0) scale(1)}30%{transform:translateX(30px) scale(1.12)}70%{transform:translateX(20px) scale(1.08)}100%{transform:translateX(0) scale(1)}}
#hero-img.attack{animation:heroAttack .5s ease-out forwards;}

/* Hurt */
@keyframes heroHurt{0%,100%{transform:translateX(0);filter:drop-shadow(0 8px 24px rgba(14,165,233,.5))}25%,75%{transform:translateX(-14px);filter:drop-shadow(0 8px 24px rgba(239,68,68,.9)) brightness(1.4)}}
#hero-img.hurt{animation:heroHurt .45s ease-out forwards;}

/* Boss hurt */
@keyframes bossHurt{0%,100%{transform:translateX(0)}30%{transform:translateX(22px)}70%{transform:translateX(14px)}}
#boss-img.hit{animation:bossHurt .45s ease-out forwards;filter:drop-shadow(0 8px 28px rgba(239,68,68,.95)) brightness(1.5)!important;}

/* Boss windup shake */
@keyframes bossCharge{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(-6px) scale(1.06)}}
#boss-img.windup{animation:bossCharge .4s ease-in-out infinite;}

/* Phase transform flash */
@keyframes phaseFlash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
#phase-flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:70;opacity:0;}
#phase-flash.go{animation:phaseFlash .8s ease-out forwards;}

/* ── HUD ── */
#hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;padding:8px 12px 4px;background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,transparent 100%);}
.hud-bars{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.hp-side{flex:1;display:flex;align-items:center;gap:6px;}
.hp-side.right{flex-direction:row-reverse;}
.hp-name{font-size:.75rem;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.9);}
.hp-bar-wrap{flex:1;height:13px;background:rgba(0,0,0,.6);border-radius:999px;border:1.5px solid rgba(255,255,255,.18);overflow:hidden;position:relative;}
.hp-fill{height:100%;border-radius:999px;transition:width .3s ease;}
#hero-hp-fill{background:linear-gradient(90deg,#22c55e,#4ade80);box-shadow:0 0 8px rgba(34,197,94,.6);}
#boss-hp-fill{background:linear-gradient(90deg,#ef4444,#f97316);box-shadow:0 0 8px rgba(239,68,68,.6);}
.vs-badge{font-size:.72rem;font-weight:900;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 8px;white-space:nowrap;}
.hud-info{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.combo-badge{background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.35);border-radius:20px;padding:3px 12px;font-size:.8rem;font-weight:900;color:#fde68a;}
.stage-badge{background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.35);border-radius:20px;padding:3px 12px;font-size:.8rem;font-weight:900;color:#c4b5fd;}
.score-badge{font-size:.8rem;font-weight:900;color:#93c5fd;}
.hp-num{font-size:.7rem;font-weight:900;color:rgba(255,255,255,.8);min-width:26px;}

/* ── BOSS TELEGRAPH ── */
#tel{position:absolute;left:12px;right:12px;top:90px;z-index:20;display:none;}
.tel-inner{background:rgba(0,0,0,.82);border:1.5px solid rgba(251,191,36,.5);border-radius:14px;padding:7px 12px;backdrop-filter:blur(6px);}
.tel-label{font-size:.75rem;font-weight:900;color:#fde68a;margin-bottom:5px;text-align:center;letter-spacing:.04em;}
.tel-track{height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;}
.tel-fill{height:100%;width:0%;background:linear-gradient(90deg,#fbbf24,#f97316,#ef4444);border-radius:999px;box-shadow:0 0 8px rgba(251,191,36,.6);}

/* ── STATUS EFFECTS ── */
#status-row{position:absolute;left:12px;top:92px;z-index:15;display:flex;gap:6px;pointer-events:none;}
.sfx-badge{background:rgba(0,0,0,.75);border-radius:8px;padding:4px 8px;font-size:.75rem;font-weight:900;border:1px solid rgba(255,255,255,.2);animation:sfxPulse 2s infinite;}
@keyframes sfxPulse{0%,100%{opacity:1}50%{opacity:.65}}

/* ── DROP ITEMS ── */
.drop-item{position:absolute;font-size:2rem;cursor:pointer;z-index:22;pointer-events:all;filter:drop-shadow(0 4px 10px rgba(0,0,0,.8));}
@keyframes dropFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.08)}}
.drop-item{animation:dropFloat 1.4s ease-in-out infinite;}

/* ── QUESTION POPUP ── */
#qpop{position:absolute;left:0;right:0;bottom:0;z-index:30;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);}
#qpop.show{transform:translateY(0);}
.qpop-inner{background:linear-gradient(170deg,#1a0533,#0f0824);border-top:2px solid #7c3aed;padding:14px 14px 20px;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.7);}
.qpop-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.qpop-atk-label{font-size:.72rem;font-weight:900;color:#f97316;letter-spacing:.05em;}
.qpop-timer{font-size:.95rem;font-weight:900;color:#fde68a;font-variant-numeric:tabular-nums;}
.qpop-timer.warn{color:#f97316;}
.qpop-timer.crit{color:#ef4444;animation:blink .45s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.timer-bar{height:5px;background:rgba(255,255,255,.1);border-radius:999px;margin-bottom:10px;overflow:hidden;}
.timer-fill{height:100%;background:#fbbf24;border-radius:999px;transition:width .1s linear;}
.qpop-eng{font-size:1.08rem;font-weight:900;color:#fff;line-height:1.55;margin-bottom:5px;}
.qpop-kor{font-size:.82rem;color:#c4b5fd;margin-bottom:12px;line-height:1.4;}
.qpop-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.qopt{padding:12px 8px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.qopt:active{transform:scale(.97);}
.qopt:disabled{cursor:default;}
.qopt.ok{background:#14532d!important;border-color:#22c55e!important;color:#86efac!important;}
.qopt.ng{background:#450a0a!important;border-color:#ef4444!important;color:#fca5a5!important;}
.qopt.reveal{background:#14532d!important;border-color:#22c55e!important;color:#86efac!important;}
.qpop-fb{min-height:26px;font-size:.84rem;font-weight:800;text-align:center;margin-top:8px;}
.qpop-fb.ok{color:#86efac;}
.qpop-fb.ng{color:#fca5a5;}

/* ── DAMAGE FLOAT ── */
@keyframes dmgFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}
.dmg-float{position:fixed;pointer-events:none;font-weight:900;z-index:60;animation:dmgFloat .9s ease-out forwards;}

/* ── PHASE CUTSCENE ── */
#cut{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);}
#cut.show{display:flex;}
.cut-card{text-align:center;color:#fff;}
@keyframes cutIn{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.cut-card{animation:cutIn .55s cubic-bezier(.34,1.56,.64,1);}
.cut-phase{font-size:.82rem;font-weight:900;color:#fbbf24;letter-spacing:.35em;margin-bottom:14px;}
.cut-chars{display:flex;justify-content:center;align-items:flex-end;gap:32px;margin-bottom:16px;}
.cut-chars img{height:160px;width:auto;filter:drop-shadow(0 0 28px rgba(124,58,237,.9));}
@keyframes cutCharIn{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.cut-chars img{animation:cutCharIn .7s cubic-bezier(.34,1.56,.64,1);}
.cut-name{font-size:2rem;font-weight:900;color:#fff;text-shadow:0 0 28px rgba(139,92,246,.8);}
.cut-sub{font-size:.9rem;color:#a78bfa;margin-top:6px;}

/* ── RESULT ── */
#result{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);}
#result.show{display:flex;}
.result-card{text-align:center;color:#fff;padding:28px 36px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:28px;backdrop-filter:blur(12px);max-width:480px;width:92%;max-height:85vh;overflow-y:auto;}
.result-icon{font-size:4rem;margin-bottom:8px;}
.result-title{font-size:2rem;font-weight:900;margin-bottom:4px;}
.result-sub{font-size:.88rem;color:#94a3b8;margin-bottom:18px;}
.result-stats{display:flex;gap:20px;justify-content:center;margin-bottom:20px;}
.result-stat b{display:block;font-size:1.6rem;font-weight:900;color:#fde68a;}
.result-stat span{font-size:.7rem;color:#94a3b8;}
.result-btns{display:flex;gap:10px;justify-content:center;}
.result-btns button{border:none;border-radius:14px;font-family:inherit;font-size:.95rem;font-weight:900;padding:12px 24px;cursor:pointer;transition:all .14s;}
.btn-retry{background:#7c3aed;color:#fff;}
.btn-home{background:rgba(255,255,255,.12);color:#fff;}
.wrong-log{margin-top:18px;text-align:left;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
.wrong-log-title{font-size:.8rem;font-weight:900;color:#f87171;margin-bottom:8px;text-align:center;}
.wrong-log-item{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.78rem;line-height:1.55;}
.wl-eng{color:#e2e8f0;font-weight:700;}
.wl-ans{color:#86efac;font-size:.72rem;margin-top:2px;}
.wl-wrong{color:#fca5a5;font-size:.72rem;}
</style>
</head>
<body>

<!-- SELECT SCREEN -->
<div id="sel">
  <div class="sel-head">
    <div class="sel-title">⚔️ 문법 보스전</div>
    <div class="sel-sub">Fighter Edition — 단원을 골라 보스에 도전하세요</div>
    <div class="sel-boss-row">
      <img src="../game/assets/chars/hero-lv1.png" alt="hero">
      <img src="../game/assets/chars/boss-lv1.png" alt="boss1" style="height:88px">
      <img src="../game/assets/chars/boss-lv2.png" alt="boss2" style="height:88px">
      <img src="../game/assets/chars/boss-lv3.png" alt="boss3" style="height:96px">
    </div>
  </div>
  <div class="sel-units" id="unit-list"></div>
  <div class="back-link"><a href="../index.html">← 메인 허브</a></div>
</div>

<!-- GAME SCREEN -->
<div id="game">
  <canvas id="c"></canvas>

  <!-- Characters -->
  <div id="arena">
    <div id="hero-wrap"><img id="hero-img" src="../game/assets/chars/hero-lv1.png" class="idle" alt="hero"></div>
    <div id="boss-wrap"><img id="boss-img" src="../game/assets/chars/boss-lv1.png" class="idle" alt="boss"></div>
  </div>

  <!-- Drop items container -->
  <div id="drops-layer" style="position:absolute;inset:0;pointer-events:none;z-index:22;"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-bars">
      <div class="hp-side">
        <div class="hp-name" id="hero-name">🧑 학생</div>
        <div class="hp-bar-wrap"><div class="hp-fill" id="hero-hp-fill" style="width:100%"></div></div>
        <div class="hp-num" id="hero-hp-num">100</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="hp-side right">
        <div class="hp-name" id="boss-name">👹 고블린</div>
        <div class="hp-bar-wrap"><div class="hp-fill" id="boss-hp-fill" style="width:100%"></div></div>
        <div class="hp-num" id="boss-hp-num">100</div>
      </div>
    </div>
    <div class="hud-info">
      <div class="combo-badge" id="combo-badge">COMBO ×1</div>
      <div class="stage-badge" id="stage-badge">PHASE 1</div>
      <div class="score-badge" id="score-badge">0점</div>
    </div>
  </div>

  <!-- Status effects -->
  <div id="status-row"></div>

  <!-- Telegraph -->
  <div id="tel">
    <div class="tel-inner">
      <div class="tel-label" id="tel-label">⚡ 공격 준비 중...</div>
      <div class="tel-track"><div class="tel-fill" id="tel-fill"></div></div>
    </div>
  </div>

  <!-- Question popup -->
  <div id="qpop">
    <div class="qpop-inner">
      <div class="qpop-top">
        <div class="qpop-atk-label" id="qpop-atk-label">⚡ 일반 공격</div>
        <div class="qpop-timer" id="qpop-timer">5.0</div>
      </div>
      <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
      <div class="qpop-eng" id="qpop-eng"></div>
      <div class="qpop-kor" id="qpop-kor"></div>
      <div class="qpop-opts" id="qpop-opts"></div>
      <div class="qpop-fb" id="qpop-fb"></div>
    </div>
  </div>

  <!-- Phase flash overlay -->
  <div id="phase-flash"></div>

  <!-- Phase cutscene -->
  <div id="cut">
    <div class="cut-card">
      <div class="cut-phase" id="cut-phase">PHASE 2</div>
      <div class="cut-chars">
        <img id="cut-hero-img" src="../game/assets/chars/hero-lv1.png" alt="hero">
        <img id="cut-boss-img" src="../game/assets/chars/boss-lv2.png" alt="boss">
      </div>
      <div class="cut-name" id="cut-name">문법 마법사</div>
      <div class="cut-sub" id="cut-sub">각성 완료...</div>
    </div>
  </div>

  <!-- Result -->
  <div id="result">
    <div class="result-card">
      <div class="result-icon" id="result-icon">🏆</div>
      <div class="result-title" id="result-title">승리!</div>
      <div class="result-sub" id="result-sub">보스를 물리쳤다!</div>
      <div class="result-stats">
        <div class="result-stat"><b id="r-score">0</b><span>점수</span></div>
        <div class="result-stat"><b id="r-correct">0</b><span>정답</span></div>
        <div class="result-stat"><b id="r-combo">x1</b><span>최대콤보</span></div>
      </div>
      <div class="result-btns">
        <button class="btn-retry" onclick="G.retry()">다시 도전</button>
        <button class="btn-home" onclick="G.goHome()">단원 선택</button>
      </div>
      <div class="wrong-log" id="wrong-log" style="display:none;">
        <div class="wrong-log-title">📋 틀린 문제</div>
        <div id="wrong-log-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CANVAS BACKGROUND
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CW = 0, CH = 0;
function resize() { CW = canvas.width = window.innerWidth; CH = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const STARS = Array.from({length:80}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.8 + .4,
  blink: Math.random() * Math.PI * 2
}));

const BG_THEMES = [
  { sky: ['#0a0515','#150a30','#200a40'], ground: ['#1a0a3a','#0a0020'], glow: '#7c3aed', line: '#5b21b6' },
  { sky: ['#0a0515','#1e0a35','#2e0a50'], ground: ['#2a0a4a','#150030'], glow: '#9333ea', line: '#7c3aed' },
  { sky: ['#050005','#100010','#180018'], ground: ['#0f0010','#050005'], glow: '#dc2626', line: '#7f1d1d' },
];

function drawBG(phase, ts) {
  const t = BG_THEMES[phase] || BG_THEMES[0];
  const g = ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,t.sky[0]); g.addColorStop(.5,t.sky[1]); g.addColorStop(1,t.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

  // Stars
  STARS.forEach(s => {
    const alpha = .4 + Math.sin(ts/1200 + s.blink) * .35;
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(s.x*CW, s.y*CH*.7, s.r, 0, Math.PI*2); ctx.fill();
  });

  // Ground
  const gY = CH * .72;
  const gg = ctx.createLinearGradient(0,gY,0,CH);
  gg.addColorStop(0,t.ground[0]); gg.addColorStop(1,t.ground[1]);
  ctx.fillStyle = gg; ctx.fillRect(0,gY,CW,CH-gY);

  // Glow line
  ctx.fillStyle = t.glow; ctx.globalAlpha = .5;
  ctx.fillRect(0, gY, CW, 3);
  ctx.globalAlpha = 1;

  // Tile grid
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
  for (let x=0; x<CW; x+=60) { ctx.beginPath(); ctx.moveTo(x,gY); ctx.lineTo(x,CH); ctx.stroke(); }

  // Phase-specific effects
  if (phase >= 1) {
    // Floating orbs background
    for (let i=0;i<3;i++) {
      const ox = CW*(0.2+i*.3) + Math.sin(ts/2000+i)*30;
      const oy = CH*(0.3+i*.1) + Math.cos(ts/1500+i)*20;
      const gr = ctx.createRadialGradient(ox,oy,0,ox,oy,60);
      gr.addColorStop(0,`rgba(124,58,237,${phase===2?.08:.05})`);
      gr.addColorStop(1,'transparent');
      ctx.fillStyle = gr; ctx.fillRect(ox-60,oy-60,120,120);
    }
  }
  if (phase >= 2) {
    // Red crack lines
    ctx.strokeStyle = 'rgba(239,68,68,.15)'; ctx.lineWidth = 2;
    for (let i=0;i<4;i++) {
      ctx.beginPath();
      ctx.moveTo(CW*(0.1+i*.25), gY);
      ctx.lineTo(CW*(0.05+i*.25)+Math.sin(ts/500+i)*10, gY-80);
      ctx.stroke();
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  ASSET PATHS
// ═══════════════════════════════════════════════════════════
const HERO_ASSETS = [
  { idle:'../game/assets/chars/hero-lv1.png', atk:'../game/assets/chars/hero-lv1-attack.png', name:'🧑 학생' },
  { idle:'../game/assets/chars/hero-lv2.png', atk:'../game/assets/chars/hero-lv2-attack.png', name:'🧙 마법사' },
  { idle:'../game/assets/chars/hero-lv3.png', atk:'../game/assets/chars/hero-lv3-attack.png', name:'⚔️ 영웅' },
];
const BOSS_ASSETS = [
  { idle:'../game/assets/chars/boss-lv1.png', hit:'../game/assets/chars/boss-lv1-hit.png', name:'👹 문법 고블린', cutName:'문법 고블린', cutSub:'1단계 보스 등장!', glow:'rgba(239,68,68,.5)' },
  { idle:'../game/assets/chars/boss-lv2.png', hit:'../game/assets/chars/boss-lv2-hit.png', name:'🧙 문법 마법사', cutName:'문법 마법사', cutSub:'2단계 각성! 마법이 폭주한다!', glow:'rgba(139,92,246,.6)' },
  { idle:'../game/assets/chars/boss-lv3.png', hit:'../game/assets/chars/boss-lv3-hit.png', name:'🐲 문법 마왕', cutName:'문법 대마왕', cutSub:'최종 형태 해방! 전력을 다해라!', glow:'rgba(220,38,38,.7)' },
];

// ═══════════════════════════════════════════════════════════
//  GAME CONFIG
// ═══════════════════════════════════════════════════════════
const ATTACK_TYPES = [
  { id:'jab',     label:'⚡ 잽!',      time:5,   damage:12, chance:.50, color:'#f97316' },
  { id:'hook',    label:'💥 훅!',      time:7,   damage:20, chance:.30, color:'#ef4444' },
  { id:'special', label:'☄️ 필살기!', time:3.5, damage:30, chance:.20, color:'#a855f7' },
];
const STATUS_FX = {
  BURN:   { icon:'🔥', label:'화염', color:'#ef4444', dur:18000, desc:'오답 2배 피해' },
  FREEZE: { icon:'🧊', label:'빙결', color:'#60a5fa', dur:14000, desc:'제한시간 절반' },
  SHOCK:  { icon:'⚡', label:'감전', color:'#fbbf24', dur:12000, desc:'보기 계속 섞임' },
};
const DROP_TYPES = {
  HEART:  { icon:'❤️', action:'heal',   value:20 },
  SHIELD: { icon:'🛡️', action:'shield', value:1 },
  POWER:  { icon:'⚔️', action:'power',  value:3 },
};

// ═══════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════
let GS = null;
let wrongLog = [];
let rafId = null, bossTimer = null, qTimer = null, dropTimer = null, telIv = null;

function initGS(qs) {
  wrongLog = [];
  return {
    phase: 0, bossPhase: 0,
    heroHP: 100, bossHP: 100,
    combo: 1, maxCombo: 1, score: 0, correct: 0,
    statusFx: {}, hasShield: false, hasPower: false,
    questions: shuffle([...qs]), qIdx: 0,
    currentQ: null, attackType: null, drops: [], dropId: 0,
  };
}

// ═══════════════════════════════════════════════════════════
//  GAME CONTROLLER
// ═══════════════════════════════════════════════════════════
const G = {
  _qs: null, _label: '',
  start(qs, label) {
    this._qs = qs; this._label = label;
    GS = initGS(qs);
    document.getElementById('sel').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    setCharSprites(0);
    updateHUD();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
    scheduleBossAttack();
    scheduleDropSpawn();
  },
  retry() {
    document.getElementById('result').classList.remove('show');
    if (this._qs) this.start(this._qs, this._label);
  },
  goHome() {
    document.getElementById('result').classList.remove('show');
    document.getElementById('game').style.display = 'none';
    document.getElementById('sel').style.display = 'flex';
    cancelTimers();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  },
};

// ═══════════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════════
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  drawBG(GS ? GS.bossPhase : 0, ts);
  // Expire status effects
  if (GS) {
    Object.keys(GS.statusFx).forEach(k => {
      if (ts > GS.statusFx[k].expires) { delete GS.statusFx[k]; updateStatusRow(); }
    });
  }
}

// ═══════════════════════════════════════════════════════════
//  CHARACTER SPRITES (DOM img)
// ═══════════════════════════════════════════════════════════
const heroImg = document.getElementById('hero-img');
const bossImg = document.getElementById('boss-img');

function setCharSprites(phase) {
  const h = HERO_ASSETS[phase], b = BOSS_ASSETS[phase];
  heroImg.src = h.idle; heroImg.className = 'idle';
  bossImg.src = b.idle; bossImg.className = 'idle';
  bossImg.style.filter = `drop-shadow(0 8px 28px ${b.glow})`;
  document.getElementById('hero-name').textContent = h.name;
  document.getElementById('boss-name').textContent = b.name;
}

function heroAnim(type) {
  const h = HERO_ASSETS[GS.bossPhase];
  heroImg.className = '';
  if (type === 'atk') {
    heroImg.src = h.atk;
    void heroImg.offsetWidth;
    heroImg.className = 'attack';
    setTimeout(() => { heroImg.src = h.idle; heroImg.className = 'idle'; }, 520);
  } else if (type === 'hurt') {
    void heroImg.offsetWidth;
    heroImg.className = 'hurt';
    setTimeout(() => { heroImg.className = 'idle'; }, 480);
  }
}

function bossAnim(type) {
  const b = BOSS_ASSETS[GS.bossPhase];
  bossImg.className = '';
  void bossImg.offsetWidth;
  if (type === 'windup') { bossImg.className = 'windup'; }
  else if (type === 'hit') {
    bossImg.src = b.hit;
    bossImg.className = 'hit';
    setTimeout(() => { bossImg.src = b.idle; bossImg.className = 'idle'; bossImg.style.filter = `drop-shadow(0 8px 28px ${b.glow})`; }, 480);
  } else { bossImg.src = b.idle; bossImg.className = 'idle'; }
}

// ═══════════════════════════════════════════════════════════
//  BOSS AI
// ═══════════════════════════════════════════════════════════
function scheduleBossAttack() {
  if (bossTimer) clearTimeout(bossTimer);
  const delay = 2500 + Math.random() * 2500;
  bossTimer = setTimeout(startAttack, delay);
}

function startAttack() {
  if (!GS || GS.phase !== 0) return;
  GS.phase = 1;

  // Pick attack type
  const roll = Math.random();
  let cum = 0, chosen = ATTACK_TYPES[0];
  for (const at of ATTACK_TYPES) {
    cum += at.chance + (at.id === 'special' ? GS.bossPhase * .08 : 0);
    if (roll < cum) { chosen = at; break; }
  }
  GS.attackType = chosen;

  // Maybe apply status effect
  if (Math.random() < 0.2 + GS.bossPhase * 0.1) {
    const keys = Object.keys(STATUS_FX);
    applyStatusFx(keys[Math.floor(Math.random() * keys.length)]);
  }

  // Telegraph
  bossAnim('windup');
  const tel = document.getElementById('tel');
  tel.style.display = 'block';
  document.getElementById('tel-label').textContent = chosen.label;
  document.getElementById('tel-label').style.color = chosen.color;

  const DUR = 1600 + GS.bossPhase * 250;
  let elapsed = 0;
  telIv = setInterval(() => {
    elapsed += 50;
    document.getElementById('tel-fill').style.width = Math.min(100, elapsed / DUR * 100) + '%';
    if (elapsed >= DUR) {
      clearInterval(telIv); telIv = null;
      tel.style.display = 'none';
      bossAnim('idle');
      showQuestion();
    }
  }, 50);
}

// ═══════════════════════════════════════════════════════════
//  QUESTION SYSTEM
// ═══════════════════════════════════════════════════════════
function showQuestion() {
  if (!GS) return;
  GS.phase = 2;
  if (GS.qIdx >= GS.questions.length) { GS.questions = shuffle([...GS.questions]); GS.qIdx = 0; }
  const q = GS.questions[GS.qIdx++];
  GS.currentQ = q;

  let timeLimit = GS.attackType.time;
  if (GS.statusFx.FREEZE) timeLimit *= 0.5;

  let opts = [...q.opts];
  if (GS.statusFx.SHOCK) opts = shuffle(opts);

  document.getElementById('qpop-atk-label').textContent = GS.attackType.label;
  document.getElementById('qpop-atk-label').style.color = GS.attackType.color;
  document.getElementById('qpop-eng').textContent = q.eng;
  document.getElementById('qpop-kor').textContent = q.kor;
  document.getElementById('qpop-fb').textContent = '';
  document.getElementById('qpop-fb').className = 'qpop-fb';

  // Render options
  const optsEl = document.getElementById('qpop-opts');
  optsEl.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qopt';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, q.ans, btn);
    optsEl.appendChild(btn);
  });

  // SHOCK: reshuffle every 1.2s
  let shockIv = null;
  if (GS.statusFx.SHOCK) {
    shockIv = setInterval(() => {
      if (GS.phase !== 2) { clearInterval(shockIv); return; }
      const sh = shuffle([...opts]);
      optsEl.querySelectorAll('.qopt:not([disabled])').forEach((b,i) => b.textContent = sh[i]);
    }, 1200);
  }

  // Timer
  const start = performance.now();
  const timerEl = document.getElementById('qpop-timer');
  const fillEl = document.getElementById('timer-fill');
  function tickTimer() {
    if (GS.phase !== 2) return;
    const rem = Math.max(0, timeLimit - (performance.now() - start) / 1000);
    timerEl.textContent = rem.toFixed(1);
    fillEl.style.width = (rem / timeLimit * 100) + '%';
    fillEl.style.background = rem > timeLimit*.5 ? '#fbbf24' : rem > timeLimit*.25 ? '#f97316' : '#ef4444';
    timerEl.className = 'qpop-timer' + (rem < 1.5 ? ' crit' : rem < 3 ? ' warn' : '');
    if (rem > 0) { qTimer = requestAnimationFrame(tickTimer); }
    else { clearInterval(shockIv); timeExpired(q.ans); }
  }
  qTimer = requestAnimationFrame(tickTimer);
  document.getElementById('qpop').classList.add('show');
}

function handleAnswer(chosen, correct, clickedBtn) {
  if (GS.phase !== 2) return;
  cancelAnimationFrame(qTimer); qTimer = null;
  GS.phase = 3;
  const isCorrect = chosen === correct;
  document.querySelectorAll('.qopt').forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add(isCorrect ? 'ok' : 'reveal');
  });
  if (!isCorrect) {
    clickedBtn.classList.add('ng');
    wrongLog.push({ eng: GS.currentQ.eng, ans: correct, wrong: chosen });
  }
  const fb = document.getElementById('qpop-fb');
  fb.textContent = isCorrect ? '✅ 정답! 공격!' : '❌ 오답! 피격!';
  fb.className = 'qpop-fb ' + (isCorrect ? 'ok' : 'ng');
  setTimeout(() => finishQuestion(isCorrect), isCorrect ? 650 : 950);
}

function timeExpired(correct) {
  if (GS.phase !== 2) return;
  cancelAnimationFrame(qTimer); qTimer = null;
  GS.phase = 3;
  document.querySelectorAll('.qopt').forEach(b => { b.disabled = true; if (b.textContent === correct) b.classList.add('reveal'); });
  const fb = document.getElementById('qpop-fb');
  fb.textContent = '⏰ 시간 초과! 피격!';
  fb.className = 'qpop-fb ng';
  wrongLog.push({ eng: GS.currentQ.eng, ans: correct, wrong: '(시간초과)' });
  setTimeout(() => finishQuestion(false), 950);
}

function finishQuestion(isCorrect) {
  document.getElementById('qpop').classList.remove('show');
  if (isCorrect) {
    let dmg = 15 + GS.bossPhase * 6;
    if (GS.hasPower) { dmg *= 3; GS.hasPower = false; }
    dmg = Math.round(dmg * (GS.combo * .08 + .92));
    GS.bossHP = Math.max(0, GS.bossHP - dmg);
    GS.combo = Math.min(GS.combo + 1, 12);
    GS.maxCombo = Math.max(GS.maxCombo, GS.combo);
    GS.score += dmg * GS.combo;
    GS.correct++;
    heroAnim('atk'); bossAnim('hit');
    showDmgFloat('-' + dmg, '#ef4444', 'right');
    playSfx('correct');
    checkBossPhase();
  } else {
    let dmg = GS.attackType.damage;
    if (GS.statusFx.BURN) dmg *= 2;
    if (GS.hasShield) { dmg = 0; GS.hasShield = false; showFloating('🛡️ 보호막!', '#60a5fa'); }
    GS.heroHP = Math.max(0, GS.heroHP - dmg);
    GS.combo = 1;
    heroAnim('hurt');
    showDmgFloat('-' + dmg, '#f97316', 'left');
    playSfx('wrong');
    if (GS.heroHP <= 0) { setTimeout(gameOver, 350); return; }
  }
  updateHUD();
  GS.phase = 0;
  setTimeout(scheduleBossAttack, 600);
}

// ═══════════════════════════════════════════════════════════
//  BOSS PHASE TRANSITIONS
// ═══════════════════════════════════════════════════════════
function checkBossPhase() {
  const hp = GS.bossHP;
  const target = hp <= 0 ? 3 : hp <= 33 ? 2 : hp <= 66 ? 1 : 0;
  if (target > GS.bossPhase) {
    if (target >= 3) { gameWin(); return; }
    triggerPhaseChange(target);
  }
}

function triggerPhaseChange(newPhase) {
  GS.bossPhase = newPhase;
  GS.phase = 10;
  cancelTimers();
  const b = BOSS_ASSETS[newPhase];
  const h = HERO_ASSETS[newPhase];
  document.getElementById('cut-phase').textContent = `PHASE ${newPhase + 1}`;
  document.getElementById('cut-hero-img').src = h.idle;
  document.getElementById('cut-boss-img').src = b.idle;
  document.getElementById('cut-name').textContent = b.cutName;
  document.getElementById('cut-sub').textContent = b.cutSub;
  // Flash
  const fl = document.getElementById('phase-flash');
  fl.className = ''; void fl.offsetWidth; fl.className = 'go';
  setTimeout(() => {
    document.getElementById('cut').classList.add('show');
    setCharSprites(newPhase);
    document.getElementById('stage-badge').textContent = `PHASE ${newPhase + 1}`;
  }, 200);
  setTimeout(() => {
    document.getElementById('cut').classList.remove('show');
    GS.phase = 0;
    scheduleBossAttack();
    scheduleDropSpawn();
  }, 2800);
}

// ═══════════════════════════════════════════════════════════
//  STATUS EFFECTS & DROPS
// ═══════════════════════════════════════════════════════════
function applyStatusFx(key) {
  const fx = STATUS_FX[key];
  GS.statusFx[key] = { ...fx, expires: performance.now() + fx.dur };
  updateStatusRow();
  showFloating(fx.icon + ' ' + fx.label + '!', fx.color);
}

function updateStatusRow() {
  const row = document.getElementById('status-row');
  const hudH = document.getElementById('hud').offsetHeight;
  const telShowing = document.getElementById('tel').style.display !== 'none';
  row.style.top = (hudH + (telShowing ? 58 : 6)) + 'px';
  row.innerHTML = Object.entries(GS.statusFx).map(([k,fx]) =>
    `<div class="sfx-badge" style="border-color:${fx.color};color:${fx.color}">${fx.icon}${fx.label}</div>`
  ).join('');
}

function scheduleDropSpawn() {
  if (dropTimer) clearTimeout(dropTimer);
  dropTimer = setTimeout(spawnDrop, 7000 + Math.random() * 9000);
}

function spawnDrop() {
  if (!GS || GS.phase === 10) { scheduleDropSpawn(); return; }
  const keys = Object.keys(DROP_TYPES);
  const key = keys[Math.floor(Math.random() * keys.length)];
  const d = { id: GS.dropId++, key, icon: DROP_TYPES[key].icon,
    x: CW * (.2 + Math.random() * .6), y: CH * (.42 + Math.random() * .18) };
  GS.drops.push(d);
  const el = document.createElement('div');
  el.className = 'drop-item'; el.textContent = d.icon;
  el.style.left = d.x + 'px'; el.style.top = d.y + 'px';
  el.style.animationDelay = (Math.random() * .6) + 's';
  el.dataset.id = d.id;
  el.onclick = () => grabDrop(d.id, el);
  el.ontouchstart = (e) => { e.preventDefault(); grabDrop(d.id, el); };
  document.getElementById('drops-layer').appendChild(el);
  scheduleDropSpawn();
  setTimeout(() => { GS.drops = GS.drops.filter(dr=>dr.id!==d.id); el.remove(); }, 6000);
}

function grabDrop(id, el) {
  const d = GS.drops.find(dr=>dr.id===id); if (!d) return;
  GS.drops = GS.drops.filter(dr=>dr.id!==id); el.remove();
  const dt = DROP_TYPES[d.key];
  if (dt.action==='heal') { GS.heroHP=Math.min(100,GS.heroHP+dt.value); updateHUD(); showFloating('❤️ +'+dt.value+'HP!','#22c55e'); }
  else if (dt.action==='shield') { GS.hasShield=true; showFloating('🛡️ 보호막!','#60a5fa'); }
  else if (dt.action==='power') { GS.hasPower=true; showFloating('⚔️ 강타 준비!','#f97316'); }
  playSfx('correct');
}

// ═══════════════════════════════════════════════════════════
//  WIN / LOSE
// ═══════════════════════════════════════════════════════════
function gameWin() { GS.phase=10; cancelTimers(); showResult(true); }
function gameOver() { GS.phase=10; cancelTimers(); showResult(false); }

function showResult(win) {
  document.getElementById('result-icon').textContent = win ? '🏆' : '💀';
  document.getElementById('result-title').textContent = win ? '승리!' : '패배...';
  document.getElementById('result-sub').textContent = win
    ? `${G._label || ''} 보스를 물리쳤다!` : '다시 도전해보자!';
  document.getElementById('r-score').textContent = GS.score;
  document.getElementById('r-correct').textContent = GS.correct;
  document.getElementById('r-combo').textContent = 'x' + GS.maxCombo;
  const wl = document.getElementById('wrong-log');
  const wll = document.getElementById('wrong-log-list');
  if (wrongLog.length) {
    wl.style.display='block';
    wll.innerHTML = wrongLog.map(w =>
      `<div class="wrong-log-item"><div class="wl-eng">${w.eng}</div>
       <div class="wl-ans">✅ 정답: <strong>${w.ans}</strong></div>
       <div class="wl-wrong">❌ 내 답: ${w.wrong}</div></div>`
    ).join('');
  } else { wl.style.display='none'; }
  document.getElementById('result').classList.add('show');
}

// ═══════════════════════════════════════════════════════════
//  HUD & FX
// ═══════════════════════════════════════════════════════════
function updateHUD() {
  if (!GS) return;
  document.getElementById('hero-hp-fill').style.width = GS.heroHP + '%';
  document.getElementById('boss-hp-fill').style.width = GS.bossHP + '%';
  document.getElementById('hero-hp-num').textContent = Math.round(GS.heroHP);
  document.getElementById('boss-hp-num').textContent = Math.round(GS.bossHP);
  document.getElementById('combo-badge').textContent = 'COMBO ×' + GS.combo;
  document.getElementById('score-badge').textContent = GS.score + '점';
}

function showDmgFloat(text, color, side) {
  const el = document.createElement('div');
  el.className = 'dmg-float';
  el.style.cssText = `color:${color};font-size:1.5rem;left:${side==='right'?'62%':'20%'};top:40%;text-shadow:0 2px 8px rgba(0,0,0,.8);`;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function showFloating(text, color) {
  const el = document.createElement('div');
  el.className = 'dmg-float';
  el.style.cssText = `color:${color};font-size:1.1rem;left:50%;transform:translateX(-50%);top:35%;text-shadow:0 2px 6px rgba(0,0,0,.8);white-space:nowrap;`;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function playSfx(type) {
  try {
    if (type==='correct' && typeof playCorrect==='function') playCorrect();
    else if (type==='wrong' && typeof playWrong==='function') playWrong();
  } catch(e){}
}

// ═══════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════
function shuffle(a) {
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function cancelTimers() {
  if (bossTimer) { clearTimeout(bossTimer); bossTimer=null; }
  if (qTimer) { cancelAnimationFrame(qTimer); qTimer=null; }
  if (dropTimer) { clearTimeout(dropTimer); dropTimer=null; }
  if (telIv) { clearInterval(telIv); telIv=null; }
  document.getElementById('tel').style.display='none';
  document.getElementById('qpop').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
//  SELECT SCREEN
// ═══════════════════════════════════════════════════════════
function buildSelect() {
  if (typeof GAME_QUESTIONS === 'undefined') return;
  const c = document.getElementById('unit-list');
  const allBtn = document.createElement('div');
  allBtn.className = 'all-card';
  allBtn.innerHTML = '⚔️ 전체 단원 보스전<br><small style="font-weight:700;opacity:.8">모든 문제로 최강 보스 도전</small>';
  allBtn.onclick = () => G.start(Object.values(GAME_QUESTIONS).flatMap(u=>u.questions), '전체 단원');
  c.appendChild(allBtn);
  Object.entries(GAME_QUESTIONS).forEach(([k,u]) => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `<div class="uc-lbl">${k.toUpperCase()}</div><h3>${u.label}</h3><div class="uc-cnt">문제 ${u.questions.length}개</div>`;
    card.onclick = () => G.start(u.questions, u.label);
    c.appendChild(card);
  });
}
buildSelect();
</script>
