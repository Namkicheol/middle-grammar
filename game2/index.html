<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>문법 보스전 — Fighter Edition</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#030712;overflow:hidden;font-family:'Noto Sans KR',sans-serif;touch-action:none;}

/* ── SELECT SCREEN ── */
#sel{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e1b4b 45%,#0f172a);overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.sel-head{width:100%;max-width:560px;padding:28px 20px 0;text-align:center;}
.sel-title{font-family:'Black Han Sans',sans-serif;font-size:2rem;font-weight:400;letter-spacing:.02em;color:#fff;text-shadow:0 4px 0 #312e81,0 0 24px rgba(124,58,237,.8);}
.sel-sub{font-size:.85rem;color:#a78bfa;margin-top:4px;}
.sel-boss-row{display:flex;justify-content:center;gap:14px;margin:18px 0 10px;align-items:flex-end;}
.sel-boss-row img{height:80px;width:auto;filter:drop-shadow(0 4px 16px rgba(124,58,237,.6));transition:.2s;}
.sel-boss-row img:hover{transform:scale(1.08);}
.sel-units{width:100%;max-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 20px 40px;}
.unit-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;cursor:pointer;transition:all .16s;color:#fff;}
.unit-card:hover,.unit-card:active{background:rgba(124,58,237,.22);border-color:#7c3aed;transform:translateY(-2px);}
.unit-card .uc-lbl{font-size:.68rem;font-weight:900;letter-spacing:.8px;color:#a78bfa;margin-bottom:5px;}
.unit-card h3{font-size:.95rem;font-weight:900;line-height:1.3;}
.unit-card .uc-cnt{font-size:.7rem;color:#94a3b8;margin-top:6px;}
.mode-toggle{grid-column:1/-1;display:flex;gap:8px;justify-content:center;margin-bottom:2px;}
.mode-btn{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 22px;font-family:inherit;font-size:.95rem;font-weight:900;color:#cbd5e1;cursor:pointer;transition:.16s;}
.mode-btn.on{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:#a855f7;color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.5);}
.mode-hint{grid-column:1/-1;text-align:center;font-size:.78rem;color:#94a3b8;margin-bottom:8px;line-height:1.4;}
.all-card{grid-column:1/-1;background:linear-gradient(135deg,#4c1d95,#7c3aed,#1d4ed8);border:none;border-radius:18px;padding:18px;text-align:center;cursor:pointer;color:#fff;font-weight:900;font-size:1.05rem;box-shadow:0 12px 28px rgba(124,58,237,.4);transition:all .16s;}
.all-card:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(124,58,237,.5);}
.back-link{text-align:center;padding-bottom:14px;}
.back-link a{color:#94a3b8;font-size:.82rem;text-decoration:none;}

/* ── GAME SCREEN ── */
#boss-start{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(160deg,#0f172a,#1e1b4b 45%,#0f172a);}
.bs-title{font-family:'Black Han Sans',sans-serif;font-size:2rem;font-weight:400;letter-spacing:.02em;color:#fff;margin-bottom:6px;text-shadow:0 4px 0 #312e81,0 0 22px rgba(124,58,237,.7);}
.bs-unit{font-size:1rem;font-weight:800;color:#a78bfa;margin-bottom:10px;line-height:1.4;max-width:420px;}
.bs-record{font-size:.84rem;font-weight:800;color:#fde68a;margin-bottom:18px;}
.bs-row{display:flex;align-items:flex-end;gap:24px;margin-bottom:12px;}
.bs-row img{height:190px;width:auto;filter:drop-shadow(0 12px 30px rgba(124,58,237,.62));}
.bs-progression{font-size:.82rem;font-weight:800;color:#c4b5fd;margin-bottom:22px;letter-spacing:.01em;}
.bs-diff{display:flex;gap:10px;margin-bottom:22px;}
.bs-diff-btn{font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;padding:12px 16px;border-radius:14px;border:2px solid rgba(167,139,250,.4);background:rgba(255,255,255,.05);color:#c4b5fd;font-size:1rem;font-weight:900;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.15s;}
.bs-diff-btn small{font-size:.66rem;font-weight:700;color:#94a3b8;}
.bs-diff-btn.on{border-color:#a855f7;background:rgba(124,58,237,.22);color:#fff;box-shadow:0 0 16px rgba(124,58,237,.5);}
.bs-diff-btn.on small{color:#ddd6fe;}
.bs-btn{font-family:inherit;font-size:1.2rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:16px;padding:17px 46px;box-shadow:0 12px 32px rgba(124,58,237,.6);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s;}
.bs-btn:active{transform:scale(.96);}
.bs-back{margin-top:18px;}
.bs-back a{color:#94a3b8;font-size:.85rem;text-decoration:none;}
#game{position:fixed;inset:0;display:none;}
canvas#c{position:absolute;inset:0;width:100%;height:100%;}

/* ── ARENA (character stage) ── */
#arena{position:absolute;left:0;right:0;bottom:0;height:72%;pointer-events:none;transition:bottom .38s cubic-bezier(.22,1,.36,1);}

/* ── CHARACTERS ── */
#hero-wrap{position:absolute;left:8%;bottom:26%;transform-origin:bottom center;transition:left .35s cubic-bezier(.22,1,.36,1), transform .15s;}
#boss-wrap{position:absolute;right:8%;bottom:26%;transform-origin:bottom center;transition:right .35s cubic-bezier(.22,1,.36,1), transform .15s;}
#hero-img,#boss-img{background-repeat:no-repeat;background-position:0 0;transform-origin:bottom center;will-change:background-position,transform,filter;}
#hero-img{filter:drop-shadow(0 8px 22px rgba(14,165,233,.45));}
#boss-img{filter:drop-shadow(0 10px 26px rgba(239,68,68,.5));}
@keyframes dmgFlash{0%{filter:brightness(1)}28%{filter:brightness(2.6) drop-shadow(0 0 30px #fff)}100%{filter:brightness(1)}}
#hero-img.flash,#boss-img.flash{animation:dmgFlash .38s ease-out;}

/* Idle float animation */
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#hero-img.idle{animation:heroFloat 2.2s ease-in-out infinite;}
#boss-img.idle{animation:bossFloat 2.6s ease-in-out infinite;}

/* Attack */
@keyframes heroAttack{0%{transform:translateX(0) scale(1)}22%{transform:translateX(8px) scale(.94)}45%{transform:translateX(36px) scale(1.16)}72%{transform:translateX(22px) scale(1.1)}100%{transform:translateX(0) scale(1)}}
#hero-img.attack{animation:heroAttack .85s ease-out forwards;}

/* Hurt */
@keyframes heroHurt{0%{transform:translateX(0);filter:drop-shadow(0 8px 24px rgba(14,165,233,.5))}20%{transform:translateX(-20px);filter:drop-shadow(0 8px 24px rgba(239,68,68,.9)) brightness(1.8)}50%{transform:translateX(-8px);filter:brightness(1.5)}75%{transform:translateX(-16px);filter:drop-shadow(0 8px 24px rgba(239,68,68,.7)) brightness(1.4)}100%{transform:translateX(0);filter:drop-shadow(0 8px 24px rgba(14,165,233,.5))}}
#hero-img.hurt{animation:heroHurt .7s ease-out forwards;}

/* Boss hurt */
@keyframes bossHurt{0%{transform:translateX(0) scale(1);filter:drop-shadow(0 8px 28px rgba(239,68,68,.6)) brightness(1)}18%{transform:translateX(36px) scale(.92);filter:drop-shadow(0 0 48px #fff) brightness(2.5)}42%{transform:translateX(20px) scale(1.04);filter:drop-shadow(0 8px 28px rgba(239,68,68,.95)) brightness(1.7)}65%{transform:translateX(14px) scale(.98)}100%{transform:translateX(0) scale(1);filter:drop-shadow(0 8px 28px rgba(239,68,68,.6)) brightness(1)}}
#boss-img.hit{animation:bossHurt .75s ease-out forwards;}

/* Boss windup shake */
@keyframes bossCharge{0%,100%{transform:translateX(0) scale(1);filter:brightness(1)}35%{transform:translateX(-9px) scale(1.08);filter:brightness(1.3) drop-shadow(0 0 20px rgba(239,68,68,.8))}70%{transform:translateX(-5px) scale(1.04);filter:brightness(1.15)}}
#boss-img.windup{animation:bossCharge .65s ease-in-out infinite;}

/* Correct / wrong screen edge flash */
@keyframes edgeFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#ok-flash,#ng-flash{position:fixed;inset:0;pointer-events:none;z-index:65;opacity:0;}
#ok-flash{background:radial-gradient(ellipse at center,transparent 35%,rgba(34,197,94,.4) 100%);}
#ng-flash{background:radial-gradient(ellipse at center,transparent 35%,rgba(239,68,68,.45) 100%);}
#ok-flash.go,#ng-flash.go{animation:edgeFlash .65s ease-out forwards;}

/* Phase transform flash */
@keyframes phaseFlash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
#phase-flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:70;opacity:0;}
#phase-flash.go{animation:phaseFlash .8s ease-out forwards;}

/* ── HUD ── */
#hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;padding:10px 14px 6px;background:linear-gradient(180deg,rgba(6,3,16,.92) 0%,rgba(6,3,16,.5) 58%,transparent 100%);}
.hud-bars{display:flex;align-items:center;gap:12px;margin-bottom:7px;}
.hp-side{flex:1;display:flex;align-items:center;gap:8px;}
.hp-side.right{flex-direction:row-reverse;}
.hp-name{font-size:.82rem;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.95);}
.hp-bar-wrap{flex:1;height:18px;background:linear-gradient(180deg,#0a0a16,#1a1628);border-radius:6px;border:2px solid rgba(255,255,255,.24);overflow:hidden;position:relative;box-shadow:inset 0 2px 5px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.08);}
.hp-bar-wrap::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 9.4%,rgba(0,0,0,.4) 9.4%,rgba(0,0,0,.4) 10%);pointer-events:none;}
.hp-fill{height:100%;border-radius:4px;transition:width .35s cubic-bezier(.22,1,.36,1);position:relative;}
.hp-fill::before{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);border-radius:4px 4px 0 0;}
#hero-hp-fill{background:linear-gradient(90deg,#15803d,#22c55e,#4ade80);box-shadow:0 0 12px rgba(34,197,94,.75);}
#boss-hp-fill{background:linear-gradient(90deg,#b91c1c,#ef4444,#f97316);box-shadow:0 0 12px rgba(239,68,68,.75);}
.vs-badge{font-size:.78rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#7f1d1d,#dc2626);border:2px solid rgba(255,255,255,.5);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;white-space:nowrap;box-shadow:0 0 14px rgba(239,68,68,.65),inset 0 2px 5px rgba(255,255,255,.3);transform:rotate(-8deg);flex-shrink:0;}
.hud-info{display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:all;}
.combo-badge{background:linear-gradient(135deg,rgba(251,191,36,.3),rgba(245,158,11,.16));border:1.5px solid rgba(251,191,36,.6);border-radius:10px;padding:4px 13px;font-size:.82rem;font-weight:900;color:#fde68a;text-shadow:0 0 8px rgba(251,191,36,.5);box-shadow:0 2px 8px rgba(0,0,0,.45);}
.stage-badge{background:linear-gradient(135deg,rgba(139,92,246,.34),rgba(124,58,237,.18));border:1.5px solid rgba(167,139,250,.6);border-radius:10px;padding:4px 13px;font-size:.82rem;font-weight:900;color:#ddd6fe;text-shadow:0 0 8px rgba(139,92,246,.5);box-shadow:0 2px 8px rgba(0,0,0,.45);}
.score-badge{font-size:.95rem;font-weight:900;color:#bae6fd;text-shadow:0 0 8px rgba(56,189,248,.55);font-variant-numeric:tabular-nums;}
/* Skill gauge */
.skill-row{display:flex;align-items:center;gap:8px;margin-top:6px;pointer-events:all;}
.skill-track{flex:1;height:11px;background:linear-gradient(180deg,#0a0a16,#191628);border-radius:999px;overflow:hidden;border:1.5px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 3px rgba(0,0,0,.75);position:relative;}
.skill-track::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);background-size:64px 100%;background-repeat:no-repeat;animation:skillShine 1.7s linear infinite;pointer-events:none;}
@keyframes skillShine{0%{background-position:-64px 0}100%{background-position:calc(100% + 64px) 0}}
.skill-fill-bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#facc15);transition:width .3s ease;box-shadow:0 0 10px rgba(167,139,250,.7);}
.skill-btn2{border:1.5px solid rgba(255,255,255,.14);font-family:inherit;font-size:.74rem;font-weight:900;border-radius:999px;padding:6px 14px;cursor:pointer;background:rgba(255,255,255,.1);color:#64748b;pointer-events:all;white-space:nowrap;}
.skill-btn2.ready{background:linear-gradient(135deg,#facc15,#fb7185,#8b5cf6);color:#fff;border-color:rgba(255,255,255,.55);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 6px rgba(250,204,21,.5))}50%{filter:drop-shadow(0 0 16px rgba(250,204,21,.9))}}
.skill-btn2:disabled{pointer-events:none;}
/* Ultimate flash */
#ult-flash{position:fixed;inset:0;pointer-events:none;z-index:75;background:linear-gradient(135deg,#facc15,#fb7185,#8b5cf6);opacity:0;}
#hud-back{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.22);color:#94a3b8;font-family:inherit;font-size:.7rem;font-weight:900;border-radius:999px;padding:4px 10px;cursor:pointer;pointer-events:all;}
#hud-back:active{color:#fff;border-color:rgba(255,255,255,.5);}
.hp-num{font-size:.82rem;font-weight:900;color:#fff;min-width:30px;text-shadow:0 1px 3px rgba(0,0,0,.9);font-variant-numeric:tabular-nums;}

/* ── BOSS TELEGRAPH ── */
#tel{position:absolute;left:12px;right:12px;top:122px;z-index:20;display:none;}
.tel-inner{background:rgba(0,0,0,.7);border-radius:8px;padding:4px 10px;backdrop-filter:blur(4px);}
.tel-label{display:none;}
.tel-track{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;}
.tel-fill{height:100%;width:0%;border-radius:999px;box-shadow:0 0 10px currentColor;}

/* ── STATUS EFFECTS ── */
#status-row{position:absolute;left:12px;top:122px;z-index:15;display:flex;gap:6px;pointer-events:none;}
.sfx-badge{background:rgba(0,0,0,.75);border-radius:8px;padding:4px 8px;font-size:.75rem;font-weight:900;border:1px solid rgba(255,255,255,.2);animation:sfxPulse 2s infinite;}
@keyframes sfxPulse{0%,100%{opacity:1}50%{opacity:.65}}

/* ── DROP ITEMS ── */
.drop-item{position:absolute;font-size:1.7rem;cursor:pointer;z-index:24;pointer-events:all;user-select:none;width:58px;height:58px;margin:-29px 0 0 -29px;display:flex;align-items:center;justify-content:center;border-radius:50%;-webkit-tap-highlight-color:transparent;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.16),rgba(22,12,44,.94) 62%);border:2px solid rgba(167,139,250,.55);box-shadow:0 0 18px rgba(167,139,250,.4),inset 0 2px 6px rgba(255,255,255,.14);}

/* ── QUESTION POPUP ── */
#qpop{position:absolute;left:50%;bottom:12px;width:min(480px,96%);transform:translateX(-50%) translateY(20px) scale(.92);opacity:0;pointer-events:none;z-index:30;transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .22s;}
#qpop.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:all;}
.qpop-inner{background:linear-gradient(170deg,#1a0533,#0f0824);border:2px solid #7c3aed;padding:14px 14px 20px;border-radius:22px;box-shadow:0 8px 40px rgba(0,0,0,.85),0 0 0 1px rgba(124,58,237,.3);}
.qpop-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.qpop-atk-label{display:none;}
.qpop-timer{font-size:.95rem;font-weight:900;color:#fde68a;font-variant-numeric:tabular-nums;}
.qpop-timer.warn{color:#f97316;}
.qpop-timer.crit{color:#ef4444;animation:blink .45s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.timer-bar{height:5px;background:rgba(255,255,255,.1);border-radius:999px;margin-bottom:10px;overflow:hidden;}
.timer-fill{height:100%;background:#fbbf24;border-radius:999px;transition:width .1s linear;}
.qpop-eng{font-size:1.08rem;font-weight:900;color:#fff;line-height:1.55;margin-bottom:5px;}
.qpop-kor{font-size:.82rem;color:#c4b5fd;margin-bottom:12px;line-height:1.4;}
.qpop-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.qopt{padding:12px 8px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.qopt:active{transform:scale(.97);}
.qopt:disabled{cursor:default;}
.qopt.ok{background:#14532d!important;border-color:#22c55e!important;color:#86efac!important;}
.qopt.reveal{background:#14532d!important;border-color:#22c55e!important;color:#86efac!important;}
.qopt.ng{background:#450a0a!important;border-color:#ef4444!important;color:#fca5a5!important;}
.qopt.ng.reveal{background:#450a0a!important;border-color:#ef4444!important;color:#fca5a5!important;}
.qpop-fb{min-height:26px;font-size:.84rem;font-weight:800;text-align:center;margin-top:8px;}
.qpop-fb.ok{color:#86efac;}
.qpop-fb.ng{color:#fca5a5;}

/* ── DAMAGE FLOAT ── */
@keyframes dmgFloat{0%{opacity:0;transform:translateY(0) scale(.6)}12%{opacity:1;transform:translateY(-10px) scale(1.25)}70%{opacity:1;transform:translateY(-50px) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(.85)}}
.dmg-float{position:fixed;pointer-events:none;font-weight:900;z-index:60;animation:dmgFloat 1.1s ease-out forwards;}

/* ── PHASE CUTSCENE ── */
#cut{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);}
#cut.show{display:flex;}
.cut-card{text-align:center;color:#fff;}
@keyframes cutIn{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.cut-card{animation:cutIn .55s cubic-bezier(.34,1.56,.64,1);}
.cut-phase{font-size:.82rem;font-weight:900;color:#fbbf24;letter-spacing:.35em;margin-bottom:14px;}
.cut-chars{display:flex;justify-content:center;align-items:flex-end;gap:32px;margin-bottom:16px;}
.cut-chars img{height:210px;width:auto;filter:drop-shadow(0 0 28px rgba(124,58,237,.9));}
@keyframes cutCharIn{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.cut-chars img{animation:cutCharIn .7s cubic-bezier(.34,1.56,.64,1);}
.cut-name{font-family:'Black Han Sans',sans-serif;font-size:2.1rem;font-weight:400;color:#fff;text-shadow:0 0 28px rgba(139,92,246,.8);}
.cut-sub{font-size:.9rem;color:#a78bfa;margin-top:6px;}

/* ── RESULT ── */
#result{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);}
#result.show{display:flex;}
.result-card{text-align:center;color:#fff;padding:30px 36px 26px;background:linear-gradient(180deg,rgba(30,20,55,.94),rgba(11,7,22,.97));border:2px solid rgba(255,255,255,.16);border-radius:26px;backdrop-filter:blur(12px);max-width:480px;width:92%;max-height:88vh;overflow-y:auto;animation:resultPop .5s cubic-bezier(.34,1.56,.64,1);}
.result-card.win{border-color:rgba(250,204,21,.55);box-shadow:0 0 60px rgba(250,204,21,.32),inset 0 0 40px rgba(250,204,21,.06);}
.result-card.lose{border-color:rgba(239,68,68,.5);box-shadow:0 0 50px rgba(239,68,68,.28);}
@keyframes resultPop{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.result-icon{font-size:4.2rem;margin-bottom:2px;filter:drop-shadow(0 4px 14px rgba(250,204,21,.5));animation:resultIcon 1.5s ease-in-out infinite;}
@keyframes resultIcon{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
.result-title{font-family:'Black Han Sans',sans-serif;font-size:2.2rem;font-weight:400;margin-bottom:2px;}
.result-grade{margin-bottom:8px;line-height:1;}
.result-grade .gr{font-size:2.7rem;font-weight:900;background:linear-gradient(135deg,#fde68a,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px rgba(251,191,36,.7));}
.result-card.lose .result-grade .gr{background:linear-gradient(135deg,#fca5a5,#ef4444,#b91c1c);-webkit-background-clip:text;background-clip:text;}
.result-grade .stars{color:#fbbf24;font-size:1.4rem;text-shadow:0 0 10px rgba(251,191,36,.7);margin-left:10px;letter-spacing:3px;vertical-align:6px;}

<script>
// ═══════════════════════════════════════════════════════════
//  BGM — CC0 배틀 음악(OpenGameArt) 페이즈별 재생
// ═══════════════════════════════════════════════════════════
const BGM = (() => {
  // CC0 배틀 음악(OpenGameArt) — 페이즈별 트랙 크로스페이드
  // iOS Safari는 OGG를 재생 못 해서 MP3로 교체 (전 브라우저 호환)
  const TRACKS = { a:'assets/bgm/battle-theme.mp3', b:'assets/bgm/hard-boss.mp3' };
  const PHASE_TRACK = ['a', 'a', 'b'];   // 0·1단계=RPG 배틀, 2단계(대마왕)=격렬
  const _au = {};
  let _cur = null, _playing = false, _phase = 0;
  function get(key) {
    if (!_au[key]) { const a = new Audio(TRACKS[key]); a.loop = true; a.volume = 0; a.preload = 'auto'; _au[key] = a; }
    return _au[key];
  }
  function fade(a, target, ms) {
    if (a._raf) cancelAnimationFrame(a._raf);
    const v0 = a.volume, t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / ms);
      a.volume = Math.max(0, Math.min(1, v0 + (target - v0) * k));
      if (k < 1) a._raf = requestAnimationFrame(step);
      else if (target === 0) { try { a.pause(); } catch (e) {} }
    })(performance.now());
  }
  function switchTo(key) {
    const next = get(key);
    Object.keys(_au).forEach(k => { if (_au[k] !== next) fade(_au[k], 0, 500); });
    _cur = next;
    next.play().then(() => fade(next, 0.5, 700)).catch(() => {});
  }
  return {
    async start(phase = 0) { _phase = phase; _playing = true; switchTo(PHASE_TRACK[phase] || 'a'); },
    stop() { _playing = false; Object.keys(_au).forEach(k => fade(_au[k], 0, 250)); },
    setPhase(p) { if (p === _phase) return; _phase = p; if (_playing) switchTo(PHASE_TRACK[p] || 'a'); },
    get isPlaying() { return _playing; }
  };
})();

// ═══════════════════════════════════════════════════════════
//  CAMERA SHAKE
// ═══════════════════════════════════════════════════════════
function cameraShake(intensity=6, dur=0.4) {
  const el = document.getElementById('game');
  gsap.killTweensOf(el);
  gsap.fromTo(el,
    { x:0, y:0 },
    { x: intensity, y: intensity*.6, duration: dur*.1,
      yoyo:true, repeat: Math.floor(dur/.1), ease:'none',
      onComplete(){ gsap.set(el,{x:0,y:0}); }
    }
  );
}

// ═══════════════════════════════════════════════════════════
//  CANVAS BACKGROUND
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CW = 0, CH = 0;
// 바닥선 위치(화면 높이 대비) — setCharSprites에서 실제 캐릭터 발 위치로 동기화.
let GROUND_FRAC = 0.72;
// 세로로 긴 화면일수록 arena(캐릭터)를 위로 올려 가운데로. 가로/PC는 그대로.
function arenaBasePct() {
  const ar = window.innerHeight / Math.max(1, window.innerWidth);
  return ar <= 1.0 ? 0 : Math.min(18, (ar - 1.0) * 24);  // 세로비율↑ → 최대 18% 위로
}
function updateGround() {
  const arena = document.getElementById('arena');
  if (arena) arena.style.bottom = arenaBasePct() + '%';
  markGroundDirty();
}
// ── 문제 팝업이 뜨면 아레나를 팝업 위로 끌어올려 전투가 항상 보이게 한다 ──
function liftArenaForQpop() {
  const arena = document.getElementById('arena');
  const qp = document.getElementById('qpop');
  if (!arena || !qp) return;
  const vh = window.innerHeight;
  const feetAbove = vh * 0.72 * 0.26;          // hero-wrap bottom:26% (arena 높이 72vh 기준)
  let target = Math.max(vh * arenaBasePct() / 100, qp.offsetHeight + 20 - feetAbove);
  target = Math.min(target, vh * 0.42);        // HUD와 겹치지 않게 상한
  arena.style.bottom = target + 'px';
  markGroundDirty();
}
function restoreArena() {
  if (GS && GS.practice && GS.practiceDone < GS.practiceTotal) return;  // 연습 중엔 연속 출제라 내리지 않음
  updateGround();
}
// 캐릭터 발(=hero-wrap 하단)에 바닥선을 맞춘다. footPad 계산 오차 없이 항상 정확.
function readFeetGround() {
  const w = document.getElementById('hero-wrap');
  if (w) GROUND_FRAC = Math.min(0.85, Math.max(0.4, w.getBoundingClientRect().bottom / window.innerHeight));
}

// var: resize()가 이 선언보다 먼저 실행되므로 TDZ 없는 var 사용 (drawBG에서 lazy 생성)
var _scn = null;

function buildScenery() {
  const far = [];
  for (let i = 0; i <= 18; i++) far.push(.07 + Math.random() * .15);   // 능선 높이(CH 비율)
  const near = [.06, .27, .56, .82].map(x => ({
    x: x + (Math.random() - .5) * .04,
    w: .055 + Math.random() * .045,
    h: .09 + Math.random() * .07,
    win: 2 + Math.floor(Math.random() * 2),
  }));
  _scn = { far, near };
  _bgKey = '';   // 지형 재생성 → 정적 캐시 무효화
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

// 정적 배경 레이어(하늘·달·산·성탑 본체·바닥)는 오프스크린 캔버스에 1회만 그려두고
// 매 프레임 blit한다. 4개 그라디언트 재생성 + 전폭 능선/벽돌 루프를 60fps로 반복하던
// 비용을 제거 — 태블릿 렉의 주원인.
const _bgCanvas = document.createElement('canvas');
const _bgCtx = _bgCanvas.getContext('2d');
const ARENA_BG = new Image();
ARENA_BG.onload = () => { _bgKey = ''; };
ARENA_BG.src = 'assets/hd-v1/arena.png';

function renderStaticBG(t, gY) {
  _bgCanvas.width = CW; _bgCanvas.height = CH;
  const c = _bgCtx;
  if (ARENA_BG.complete && ARENA_BG.naturalWidth) {
    const ir = ARENA_BG.naturalWidth / ARENA_BG.naturalHeight, cr = CW / CH;
    let sx=0, sy=0, sw=ARENA_BG.naturalWidth, sh=ARENA_BG.naturalHeight;
    if (ir > cr) { sw = sh * cr; sx = (ARENA_BG.naturalWidth - sw) / 2; }
    else { sh = sw / cr; sy = (ARENA_BG.naturalHeight - sh) / 2; }
    c.drawImage(ARENA_BG,sx,sy,sw,sh,0,0,CW,CH);
    const mood=c.createLinearGradient(0,0,0,CH);mood.addColorStop(0,hexA(t.glow,.08));mood.addColorStop(.72,'rgba(3,7,18,.03)');mood.addColorStop(1,'rgba(3,7,18,.3)');c.fillStyle=mood;c.fillRect(0,0,CW,CH);
    return;
  }
  // Sky
  const g = c.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,t.sky[0]); g.addColorStop(.5,t.sky[1]); g.addColorStop(1,t.sky[2]);
  c.fillStyle = g; c.fillRect(0,0,CW,CH);
  // Moon (정적 — 색만 테마 따라 변함)
  const mx = CW*.82, my = CH*.26, mr = Math.min(CW,CH)*.07;
  const halo = c.createRadialGradient(mx,my,mr*.5, mx,my,mr*2.8);
  halo.addColorStop(0, hexA(t.glow,.16)); halo.addColorStop(1,'transparent');
  c.fillStyle = halo; c.fillRect(mx-mr*3,my-mr*3,mr*6,mr*6);
  c.fillStyle = t.moon;
  c.beginPath(); c.arc(mx,my,mr,0,Math.PI*2); c.fill();
  c.fillStyle = 'rgba(0,0,0,.13)';
  c.beginPath(); c.arc(mx-mr*.3,my-mr*.2,mr*.22,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(mx+mr*.32,my+mr*.3,mr*.15,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(mx+mr*.1,my-mr*.42,mr*.1,0,Math.PI*2); c.fill();
  // Far mountains — 8px 계단형 픽셀 능선
  c.fillStyle = t.far;
  const N = _scn.far.length - 1;
  for (let x = 0; x < CW; x += 8) {
    const fi = (x / CW) * N, i0 = Math.floor(fi), k = fi - i0;
    const h = _scn.far[i0] * (1-k) + _scn.far[Math.min(N,i0+1)] * k;
    const y = Math.round((gY - h*CH) / 8) * 8;
    c.fillRect(x, y, 8, gY - y);
  }
  // Near silhouette — 성탑 본체 + 총안 (창 불빛은 동적이라 제외)
  _scn.near.forEach((tw) => {
    const w = tw.w*CW, x = tw.x*CW, h = tw.h*CH, y = gY - h;
    c.fillStyle = t.near;
    c.fillRect(x, y, w, h);
    const bw = Math.max(4, w/5);
    for (let i=0; i<5; i+=2) c.fillRect(x+i*bw, y-bw, bw, bw);   // 총안(battlement)
  });
  // Ground
  const gg = c.createLinearGradient(0,gY,0,CH);
  gg.addColorStop(0,t.ground[0]); gg.addColorStop(1,t.ground[1]);
  c.fillStyle = gg; c.fillRect(0,gY,CW,CH-gY);
  // Glow line
  c.fillStyle = t.glow; c.globalAlpha = .5;
  c.fillRect(0, gY, CW, 3);
  c.globalAlpha = 1;
  // Brick floor — 엇갈린 벽돌 패턴
  c.fillStyle = 'rgba(0,0,0,.2)';
  for (let y = gY+22; y < CH; y += 24) c.fillRect(0, y, CW, 2);
  c.fillStyle = 'rgba(255,255,255,.04)';
  for (let r = 0, y = gY+4; y < CH; r++, y += 24) {
    for (let x = (r%2)*30; x < CW; x += 60) c.fillRect(x, y, 2, 18);
  }
}

function drawBG(phase, ts) {
  const _st = GS ? GS.stage : 1;
  const t = (_st >= 2) ? STAGE_BG_THEMES[(_st - 2) % STAGE_BG_THEMES.length] : (BG_THEMES[phase] || BG_THEMES[0]);
  if (!_scn) buildScenery();
  const gY = CH * GROUND_FRAC;

  // 테마·화면크기·바닥선이 바뀔 때만 정적 레이어 재생성, 그 외엔 캐시 blit
  const key = (_st>=2 ? 'S'+((_st-2)%STAGE_BG_THEMES.length) : 'P'+phase) + ':' + CW + 'x' + CH + ':' + Math.round(gY);
  if (key !== _bgKey) { renderStaticBG(t, gY); _bgKey = key; }
  ctx.drawImage(_bgCanvas, 0, 0);

  // ── 동적 레이어 ──
  // Stars (깜빡임)
  STARS.forEach(s => {
    const alpha = .4 + Math.sin(ts/1200 + s.blink) * .35;
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(s.x*CW, s.y*CH*.7, s.r, 0, Math.PI*2); ctx.fill();
  });

  // 성탑 창 불빛 깜빡임
  if (!(ARENA_BG.complete && ARENA_BG.naturalWidth)) _scn.near.forEach((tw, ti) => {
    const w = tw.w*CW, x = tw.x*CW, h = tw.h*CH, y = gY - h;
    for (let i=0; i<tw.win; i++) {
      const fl = .5 + .5*Math.sin(ts/420 + ti*2.1 + i*1.7);
      ctx.fillStyle = hexA(t.glow, .25 + .45*fl);
      ctx.fillRect(x + w*.5 - 3, y + h*(.3 + i*.3), 6, 9);
    }
  });

  // Phase-specific effects
  if (phase >= 1) {
    // Floating orbs background
    for (let i=0;i<3;i++) {
      const ox = CW*(0.2+i*.3) + Math.sin(ts/2000+i)*30;
      const oy = CH*(0.3+i*.1) + Math.cos(ts/1500+i)*20;
      const gr = ctx.createRadialGradient(ox,oy,0,ox,oy,60);
      gr.addColorStop(0,`rgba(124,58,237,${phase===2?.08:.05})`);
      gr.addColorStop(1,'transparent');
      ctx.fillStyle = gr; ctx.fillRect(ox-60,oy-60,120,120);
    }
  }
  if (phase >= 2) {
    // Red crack lines
    ctx.strokeStyle = 'rgba(239,68,68,.15)'; ctx.lineWidth = 2;
    for (let i=0;i<4;i++) {
      ctx.beginPath();
      ctx.moveTo(CW*(0.1+i*.25), gY);
      ctx.lineTo(CW*(0.05+i*.25)+Math.sin(ts/500+i)*10, gY-80);
      ctx.stroke();
    }
  }
}

let _bursts = [];

function spawnBurst(cx, cy, colors, count=14, power=1) {
  const now = performance.now();
  for (let i=0; i<count; i++) {
    const angle = (Math.PI*2*i/count) + Math.random()*.5;
    const spd = (55 + Math.random()*90) * power;
    _bursts.push({
      x:cx, y:cy,
      vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd - 35*power,
      r: 3 + Math.random()*3*power,
      color: colors[Math.floor(Math.random()*colors.length)],
      birth: now, ttl: 350 + Math.random()*250
    });
  }
}

function paintBursts(now) {
  const alive = [];
  for (const b of _bursts) {
    const age = now - b.birth;
    if (age >= b.ttl) continue;
    const t = age / b.ttl;
    const x = b.x + b.vx*(age/1000);
    const y = b.y + b.vy*(age/1000) + 180*(age/1000)**2;
    ctx.globalAlpha = (1-t)*0.85;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(x, y, b.r*(1-t*.5), 0, Math.PI*2);
    ctx.fill();
    alive.push(b);
  }
  ctx.globalAlpha = 1;
  _bursts = alive;
}

const CANVAS_FRAME_MS = 30;
let _lastCanvasTs = 0;
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min(64, ts - _lastTs); _lastTs = ts;
  heroFighter.update(dt); bossFighter.update(dt);
  // 배경·파티클은 30fps로도 충분히 부드럽다. 전체 화면 canvas를 60fps로
  // 다시 그리면 저사양 태블릿에서 문제 선택과 캐릭터 애니메이션까지 끊긴다.
  // 문제를 읽고 고르는 동안에는 배경만 15fps로 낮춰 터치 응답을 우선한다.
  const canvasFrameMs = GS && GS.phase === 2 ? 66 : CANVAS_FRAME_MS;
  if (ts - _lastCanvasTs >= canvasFrameMs) {
    syncGroundToFeet();   // 강제 reflow도 canvas 갱신 시에만 제한적으로 실행
    drawBG(GS ? GS.bossPhase : 0, ts);
    paintBursts(ts);
    _lastCanvasTs = ts;
  }
  // Expire status effects
  if (GS) {
    Object.keys(GS.statusFx).forEach(k => {
      if (ts > GS.statusFx[k].expires) { delete GS.statusFx[k]; updateStatusRow(); }
    });
  }
}

function viewScale() {
  return Math.max(0.68, Math.min(1, window.innerWidth / 760));
}
function makeFighter(el, defKey) {
  const def=HD_SPRITE_DEFS[defKey];
  const S = def.scale * viewScale();   // 화면 폭 반영 유효 배율
  for (const k in def.anims) { const im = new Image(); im.src = def.base + def.anims[k].file; }
  el.style.width  = (def.fw * S) + 'px';
  el.style.height = (def.fh * S) + 'px';
  if (def.flip) el.style.transform = 'scaleX(-1)';
  const f = {
    def, el, defKey, S, state:null, frame:0, acc:0, done:null,
    play(state, done=null) {
      if (!def.anims[state]) state = 'idle';
      if (this.state === state && def.anims[state].loop && !done) return;
      this.state = state; this.frame = 0; this.acc = 0; this.done = done;
      const a = def.anims[state];
      el.style.backgroundImage = 'url(' + def.base + a.file + ')';
      el.style.backgroundSize  = (def.fw*S*a.n) + 'px ' + (def.fh*S) + 'px';
      el.style.backgroundPosition = '0 0';
    },
    update(dt) {
      const a = def.anims[this.state]; if (!a) return;
      this.acc += dt;
      const spf = 1000 / a.fps;
      let frameChanged = false;
      while (this.acc >= spf) {
        this.acc -= spf; this.frame++; frameChanged = true;
        if (this.frame >= a.n) {
          if (a.loop) { this.frame = 0; }
          else if (a.hold) { this.frame = a.n-1; this.acc = 0;
            if (this.done) { const cb = this.done; this.done = null; cb(); } break; }
          else { const nx = a.next || 'idle', cb = this.done; this.done = null;
            this.play(nx); if (cb) cb(); return; }
        }
      }
      if (frameChanged) el.style.backgroundPosition = (-(this.frame*def.fw*S)) + 'px 0';
    },
    flash() { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); },
  };
  f.play('idle');
  return f;
}

  const glow = st >= 2 ? `rgba(239,68,68,${Math.min(0.92, 0.62 + 0.12 * (st - 1)).toFixed(2)})` : b.glow;
  // 정예 보스: 진홍 후광 + 채도/대비 강화로 챔피언 느낌
  const elite = isElite() ? ' saturate(1.5) contrast(1.12) drop-shadow(0 0 22px rgba(239,68,68,.95)) drop-shadow(0 0 8px rgba(255,215,120,.7))' : '';
  return `${b.tint || ''}${stageRed} drop-shadow(0 10px 28px ${glow})${elite}`;
}

// 영웅 승급 티어 (스테이지2+) — 용사 → 대용사 → 전설의 용사
function heroTier(st) { return st >= 7 ? 2 : st >= 4 ? 1 : 0; }
function heroStageName(st) {
  return ['☀️ 봉황 성기사','⚜️ 봉황 대성기사','🌟 전설의 월광기사'][heroTier(st)];
}
// 영웅 필터(오라) — 스테이지 올라갈수록 황금→전설 빛 강화
function heroFilterStr(h) {
  const st = GS ? GS.stage : 1;
  if (st < 2) return `${h.tint || ''} drop-shadow(0 8px 22px ${h.glow})`;
  const tier = heroTier(st);
  const auraGlow = ['rgba(250,204,21,.72)', 'rgba(255,214,128,.85)', 'rgba(125,211,252,.95)'][tier];
  const extra = tier === 2 ? ' drop-shadow(0 0 18px rgba(255,255,255,.7))'
              : tier === 1 ? ' drop-shadow(0 0 11px rgba(250,204,21,.6))' : '';
  const sat   = (1.2 + 0.05 * (st - 2)).toFixed(2);
  const bright = Math.min(1.35, 1 + 0.04 * (st - 2)).toFixed(2);
  return `saturate(${sat}) brightness(${bright}) drop-shadow(0 8px 22px ${auraGlow})${extra}`;
}

function setCharSprites(phase) {
  const h = HERO_ASSETS[phase], b = BOSS_ASSETS[phase];
  // 진행 중인 타임라인 전체 킬 (killTweensOf는 .call() 콜백 킬 안 함)
  if (_heroTl) { _heroTl.kill(); _heroTl = null; }
  if (_bossTl) { _bossTl.kill(); _bossTl = null; }
  gsap.killTweensOf(heroWrap); gsap.killTweensOf(bossWrap);
  // 캐릭터 선택: 스테이지1은 페이즈별 변신(영웅 수련생→검사→용사 / 보스 마법사→흑마도사→대마왕),
  // 스테이지2+는 영웅=용사(기사) · 보스=대마왕(왕) 고정으로 시작부터 풀파워
  const st = GS ? GS.stage : 1;
  const hk=(st>=2)?'hero_phoenix':(HERO_SPRITE[phase]||'hero_moonblade');
  const bk = bossKeyFor(st, phase);
  if (hk !== _heroKey) { heroFighter = makeFighter(heroImg, hk); _heroKey = hk; } else heroFighter.play('idle');
  if (bk !== _bossKey) { bossFighter = makeFighter(bossImg, bk); _bossKey = bk; } else bossFighter.play('idle');
  // 스테이지 올라갈수록 보스 더 크게 (보스다움 ↑, 최대 +40%). 정예는 챔피언이라 더 큼.
  const bossStageScale = Math.min(1.4, 1 + 0.14 * (st - 1)) * (isElite() ? 1.22 : 1);
  const heroStageScale = Math.min(1.22, 1 + 0.045 * (st - 1));
  const _hScreen = (h.scale || 1) * heroStageScale;
  // 영웅도 보스와 동일하게 footPad(발밑 투명 여백, native px) 우선 적용해 발을 바닥에 정확히 붙임.
  const _hFoot = (heroFighter.def.footPad != null)
    ? (heroFighter.def.footPad * heroFighter.S * _hScreen)
    : (heroFighter.def.foot || 0);
  heroImg.style.transform = `translateY(${_hFoot.toFixed(1)}px) scale(${_hScreen.toFixed(3)})`;
  heroImg.style.filter = heroFilterStr(h);
  const _bScreen = (b.scale || 1) * bossStageScale;
  // footPad(스프라이트 발밑 투명 여백, native px)가 있으면 화면배율만큼 끌어내려 발을 바닥에 정확히 붙임.
  // 없으면 기존 foot 상수 사용(king 등).
  const _bFoot = (bossFighter.def.footPad != null)
    ? (bossFighter.def.footPad * bossFighter.S * _bScreen)
    : (bossFighter.def.foot || 0);
  bossImg.style.transform=`translateY(${_bFoot.toFixed(1)}px) scale(${_bScreen.toFixed(3)})`;
  bossImg.style.filter = bossFilterStr(b);
  gsap.set(heroWrap, { left: '8%', clearProps: 'x,right' });
  gsap.set(bossWrap, { right: '8%', clearProps: 'x,left' });
  readFeetGround(); markGroundDirty();   // 스프라이트 교체 직후 즉시 바닥선 동기화 + 잠깐 추적
  document.getElementById('hero-name').textContent = (st >= 2) ? heroStageName(st) : h.name;
  let bossName;
  if (st >= 2) {
    const cyc = Math.floor((st - 2) / BOSS_STAGE_ROSTER.length);
    bossName = (BOSS_STAGE_NAME[bk] || '👹 보스') + (cyc > 0 ? ' ' + '⚡'.repeat(Math.min(3, cyc)) : '');
  } else {
    bossName = b.name;
  }
  // 정예 노드: 왕관 + '정예' 칭호로 챔피언임을 표기
  if (isElite()) bossName = '👑 정예 ' + bossName.replace(/^[^\s가-힣]+\s*/, '');
  document.getElementById('boss-name').textContent = bossName;
}

function heroAnim(type) {
  if (_heroTl) { _heroTl.kill(); _heroTl = null; }
  if (type === 'atk') {
    heroFighter.play('atk');
    _heroTl = gsap.timeline()
      .to(heroWrap, { left: '17%', duration: .28, ease: 'power3.out' })
      .to(heroWrap, { left: '8%', duration: .45, ease: 'power2.in',
          onComplete() { _heroTl = null; } });
  } else if (type === 'crit') {
    // 크리티컬 — 더 깊게 파고들며 다른 공격 모션
    heroFighter.play('atk2');
    _heroTl = gsap.timeline()
      .to(heroWrap, { left: '24%', duration: .22, ease: 'power4.out' })
      .to(heroWrap, { left: '8%', duration: .5, ease: 'power2.in',
          onComplete() { _heroTl = null; } });
  } else if (type === 'hurt') {
    heroFighter.play('hurt'); heroFighter.flash();
    _heroTl = gsap.fromTo(heroWrap, { x: 0 }, { x: -22, duration: .1, yoyo: true, repeat: 4, ease: 'power1.inOut',
      onComplete() { _heroTl = null; gsap.set(heroWrap, { x: 0 }); } });
  }
}

function bossAnim(type) {
  if (_bossTl) { _bossTl.kill(); _bossTl = null; }
  const b = BOSS_ASSETS[GS.bossPhase];
  if (type === 'windup') {
    // 둘 다 중앙으로 돌격 — clash
    if (_heroTl) { _heroTl.kill(); _heroTl = null; }
    bossFighter.play('run'); heroFighter.play('run'); playSfx('whoosh');
    const cp = (window.innerWidth < 600 ? 9 : 15) + '%';  // 모바일은 화면이 좁아 덜 붙게
    _bossTl = gsap.to(bossWrap, { right: cp, duration: .5, ease: 'power2.out' });
    _heroTl = gsap.to(heroWrap, { left: cp, duration: .5, ease: 'power2.out', onComplete() { _heroTl = null; } });
  } else if (type === 'attack') {
    // 보스 반격 잽 (오답 시 영웅에게 달려들어 타격)
    bossFighter.play('atk');
    _bossTl = gsap.timeline()
      .to(bossWrap, { right: '30%', duration: .24, ease: 'power3.out' })
      .to(bossWrap, { right: '8%', duration: .5, ease: 'power2.in', onComplete() { _bossTl = null; bossFighter.play('idle'); } });
  } else if (type === 'hit') {
    bossFighter.play('hurt'); bossFighter.flash();
    _bossTl = gsap.timeline()
      .to(bossWrap, { right: '8%', duration: .34, ease: 'power3.out' })
      .fromTo(bossWrap, { x: 0 }, { x: 26, duration: .09, yoyo: true, repeat: 5, ease: 'power1.inOut' })
      .call(() => { _bossTl = null; bossImg.style.filter = bossFilterStr(b); });
  } else {
    // 후퇴 — 둘 다 제자리로
    if (_heroTl) { _heroTl.kill(); _heroTl = null; }
    bossFighter.play('idle'); heroFighter.play('idle');
    _bossTl = gsap.to(bossWrap, { right: '8%', duration: .42, ease: 'power2.out',
      onComplete() { _bossTl = null; } });
    _heroTl = gsap.to(heroWrap, { left: '8%', duration: .42, ease: 'power2.out',
      onComplete() { _heroTl = null; } });
  }
}

// ─── SKILL SYSTEM ───────────────────────────────────────────
const SKILL_MAX = 100;
let skillGauge = 0;

function addSkillGauge(v) {
  if (!GS || GS.phase === 10) return;
  if (v > 0) v = v * (1 + (GS.upgrades.skill || 0));   // 필살기 충전 강화
  skillGauge = Math.min(SKILL_MAX, skillGauge + v);
  const pct = (skillGauge / SKILL_MAX) * 100;
  document.getElementById('skill-fill-bar').style.width = pct + '%';
  const btn = document.getElementById('skill-btn2');
  const ready = skillGauge >= SKILL_MAX;
  btn.disabled = !ready;
  btn.textContent = ready ? '발동!' : Math.round(pct) + '%';
  btn.className = 'skill-btn2' + (ready ? ' ready' : '');
}

// 필살기 4종 — 사용할 때마다 순환, 연출·데미지·색 다름
let _ultIdx = 0;
const ULTIMATES = [
  { name:'⚡ 슈팅스타', color:'#38bdf8', base:13, shake:16, flash:.65, fx:'beam' },
  { name:'📚 문장폭풍', color:'#a855f7', base:16, shake:20, flash:.6,  fx:'storm' },
  { name:'⚔️ 문법심판', color:'#fde68a', base:24, shake:30, flash:.96, fx:'judge' },
  { name:'☄️ 유성낙하', color:'#f97316', base:18, shake:24, flash:.7,  fx:'meteor' },
];
function castSkill() {
  if (!GS || skillGauge < SKILL_MAX || GS.phase === 10) return;
  skillGauge = 0;
  addSkillGauge(0);
  const ult = ULTIMATES[_ultIdx % ULTIMATES.length]; _ultIdx++;
  heroFighter.play('special');
  showFloating('필살기 ' + ult.name + '!', ult.color);
  playSfx('cast');
  const ultFlash = document.getElementById('ult-flash');
  const pc = [ult.color, '#fff', '#facc15', '#fb7185'];
  gsap.timeline()
    .to(heroWrap, { left: '30%', duration: .34, ease: 'power4.out' })
    .to(ultFlash,  { opacity: ult.flash, duration: .16 })
    .call(() => {
      const dmg = Math.round((ult.base + GS.bossPhase * 4) * (GS.combo * .05 + .95));
      GS.bossHP = Math.max(0, GS.bossHP - dmg);
      GS.score += Math.round(dmg * 3 * (1 + (GS.upgrades.score || 0)));
      bossAnim('hit');
      showDmgFloat('💥 -' + dmg, ult.color, 'right');
      cameraShake(ult.shake + GS.bossPhase * 4, .85);
      playSfx('correct');
      // 연출별 파티클 (비주얼 전용, 게임상태 변화 없음)
      if (ult.fx === 'beam') {
        [.5,.62,.74].forEach((x,i) => setTimeout(() => spawnBurst(CW*x, CH*.4, [ult.color,'#fff'], 12, 1.5), i*60));
      } else if (ult.fx === 'storm') {
        for (let i=0;i<4;i++) setTimeout(() => { spawnBurst(CW*(.6+Math.sin(i)*.12), CH*(.35+i*.05), pc, 14, 1.4); playSfx('slash'); cameraShake(8,.3); }, i*110);
      } else if (ult.fx === 'judge') {
        spawnBurst(CW*.75, CH*.4, pc, 48, 2.6); spawnBurst(CW*.5, CH*.42, ['#fde68a','#fff'], 24, 2.0);
      } else { // meteor
        for (let i=0;i<6;i++) setTimeout(() => { spawnBurst(CW*(.45+i*.07), CH*.18, ['#f97316','#fde68a','#fff'], 10, 1.5); playSfx('impact'); }, i*90);
      }
      checkBossPhase();
      updateHUD();
    })
    .to(ultFlash,  { opacity: 0, duration: .55 })
    .to(heroWrap,  { left: '8%', duration: .5, ease: 'back.out(1.5)', onComplete() { heroFighter.play('idle'); } });
}

// ═══════════════════════════════════════════════════════════
//  BOSS AI
// ═══════════════════════════════════════════════════════════
function scheduleBossAttack() {
  if (bossTimer) clearTimeout(bossTimer);
  const [mn, mx] = PHASE_ATTACK_DELAY[GS ? GS.bossPhase : 0] || PHASE_ATTACK_DELAY[0];
  const diffMul = (GS && GS.difficulty === 'beginner') ? 1.45 : 1;   // 초급: 보스 공격 간격 더 길게
  const delay = (mn + Math.random() * (mx - mn)) * stageSpeedMul() * nodeSpeedMul() * diffMul;
  bossTimer = setTimeout(startAttack, delay);
}

// 보스별 시그니처 — 보스마다 고정 기믹으로 정체성+학습성 부여
//  status: 고정 상태이상('ANY'=랜덤, null=거의 없음) / bias: 자주 쓰는 공격 타입 / tag: 등장 안내
const BOSS_SIGNATURE = {
  goblin:     { status:null,     bias:'jab',     tag:'⚡ 빠른 잽' },
  mushroom:   { status:'BURN',   bias:null,      tag:'🔥 맹독 포자 — 오답 2배 피해' },
  skeleton:   { status:null,     bias:'hook',    tag:'💀 강타 — 한 방이 무겁다' },
  flying_eye: { status:'FREEZE', bias:null,      tag:'🧊 빙결의 시선 — 제한시간 절반' },
  wizard:     { status:'SHOCK',  bias:null,      tag:'⚡ 혼란 마법 — 보기가 섞인다' },
  king:       { status:'ANY',    bias:'special', tag:'👹 폭주 — 모든 기믹' },
};
function bossSig() { return BOSS_SIGNATURE[_bossKey] || { status:'ANY', bias:null }; }
let _lastSigKey = '';
function announceBossSignature() {
  const sig = bossSig();
  if (_bossKey === _lastSigKey || !sig.tag) return;
  _lastSigKey = _bossKey;
  setTimeout(() => { if (GS && GS.phase !== 10) showFloating(sig.tag, '#fca5a5'); }, 500);
}

function startAttack() {
  if (!GS || GS.phase !== 0) return;
  GS.phase = 1;
  const sig = bossSig();

  // Pick attack type (보스 시그니처 bias가 있으면 절반 확률로 그 공격을 씀)
  let chosen;
  if (sig.bias && Math.random() < 0.5) {
    chosen = ATTACK_TYPES.find(a => a.id === sig.bias) || ATTACK_TYPES[0];
  } else {
    const roll = Math.random();
    let cum = 0; chosen = ATTACK_TYPES[0];
    for (const at of ATTACK_TYPES) {
      cum += at.chance + (at.id === 'special' ? GS.bossPhase * .08 : 0);
      if (roll < cum) { chosen = at; break; }
    }
  }
  GS.attackType = chosen;

  // 상태이상: 보스 시그니처에 따라 결정 (정예는 빈도 ↑)
  const sChance = (0.16 + GS.bossPhase * 0.08) * (isElite() ? 1.6 : 1);
  if (sig.status === 'ANY') {
    if (Math.random() < sChance) {
      const keys = Object.keys(STATUS_FX);
      applyStatusFx(keys[Math.floor(Math.random() * keys.length)]);
    }
  } else if (sig.status) {
    if (Math.random() < sChance + 0.12) applyStatusFx(sig.status);
  }
  // status:null 인 보스(고블린·해골)는 상태이상 없음 — 초반/강타형은 깔끔하게

  // Telegraph
  bossAnim('windup');
  const tel = document.getElementById('tel');
  tel.style.display = 'block';
  const telFillEl = document.getElementById('tel-fill');
  telFillEl.style.background = chosen.color;
  telFillEl.style.boxShadow = `0 0 10px ${chosen.color}`;

  const DUR = 950 + GS.bossPhase * 200;
  let elapsed = 0;
  telIv = setInterval(() => {
    elapsed += 50;
    document.getElementById('tel-fill').style.width = Math.min(100, elapsed / DUR * 100) + '%';
    if (elapsed >= DUR) {
      clearInterval(telIv); telIv = null;
      tel.style.display = 'none';
      bossAnim('idle');
      showQuestion();
    }
  }, 50);
}

// ═══════════════════════════════════════════════════════════
//  PRACTICE MODE (시간제한·피격 없는 학습 모드)
// ═══════════════════════════════════════════════════════════
function practiceNextQuestion() {
  if (!GS || !GS.practice) return;
  if (GS.practiceDone >= GS.practiceTotal) { practiceResult(); return; }
  GS.phase = 0;
  GS.attackType = ATTACK_TYPES[0];
  showQuestion();
}

function practiceFinish(isCorrect) {
  document.getElementById('qpop').classList.remove('show');
  if (isCorrect) {
    GS.practiceCorrect++;
    GS.combo = Math.min(GS.combo + 1, 12);
    GS.maxCombo = Math.max(GS.maxCombo, GS.combo);
    heroAnim('atk'); bossAnim('hit');
    spawnBurst(CW*.78, CH*.42, ['#fbbf24','#f97316','#fff'], 14, 1.1);
  } else {
    GS.combo = 1;
  }
  GS.practiceDone++;
  updateHUD();
  setTimeout(practiceNextQuestion, 450);
}

function practiceResult() {
  GS.phase = 10;
  cancelTimers();
  BGM.stop();
  const total = GS.practiceTotal, correct = GS.practiceCorrect;
  const pct = total ? Math.round(correct / total * 100) : 0;
  const card = document.querySelector('#result .result-card');
  if (card) { card.classList.remove('lose'); card.classList.add('win'); }
  document.getElementById('result-icon').textContent = '📖';
  document.getElementById('result-title').textContent = '연습 완료!';
  document.getElementById('result-grade').innerHTML = `<span class="gr">${pct}점</span>`;
  document.getElementById('result-sub').textContent = correct === total ? '전부 맞혔어요! 보스전에 도전해볼까요? 💪' : '틀린 문제를 확인하고 다시 도전해봐요!';
  document.getElementById('result-btns').innerHTML =
    `<button class="btn-retry" onclick="G.retry()">📖 다시 연습</button><button class="btn-home" onclick="G.goHome()">단원 선택</button>`;
  document.getElementById('r-score').textContent = correct + '/' + total;
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-combo').textContent = 'x' + GS.maxCombo;
  const wl = document.getElementById('wrong-log');
  const wll = document.getElementById('wrong-log-list');
  if (wrongLog.length) {
    wl.style.display = 'block';
    wll.innerHTML = wrongLogHTML();
  } else { wl.style.display = 'none'; }
  document.getElementById('result').classList.add('show');
}

// ═══════════════════════════════════════════════════════════
//  QUESTION SYSTEM
// ═══════════════════════════════════════════════════════════
function showQuestion() {
  if (!GS) return;
  GS.phase = 2;
  if (GS.qIdx >= GS.questions.length) { GS.questions = shuffle([...GS.questions]); GS.qIdx = 0; }
  const q = GS.questions[GS.qIdx++];
  GS.currentQ = q;

  if (!GS.attackType) GS.attackType = ATTACK_TYPES[0];   // 연습 모드 등 보스공격 없이 문제 띄울 때 기본값
  let timeLimit = GS.attackType.time * (PHASE_TIME_SCALE[GS.bossPhase] || 1) * stageTimeMul() * nodeTimeMul() * (1 + (GS.upgrades.time || 0)) * (GS.difficulty === 'beginner' ? 1.5 : 1);
  if (GS.statusFx.FREEZE) timeLimit *= 0.5;
  GS._qT0 = performance.now(); GS._qLimit = timeLimit;   // 크리티컬(빠른 정답) 판정용

  let opts = [...q.opts];
  if (GS.statusFx.SHOCK) opts = shuffle(opts);

  document.getElementById('qpop-atk-label').textContent = GS.practice ? ('📖 연습 ' + (GS.practiceDone + 1) + '/' + GS.practiceTotal) : GS.attackType.label;
  document.getElementById('qpop-atk-label').style.color = GS.practice ? '#38bdf8' : GS.attackType.color;
  document.getElementById('qpop-eng').textContent = q.eng;
  document.getElementById('qpop-kor').textContent = q.kor;
  document.getElementById('qpop-fb').textContent = '';
  document.getElementById('qpop-fb').className = 'qpop-fb';

  // Render options
  const optsEl = document.getElementById('qpop-opts');
  optsEl.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qopt';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(btn.textContent, q.ans, btn);
    optsEl.appendChild(btn);
  });

  // SHOCK: reshuffle every 1.2s
  let shockIv = null;
  if (GS.statusFx.SHOCK) {
    shockIv = setInterval(() => {
      if (GS.phase !== 2) { clearInterval(shockIv); return; }
      const sh = shuffle([...opts]);
      optsEl.querySelectorAll('.qopt:not([disabled])').forEach((b,i) => b.textContent = sh[i]);
    }, 1200);
  }

  // Timer
  const start = performance.now();
  const timerEl = document.getElementById('qpop-timer');
  const fillEl = document.getElementById('timer-fill');
  if (GS.practice) {
    // 연습 모드: 시간 제한 없음 — 타이머 바 가득, 카운트다운 안 함
    timerEl.textContent = '∞';
    timerEl.className = 'qpop-timer';
    fillEl.style.width = '100%';
    fillEl.style.background = '#38bdf8';
  } else {
    let lastTimerPaint = -Infinity;
    function tickTimer(now) {
      if (GS.phase !== 2) return;
      const rem = Math.max(0, timeLimit - (now - start) / 1000);
      // 정답 판정은 매 프레임 확인하되 화면 표시는 0.1초 단위로 갱신한다.
      // 같은 DOM을 초당 60번 다시 쓰면 저사양 태블릿에서 보기 터치가 늦어진다.
      if (now - lastTimerPaint >= 100 || rem === 0) {
        timerEl.textContent = rem.toFixed(1);
        fillEl.style.width = (rem / timeLimit * 100) + '%';
        fillEl.style.background = rem > timeLimit*.5 ? '#fbbf24' : rem > timeLimit*.25 ? '#f97316' : '#ef4444';
        timerEl.className = 'qpop-timer' + (rem < 1.5 ? ' crit' : rem < 3 ? ' warn' : '');
        lastTimerPaint = now;
      }
      if (rem > 0) { qTimer = requestAnimationFrame(tickTimer); }
      else { clearInterval(shockIv); timeExpired(q.ans); }
    }
    qTimer = requestAnimationFrame(tickTimer);
  }
  document.getElementById('qpop').classList.add('show');
  liftArenaForQpop();   // 캐릭터를 팝업 위로 — 문제 푸는 동안에도 전투가 보인다
}

function handleAnswer(chosen, correct, clickedBtn) {
  if (GS.phase !== 2) return;
  cancelAnimationFrame(qTimer); qTimer = null;
  GS._ansFrac = Math.max(0, 1 - (performance.now() - GS._qT0) / 1000 / (GS._qLimit || 1));
  GS.phase = 3;
  const isCorrect = chosen === correct;
  document.querySelectorAll('.qopt').forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add(isCorrect ? 'ok' : 'reveal');
  });
  if (!isCorrect) {
    clickedBtn.classList.add('ng');
    wrongLog.push({ eng: GS.currentQ.eng, ans: correct, wrong: chosen, type: GS.currentQ.type, kor: GS.currentQ.kor });
  }
  const fb = document.getElementById('qpop-fb');
  if (GS.practice) {
    // 연습: 피격 없이 정답/해설만. 오답이면 정답을 또렷이 보여줌.
    fb.textContent = isCorrect ? '✅ 정답!' : ('❌ 오답 — 정답: ' + correct);
    fb.className = 'qpop-fb ' + (isCorrect ? 'ok' : 'ng');
    if (isCorrect) playSfx('correct'); else playSfx('wrong');
    setTimeout(() => practiceFinish(isCorrect), isCorrect ? 800 : 1500);
    return;
  }
  fb.textContent = isCorrect ? (GS._ansFrac >= 0.55 ? '⚡ 빠른 정답! 크리티컬!' : '✅ 정답! 공격!') : '❌ 오답! 피격!';
  fb.className = 'qpop-fb ' + (isCorrect ? 'ok' : 'ng');
  setTimeout(() => finishQuestion(isCorrect), isCorrect ? 650 : 950);
}

function timeExpired(correct) {
  if (GS.phase !== 2) return;
  cancelAnimationFrame(qTimer); qTimer = null;
  GS._ansFrac = 0;
  GS.phase = 3;
  document.querySelectorAll('.qopt').forEach(b => { b.disabled = true; if (b.textContent === correct) b.classList.add('reveal'); });
  const fb = document.getElementById('qpop-fb');
  fb.textContent = '⏰ 시간 초과! 피격!';
  fb.className = 'qpop-fb ng';
  wrongLog.push({ eng: GS.currentQ.eng, ans: correct, wrong: '(시간초과)', type: GS.currentQ.type, kor: GS.currentQ.kor });
  setTimeout(() => finishQuestion(false), 950);
}

function finishQuestion(isCorrect) {
  document.getElementById('qpop').classList.remove('show');
  restoreArena();
  if (isCorrect) {
    const crit = (GS._ansFrac || 0) >= 0.55;   // 남은 시간 55% 이상이면 크리티컬
    const stance = STANCES[GS.stance] || STANCES.combo;
    let dmg = 6 + GS.bossPhase * 2;
    if (crit) dmg = Math.round(dmg * 1.5);
    if (GS.hasPower) { dmg = Math.round(dmg * 1.6); GS.hasPower = false; }
    dmg = Math.round(dmg * stance.dmg * (GS.combo * .09 + .91) * (1 + (GS.upgrades.atk || 0)));
    GS.bossHP = Math.max(0, GS.bossHP - dmg);
    GS.combo = Math.min(GS.combo + stance.comboGrow, 12);
    GS.maxCombo = Math.max(GS.maxCombo, GS.combo);
    GS.score += Math.round(dmg * GS.combo * (1 + (GS.upgrades.score || 0)));
    GS.correct++;
    // 수비 스탠스: 정답 시 소량 회복
    if (stance.heal) { GS.heroHP = Math.min(100, GS.heroHP + stance.heal); showFloating('🛡️ +' + stance.heal + 'HP', '#38bdf8'); }
    addSkillGauge(crit ? 22 : 15);
    heroAnim((crit || GS.stance === 'power') ? 'crit' : 'atk'); bossAnim('hit');
    const dmgPrefix = crit ? '💢 CRITICAL ' : GS.stance === 'power' ? '💥 ' : '';
    showDmgFloat(dmgPrefix + '-' + dmg, crit ? '#fde68a' : GS.stance === 'power' ? '#ef4444' : '#ef4444', 'right');
    cameraShake((crit ? 16 : 10) + GS.bossPhase * 4, crit ? .65 : .5);
    spawnBurst(CW*.78, CH*.42, ['#fbbf24','#f97316','#ef4444','#fff','#fb7185'], (crit?30:22)+GS.bossPhase*5, (crit?1.9:1.4)+GS.bossPhase*.3);
    spawnBurst(CW*.72, CH*.38, ['#fff','#fbbf24'], crit ? 14 : 8, crit ? 1.2 : .8);
    _flashEl('ok-flash');
    playSfx('correct'); playSfx('slash'); setTimeout(() => playSfx('impact'), 150);
    if (crit) setTimeout(() => playSfx('impact'), 290);
    checkBossPhase();
  } else {
    let dmg = ((GS.attackType && GS.attackType.damage) || 10) * stageDmgMul() * nodeDmgMul();
    if (GS.statusFx.BURN) dmg *= 2;
    dmg = Math.round(dmg * (1 - (GS.upgrades.def || 0)));   // 방어력 강화로 피해 감소
    if (GS.hasShield) { dmg = 0; GS.hasShield = false; showFloating('🛡️ 보호막!', '#60a5fa'); }
    GS.heroHP = Math.max(0, GS.heroHP - dmg);
    GS.combo = 1;
    bossAnim('attack'); heroAnim('hurt');
    showDmgFloat('-' + dmg, '#f97316', 'left');
    cameraShake(12, .65);
    spawnBurst(CW*.22, CH*.42, ['#ef4444','#f97316','#dc2626','#fff'], 16, 1.1);
    _flashEl('ng-flash');
    playSfx('wrong'); playSfx('whoosh'); setTimeout(() => playSfx('impact'), 200);
    if (GS.heroHP <= 0) { setTimeout(gameOver, 350); return; }
  }
  updateHUD();
  // 페이즈 전환/승리/약점 라운드(phase=10 또는 review)면 덮어쓰지 않음 (각자 다음 턴을 예약)
  if (GS.phase !== 10 && !GS.review) {
    GS.phase = 0;
    setTimeout(scheduleBossAttack, 600);
  }
}

// ═══════════════════════════════════════════════════════════
//  약점 공략 라운드 (보스 격파 시 이번 판 틀린 문제 재출제 — 학습 강화)
//  격리 구현: 보스 공격 루프/handleAnswer를 건드리지 않고 자체 핸들러로만 동작.
// ═══════════════════════════════════════════════════════════
let _wr = null;   // { list, idx, correct, onDone }
function buildReviewList() {
  const seen = new Set(), list = [];
  for (const w of wrongLog) {
    if (!w.eng || seen.has(w.eng)) continue;
    seen.add(w.eng);
    const q = (GS.questions || []).find(x => x.eng === w.eng);
    if (q && q.opts) list.push(q);
    if (list.length >= 3) break;   // 최대 3문제 — 흐름 안 끊기게
  }
  return list;
}
function startWeaknessRound(list, onDone) {
  _wr = { list, idx: 0, correct: 0, onDone };
  GS.review = true;
  GS.phase = 10;   // finishQuestion이 '전투중'으로 오인해 보스공격 재예약하지 않도록 차단 phase 사용
  showFloating('📚 약점 공략! 틀린 문제로 마무리 일격', '#fde68a');
  cameraShake(8, .4);
  setTimeout(reviewNext, 1150);
}
function reviewNext() {
  if (!_wr) return;
  if (_wr.idx >= _wr.list.length) { endWeaknessRound(); return; }
  const q = _wr.list[_wr.idx];
  GS.currentQ = q;
  document.getElementById('qpop-atk-label').textContent = '📚 약점 복습 ' + (_wr.idx + 1) + '/' + _wr.list.length;
  document.getElementById('qpop-atk-label').style.color = '#fde68a';
  document.getElementById('qpop-atk-label').style.display = 'block';
  document.getElementById('qpop-timer').textContent = '∞';
  document.getElementById('qpop-timer').className = 'qpop-timer';
  document.getElementById('timer-fill').style.width = '100%';
  document.getElementById('timer-fill').style.background = '#fde68a';
  document.getElementById('qpop-eng').textContent = q.eng;
  document.getElementById('qpop-kor').textContent = q.kor;
  const fb = document.getElementById('qpop-fb'); fb.textContent = ''; fb.className = 'qpop-fb';
  const optsEl = document.getElementById('qpop-opts');
  optsEl.innerHTML = '';
  [...q.opts].forEach(opt => {   // 약점 라운드는 차분히 — SHOCK 섞기·타이머 없음
    const btn = document.createElement('button');
    btn.className = 'qopt'; btn.textContent = opt;
    btn.onclick = () => reviewAnswer(opt, q.ans, btn);
    optsEl.appendChild(btn);
  });
  document.getElementById('qpop').classList.add('show');
  liftArenaForQpop();
}
function reviewAnswer(chosen, correct, btn) {
  const isCorrect = chosen === correct;
  document.querySelectorAll('.qopt').forEach(b => { b.disabled = true; if (b.textContent === correct) b.classList.add('ok'); });
  if (!isCorrect) btn.classList.add('ng');
  const fb = document.getElementById('qpop-fb');
  fb.textContent = isCorrect ? '💥 마무리 일격! +30점' : ('❌ 정답은 「' + correct + '」 — 다음엔 맞히자!');
  fb.className = 'qpop-fb ' + (isCorrect ? 'ok' : 'ng');
  if (isCorrect) {
    _wr.correct++;
    GS.score += 30;
    GS.heroHP = Math.min(100, GS.heroHP + 6);
    heroAnim('crit'); bossAnim('hit');   // 쓰러진 보스를 한 번 더 후려패는 마무리 연출
    showDmgFloat('💥 마무리!', '#fde68a', 'right');
    cameraShake(14, .6);
    spawnBurst(CW*.78, CH*.42, ['#fde68a','#fbbf24','#fff'], 24, 1.7);
    playSfx('correct'); playSfx('slash'); setTimeout(() => playSfx('impact'), 150);
    updateHUD();
  } else {
    playSfx('wrong');
  }
  _wr.idx++;
  setTimeout(() => {
    document.getElementById('qpop').classList.remove('show');
    restoreArena();
    setTimeout(reviewNext, 420);
  }, isCorrect ? 950 : 1700);
}
function endWeaknessRound() {
  const c = _wr ? _wr.correct : 0, t = _wr ? _wr.list.length : 0, onDone = _wr ? _wr.onDone : null;
  GS.review = false; _wr = null;
  document.getElementById('qpop').classList.remove('show');
  updateGround();
  showFloating('📚 약점 공략 ' + c + '/' + t + ' 정답!' + (c ? ' +' + (c * 30) + '점' : ''), '#fde68a');
  setTimeout(() => { if (onDone) onDone(); }, 1300);
}

// ═══════════════════════════════════════════════════════════
//  BOSS PHASE TRANSITIONS
// ═══════════════════════════════════════════════════════════
function checkBossPhase() {
  const hp = GS.bossHP;
  // 초급: 2단계(HP 50 경계) / 중급: 3단계(HP 66·33 경계)
  let target, end;
  if (GS.difficulty === 'beginner') { target = hp <= 0 ? 2 : hp <= 50 ? 1 : 0; end = 2; }
  else { target = hp <= 0 ? 3 : hp <= 33 ? 2 : hp <= 66 ? 1 : 0; end = 3; }
  if (target > GS.bossPhase) {
    if (target >= end) { onBossDefeated(); return; }
    triggerPhaseChange(target);
  }
}

// 보스 격파 직전 — 이번 판 틀린 문제가 있으면 '마무리 일격' 약점 공략 라운드, 없으면 바로 승리
function onBossDefeated() {
  GS.phase = 10;
  cancelTimers();
  const review = buildReviewList();
  if (review.length) {
    bossFighter.play('hurt');   // 보스를 비틀거리게 두고 마무리
    startWeaknessRound(review, gameWin);
  } else {
    gameWin();
  }
}

function triggerPhaseChange(newPhase) {
  GS.bossPhase = newPhase;
  GS.phase = 10;
  GS.combo = 1;
  BGM.setPhase(newPhase);
  cancelTimers();
  const b = BOSS_ASSETS[newPhase];
  const h = HERO_ASSETS[newPhase];
  // 스테이지2+ 컷씬은 실제 등장하는 로스터 몬스터의 초상·이름을 보여준다
  const st = GS.stage, bk = bossKeyFor(st, newPhase);
  document.getElementById('cut-phase').textContent = `PHASE ${newPhase + 1}`;
  document.getElementById('cut-hero-img').src = h.idle;
  document.getElementById('cut-boss-img').src=(st>=2)?HD_SPRITE_DEFS[bk].portrait:b.idle;
  document.getElementById('cut-name').textContent = (st >= 2) ? (BOSS_STAGE_NAME[bk] || '👹 보스') : b.cutName;
  document.getElementById('cut-sub').textContent = (st >= 2) ? '더 강해진 보스가 나타났다!' : b.cutSub;
  // Flash
  const fl = document.getElementById('phase-flash');
  fl.className = ''; void fl.offsetWidth; fl.className = 'go';
  setTimeout(() => {
    document.getElementById('cut').classList.add('show');
    setCharSprites(newPhase);
    document.getElementById('stage-badge').textContent = `STAGE ${GS.stage} · P${newPhase + 1}`;
  }, 200);
  setTimeout(() => {
    document.getElementById('cut').classList.remove('show');
    GS.phase = 0;
    announceBossSignature();   // 새 페이즈 보스의 시그니처 안내
    scheduleBossAttack();
    scheduleDropSpawn();
  }, 2800);
}

// ═══════════════════════════════════════════════════════════
//  STATUS EFFECTS & DROPS
// ═══════════════════════════════════════════════════════════
function applyStatusFx(key) {
  const fx = STATUS_FX[key];
  GS.statusFx[key] = { ...fx, expires: performance.now() + fx.dur };
  updateStatusRow();
  showFloating(fx.icon + ' ' + fx.label + '! ' + fx.desc, fx.color);
}

function updateStatusRow() {
  const row = document.getElementById('status-row');
  const hudH = document.getElementById('hud').offsetHeight;
  const telShowing = document.getElementById('tel').style.display !== 'none';
  row.style.top = (hudH + (telShowing ? 86 : 6)) + 'px';
  row.innerHTML = Object.entries(GS.statusFx).map(([k,fx]) =>
    `<div class="sfx-badge" style="border-color:${fx.color};color:${fx.color}">${fx.icon}${fx.label} · ${fx.desc}</div>`
  ).join('');
}

const MAX_DROPS = 1;

function clearDropsDOM() {
  const layer = document.getElementById('drops-layer');
  if (layer) layer.innerHTML = '';
  if (GS) GS.drops = [];
}

function scheduleDropSpawn() {
  if (dropTimer) clearTimeout(dropTimer);
  dropTimer = setTimeout(spawnDropIfNeeded, 9000 + Math.random() * 6000);
}

function spawnDropIfNeeded() {
  if (!GS || GS.phase === 10) { scheduleDropSpawn(); return; }
  if (GS.drops.length < MAX_DROPS) spawnDrop();
  scheduleDropSpawn();
}

function randDropPos() {
  // 문제 팝업(하단)과 안 겹치는 중상단 영역
  return { x: CW * (.15 + Math.random() * .7), y: CH * (.3 + Math.random() * .18) };
}

function animateDrop(el) {
  if (!el.isConnected) return;
  // 제자리에서 살짝 위아래로만 까딱 (탭 타깃 안정 — 떠돌지 않음)
  gsap.to(el, { y: -16, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1 });
}

function spawnDrop() {
  if (!GS || GS.phase === 10) return;
  const keys = Object.keys(DROP_TYPES);
  const key = keys[Math.floor(Math.random() * keys.length)];
  const id = GS.dropId++;
  const pos = randDropPos();
  GS.drops.push({ id, key, icon: DROP_TYPES[key].icon });
  const el = document.createElement('div');
  el.className = 'drop-item'; el.textContent = DROP_TYPES[key].icon;
  el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
  el.style.opacity = '0'; el.style.transform = 'scale(.4)';
  el.dataset.id = id;
  el.onclick = () => grabDrop(id, el);
  el.ontouchstart = (e) => { e.preventDefault(); grabDrop(id, el); };
  document.getElementById('drops-layer').appendChild(el);
  // Appear animation
  gsap.to(el, { opacity: 1, scale: 1, duration: .4, ease: 'back.out(1.7)',
    onComplete() { animateDrop(el); }
  });
  // Auto-expire after 12s
  setTimeout(() => {
    if (!el.isConnected) return;
    gsap.to(el, { opacity: 0, scale: .3, duration: .3, onComplete() {
      GS && (GS.drops = GS.drops.filter(d => d.id !== id));
      el.remove();
    }});
  }, 16000);   // 문제 푸느라 못 줍는 일 줄이게 12→16s
}

function grabDrop(id, el) {
  const d = GS.drops.find(dr=>dr.id===id); if (!d) return;
  GS.drops = GS.drops.filter(dr=>dr.id!==id);
  gsap.killTweensOf(el);
  gsap.to(el, { scale: 1.6, opacity: 0, y: -30, duration: .3, onComplete: () => el.remove() });
  const dt = DROP_TYPES[d.key];
  if (dt.action==='heal') { GS.heroHP=Math.min(100,GS.heroHP+dt.value); updateHUD(); showFloating('❤️ +'+dt.value+'HP!','#22c55e'); }
  else if (dt.action==='shield') { GS.hasShield=true; showFloating('🛡️ 보호막!','#60a5fa'); }
  else if (dt.action==='power') { GS.hasPower=true; showFloating('⚔️ 강타 준비!','#f97316'); }
  addSkillGauge(10);
  playSfx('correct');
}

// ═══════════════════════════════════════════════════════════
//  WIN / LOSE
// ═══════════════════════════════════════════════════════════
function gameWin() {
  GS.phase = 10;
  cancelTimers();
  BGM.stop();
  bossFighter.play('death'); heroFighter.play('idle');
  // Victory flash
  const fl = document.getElementById('phase-flash');
  fl.className = ''; void fl.offsetWidth; fl.className = 'go';
  // Show victory cutscene
  const h = HERO_ASSETS[GS.bossPhase];
  document.getElementById('vc-hero-img').src = h.idle;
  document.getElementById('vc-sub').textContent = (G._label || '') + ' 보스를 완전히 물리쳤다!';
  setTimeout(() => {
    document.getElementById('victory-cut').classList.add('show');
    playSfx('win');
  }, 250);
  setTimeout(() => {
    document.getElementById('victory-cut').classList.remove('show');
    showResult(true);
  }, 3500);
}
// 패배 시 직전 런 강화의 절반을 보관 → 재도전(G.start)에서 계승. 모바일 로그라이크식 재도전 의욕↑.
let _carryUpgrades = null;
function halfUpgrades(u) {
  const r = {};
  for (const k in u) r[k] = (k === 'startGauge') ? Math.round((u[k] || 0) / 2) : +(((u[k] || 0) / 2).toFixed(3));
  return r;
}
function gameOver() {
  GS.phase = 10; cancelTimers(); heroFighter.play('death');
  const hasUp = GS.upgrades && Object.values(GS.upgrades).some(v => v > 0);
  _carryUpgrades = (GS.stage >= 2 && hasUp) ? halfUpgrades(GS.upgrades) : null;
  setTimeout(() => showResult(false), 700);
}

// ── 갈림길(로그라이크 경로 선택) ──
function showNodeChoice() {
  // 항상 일반·정예를 제공하고, 세 번째는 안식처/보물 교대
  const third = (GS.stage % 3 === 0) ? 'treasure' : 'rest';
  const kinds = ['boss', 'elite', third];
  document.getElementById('node-slots').innerHTML = kinds.map(k => {
    const nd = RUN_NODES[k];
    return `<button class="up-card${nd.elite ? ' elite' : ''}" style="--cc:${nd.color}" onclick="G.pickNode('${k}')">
       <div class="up-icon">${nd.icon}</div>
       <div class="up-title">${nd.title}</div>
       <div class="up-desc">${nd.desc.replace(/\n/g,'<br>')}</div>
     </button>`;
  }).join('');
  document.getElementById('node-depth').textContent = '📜 ' + (GS.stage) + '층 돌파 — 다음은 ' + (GS.stage + 1) + '층';
  document.getElementById('node-pick').classList.add('show');
}

let _cardChoices = [];
function showCardPick() {
  _cardChoices = shuffle([...UPGRADE_CARDS]).slice(0, 3);
  document.getElementById('card-slots').innerHTML = _cardChoices.map((c,i) =>
    `<button class="up-card" style="--cc:${c.color}" onclick="G.pickCard(${i})">
       <div class="up-icon">${c.icon}</div>
       <div class="up-title">${c.title}</div>
       <div class="up-desc">${c.desc}</div>
     </button>`).join('');
  const u = GS.upgrades, owned = [];
  if (u.atk) owned.push('⚔️+'+Math.round(u.atk*100)+'%');
  if (u.def) owned.push('🛡️+'+Math.round(u.def*100)+'%');
  if (u.skill) owned.push('⚡+'+Math.round(u.skill*100)+'%');
  if (u.time) owned.push('⏱️+'+Math.round(u.time*100)+'%');
  if (u.score) owned.push('🍀+'+Math.round(u.score*100)+'%');
  if (u.startGauge) owned.push('🔋'+u.startGauge+'%');
  document.getElementById('card-owned').textContent = owned.length ? '보유 강화 · ' + owned.join('   ') : '';
  document.getElementById('card-pick').classList.add('show');
}

// 허브(game/index.html)와 공유하는 키 — 보스 모드 카드 뱃지가 이 기록을 읽는다.
const BOSS_BEST_KEY = u => 'mg_boss_best_v1_' + u;
function saveBestRecord(win) {
  if (!_unitKey) return false;
  try {
    const k = BOSS_BEST_KEY(_unitKey);
    const r = JSON.parse(localStorage.getItem(k) || '{}');
    const newStage = win ? GS.stage : GS.stage - 1;
    const isNew = GS.score > (r.score || 0);
    r.stage = Math.max(r.stage || 0, newStage);
    r.score = Math.max(r.score || 0, GS.score);
    r.clear = r.clear || win;
    r.date = new Date().toLocaleDateString('ko-KR');
    localStorage.setItem(k, JSON.stringify(r));
    return isNew && GS.score > 0;
  } catch (e) { return false; }
}

function showResult(win) {
  const isNewRecord = saveBestRecord(win);
  // 등급(랭크) 계산 — 정답률·최대콤보 기반
  const acc = GS.correct / Math.max(1, GS.correct + wrongLog.length);
  let grade = 'C', stars = 0;
  if (!win) { grade = 'D'; stars = 0; }
  else if (GS.maxCombo >= 10 && acc >= 0.9) { grade = 'S'; stars = 3; }
  else if (GS.maxCombo >= 7) { grade = 'A'; stars = 2; }
  else if (GS.maxCombo >= 4) { grade = 'B'; stars = 1; }
  else { grade = 'C'; stars = 0; }
  const card = document.querySelector('#result .result-card');
  if (card) { card.classList.remove('win','lose'); card.classList.add(win ? 'win' : 'lose'); }
  document.getElementById('result-grade').innerHTML =
    `<span class="gr">RANK ${grade}</span><span class="stars">${'★'.repeat(stars)}<span style="opacity:.25">${'☆'.repeat(3-stars)}</span></span>`;
  document.getElementById('result-icon').textContent = win ? '🏆' : '💀';
  document.getElementById('result-title').textContent = win ? `STAGE ${GS.stage} 클리어!` : '패배...';
  const recBadge = isNewRecord
    ? `<div style="display:inline-block;margin-bottom:8px;padding:5px 14px;border-radius:999px;font-size:.82rem;font-weight:900;color:#0b0712;background:linear-gradient(135deg,#fde68a,#fbbf24,#f59e0b);box-shadow:0 4px 14px rgba(251,191,36,.5);animation:resultIcon 1.2s ease-in-out infinite;">🎉 신기록 달성!</div><br>` : '';
  document.getElementById('result-sub').innerHTML = recBadge + (win
    ? `여기서 끝낼 거야? 더 센 보스가 기다린다! 💪` : `STAGE ${GS.stage}에서 쓰러졌다... 복수하러 가자!`);
  // 승리=다음 스테이지 / 패배=처음부터 다시
  document.getElementById('result-btns').innerHTML = win
    ? `<button class="btn-retry" onclick="G.nextStage()">🔥 더 센 보스에 도전!</button><button class="btn-home" onclick="G.goHome()">오늘은 여기까지</button>`
    : `<button class="btn-retry" onclick="G.retry()">⚔️ 다시 도전!</button><button class="btn-home" onclick="G.goHome()">단원 선택</button>`;
  document.getElementById('r-score').textContent = GS.score;
  document.getElementById('r-correct').textContent = GS.correct;
  document.getElementById('r-combo').textContent = 'x' + GS.maxCombo;
  const wl = document.getElementById('wrong-log');
  const wll = document.getElementById('wrong-log-list');
  if (wrongLog.length) {
    wl.style.display='block';
    wll.innerHTML = wrongLogHTML();
  } else { wl.style.display='none'; }
  document.getElementById('result').classList.add('show');
  BGM.stop();
  if (!win) setTimeout(() => playSfx('lose'), 200);
}

function updateHUD() {
  if (!GS) return;
  document.getElementById('hero-hp-fill').style.width = GS.heroHP + '%';
  document.getElementById('boss-hp-fill').style.width = GS.bossHP + '%';

  document.getElementById('combo-badge').textContent = 'COMBO ×' + GS.combo;
  document.getElementById('score-badge').textContent = GS.score + '점';
  document.getElementById('stage-badge').textContent = 'STAGE ' + GS.stage + ' · P' + (GS.bossPhase + 1);
}

function showDmgFloat(text, color, side) {

  el.style.cssText = `color:${color};font-size:2.2rem;left:${side==='right'?'60%':'16%'};top:38%;text-shadow:0 3px 12px rgba(0,0,0,.9),0 0 20px ${color};`;

function _flashEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = ''; void el.offsetWidth; el.className = 'go';
}

function showFloating(text, color) {
  const el = document.createElement('div');
  el.className = 'dmg-float';

  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

let _sfxAC = null;
function _ac() { if (!_sfxAC) _sfxAC = new (window.AudioContext||window.webkitAudioContext)(); return _sfxAC; }
function playSfx(type) {
  try {
    const ac = _ac();
    if (type === 'correct') {
      [[660,.08],[880,.12],[1100,.12]].forEach(([f,t],i) => {
        const o=ac.createOscillator(), g=ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type='sine'; o.frequency.value=f;
        const s=ac.currentTime+i*.08;
        g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.25,s+.02);
        g.gain.exponentialRampToValueAtTime(.001,s+t+.06);
        o.start(s); o.stop(s+t+.08);
      });
    } else if (type === 'wrong') {
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sawtooth'; o.frequency.setValueAtTime(280,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(120,ac.currentTime+.3);
      g.gain.setValueAtTime(.3,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);
      o.start(); o.stop(ac.currentTime+.36);
    } else if (type === 'win') {
      [[523,.1],[659,.1],[784,.1],[1047,.3]].forEach(([f,t],i) => {
        const o=ac.createOscillator(), g=ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type='triangle'; o.frequency.value=f;
        const s=ac.currentTime+i*.12;
        g.gain.setValueAtTime(.3,s); g.gain.exponentialRampToValueAtTime(.001,s+t+.1);
        o.start(s); o.stop(s+t+.15);
      });
    } else if (type === 'lose') {
      [[400,.1],[300,.1],[200,.4]].forEach(([f,t],i) => {
        const o=ac.createOscillator(), g=ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type='sawtooth'; o.frequency.value=f;
        const s=ac.currentTime+i*.15;
        g.gain.setValueAtTime(.25,s); g.gain.exponentialRampToValueAtTime(.001,s+t+.1);
        o.start(s); o.stop(s+t+.15);
      });
    } else if (type === 'slash') {
      // 칼 휘두르기 — 노이즈 밴드패스 스윕
      const dur=.16, src=ac.createBufferSource(); src.buffer=_noise(ac,dur);
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.9;
      bp.frequency.setValueAtTime(800,ac.currentTime); bp.frequency.exponentialRampToValueAtTime(3600,ac.currentTime+dur);
      const g=ac.createGain(); g.gain.setValueAtTime(.32,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
      src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(); src.stop(ac.currentTime+dur+.02);
    } else if (type === 'impact') {
      // 타격 — 저음 thud + 노이즈 펀치
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
      o.frequency.setValueAtTime(170,ac.currentTime); o.frequency.exponentialRampToValueAtTime(46,ac.currentTime+.16);
      g.gain.setValueAtTime(.5,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+.22);
      const src=ac.createBufferSource(); src.buffer=_noise(ac,.08);
      const ng=ac.createGain(); ng.gain.setValueAtTime(.28,ac.currentTime); ng.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);
      src.connect(ng); ng.connect(ac.destination); src.start(); src.stop(ac.currentTime+.1);
    } else if (type === 'whoosh') {
      // 돌격/공격 준비 — 노이즈 스윕업
      const dur=.26, src=ac.createBufferSource(); src.buffer=_noise(ac,dur);
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.3;
      bp.frequency.setValueAtTime(280,ac.currentTime); bp.frequency.exponentialRampToValueAtTime(1500,ac.currentTime+dur);
      const g=ac.createGain(); g.gain.setValueAtTime(0,ac.currentTime); g.gain.linearRampToValueAtTime(.26,ac.currentTime+.08); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
      src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(); src.stop(ac.currentTime+dur+.02);
    } else if (type === 'cast') {
      // 필살기 — 상승 톤 + 붐
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sawtooth';
      o.frequency.setValueAtTime(180,ac.currentTime); o.frequency.exponentialRampToValueAtTime(950,ac.currentTime+.34);
      g.gain.setValueAtTime(.28,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+.52);
      setTimeout(()=>playSfx('impact'), 330);
    }
  } catch(e){}
}
function _noise(ac, dur) {
  const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return buf;
}

function shuffle(a) {
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function cancelTimers() {
  if (bossTimer) { clearTimeout(bossTimer); bossTimer=null; }
  if (qTimer) { cancelAnimationFrame(qTimer); qTimer=null; }
  if (dropTimer) { clearTimeout(dropTimer); dropTimer=null; }
  if (telIv) { clearInterval(telIv); telIv=null; }
  document.getElementById('tel').style.display='none';
  document.getElementById('qpop').classList.remove('show');
  updateGround();   // 아레나 리프트 원위치
}

// ═══════════════════════════════════════════════════════════
//  SELECT SCREEN
// ═══════════════════════════════════════════════════════════
// 허브(game/index.html)에서 ?unit=KEY 로 진입 → 해당 단원 보스전 바로 시작.
// param 없거나 잘못된 경우 게임 허브로 돌려보낸다(자체 단원 선택 화면 없음).
const HUB_URL = '../game/index.html';
let _pendingBattle = null, _unitKey = '';
// 허브에서 ?unit=KEY 로 진입 → 시작 게이트를 띄운다(전투 자동 시작 X).
// 사용자가 '전투 시작' 버튼을 누르는 그 제스처 안에서 G.start→BGM.start 가 실행돼 음악이 바로 난다.
function initFromParam() {
  if (typeof GAME_QUESTIONS === 'undefined') { location.replace(HUB_URL); return; }
  const unit = new URLSearchParams(location.search).get('unit');
  if (unit === 'all') {
    _pendingBattle = { qs: Object.values(GAME_QUESTIONS).flatMap(u => u.questions), label: '전체 단원' };
  } else if (unit && GAME_QUESTIONS[unit]) {
    _pendingBattle = { qs: GAME_QUESTIONS[unit].questions, label: GAME_QUESTIONS[unit].label };
  } else {
    location.replace(HUB_URL); return;
  }
  _unitKey = unit;
  document.getElementById('boss-start-unit').textContent = _pendingBattle.label;
  try {
    const r = JSON.parse(localStorage.getItem(BOSS_BEST_KEY(unit)) || '{}');
    if (r.score || r.stage) {
      document.getElementById('bs-record').textContent =
        '🏆 최고 기록 — ' + (r.stage ? 'STAGE ' + r.stage + (r.clear ? ' 클리어' : ' 도달') + ' · ' : '') + (r.score || 0) + '점';
    }
  } catch (e) {}
  document.getElementById('boss-start').style.display = 'flex';
}
// ── 난이도 선택 (초급=느리게·2단계 / 중급=기본·3단계) ──
window.__bossDiff = localStorage.getItem('egm.boss.diff') || 'medium';
function syncDiffUI() {
  document.querySelectorAll('#bs-diff .bs-diff-btn').forEach(b => b.classList.toggle('on', b.dataset.d === window.__bossDiff));
}
document.querySelectorAll('#bs-diff .bs-diff-btn').forEach(b => b.addEventListener('click', () => {
  window.__bossDiff = b.dataset.d; localStorage.setItem('egm.boss.diff', window.__bossDiff); syncDiffUI();
}));
syncDiffUI();
document.getElementById('boss-start-btn').addEventListener('click', () => {
  if (!_pendingBattle) return;
  document.getElementById('boss-start').style.display = 'none';
  G.start(_pendingBattle.qs, _pendingBattle.label);   // 버튼 제스처 안에서 시작 → BGM 즉시 재생
});
initFromParam();
