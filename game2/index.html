<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>문법 보스전 — Fighter Edition</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#000;overflow:hidden;font-family:'Baloo 2','Noto Sans KR',sans-serif;touch-action:none;}

/* ── SELECT SCREEN ── */
#sel{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e1b4b 45%,#0f172a);overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.sel-head{width:100%;max-width:560px;padding:28px 20px 0;text-align:center;}
.sel-title{font-size:1.9rem;font-weight:900;color:#fff;text-shadow:0 0 24px rgba(124,58,237,.8);}
.sel-sub{font-size:.85rem;color:#a78bfa;margin-top:4px;}
.sel-boss-row{display:flex;justify-content:center;gap:24px;margin:22px 0 10px;font-size:3.2rem;}
.sel-units{width:100%;max-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 20px 40px;}
.unit-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;cursor:pointer;transition:all .16s;color:#fff;}
.unit-card:hover,.unit-card:active{background:rgba(124,58,237,.22);border-color:#7c3aed;transform:translateY(-2px);}
.unit-card .uc-lbl{font-size:.68rem;font-weight:900;letter-spacing:.8px;color:#a78bfa;margin-bottom:5px;}
.unit-card h3{font-size:.95rem;font-weight:900;line-height:1.3;}
.unit-card .uc-cnt{font-size:.7rem;color:#94a3b8;margin-top:6px;}
.all-card{grid-column:1/-1;background:linear-gradient(135deg,#4c1d95,#7c3aed,#1d4ed8);border:none;border-radius:18px;padding:18px;text-align:center;cursor:pointer;color:#fff;font-weight:900;font-size:1.05rem;box-shadow:0 12px 28px rgba(124,58,237,.4);transition:all .16s;}
.all-card:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(124,58,237,.5);}
.back-link{text-align:center;margin-top:0;padding-bottom:10px;}
.back-link a{color:#94a3b8;font-size:.82rem;text-decoration:none;}

/* ── GAME SCREEN ── */
#game{position:fixed;inset:0;display:none;}
canvas#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;}

/* ── HUD ── */
#hud{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;pointer-events:none;z-index:10;}
.hud-row{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;}
.hp-block{display:flex;align-items:center;gap:6px;flex:1;}
.hp-name{font-size:.75rem;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.8);}
.hp-bar-wrap{flex:1;height:12px;background:rgba(0,0,0,.6);border-radius:999px;border:1.5px solid rgba(255,255,255,.2);overflow:hidden;}
.hp-fill{height:100%;border-radius:999px;transition:width .25s ease;}
#hero-hp-fill{background:linear-gradient(90deg,#22c55e,#4ade80);}
#boss-hp-fill{background:linear-gradient(90deg,#ef4444,#f97316);}
.hud-info{display:flex;align-items:center;gap:10px;padding:0 12px 6px;justify-content:space-between;}
.combo-badge{background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.4);border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:900;color:#fde68a;}
.stage-badge{background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.4);border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:900;color:#c4b5fd;}
.score-badge{font-size:.8rem;font-weight:900;color:#93c5fd;}

/* ── BOSS TELEGRAPH ── */
#tel{position:absolute;left:10px;right:10px;z-index:20;pointer-events:none;display:none;}
.tel-bar-wrap{background:rgba(0,0,0,.75);border:1.5px solid rgba(252,165,165,.5);border-radius:12px;padding:6px 10px;backdrop-filter:blur(4px);}
.tel-label{font-size:.72rem;font-weight:900;color:#fde68a;margin-bottom:4px;text-align:center;}
.tel-track{height:10px;background:rgba(0,0,0,.5);border-radius:999px;overflow:hidden;}
.tel-fill{height:100%;width:0%;background:linear-gradient(90deg,#fbbf24,#f97316,#ef4444);border-radius:999px;transition:width .1s linear;}

/* ── QUESTION POPUP ── */
#qpop{position:absolute;left:0;right:0;bottom:0;z-index:30;transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);}
#qpop.show{transform:translateY(0);}
.qpop-inner{background:linear-gradient(170deg,#1e1b4b,#0f172a);border-top:2px solid #7c3aed;padding:14px 14px 20px;border-radius:20px 20px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.6);}
.qpop-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.qpop-attack-label{font-size:.7rem;font-weight:900;color:#f97316;letter-spacing:.05em;}
.qpop-timer{font-size:.9rem;font-weight:900;color:#fde68a;font-variant-numeric:tabular-nums;}
.qpop-timer.warn{color:#f97316;}
.qpop-timer.crit{color:#ef4444;animation:blink .5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.qpop-timer-bar{height:5px;background:rgba(255,255,255,.1);border-radius:999px;margin-bottom:10px;overflow:hidden;}
.qpop-timer-fill{height:100%;background:#fbbf24;border-radius:999px;transition:width .1s linear;}
.qpop-eng{font-size:1.05rem;font-weight:900;color:#fff;line-height:1.5;margin-bottom:6px;}
.qpop-kor{font-size:.82rem;color:#a78bfa;margin-bottom:12px;line-height:1.4;}
.qpop-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qopt{padding:11px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:.92rem;font-weight:800;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.qopt:disabled{cursor:default;}
.qopt.ok{background:#14532d!important;border-color:#22c55e!important;color:#86efac!important;}
.qopt.ng{background:#450a0a!important;border-color:#ef4444!important;color:#fca5a5!important;}
.qopt.reveal{background:#14532d!important;border-color:#22c55e!important;color:#86efac!important;}
.qpop-feedback{min-height:28px;font-size:.82rem;font-weight:800;text-align:center;margin-top:8px;}
.qpop-feedback.ok{color:#86efac;}
.qpop-feedback.ng{color:#fca5a5;}

/* ── STATUS EFFECTS ── */
#status-row{position:absolute;left:12px;z-index:15;display:flex;gap:6px;pointer-events:none;}
.sfx-badge{background:rgba(0,0,0,.75);border-radius:8px;padding:4px 8px;font-size:.75rem;font-weight:900;border:1px solid rgba(255,255,255,.2);animation:sfxPulse 2s infinite;}
@keyframes sfxPulse{0%,100%{opacity:1}50%{opacity:.7}}

/* ── DROP ITEMS ── */
.drop-item{position:absolute;font-size:1.5rem;cursor:pointer;z-index:20;animation:float 1.2s ease-in-out infinite alternate;pointer-events:all;text-shadow:0 2px 8px rgba(0,0,0,.6);}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}

/* ── PHASE CUTSCENE ── */
#cut{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);}
#cut.show{display:flex;}
.cut-card{text-align:center;color:#fff;animation:cutIn .6s ease-out;}
@keyframes cutIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.cut-phase{font-size:.85rem;font-weight:900;color:#fbbf24;letter-spacing:.3em;margin-bottom:12px;}
.cut-icon{font-size:5rem;margin-bottom:12px;animation:cutSpin .8s ease-out;}
@keyframes cutSpin{from{transform:rotate(-20deg) scale(.5)}to{transform:rotate(0) scale(1)}}
.cut-name{font-size:2.2rem;font-weight:900;color:#fff;text-shadow:0 0 24px rgba(139,92,246,.8);}
.cut-sub{font-size:.9rem;color:#a78bfa;margin-top:6px;}

/* ── WIN / LOSE ── */
#result{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);}
#result.show{display:flex;}
.result-card{text-align:center;color:#fff;padding:32px 40px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:28px;backdrop-filter:blur(12px);}
.result-icon{font-size:4.5rem;margin-bottom:10px;}
.result-title{font-size:2.2rem;font-weight:900;margin-bottom:6px;}
.result-sub{font-size:.9rem;color:#94a3b8;margin-bottom:20px;}
.result-stats{display:flex;gap:18px;justify-content:center;margin-bottom:24px;}
.result-stat{text-align:center;}
.result-stat b{display:block;font-size:1.6rem;font-weight:900;color:#fde68a;}
.result-stat span{font-size:.72rem;color:#94a3b8;}
.result-btns{display:flex;gap:10px;justify-content:center;}
.result-btns button{border:none;border-radius:14px;font-family:inherit;font-size:.95rem;font-weight:900;padding:12px 24px;cursor:pointer;transition:all .14s;}
.btn-retry{background:#7c3aed;color:#fff;}
.btn-home{background:rgba(255,255,255,.12);color:#fff;}
.btn-retry:hover{background:#6d28d9;}
.btn-home:hover{background:rgba(255,255,255,.2);}

/* ── WRONG ANSWER LOG ── */
.wrong-log-section{margin-top:20px;text-align:left;max-height:180px;overflow-y:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
.wrong-log-title{font-size:.8rem;font-weight:900;color:#f87171;margin-bottom:8px;text-align:center;}
.wrong-log-item{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.78rem;line-height:1.5;}
.wrong-log-item .wl-eng{color:#e2e8f0;font-weight:700;}
.wrong-log-item .wl-ans{color:#86efac;font-size:.72rem;}
.wrong-log-item .wl-wrong{color:#fca5a5;font-size:.72rem;}

@media(min-width:600px){
  .qpop-opts{grid-template-columns:1fr 1fr;}
  .qpop-eng{font-size:1.15rem;}
}
</style>
</head>

  <!-- Question popup -->

      <div class="qpop-meta">
        <div class="qpop-attack-label" id="qpop-atk-label">⚡ 일반 공격</div>

      <div class="cut-name" id="cut-name">문법 마법사</div>
      <div class="cut-sub" id="cut-sub">각성 완료...</div>
    </div>
  </div>

  <!-- Result screen -->
  <div id="result">
    <div class="result-card" id="result-card">
      <div class="result-icon" id="result-icon">🏆</div>
      <div class="result-title" id="result-title">승리!</div>
      <div class="result-sub" id="result-sub">문법 보스를 물리쳤다!</div>
      <div class="result-stats">

//  PIXEL ART SPRITE ENGINE

const PX = 5; // pixels per dot

function buildSprite(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const offscreen = document.createElement('canvas');
  offscreen.width = w * PX; offscreen.height = h * PX;
  const ctx = offscreen.getContext('2d');
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const ch = rows[r][c];
      if (ch === '.' || !pal[ch]) continue;
      ctx.fillStyle = pal[ch];
      ctx.fillRect(c * PX, r * PX, PX, PX);
    }
  }
  return offscreen;
}

//  CANVAS & BACKGROUND DRAWING
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let CW = 0, CH = 0; // canvas size (CSS pixels = internal, no scale)
function resize() {
  CW = canvas.width = window.innerWidth;
  CH = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Background layers by phase
function drawBG(phase) {
  // Sky gradient
  const skies = [
    ['#0a0a1a','#1a0a2e','#2a0a4a'],
    ['#0a0a2a','#1a0a3e','#3a0a5a'],
    ['#050505','#100010','#1a001a'],
  ];
  const [c1,c2,c3] = skies[phase] || skies[0];
  const g = ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,c1); g.addColorStop(.5,c2); g.addColorStop(1,c3);
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  const starPositions = [.05,.12,.18,.25,.31,.38,.45,.52,.58,.65,.72,.79,.85,.91,.97];
  starPositions.forEach((xr,i) => {
    const yr = [.04,.09,.06,.13,.07,.11,.05,.15,.08,.12,.06,.14,.09,.07,.11][i];
    const sz = [1.5,1,2,1,1.5,1,2,1.5,1,2,1,1.5,1,2,1][i];
    ctx.fillRect(xr*CW-sz/2, yr*CH-sz/2, sz, sz);
  });

  // Ground platform
  const groundY = CH * 0.72;
  const gc = ctx.createLinearGradient(0,groundY,0,CH);
  const platformColors = [
    ['#1a0a3a','#0a0020'],
    ['#3a0a5a','#1a003a'],
    ['#050005','#000000'],
  ];
  const [pc1,pc2] = platformColors[phase] || platformColors[0];
  gc.addColorStop(0,pc1); gc.addColorStop(1,pc2);
  ctx.fillStyle = gc; ctx.fillRect(0, groundY, CW, CH - groundY);

  // Platform top edge glow
  const glowColors = ['#7c3aed','#9333ea','#ef4444'];
  ctx.fillStyle = glowColors[phase] || glowColors[0];
  ctx.globalAlpha = 0.4;
  ctx.fillRect(0, groundY, CW, 3);
  ctx.globalAlpha = 1;

  // Floor tiles
  ctx.fillStyle = 'rgba(255,255,255,.04)';
  for (let x = 0; x < CW; x += 60) {
    ctx.fillRect(x, groundY + 3, 1, CH - groundY);
  }
}

function drawSprite(img, x, y, scale = 1, flipX = false) {
  const w = img.width * scale, h = img.height * scale;
  ctx.save();
  if (flipX) {
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, w, h);
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════
const ATTACK_TYPES = [
  { id:'jab',   label:'⚡ 잽!',        time:4.5, damage:12, chance:.50, color:'#f97316' },
  { id:'hook',  label:'💥 훅!',        time:6.5, damage:18, chance:.30, color:'#ef4444' },
  { id:'special',label:'☄️ 필살기!',  time:3.0, damage:28, chance:.20, color:'#7c3aed' },
];
const STATUS_FX = {
  BURN:   { icon:'🔥', label:'화염', desc:'오답 시 2배 피해', color:'#ef4444', dur:20000 },
  FREEZE: { icon:'🧊', label:'빙결', desc:'제한시간 50% 감소', color:'#60a5fa', dur:15000 },
  SHOCK:  { icon:'⚡', label:'감전', desc:'보기 순서 계속 바뀜', color:'#fbbf24', dur:12000 },
};
const DROP_TYPES = {
  HEART:  { icon:'❤️', label:'회복',    action:'heal',    value:20 },
  SHIELD: { icon:'🛡️', label:'보호막',  action:'shield',  value:1  },
  POWER:  { icon:'⚔️', label:'강타',    action:'power',   value:3  },
};

let GS = null; // game state
let rafId = null;
let bossTimer = null;
let qTimer = null;
let dropTimer = null;
let telInterval = null;
let wrongLog = [];

function initGS(questions) {
  wrongLog = [];
  return {
    phase: 0,           // 0=idle, 1=telegraph, 2=question, 3=anim, 4=end
    heroHP: 100, bossHP: 100,
    combo: 1, maxCombo: 1, score: 0, correct: 0,
    bossPhase: 0,       // 0,1,2 (phase 1,2,3)
    heroPhase: 0,
    statusFx: {},       // active status effects
    hasShield: false,
    hasPower: false,
    questions: shuffle([...questions]),
    qIdx: 0,
    currentQ: null,
    attackType: null,
    heroAnim: 'idle',   // idle|atk|hurt
    heroAnimEnd: 0,
    bossAnim: 'idle',   // idle|windup
    drops: [],          // active drop items
    dropId: 0,
  };
}

// ═══════════════════════════════════════════════════════════
//  GAME MAIN OBJECT
// ═══════════════════════════════════════════════════════════
const G = {
  selUnit: null,
  selLabel: '',

  start(questions, label) {
    this.selUnit = questions;
    this.selLabel = label;
    GS = initGS(questions);
    document.getElementById('sel').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    document.getElementById('stage-badge').textContent = 'PHASE 1';
    document.getElementById('boss-name').textContent = BOSS_SPRITES[0].name;
    document.getElementById('hero-name').textContent = HERO_SPRITES[0].name;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
    scheduleBossAttack();
    scheduleDropSpawn();
    updateHUD();
  },

  retry() {
    document.getElementById('result').classList.remove('show');
    if (this.selUnit) this.start(this.selUnit, this.selLabel);
  },

  goHome() {
    document.getElementById('result').classList.remove('show');
    document.getElementById('game').style.display = 'none';
    document.getElementById('sel').style.display = 'flex';
    cancelTimers();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  },
};

// ═══════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════
let lastTs = 0;
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  const dt = ts - lastTs; lastTs = ts;
  update(ts, dt);
  render(ts);
}

function update(ts, dt) {
  if (!GS) return;
  // Hero animation timeout
  if (GS.heroAnim !== 'idle' && ts > GS.heroAnimEnd) {
    GS.heroAnim = 'idle';
  }
  // Status effects expiry
  Object.keys(GS.statusFx).forEach(k => {
    if (ts > GS.statusFx[k].expires) {
      delete GS.statusFx[k];
      updateStatusRow();
    }
  });
}

function render(ts) {
  if (!GS) return;
  ctx.clearRect(0,0,CW,CH);
  drawBG(GS.bossPhase);

  const groundY = CH * 0.72;
  const sprScale = Math.min(CW / 480, CH / 270) * 1.8;

  // ── Boss sprite ──
  const bossImg = GS.bossAnim === 'windup'
    ? BOSS_SPRITES[GS.bossPhase].windup
    : BOSS_SPRITES[GS.bossPhase].idle;
  const bossW = bossImg.width * sprScale;
  const bossH = bossImg.height * sprScale;
  const bossX = CW * 0.62;
  const bossY = groundY - bossH - 4;
  // Idle bob
  const bob = Math.sin(ts / 500) * 4;
  drawSprite(bossImg, bossX, bossY + bob, sprScale, true);

  // ── Hero sprite ──
  let heroImg;
  if (GS.heroAnim === 'atk') heroImg = HERO_SPRITES[GS.heroPhase].atk;
  else if (GS.heroAnim === 'hurt') heroImg = HERO_SPRITES[GS.heroPhase].hurt;
  else heroImg = HERO_SPRITES[GS.heroPhase].idle;
  const heroW = heroImg.width * sprScale;
  const heroH = heroImg.height * sprScale;
  const heroX = CW * 0.18 - heroW / 2;
  const heroY = groundY - heroH;
  const heroBob = Math.sin(ts / 600 + 1) * 2;
  drawSprite(heroImg, heroX, heroY + heroBob, sprScale);

  // ── Drop items ──
  GS.drops.forEach(d => {
    ctx.font = `${Math.round(30 * sprScale * 0.6)}px serif`;
    ctx.textAlign = 'center';
    const fy = d.y + Math.sin(ts / 400 + d.id) * 8;
    ctx.fillText(d.icon, d.x, fy);
  });

  // ── Hit flash ──
  if (GS.heroAnim === 'hurt') {
    ctx.fillStyle = 'rgba(239,68,68,.12)';
    ctx.fillRect(0,0,CW,CH);
  }
}

// ═══════════════════════════════════════════════════════════
//  BOSS AI
// ═══════════════════════════════════════════════════════════
function scheduleBossAttack() {
  if (bossTimer) clearTimeout(bossTimer);
  const delay = 3000 + Math.random() * 3000;
  bossTimer = setTimeout(startAttack, delay);
}

function startAttack() {
  if (!GS || GS.phase !== 0) return;
  GS.phase = 1;

  // Pick attack type based on boss phase
  const roll = Math.random();
  let cum = 0, chosen = ATTACK_TYPES[0];
  const phaseBoost = GS.bossPhase * 0.1; // harder as phase advances
  for (const at of ATTACK_TYPES) {
    cum += at.chance + (at.id === 'special' ? phaseBoost : 0);
    if (roll < cum) { chosen = at; break; }
  }
  GS.attackType = chosen;

  // Occasionally add status effect from boss
  if (Math.random() < 0.25 + GS.bossPhase * 0.1) {
    const sfxKeys = Object.keys(STATUS_FX);
    const sfxKey = sfxKeys[Math.floor(Math.random() * sfxKeys.length)];
    applyStatusFx(sfxKey);
  }

  // Update telegraph
  GS.bossAnim = 'windup';
  const tel = document.getElementById('tel');
  const telLabel = document.getElementById('tel-label');
  const telFill = document.getElementById('tel-fill');
  tel.style.display = 'block';
  tel.style.top = (window.innerHeight * 0.62 - 50) + 'px';
  telLabel.textContent = chosen.label;
  telLabel.style.color = chosen.color;

  const TELEGRAPH_DUR = 1800 + GS.bossPhase * 300;
  let elapsed = 0;
  telInterval = setInterval(() => {
    elapsed += 50;
    telFill.style.width = Math.min(100, (elapsed / TELEGRAPH_DUR * 100)) + '%';
    if (elapsed >= TELEGRAPH_DUR) {
      clearInterval(telInterval); telInterval = null;
      tel.style.display = 'none';
      showQuestion();
    }
  }, 50);
}

// ═══════════════════════════════════════════════════════════
//  QUESTION SYSTEM
// ═══════════════════════════════════════════════════════════
function showQuestion() {
  if (!GS) return;
  GS.phase = 2;

  // Pick question
  if (GS.qIdx >= GS.questions.length) {
    GS.questions = shuffle([...GS.questions]);
    GS.qIdx = 0;
  }
  const q = GS.questions[GS.qIdx++];
  GS.currentQ = q;

  let timeLimit = GS.attackType.time;
  if (GS.statusFx.FREEZE) timeLimit *= 0.5;

  // Build options (possibly shuffle if SHOCK)
  let opts = [...q.opts];
  if (GS.statusFx.SHOCK) opts = shuffle(opts);
  const ans = q.ans;

  // Render question
  document.getElementById('qpop-atk-label').textContent = GS.attackType.label;
  document.getElementById('qpop-atk-label').style.color = GS.attackType.color;
  document.getElementById('qpop-eng').textContent = q.eng;
  document.getElementById('qpop-kor').textContent = q.kor;
  document.getElementById('qpop-fb').textContent = '';
  document.getElementById('qpop-fb').className = 'qpop-feedback';
  const timerEl = document.getElementById('qpop-timer');
  const timerFill = document.getElementById('qpop-timer-fill');

  // Option buttons
  const optsEl = document.getElementById('qpop-opts');
  optsEl.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qopt';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, ans, opts, btn);
    optsEl.appendChild(btn);
  });

  // SHOCK: reshuffle options every second
  let shockTimer = null;
  if (GS.statusFx.SHOCK) {
    shockTimer = setInterval(() => {
      if (GS.phase !== 2) { clearInterval(shockTimer); return; }
      const shuffled = shuffle(opts);
      const btns = optsEl.querySelectorAll('.qopt:not([disabled])');
      btns.forEach((b, i) => { b.textContent = shuffled[i]; });
    }, 1000);
  }

  // Timer
  const start = performance.now();
  let timerDone = false;
  function tickTimer() {
    if (GS.phase !== 2 || timerDone) return;
    const elapsed = (performance.now() - start) / 1000;
    const remaining = Math.max(0, timeLimit - elapsed);
    const pct = (remaining / timeLimit) * 100;
    timerEl.textContent = remaining.toFixed(1);
    timerFill.style.width = pct + '%';
    timerEl.className = 'qpop-timer' + (remaining < 1.5 ? ' crit' : remaining < 3 ? ' warn' : '');
    timerFill.style.background = pct > 50 ? '#fbbf24' : pct > 25 ? '#f97316' : '#ef4444';
    if (remaining > 0) {
      qTimer = requestAnimationFrame(tickTimer);
    } else {
      timerDone = true;
      clearInterval(shockTimer);
      timeExpired(ans, opts);
    }
  }
  qTimer = requestAnimationFrame(tickTimer);

  // Show popup
  document.getElementById('qpop').classList.add('show');
}

function handleAnswer(chosen, correct, opts, clickedBtn) {
  if (GS.phase !== 2) return;
  cancelAnimationFrame(qTimer); qTimer = null;
  GS.phase = 3;

  const isCorrect = chosen === correct;
  const allBtns = document.querySelectorAll('.qopt');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add('reveal');
  });
  if (!isCorrect) clickedBtn.classList.add('ng');

  const fb = document.getElementById('qpop-fb');
  if (isCorrect) {
    fb.textContent = '✅ 정답! 공격!';
    fb.className = 'qpop-feedback ok';
    setTimeout(() => finishQuestion(true, correct), 700);
  } else {
    fb.textContent = '❌ 오답! 피격!';
    fb.className = 'qpop-feedback ng';
    // Log wrong answer
    wrongLog.push({ eng: GS.currentQ.eng, ans: correct, wrong: chosen });
    setTimeout(() => finishQuestion(false, correct), 900);
  }
}

function timeExpired(correct, opts) {
  if (GS.phase !== 2) return;
  GS.phase = 3;
  const allBtns = document.querySelectorAll('.qopt');
  allBtns.forEach(b => { b.disabled = true; if (b.textContent === correct) b.classList.add('reveal'); });
  const fb = document.getElementById('qpop-fb');
  fb.textContent = '⏰ 시간 초과! 피격!';
  fb.className = 'qpop-feedback ng';
  wrongLog.push({ eng: GS.currentQ.eng, ans: correct, wrong: '(시간초과)' });
  setTimeout(() => finishQuestion(false, correct), 900);
}

function finishQuestion(isCorrect, correct) {
  document.getElementById('qpop').classList.remove('show');
  GS.bossAnim = 'idle';

  if (isCorrect) {
    // Hero attacks boss
    GS.heroAnim = 'atk';
    GS.heroAnimEnd = performance.now() + 600;
    let dmg = 15 + GS.bossPhase * 5;
    if (GS.hasPower) { dmg *= 3; GS.hasPower = false; }
    dmg = Math.round(dmg * (GS.combo * 0.1 + 0.9));
    GS.bossHP = Math.max(0, GS.bossHP - dmg);
    GS.combo = Math.min(GS.combo + 1, 10);
    GS.maxCombo = Math.max(GS.maxCombo, GS.combo);
    GS.score += dmg * GS.combo;
    GS.correct++;
    playSfx('correct');
    checkBossPhase();
  } else {
    // Hero takes damage
    GS.heroAnim = 'hurt';
    GS.heroAnimEnd = performance.now() + 500;
    let dmg = GS.attackType.damage;
    if (GS.statusFx.BURN) dmg *= 2;
    if (GS.hasShield) { dmg = 0; GS.hasShield = false; showFloating('🛡️ 보호막!', '#60a5fa'); }
    GS.heroHP = Math.max(0, GS.heroHP - dmg);
    GS.combo = 1;
    playSfx('wrong');
    if (GS.heroHP <= 0) {
      setTimeout(gameOver, 400);
      return;
    }
  }

  updateHUD();
  GS.phase = 0;
  setTimeout(scheduleBossAttack, 500);
}

// ═══════════════════════════════════════════════════════════
//  BOSS PHASE TRANSITIONS
// ═══════════════════════════════════════════════════════════
function checkBossPhase() {
  const hp = GS.bossHP;
  const newPhase = hp <= 0 ? 3 : hp <= 33 ? 2 : hp <= 67 ? 1 : 0;
  if (newPhase > GS.bossPhase) {
    if (newPhase >= 3) { gameWin(); return; }
    triggerPhaseChange(newPhase);
  }
}

function triggerPhaseChange(newPhase) {
  GS.bossPhase = newPhase;
  GS.heroPhase = newPhase;
  GS.phase = 10; // locked during cutscene
  cancelTimers();

  const phaseData = [
    null,
    { phase:'PHASE 2', icon:'🧙', name:'문법 마법사', sub:'분노의 각성... 마법 폭풍이 몰아친다!' },
    { phase:'PHASE 3', icon:'🐲', name:'문법 대마왕', sub:'최종 형태 해방! 모든 힘을 쏟아낸다!' },
  ];
  const d = phaseData[newPhase];
  document.getElementById('cut-phase').textContent = d.phase;
  document.getElementById('cut-icon').textContent = d.icon;
  document.getElementById('cut-name').textContent = d.name;
  document.getElementById('cut-sub').textContent = d.sub;
  document.getElementById('cut').classList.add('show');
  document.getElementById('stage-badge').textContent = d.phase;
  document.getElementById('boss-name').textContent = BOSS_SPRITES[newPhase].name;
  document.getElementById('hero-name').textContent = HERO_SPRITES[newPhase].name;

  setTimeout(() => {
    document.getElementById('cut').classList.remove('show');
    GS.phase = 0;
    scheduleBossAttack();
    scheduleDropSpawn();
  }, 2400);
}

// ═══════════════════════════════════════════════════════════
//  STATUS EFFECTS & DROPS
// ═══════════════════════════════════════════════════════════
function applyStatusFx(key) {
  const fx = STATUS_FX[key];
  GS.statusFx[key] = {
    ...fx,
    expires: performance.now() + fx.dur,
  };
  updateStatusRow();
  showFloating(fx.icon + ' ' + fx.label, fx.color);
}

function updateStatusRow() {
  const row = document.getElementById('status-row');
  const hudH = document.getElementById('hud').offsetHeight;
  row.style.top = (hudH + 6) + 'px';
  row.innerHTML = Object.entries(GS.statusFx).map(([k,fx]) =>
    `<div class="sfx-badge" style="border-color:${fx.color};color:${fx.color}">${fx.icon}${fx.label}</div>`
  ).join('');
}

function scheduleDropSpawn() {
  if (dropTimer) clearTimeout(dropTimer);
  const delay = 8000 + Math.random() * 10000;
  dropTimer = setTimeout(spawnDrop, delay);
}

function spawnDrop() {
  if (!GS || GS.phase === 10) { scheduleDropSpawn(); return; }
  const keys = Object.keys(DROP_TYPES);
  const key = keys[Math.floor(Math.random() * keys.length)];
  const d = DROP_TYPES[key];
  const drop = {
    id: GS.dropId++,
    key, icon: d.icon, label: d.label,
    x: CW * (0.25 + Math.random() * 0.5),
    y: CH * (0.5 + Math.random() * 0.15),
  };
  GS.drops.push(drop);
  scheduleDropSpawn();
  // Remove if not grabbed after 6s
  setTimeout(() => {
    GS.drops = GS.drops.filter(dr => dr.id !== drop.id);
  }, 6000);
}

function grabDrop(dropId) {
  const drop = GS.drops.find(d => d.id === dropId);
  if (!drop) return;
  GS.drops = GS.drops.filter(d => d.id !== dropId);
  const dt = DROP_TYPES[drop.key];
  if (dt.action === 'heal') {
    GS.heroHP = Math.min(100, GS.heroHP + dt.value);
    updateHUD();
    showFloating('❤️ +' + dt.value + ' 회복!', '#22c55e');
  } else if (dt.action === 'shield') {
    GS.hasShield = true;
    showFloating('🛡️ 보호막!', '#60a5fa');
  } else if (dt.action === 'power') {
    GS.hasPower = true;
    showFloating('⚔️ 강타!', '#f97316');
  }
  playSfx('correct');
}

// Click detection on canvas for drops
canvas.addEventListener('click', e => {
  if (!GS) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left), my = (e.clientY - rect.top);
  const sprScale = Math.min(CW / 480, CH / 270) * 1.8;
  const hitR = 25 * sprScale * 0.6;
  const hit = GS.drops.find(d => {
    return Math.abs(d.x - mx) < hitR && Math.abs(d.y - my) < hitR;
  });
  if (hit) grabDrop(hit.id);
});
canvas.addEventListener('touchstart', e => {
  if (!GS) return;
  const rect = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  const mx = t.clientX - rect.left, my = t.clientY - rect.top;
  const sprScale = Math.min(CW / 480, CH / 270) * 1.8;
  const hitR = 35 * sprScale * 0.6;
  const hit = GS.drops.find(d => {
    return Math.abs(d.x - mx) < hitR && Math.abs(d.y - my) < hitR;
  });
  if (hit) { grabDrop(hit.id); e.preventDefault(); }
}, { passive: false });

// ═══════════════════════════════════════════════════════════
//  WIN / LOSE
// ═══════════════════════════════════════════════════════════
function gameWin() {
  GS.phase = 10;
  cancelTimers();
  showResult(true);
}

function gameOver() {
  GS.phase = 10;
  cancelTimers();
  showResult(false);
}

function showResult(win) {
  document.getElementById('result-icon').textContent = win ? '🏆' : '💀';
  document.getElementById('result-title').textContent = win ? '승리!' : '패배...';
  document.getElementById('result-sub').textContent = win
    ? `${GS.selLabel || ''} 보스를 물리쳤다!`
    : '다시 도전해보자!';
  document.getElementById('r-score').textContent = GS.score;
  document.getElementById('r-correct').textContent = GS.correct;
  document.getElementById('r-combo').textContent = 'x' + GS.maxCombo;

  // Wrong answer log
  const wls = document.getElementById('wrong-log-section');
  const wll = document.getElementById('wrong-log-list');
  if (wrongLog.length > 0) {
    wls.style.display = 'block';
    wll.innerHTML = wrongLog.map(w =>
      `<div class="wrong-log-item">
        <div class="wl-eng">${w.eng}</div>
        <div class="wl-ans">✅ 정답: <strong>${w.ans}</strong></div>
        <div class="wl-wrong">❌ 내 답: ${w.wrong}</div>
      </div>`
    ).join('');
  } else {
    wls.style.display = 'none';
  }

  document.getElementById('result').classList.add('show');
}

// ═══════════════════════════════════════════════════════════
//  HUD UPDATES
// ═══════════════════════════════════════════════════════════
function updateHUD() {
  if (!GS) return;
  document.getElementById('hero-hp-fill').style.width = GS.heroHP + '%';
  document.getElementById('boss-hp-fill').style.width = GS.bossHP + '%';
  document.getElementById('hero-hp-num').textContent = Math.round(GS.heroHP);
  document.getElementById('boss-hp-num').textContent = Math.round(GS.bossHP);
  document.getElementById('combo-badge').textContent = 'COMBO ×' + GS.combo;
  document.getElementById('score-badge').textContent = GS.score + '점';
}

// ═══════════════════════════════════════════════════════════
//  FLOATING TEXT FEEDBACK
// ═══════════════════════════════════════════════════════════
function showFloating(text, color) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;left:50%;top:${window.innerHeight*0.4}px;transform:translateX(-50%);
    color:${color};font-size:1.2rem;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.8);
    pointer-events:none;z-index:50;animation:floatUp .9s ease-out forwards;white-space:nowrap;`;
  el.textContent = text;
  document.body.appendChild(el);
  const style = document.createElement('style');
  style.textContent = '@keyframes floatUp{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-60px)}}';
  document.head.appendChild(style);
  setTimeout(() => { el.remove(); style.remove(); }, 900);
}

// ═══════════════════════════════════════════════════════════
//  SOUND
// ═══════════════════════════════════════════════════════════
function playSfx(type) {
  try {
    if (typeof playCorrect === 'function' && type === 'correct') playCorrect();
    else if (typeof playWrong === 'function' && type === 'wrong') playWrong();
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function cancelTimers() {
  if (bossTimer) { clearTimeout(bossTimer); bossTimer = null; }
  if (qTimer) { cancelAnimationFrame(qTimer); qTimer = null; }
  if (dropTimer) { clearTimeout(dropTimer); dropTimer = null; }
  if (telInterval) { clearInterval(telInterval); telInterval = null; }
  document.getElementById('tel').style.display = 'none';
  document.getElementById('qpop').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
//  UNIT SELECT SCREEN BUILDER
// ═══════════════════════════════════════════════════════════
function buildSelectScreen() {
  if (typeof GAME_QUESTIONS === 'undefined') return;
  const container = document.getElementById('unit-list');
  container.innerHTML = '';

  // All units card
  const allCard = document.createElement('div');
  allCard.className = 'all-card';
  allCard.innerHTML = '⚔️ 전체 단원 보스전<br><small style="font-weight:700;opacity:.8">모든 문제로 최강 보스 도전</small>';
  allCard.onclick = () => {
    const allQ = Object.values(GAME_QUESTIONS).flatMap(u => u.questions);
    G.start(allQ, '전체 단원');
  };
  container.appendChild(allCard);

  Object.entries(GAME_QUESTIONS).forEach(([key, unit]) => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `
      <div class="uc-lbl">${key.toUpperCase()}</div>
      <h3>${unit.label}</h3>
      <div class="uc-cnt">문제 ${unit.questions.length}개</div>`;
    card.onclick = () => G.start(unit.questions, unit.label);
    container.appendChild(card);
  });
}

buildSelectScreen();
</script>
