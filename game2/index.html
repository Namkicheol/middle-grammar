<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>문법 보스전 — Fighter Edition</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#000;overflow:hidden;font-family:'Baloo 2','Noto Sans KR',sans-serif;touch-action:none;}

/* ── SELECT SCREEN ── */
#sel{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e1b4b 45%,#0f172a);overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.sel-head{width:100%;max-width:560px;padding:28px 20px 0;text-align:center;}
.sel-title{font-size:1.9rem;font-weight:900;color:#fff;text-shadow:0 0 24px rgba(124,58,237,.8);}
.sel-sub{font-size:.85rem;color:#a78bfa;margin-top:4px;}
.sel-boss-row{display:flex;justify-content:center;gap:14px;margin:18px 0 10px;align-items:flex-end;}
.sel-boss-row img{height:80px;width:auto;filter:drop-shadow(0 4px 16px rgba(124,58,237,.6));transition:.2s;}
.sel-boss-row img:hover{transform:scale(1.08);}
.sel-units{width:100%;max-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 20px 40px;}
.unit-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;cursor:pointer;transition:all .16s;color:#fff;}
.unit-card:hover,.unit-card:active{background:rgba(124,58,237,.22);border-color:#7c3aed;transform:translateY(-2px);}
.unit-card .uc-lbl{font-size:.68rem;font-weight:900;letter-spacing:.8px;color:#a78bfa;margin-bottom:5px;}
.unit-card h3{font-size:.95rem;font-weight:900;line-height:1.3;}
.unit-card .uc-cnt{font-size:.7rem;color:#94a3b8;margin-top:6px;}
.all-card{grid-column:1/-1;background:linear-gradient(135deg,#4c1d95,#7c3aed,#1d4ed8);border:none;border-radius:18px;padding:18px;text-align:center;cursor:pointer;color:#fff;font-weight:900;font-size:1.05rem;box-shadow:0 12px 28px rgba(124,58,237,.4);transition:all .16s;}
.all-card:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(124,58,237,.5);}
.back-link{text-align:center;padding-bottom:14px;}
.back-link a{color:#94a3b8;font-size:.82rem;text-decoration:none;}

/* ── GAME SCREEN ── */
#game{position:fixed;inset:0;display:none;}
canvas#c{position:absolute;inset:0;width:100%;height:100%;}

/* ── ARENA (character stage) ── */
#arena{position:absolute;left:0;right:0;bottom:0;height:72%;pointer-events:none;}

/* ── CHARACTERS ── */
#hero-wrap{position:absolute;left:8%;bottom:26%;transform-origin:bottom center;transition:left .35s cubic-bezier(.22,1,.36,1), transform .15s;}
#boss-wrap{position:absolute;right:8%;bottom:26%;transform-origin:bottom center;transition:right .35s cubic-bezier(.22,1,.36,1), transform .15s;}
#hero-img,#boss-img{background-repeat:no-repeat;background-position:0 0;image-rendering:pixelated;transform-origin:bottom center;will-change:background-position;}
#hero-img{filter:drop-shadow(0 8px 22px rgba(14,165,233,.45));}
#boss-img{filter:drop-shadow(0 10px 26px rgba(239,68,68,.5));transform:scaleX(-1);}
@keyframes dmgFlash{0%{filter:brightness(1)}28%{filter:brightness(2.6) drop-shadow(0 0 30px #fff)}100%{filter:brightness(1)}}
#hero-img.flash,#boss-img.flash{animation:dmgFlash .38s ease-out;}

/* Idle float animation */
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#hero-img.idle{animation:heroFloat 2.2s ease-in-out infinite;}
#boss-img.idle{animation:bossFloat 2.6s ease-in-out infinite;}

/* Attack */
@keyframes heroAttack{0%{transform:translateX(0) scale(1)}22%{transform:translateX(8px) scale(.94)}45%{transform:translateX(36px) scale(1.16)}72%{transform:translateX(22px) scale(1.1)}100%{transform:translateX(0) scale(1)}}
#hero-img.attack{animation:heroAttack .85s ease-out forwards;}

/* Hurt */
@keyframes heroHurt{0%{transform:translateX(0);filter:drop-shadow(0 8px 24px rgba(14,165,233,.5))}20%{transform:translateX(-20px);filter:drop-shadow(0 8px 24px rgba(239,68,68,.9)) brightness(1.8)}50%{transform:translateX(-8px);filter:brightness(1.5)}75%{transform:translateX(-16px);filter:drop-shadow(0 8px 24px rgba(239,68,68,.7)) brightness(1.4)}100%{transform:translateX(0);filter:drop-shadow(0 8px 24px rgba(14,165,233,.5))}}
#hero-img.hurt{animation:heroHurt .7s ease-out forwards;}

/* Boss hurt */
@keyframes bossHurt{0%{transform:translateX(0) scale(1);filter:drop-shadow(0 8px 28px rgba(239,68,68,.6)) brightness(1)}18%{transform:translateX(36px) scale(.92);filter:drop-shadow(0 0 48px #fff) brightness(2.5)}42%{transform:translateX(20px) scale(1.04);filter:drop-shadow(0 8px 28px rgba(239,68,68,.95)) brightness(1.7)}65%{transform:translateX(14px) scale(.98)}100%{transform:translateX(0) scale(1);filter:drop-shadow(0 8px 28px rgba(239,68,68,.6)) brightness(1)}}
#boss-img.hit{animation:bossHurt .75s ease-out forwards;}

/* Boss windup shake */
@keyframes bossCharge{0%,100%{transform:translateX(0) scale(1);filter:brightness(1)}35%{transform:translateX(-9px) scale(1.08);filter:brightness(1.3) drop-shadow(0 0 20px rgba(239,68,68,.8))}70%{transform:translateX(-5px) scale(1.04);filter:brightness(1.15)}}
#boss-img.windup{animation:bossCharge .65s ease-in-out infinite;}

/* Correct / wrong screen edge flash */
@keyframes edgeFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#ok-flash,#ng-flash{position:fixed;inset:0;pointer-events:none;z-index:65;opacity:0;}
#ok-flash{background:radial-gradient(ellipse at center,transparent 35%,rgba(34,197,94,.4) 100%);}
#ng-flash{background:radial-gradient(ellipse at center,transparent 35%,rgba(239,68,68,.45) 100%);}
#ok-flash.go,#ng-flash.go{animation:edgeFlash .65s ease-out forwards;}

/* Phase transform flash */
@keyframes phaseFlash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
#phase-flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:70;opacity:0;}
#phase-flash.go{animation:phaseFlash .8s ease-out forwards;}

/* ── HUD ── */
#hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;padding:8px 12px 4px;background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,transparent 100%);}
.hud-bars{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.hp-side{flex:1;display:flex;align-items:center;gap:6px;}
.hp-side.right{flex-direction:row-reverse;}
.hp-name{font-size:.75rem;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.9);}
.hp-bar-wrap{flex:1;height:13px;background:rgba(0,0,0,.6);border-radius:999px;border:1.5px solid rgba(255,255,255,.18);overflow:hidden;position:relative;}
.hp-fill{height:100%;border-radius:999px;transition:width .3s ease;}
#hero-hp-fill{background:linear-gradient(90deg,#22c55e,#4ade80);box-shadow:0 0 8px rgba(34,197,94,.6);}
#boss-hp-fill{background:linear-gradient(90deg,#ef4444,#f97316);box-shadow:0 0 8px rgba(239,68,68,.6);}
.vs-badge{font-size:.72rem;font-weight:900;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 8px;white-space:nowrap;}
.hud-info{display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:all;}
.combo-badge{background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.35);border-radius:20px;padding:3px 12px;font-size:.8rem;font-weight:900;color:#fde68a;}
.stage-badge{background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.35);border-radius:20px;padding:3px 12px;font-size:.8rem;font-weight:900;color:#c4b5fd;}
.score-badge{font-size:.8rem;font-weight:900;color:#93c5fd;}
/* Skill gauge */
.skill-row{display:flex;align-items:center;gap:7px;margin-top:5px;pointer-events:all;}
.skill-track{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;}
.skill-fill-bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#facc15);transition:width .3s ease;}
.skill-btn2{border:none;font-family:inherit;font-size:.72rem;font-weight:900;border-radius:999px;padding:5px 12px;cursor:pointer;background:rgba(255,255,255,.12);color:#64748b;pointer-events:all;white-space:nowrap;}
.skill-btn2.ready{background:linear-gradient(135deg,#facc15,#fb7185,#8b5cf6);color:#fff;animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 6px rgba(250,204,21,.5))}50%{filter:drop-shadow(0 0 16px rgba(250,204,21,.9))}}
.skill-btn2:disabled{pointer-events:none;}
/* Ultimate flash */
#ult-flash{position:fixed;inset:0;pointer-events:none;z-index:75;background:linear-gradient(135deg,#facc15,#fb7185,#8b5cf6);opacity:0;}
#hud-back{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.22);color:#94a3b8;font-family:inherit;font-size:.7rem;font-weight:900;border-radius:999px;padding:4px 10px;cursor:pointer;pointer-events:all;}
#hud-back:active{color:#fff;border-color:rgba(255,255,255,.5);}
.hp-num{font-size:.7rem;font-weight:900;color:rgba(255,255,255,.8);min-width:26px;}

/* ── BOSS TELEGRAPH ── */
#tel{position:absolute;left:12px;right:12px;top:122px;z-index:20;display:none;}
.tel-inner{background:rgba(0,0,0,.7);border-radius:8px;padding:4px 10px;backdrop-filter:blur(4px);}
.tel-label{display:none;}
.tel-track{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;}
.tel-fill{height:100%;width:0%;border-radius:999px;box-shadow:0 0 10px currentColor;}

/* ── STATUS EFFECTS ── */
#status-row{position:absolute;left:12px;top:122px;z-index:15;display:flex;gap:6px;pointer-events:none;}
.sfx-badge{background:rgba(0,0,0,.75);border-radius:8px;padding:4px 8px;font-size:.75rem;font-weight:900;border:1px solid rgba(255,255,255,.2);animation:sfxPulse 2s infinite;}
@keyframes sfxPulse{0%,100%{opacity:1}50%{opacity:.65}}

/* ── DROP ITEMS ── */
.drop-item{position:absolute;font-size:2.2rem;cursor:pointer;z-index:22;pointer-events:all;filter:drop-shadow(0 4px 14px rgba(255,255,255,.35));user-select:none;}

/* ── QUESTION POPUP ── */
#qpop{position:absolute;left:50%;bottom:12px;width:min(480px,96%);transform:translateX(-50%) translateY(20px) scale(.92);opacity:0;pointer-events:none;z-index:30;transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .22s;}
#qpop.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:all;}
.qpop-inner{background:linear-gradient(170deg,#1a0533,#0f0824);border:2px solid #7c3aed;padding:14px 14px 20px;border-radius:22px;box-shadow:0 8px 40px rgba(0,0,0,.85),0 0 0 1px rgba(124,58,237,.3);}
.qpop-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.qpop-atk-label{display:none;}
.qpop-timer{font-size:.95rem;font-weight:900;color:#fde68a;font-variant-numeric:tabular-nums;}
.qpop-timer.warn{color:#f97316;}
.qpop-timer.crit{color:#ef4444;animation:blink .45s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.timer-bar{height:5px;background:rgba(255,255,255,.1);border-radius:999px;margin-bottom:10px;overflow:hidden;}
.timer-fill{height:100%;background:#fbbf24;border-radius:999px;transition:width .1s linear;}
.qpop-eng{font-size:1.08rem;font-weight:900;color:#fff;line-height:1.55;margin-bottom:5px;}
.qpop-kor{font-size:.82rem;color:#c4b5fd;margin-bottom:12px;line-height:1.4;}
.qpop-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.qopt{padding:12px 8px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.qopt:active{transform:scale(.97);}
.qopt:disabled{cursor:default;}
.qopt.ok{background:#14532d!important;border-color:#22c55e!important;color:#86efac!important;}
.qopt.reveal{background:#14532d!important;border-color:#22c55e!important;color:#86efac!important;}
.qopt.ng{background:#450a0a!important;border-color:#ef4444!important;color:#fca5a5!important;}
.qopt.ng.reveal{background:#450a0a!important;border-color:#ef4444!important;color:#fca5a5!important;}
.qpop-fb{min-height:26px;font-size:.84rem;font-weight:800;text-align:center;margin-top:8px;}
.qpop-fb.ok{color:#86efac;}
.qpop-fb.ng{color:#fca5a5;}

/* ── DAMAGE FLOAT ── */
@keyframes dmgFloat{0%{opacity:0;transform:translateY(0) scale(.6)}12%{opacity:1;transform:translateY(-10px) scale(1.25)}70%{opacity:1;transform:translateY(-50px) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(.85)}}
.dmg-float{position:fixed;pointer-events:none;font-weight:900;z-index:60;animation:dmgFloat 1.1s ease-out forwards;}

/* ── PHASE CUTSCENE ── */
#cut{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);}
#cut.show{display:flex;}
.cut-card{text-align:center;color:#fff;}
@keyframes cutIn{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.cut-card{animation:cutIn .55s cubic-bezier(.34,1.56,.64,1);}
.cut-phase{font-size:.82rem;font-weight:900;color:#fbbf24;letter-spacing:.35em;margin-bottom:14px;}
.cut-chars{display:flex;justify-content:center;align-items:flex-end;gap:32px;margin-bottom:16px;}
.cut-chars img{height:160px;width:auto;filter:drop-shadow(0 0 28px rgba(124,58,237,.9));}
@keyframes cutCharIn{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.cut-chars img{animation:cutCharIn .7s cubic-bezier(.34,1.56,.64,1);}
.cut-name{font-size:2rem;font-weight:900;color:#fff;text-shadow:0 0 28px rgba(139,92,246,.8);}
.cut-sub{font-size:.9rem;color:#a78bfa;margin-top:6px;}

/* ── RESULT ── */
#result{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);}
#result.show{display:flex;}
.result-card{text-align:center;color:#fff;padding:28px 36px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:28px;backdrop-filter:blur(12px);max-width:480px;width:92%;max-height:85vh;overflow-y:auto;}
.result-icon{font-size:4rem;margin-bottom:8px;}
.result-title{font-size:2rem;font-weight:900;margin-bottom:4px;}
.result-sub{font-size:.88rem;color:#94a3b8;margin-bottom:18px;}
.result-stats{display:flex;gap:20px;justify-content:center;margin-bottom:20px;}
.result-stat b{display:block;font-size:1.6rem;font-weight:900;color:#fde68a;}
.result-stat span{font-size:.7rem;color:#94a3b8;}
.result-btns{display:flex;gap:10px;justify-content:center;}
.result-btns button{border:none;border-radius:14px;font-family:inherit;font-size:.95rem;font-weight:900;padding:12px 24px;cursor:pointer;transition:all .14s;}
.btn-retry{background:#7c3aed;color:#fff;}
.btn-home{background:rgba(255,255,255,.12);color:#fff;}
.wrong-log{margin-top:18px;text-align:left;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
.wrong-log-title{font-size:.8rem;font-weight:900;color:#f87171;margin-bottom:8px;text-align:center;}
.wrong-log-item{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.78rem;line-height:1.55;}
.wl-eng{color:#e2e8f0;font-weight:700;}
.wl-ans{color:#86efac;font-size:.72rem;margin-top:2px;}
.wl-wrong{color:#fca5a5;font-size:.72rem;}

/* ── VICTORY CUTSCENE ── */
#victory-cut{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.93);}
#victory-cut.show{display:flex;}
@keyframes victoryIn{from{transform:scale(.4) translateY(40px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes victoryPulse{0%,100%{text-shadow:0 0 20px rgba(250,204,21,.8),0 0 40px rgba(250,204,21,.4)}50%{text-shadow:0 0 60px rgba(250,204,21,1),0 0 120px rgba(250,204,21,.6)}}
@keyframes victoryHeroIn{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.vc-card{text-align:center;color:#fff;animation:victoryIn .7s cubic-bezier(.34,1.56,.64,1);}
.vc-title{font-size:3.8rem;font-weight:900;color:#fde68a;letter-spacing:.08em;margin-bottom:14px;animation:victoryPulse 1.2s ease-in-out infinite;}
.vc-hero{height:clamp(160px,28vw,220px);width:auto;filter:drop-shadow(0 0 48px rgba(250,204,21,.9));animation:victoryHeroIn .8s cubic-bezier(.34,1.56,.64,1);}
.vc-name{font-size:1.5rem;font-weight:900;color:#fff;margin-top:14px;text-shadow:0 0 24px rgba(139,92,246,.9);}
.vc-sub{font-size:.9rem;color:#a78bfa;margin-top:6px;}
</style>
</head>
<body>

<!-- SELECT SCREEN -->
<div id="sel">
  <div class="sel-head">
    <div class="sel-title">⚔️ 문법 보스전</div>
    <div class="sel-sub">Fighter Edition — 단원을 골라 보스에 도전하세요</div>
    <div class="sel-boss-row">
      <img src="../game/assets/chars/hero-lv1.png" alt="hero">
      <img src="../game/assets/chars/boss-lv1.png" alt="boss1" style="height:88px">
      <img src="../game/assets/chars/boss-lv2.png" alt="boss2" style="height:88px">
      <img src="../game/assets/chars/boss-lv3.png" alt="boss3" style="height:96px">
    </div>
  </div>
  <div class="sel-units" id="unit-list"></div>
  <div class="back-link"><a href="../index.html">← 메인 허브</a></div>
</div>

<!-- GAME SCREEN -->
<div id="game">
  <canvas id="c"></canvas>

  <!-- Characters -->
  <div id="arena">
    <div id="hero-wrap"><div id="hero-img"></div></div>
    <div id="boss-wrap"><div id="boss-img"></div></div>
  </div>

  <!-- Drop items container -->
  <div id="drops-layer" style="position:absolute;inset:0;pointer-events:none;z-index:22;"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-bars">
      <div class="hp-side">
        <div class="hp-name" id="hero-name">🧑 학생</div>
        <div class="hp-bar-wrap"><div class="hp-fill" id="hero-hp-fill" style="width:100%"></div></div>
        <div class="hp-num" id="hero-hp-num">100</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="hp-side right">
        <div class="hp-name" id="boss-name">👹 고블린</div>
        <div class="hp-bar-wrap"><div class="hp-fill" id="boss-hp-fill" style="width:100%"></div></div>
        <div class="hp-num" id="boss-hp-num">100</div>
      </div>
    </div>
    <div class="hud-info">
      <button id="hud-back" onclick="G.goHome()">← 목록</button>
      <div class="combo-badge" id="combo-badge">COMBO ×1</div>
      <div class="stage-badge" id="stage-badge">PHASE 1</div>
      <div class="score-badge" id="score-badge">0점</div>
    </div>
    <div class="skill-row">
      <span style="font-size:.68rem;font-weight:900;color:#a78bfa;white-space:nowrap;">⚡ 필살기</span>
      <div class="skill-track"><div class="skill-fill-bar" id="skill-fill-bar"></div></div>
      <button class="skill-btn2" id="skill-btn2" onclick="castSkill()" disabled>준비중</button>
    </div>
  </div>

  <!-- Status effects -->
  <div id="status-row"></div>

  <!-- Telegraph -->
  <div id="tel">
    <div class="tel-inner">
      <div class="tel-label" id="tel-label">⚡ 공격 준비 중...</div>
      <div class="tel-track"><div class="tel-fill" id="tel-fill"></div></div>
    </div>
  </div>

  <!-- Question popup -->
  <div id="qpop">
    <div class="qpop-inner">
      <div class="qpop-top">
        <div class="qpop-atk-label" id="qpop-atk-label">⚡ 일반 공격</div>
        <div class="qpop-timer" id="qpop-timer">5.0</div>
      </div>
      <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
      <div class="qpop-eng" id="qpop-eng"></div>
      <div class="qpop-kor" id="qpop-kor"></div>
      <div class="qpop-opts" id="qpop-opts"></div>
      <div class="qpop-fb" id="qpop-fb"></div>
    </div>
  </div>

  <!-- Phase flash overlay -->

<script>
// ═══════════════════════════════════════════════════════════
//  BGM — Tone.js 페이즈별 전투 음악
// ═══════════════════════════════════════════════════════════
const BGM = (() => {
  let _ready=false, _playing=false, _phase=0;
  let _lead, _pad, _bass, _kick, _snare, _hat, _master;
  let _melSeq, _bassSeq, _kickSeq, _hatSeq;

  // Phase 0 (120 BPM) — 학생 : 차분한 전투
  // Phase 1 (148 BPM) — 마법사 : 긴박감
  // Phase 2 (168 BPM) — 마왕 : 극한 전투
  const PHASES = [
    {
      bpm: 120,
      mel:  ['E4','G4','A4',null,'G4','E4','D4',null,
             'E4','C4','D4',null,'C4',null,null,null],
      bass: ['A2',null,'E3',null,'A2',null,'G2',null,
             'A2',null,'E3',null,'D2',null,'E2',null],
      pad:  [['A3','C4','E4'],null,null,null,null,null,null,null,
             ['G3','B3','D4'],null,null,null,null,null,null,null],
    },
    {
      bpm: 148,
      mel:  ['A4','C5','E5',null,'C5','A4','G4',null,
             'A4','E4','G4',null,'A4',null,'G4',null],
      bass: ['A2',null,'A2','E3','A2',null,'G2',null,
             'A2',null,'A2','E3','F2',null,'E2',null],
      pad:  [['A3','E4'],null,null,null,['G3','D4'],null,null,null,
             ['A3','E4'],null,null,null,['F3','C4'],null,null,null],
    },
    {
      bpm: 168,
      mel:  ['E5','G5','A5',null,'G5','E5','D5','E5',
             'C5',null,'D5','E5','G5',null,'E5',null],
      bass: ['A1',null,'E2','A1','G1',null,'E1',null,
             'A1',null,'A1','E2','D2',null,'A1',null],
      pad:  [['A3','E4','A4'],null,null,null,['G3','D4','G4'],null,null,null,
             ['A3','E4','A4'],null,null,null,['F3','C4','F4'],null,null,null],
    },
  ];

  function build() {
    if (_ready) return;
    _ready = true;

    _master = new Tone.Gain(0.78).toDestination();
    const comp = new Tone.Compressor({ threshold:-18, ratio:4 }).connect(_master);
    const rev  = new Tone.Reverb({ decay:1.5, wet:0.18 }).connect(comp);

    // Lead synth (saw + filter)
    _lead = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type:'sawtooth' },
      envelope:   { attack:.02, decay:.12, sustain:.6, release:.28 },
    });
    const leadFilter = new Tone.Filter(2400,'lowpass').connect(rev);
    _lead.connect(leadFilter);
    _lead.volume.value = -9;

    // Pad (warm chords)
    _pad = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type:'triangle' },
      envelope:   { attack:.35, decay:.4, sustain:.5, release:.8 },
    }).connect(rev);
    _pad.volume.value = -18;

    // Bass
    _bass = new Tone.Synth({
      oscillator: { type:'square' },
      envelope:   { attack:.01, decay:.18, sustain:.55, release:.2 },
    });
    const bassFilter = new Tone.Filter(600,'lowpass').connect(comp);
    _bass.connect(bassFilter);
    _bass.volume.value = -7;

    // Kick
    _kick = new Tone.MembraneSynth({ pitchDecay:.06, octaves:6,
      envelope:{ attack:.001, decay:.32, sustain:0, release:.15 }
    }).connect(comp);
    _kick.volume.value = -3;

    // Snare (noise + tone)
    _snare = new Tone.NoiseSynth({ noise:{type:'white'},
      envelope:{ attack:.001, decay:.14, sustain:0, release:.05 }
    }).connect(comp);
    _snare.volume.value = -10;

    // Hi-hat
    _hat = new Tone.MetalSynth({ frequency:400, envelope:{attack:.001,decay:.04,release:.01},
      resonance:8000, modulationIndex:32, octaves:1.5 }).connect(comp);
    _hat.volume.value = -18;

    const p = PHASES[_phase];
    Tone.getTransport().bpm.value = p.bpm;
    Tone.getTransport().loop = true;
    Tone.getTransport().loopEnd = '2m';

    _melSeq  = new Tone.Sequence((t,n)=>{ if(n) _lead.triggerAttackRelease(n,'8n',t); }, p.mel,  '16n').start(0);
    _bassSeq = new Tone.Sequence((t,n)=>{ if(n) _bass.triggerAttackRelease(n,'8n',t); }, p.bass, '16n').start(0);
    new Tone.Sequence((t,n)=>{ if(n) _pad.triggerAttackRelease(n,'4n',t); }, p.pad, '16n').start(0);

    // Kick: beat 1 and 3 (every 8 16th notes)
    _kickSeq = new Tone.Sequence((t,i)=>{
      if(i===0||i===8) _kick.triggerAttackRelease('C1','16n',t);
    }, [...Array(16).keys()], '16n').start(0);

    // Snare: beat 2 and 4
    new Tone.Sequence((t,i)=>{
      if(i===4||i===12) _snare.triggerAttackRelease('8n',t);
    }, [...Array(16).keys()], '16n').start(0);

    // Hi-hat: 8th notes, offbeat quieter
    _hatSeq = new Tone.Sequence((t,i)=>{
      _hat.volume.value = i%2===0 ? -18 : -22;
      _hat.triggerAttackRelease('16n',t);
    }, [...Array(16).keys()], '16n').start(0);
  }

  return {
    async start(phase=0) {
      if (_playing) return;
      _phase = phase;
      _playing = true;
      try {
        await Tone.start();
        build();
        const p = PHASES[phase];
        Tone.getTransport().bpm.value = p.bpm;
        if (_melSeq)  _melSeq.events  = p.mel;
        if (_bassSeq) _bassSeq.events = p.bass;
        if (Tone.getTransport().state !== 'started') Tone.getTransport().start('+0.05');
      } catch(e) { console.warn('BGM error:', e); }
    },
    stop() {
      _playing = false;
      try {
        if (_master) _master.gain.rampTo(0, 0.12);
        setTimeout(() => {
          try { Tone.getTransport().stop(); if (_master) _master.gain.rampTo(0.78, 0); } catch(e){}
        }, 180);
      } catch(e){}
    },
    setPhase(p) {
      if (_phase === p || !_ready) return;
      _phase = p;
      const track = PHASES[p];
      try {
        Tone.getTransport().bpm.rampTo(track.bpm, 1.2);
        if (_melSeq)  _melSeq.events  = track.mel;
        if (_bassSeq) _bassSeq.events = track.bass;
        if (_lead) _lead.volume.rampTo(-9 + p*1.5, 0.5);
        if (_kick) _kick.volume.rampTo(-3 + p*1.5, 0.5);
      } catch(e){}
    },
    get isPlaying() { return _playing; }
  };
})();

function cameraShake(intensity=6, dur=0.4) {
  const el = document.getElementById('game');
  gsap.killTweensOf(el);
  gsap.fromTo(el,
    { x:0, y:0 },
    { x: intensity, y: intensity*.6, duration: dur*.1,
      yoyo:true, repeat: Math.floor(dur/.1), ease:'none',
      onComplete(){ gsap.set(el,{x:0,y:0}); }
    }
  );
}

//  CANVAS BACKGROUND
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CW = 0, CH = 0;
function resize() { CW = canvas.width = window.innerWidth; CH = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const STARS = Array.from({length:80}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.8 + .4,
  blink: Math.random() * Math.PI * 2
}));

const BG_THEMES = [
  { sky: ['#0a0515','#150a30','#200a40'], ground: ['#1a0a3a','#0a0020'], glow: '#7c3aed', line: '#5b21b6' },
  { sky: ['#0a0515','#1e0a35','#2e0a50'], ground: ['#2a0a4a','#150030'], glow: '#9333ea', line: '#7c3aed' },
  { sky: ['#050005','#100010','#180018'], ground: ['#0f0010','#050005'], glow: '#dc2626', line: '#7f1d1d' },
];

function drawBG(phase, ts) {
  const t = BG_THEMES[phase] || BG_THEMES[0];
  const g = ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,t.sky[0]); g.addColorStop(.5,t.sky[1]); g.addColorStop(1,t.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

  // Stars
  STARS.forEach(s => {
    const alpha = .4 + Math.sin(ts/1200 + s.blink) * .35;
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(s.x*CW, s.y*CH*.7, s.r, 0, Math.PI*2); ctx.fill();
  });

  // Ground
  const gY = CH * .72;
  const gg = ctx.createLinearGradient(0,gY,0,CH);
  gg.addColorStop(0,t.ground[0]); gg.addColorStop(1,t.ground[1]);
  ctx.fillStyle = gg; ctx.fillRect(0,gY,CW,CH-gY);

  // Glow line
  ctx.fillStyle = t.glow; ctx.globalAlpha = .5;
  ctx.fillRect(0, gY, CW, 3);
  ctx.globalAlpha = 1;

  // Tile grid
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
  for (let x=0; x<CW; x+=60) { ctx.beginPath(); ctx.moveTo(x,gY); ctx.lineTo(x,CH); ctx.stroke(); }

  // Phase-specific effects
  if (phase >= 1) {
    // Floating orbs background
    for (let i=0;i<3;i++) {
      const ox = CW*(0.2+i*.3) + Math.sin(ts/2000+i)*30;
      const oy = CH*(0.3+i*.1) + Math.cos(ts/1500+i)*20;
      const gr = ctx.createRadialGradient(ox,oy,0,ox,oy,60);
      gr.addColorStop(0,`rgba(124,58,237,${phase===2?.08:.05})`);
      gr.addColorStop(1,'transparent');
      ctx.fillStyle = gr; ctx.fillRect(ox-60,oy-60,120,120);
    }
  }
  if (phase >= 2) {
    // Red crack lines
    ctx.strokeStyle = 'rgba(239,68,68,.15)'; ctx.lineWidth = 2;
    for (let i=0;i<4;i++) {
      ctx.beginPath();
      ctx.moveTo(CW*(0.1+i*.25), gY);
      ctx.lineTo(CW*(0.05+i*.25)+Math.sin(ts/500+i)*10, gY-80);
      ctx.stroke();
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  PARTICLE SYSTEM
// ═══════════════════════════════════════════════════════════
let _bursts = [];

function spawnBurst(cx, cy, colors, count=14, power=1) {
  const now = performance.now();
  for (let i=0; i<count; i++) {
    const angle = (Math.PI*2*i/count) + Math.random()*.5;
    const spd = (55 + Math.random()*90) * power;
    _bursts.push({
      x:cx, y:cy,
      vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd - 35*power,
      r: 3 + Math.random()*3*power,
      color: colors[Math.floor(Math.random()*colors.length)],
      birth: now, ttl: 350 + Math.random()*250
    });
  }
}

function paintBursts(now) {
  const alive = [];
  for (const b of _bursts) {
    const age = now - b.birth;
    if (age >= b.ttl) continue;
    const t = age / b.ttl;
    const x = b.x + b.vx*(age/1000);
    const y = b.y + b.vy*(age/1000) + 180*(age/1000)**2;
    ctx.globalAlpha = (1-t)*0.85;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(x, y, b.r*(1-t*.5), 0, Math.PI*2);
    ctx.fill();
    alive.push(b);
  }
  ctx.globalAlpha = 1;
  _bursts = alive;
}

// ═══════════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════════
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min(64, ts - _lastTs); _lastTs = ts;
  drawBG(GS ? GS.bossPhase : 0, ts);
  heroFighter.update(dt); bossFighter.update(dt);
  paintBursts(ts);
  // Expire status effects
  if (GS) {
    Object.keys(GS.statusFx).forEach(k => {
      if (ts > GS.statusFx[k].expires) { delete GS.statusFx[k]; updateStatusRow(); }
    });
  }
}

function makeFighter(el, defKey) {
  const def = SPRITE_DEFS[defKey];
  for (const k in def.anims) { const im = new Image(); im.src = def.base + def.anims[k].file; }
  el.style.width  = (def.fw * def.scale) + 'px';
  el.style.height = (def.fh * def.scale) + 'px';
  if (def.flip) el.style.transform = 'scaleX(-1)';
  const f = {
    def, el, defKey, state:null, frame:0, acc:0, done:null,
    play(state, done=null) {
      if (!def.anims[state]) state = 'idle';
      if (this.state === state && def.anims[state].loop && !done) return;
      this.state = state; this.frame = 0; this.acc = 0; this.done = done;
      const a = def.anims[state];
      el.style.backgroundImage = 'url(' + def.base + a.file + ')';
      el.style.backgroundSize  = (def.fw*def.scale*a.n) + 'px ' + (def.fh*def.scale) + 'px';
      el.style.backgroundPosition = '0 0';
    },
    update(dt) {
      const a = def.anims[this.state]; if (!a) return;
      this.acc += dt;
      const spf = 1000 / a.fps;
      while (this.acc >= spf) {
        this.acc -= spf; this.frame++;
        if (this.frame >= a.n) {
          if (a.loop) { this.frame = 0; }
          else if (a.hold) { this.frame = a.n-1; this.acc = 0;
            if (this.done) { const cb = this.done; this.done = null; cb(); } break; }
          else { const nx = a.next || 'idle', cb = this.done; this.done = null;
            this.play(nx); if (cb) cb(); return; }
        }
      }
      el.style.backgroundPosition = (-(this.frame*def.fw*def.scale)) + 'px 0';
    },
    flash() { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); },
  };
  f.play('idle');
  return f;
}

// ─── SKILL SYSTEM ───────────────────────────────────────────
const SKILL_MAX = 100;
let skillGauge = 0;

function addSkillGauge(v) {
  if (!GS || GS.phase === 10) return;
  skillGauge = Math.min(SKILL_MAX, skillGauge + v);
  const pct = (skillGauge / SKILL_MAX) * 100;
  document.getElementById('skill-fill-bar').style.width = pct + '%';
  const btn = document.getElementById('skill-btn2');
  const ready = skillGauge >= SKILL_MAX;
  btn.disabled = !ready;
  btn.textContent = ready ? '발동!' : Math.round(pct) + '%';
  btn.className = 'skill-btn2' + (ready ? ' ready' : '');
}

function castSkill() {
  if (!GS || skillGauge < SKILL_MAX || GS.phase === 10) return;
  skillGauge = 0;
  addSkillGauge(0);
  heroFighter.play('special');

  // GSAP timeline: dash across screen, flash, return
  const ultFlash = document.getElementById('ult-flash');
  gsap.timeline()
    .to(heroWrap, { left: '30%', duration: .38, ease: 'power4.out' })
    .to(ultFlash,  { opacity: .85, duration: .18 })
    .call(() => {
      const dmg = Math.round((10 + GS.bossPhase * 5) * (GS.combo * .05 + .95));
      GS.bossHP = Math.max(0, GS.bossHP - dmg);
      GS.score += dmg * 3;
      bossAnim('hit');
      showDmgFloat('💥 -' + dmg, '#facc15', 'right');
      showFloating('⚡ 필살기!', '#facc15');

      spawnBurst(CW*.5,  CH*.42, pc, 22, 1.5);

      playSfx('correct');

    })

}

// ═══════════════════════════════════════════════════════════
//  BOSS AI
// ═══════════════════════════════════════════════════════════
function scheduleBossAttack() {
  if (bossTimer) clearTimeout(bossTimer);
  const [mn, mx] = PHASE_ATTACK_DELAY[GS ? GS.bossPhase : 0] || PHASE_ATTACK_DELAY[0];
  const delay = mn + Math.random() * (mx - mn);
  bossTimer = setTimeout(startAttack, delay);
}

function startAttack() {
  if (!GS || GS.phase !== 0) return;
  GS.phase = 1;

  // Pick attack type
  const roll = Math.random();
  let cum = 0, chosen = ATTACK_TYPES[0];
  for (const at of ATTACK_TYPES) {
    cum += at.chance + (at.id === 'special' ? GS.bossPhase * .08 : 0);
    if (roll < cum) { chosen = at; break; }
  }
  GS.attackType = chosen;

  // Maybe apply status effect
  if (Math.random() < 0.2 + GS.bossPhase * 0.1) {
    const keys = Object.keys(STATUS_FX);
    applyStatusFx(keys[Math.floor(Math.random() * keys.length)]);
  }

  // Telegraph
  bossAnim('windup');
  const tel = document.getElementById('tel');
  tel.style.display = 'block';
  const telFillEl = document.getElementById('tel-fill');
  telFillEl.style.background = chosen.color;
  telFillEl.style.boxShadow = `0 0 10px ${chosen.color}`;

  const DUR = 1600 + GS.bossPhase * 250;
  let elapsed = 0;
  telIv = setInterval(() => {
    elapsed += 50;
    document.getElementById('tel-fill').style.width = Math.min(100, elapsed / DUR * 100) + '%';
    if (elapsed >= DUR) {
      clearInterval(telIv); telIv = null;
      tel.style.display = 'none';
      bossAnim('idle');
      showQuestion();
    }
  }, 50);
}

// ═══════════════════════════════════════════════════════════
//  QUESTION SYSTEM
// ═══════════════════════════════════════════════════════════
function showQuestion() {
  if (!GS) return;
  GS.phase = 2;
  if (GS.qIdx >= GS.questions.length) { GS.questions = shuffle([...GS.questions]); GS.qIdx = 0; }
  const q = GS.questions[GS.qIdx++];
  GS.currentQ = q;

  let timeLimit = GS.attackType.time * (PHASE_TIME_SCALE[GS.bossPhase] || 1);
  if (GS.statusFx.FREEZE) timeLimit *= 0.5;

  let opts = [...q.opts];
  if (GS.statusFx.SHOCK) opts = shuffle(opts);

  document.getElementById('qpop-atk-label').textContent = GS.attackType.label;
  document.getElementById('qpop-atk-label').style.color = GS.attackType.color;
  document.getElementById('qpop-eng').textContent = q.eng;
  document.getElementById('qpop-kor').textContent = q.kor;
  document.getElementById('qpop-fb').textContent = '';
  document.getElementById('qpop-fb').className = 'qpop-fb';

  // Render options
  const optsEl = document.getElementById('qpop-opts');
  optsEl.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qopt';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(btn.textContent, q.ans, btn);
    optsEl.appendChild(btn);
  });

  // SHOCK: reshuffle every 1.2s
  let shockIv = null;
  if (GS.statusFx.SHOCK) {
    shockIv = setInterval(() => {
      if (GS.phase !== 2) { clearInterval(shockIv); return; }
      const sh = shuffle([...opts]);
      optsEl.querySelectorAll('.qopt:not([disabled])').forEach((b,i) => b.textContent = sh[i]);
    }, 1200);
  }

  // Timer
  const start = performance.now();
  const timerEl = document.getElementById('qpop-timer');
  const fillEl = document.getElementById('timer-fill');
  function tickTimer() {
    if (GS.phase !== 2) return;
    const rem = Math.max(0, timeLimit - (performance.now() - start) / 1000);
    timerEl.textContent = rem.toFixed(1);
    fillEl.style.width = (rem / timeLimit * 100) + '%';
    fillEl.style.background = rem > timeLimit*.5 ? '#fbbf24' : rem > timeLimit*.25 ? '#f97316' : '#ef4444';
    timerEl.className = 'qpop-timer' + (rem < 1.5 ? ' crit' : rem < 3 ? ' warn' : '');
    if (rem > 0) { qTimer = requestAnimationFrame(tickTimer); }
    else { clearInterval(shockIv); timeExpired(q.ans); }
  }
  qTimer = requestAnimationFrame(tickTimer);
  document.getElementById('qpop').classList.add('show');
}

function handleAnswer(chosen, correct, clickedBtn) {
  if (GS.phase !== 2) return;
  cancelAnimationFrame(qTimer); qTimer = null;
  GS.phase = 3;
  const isCorrect = chosen === correct;
  document.querySelectorAll('.qopt').forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add(isCorrect ? 'ok' : 'reveal');
  });
  if (!isCorrect) {
    clickedBtn.classList.add('ng');
    wrongLog.push({ eng: GS.currentQ.eng, ans: correct, wrong: chosen });
  }
  const fb = document.getElementById('qpop-fb');
  fb.textContent = isCorrect ? '✅ 정답! 공격!' : '❌ 오답! 피격!';
  fb.className = 'qpop-fb ' + (isCorrect ? 'ok' : 'ng');
  setTimeout(() => finishQuestion(isCorrect), isCorrect ? 650 : 950);
}

function timeExpired(correct) {
  if (GS.phase !== 2) return;
  cancelAnimationFrame(qTimer); qTimer = null;
  GS.phase = 3;
  document.querySelectorAll('.qopt').forEach(b => { b.disabled = true; if (b.textContent === correct) b.classList.add('reveal'); });
  const fb = document.getElementById('qpop-fb');
  fb.textContent = '⏰ 시간 초과! 피격!';
  fb.className = 'qpop-fb ng';
  wrongLog.push({ eng: GS.currentQ.eng, ans: correct, wrong: '(시간초과)' });
  setTimeout(() => finishQuestion(false), 950);
}

function finishQuestion(isCorrect) {
  document.getElementById('qpop').classList.remove('show');
  if (isCorrect) {
    let dmg = 6 + GS.bossPhase * 2;
    if (GS.hasPower) { dmg = Math.round(dmg * 1.6); GS.hasPower = false; }
    dmg = Math.round(dmg * (GS.combo * .05 + .95));
    GS.bossHP = Math.max(0, GS.bossHP - dmg);
    GS.combo = Math.min(GS.combo + 1, 12);
    GS.maxCombo = Math.max(GS.maxCombo, GS.combo);
    GS.score += dmg * GS.combo;
    GS.correct++;
    addSkillGauge(15);
    heroAnim('atk'); bossAnim('hit');
    showDmgFloat('-' + dmg, '#ef4444', 'right');
    cameraShake(10 + GS.bossPhase * 4, .5);
    spawnBurst(CW*.78, CH*.42, ['#fbbf24','#f97316','#ef4444','#fff','#fb7185'], 22+GS.bossPhase*5, 1.4+GS.bossPhase*.3);
    spawnBurst(CW*.72, CH*.38, ['#fff','#fbbf24'], 8, .8);
    _flashEl('ok-flash');
    playSfx('correct');
    checkBossPhase();
  } else {
    let dmg = GS.attackType.damage;
    if (GS.statusFx.BURN) dmg *= 2;
    if (GS.hasShield) { dmg = 0; GS.hasShield = false; showFloating('🛡️ 보호막!', '#60a5fa'); }
    GS.heroHP = Math.max(0, GS.heroHP - dmg);
    GS.combo = 1;
    bossAnim('attack'); heroAnim('hurt');
    showDmgFloat('-' + dmg, '#f97316', 'left');
    cameraShake(12, .65);
    spawnBurst(CW*.22, CH*.42, ['#ef4444','#f97316','#dc2626','#fff'], 16, 1.1);
    _flashEl('ng-flash');
    playSfx('wrong');
    if (GS.heroHP <= 0) { setTimeout(gameOver, 350); return; }
  }
  updateHUD();
  GS.phase = 0;
  setTimeout(scheduleBossAttack, 600);
}

function checkBossPhase() {
  const hp = GS.bossHP;
  const target = hp <= 0 ? 3 : hp <= 33 ? 2 : hp <= 66 ? 1 : 0;
  if (target > GS.bossPhase) {
    if (target >= 3) { gameWin(); return; }
    triggerPhaseChange(target);
  }
}

function triggerPhaseChange(newPhase) {
  GS.bossPhase = newPhase;
  GS.phase = 10;
  GS.combo = 1;
  BGM.setPhase(newPhase);
  cancelTimers();
  const b = BOSS_ASSETS[newPhase];
  const h = HERO_ASSETS[newPhase];
  document.getElementById('cut-phase').textContent = `PHASE ${newPhase + 1}`;
  document.getElementById('cut-hero-img').src = h.idle;
  document.getElementById('cut-boss-img').src = b.idle;
  document.getElementById('cut-name').textContent = b.cutName;
  document.getElementById('cut-sub').textContent = b.cutSub;
  // Flash
  const fl = document.getElementById('phase-flash');
  fl.className = ''; void fl.offsetWidth; fl.className = 'go';
  setTimeout(() => {
    document.getElementById('cut').classList.add('show');
    setCharSprites(newPhase);
    document.getElementById('stage-badge').textContent = `PHASE ${newPhase + 1}`;
  }, 200);
  setTimeout(() => {
    document.getElementById('cut').classList.remove('show');
    GS.phase = 0;
    scheduleBossAttack();
    scheduleDropSpawn();
  }, 2800);
}

function applyStatusFx(key) {

  updateStatusRow();
  showFloating(fx.icon + ' ' + fx.label + '!', fx.color);

function updateStatusRow() {
  const row = document.getElementById('status-row');
  const hudH = document.getElementById('hud').offsetHeight;
  const telShowing = document.getElementById('tel').style.display !== 'none';
  row.style.top = (hudH + (telShowing ? 86 : 6)) + 'px';
  row.innerHTML = Object.entries(GS.statusFx).map(([k,fx]) =>
    `<div class="sfx-badge" style="border-color:${fx.color};color:${fx.color}">${fx.icon}${fx.label}</div>`
  ).join('');
}

const MAX_DROPS = 1;

function scheduleDropSpawn() {
  if (dropTimer) clearTimeout(dropTimer);
  dropTimer = setTimeout(spawnDropIfNeeded, 9000 + Math.random() * 6000);
}

function spawnDropIfNeeded() {
  if (!GS || GS.phase === 10) { scheduleDropSpawn(); return; }
  if (GS.drops.length < MAX_DROPS) spawnDrop();
  scheduleDropSpawn();
}

function randDropPos() {
  return { x: CW * (.15 + Math.random() * .7), y: CH * (.38 + Math.random() * .22) };
}

function animateDrop(el) {
  if (!el.isConnected) return;
  const pos = randDropPos();
  const dur = 2.2 + Math.random() * 2;
  gsap.to(el, {
    left: pos.x, top: pos.y, duration: dur,
    ease: 'sine.inOut',
    onComplete() { animateDrop(el); }
  });
}

function spawnDrop() {
  if (!GS || GS.phase === 10) return;
  const keys = Object.keys(DROP_TYPES);
  const key = keys[Math.floor(Math.random() * keys.length)];
  const id = GS.dropId++;
  const pos = randDropPos();
  GS.drops.push({ id, key, icon: DROP_TYPES[key].icon });
  const el = document.createElement('div');
  el.className = 'drop-item'; el.textContent = DROP_TYPES[key].icon;
  el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
  el.style.opacity = '0'; el.style.transform = 'scale(.4)';
  el.dataset.id = id;
  el.onclick = () => grabDrop(id, el);
  el.ontouchstart = (e) => { e.preventDefault(); grabDrop(id, el); };
  document.getElementById('drops-layer').appendChild(el);
  // Appear animation
  gsap.to(el, { opacity: 1, scale: 1, duration: .4, ease: 'back.out(1.7)',
    onComplete() { animateDrop(el); }
  });
  // Auto-expire after 12s
  setTimeout(() => {
    if (!el.isConnected) return;
    gsap.to(el, { opacity: 0, scale: .3, duration: .3, onComplete() {
      GS && (GS.drops = GS.drops.filter(d => d.id !== id));
      el.remove();
    }});
  }, 12000);
}

function grabDrop(id, el) {
  const d = GS.drops.find(dr=>dr.id===id); if (!d) return;
  GS.drops = GS.drops.filter(dr=>dr.id!==id);
  gsap.killTweensOf(el);
  gsap.to(el, { scale: 1.6, opacity: 0, y: -30, duration: .3, onComplete: () => el.remove() });
  const dt = DROP_TYPES[d.key];
  if (dt.action==='heal') { GS.heroHP=Math.min(100,GS.heroHP+dt.value); updateHUD(); showFloating('❤️ +'+dt.value+'HP!','#22c55e'); }
  else if (dt.action==='shield') { GS.hasShield=true; showFloating('🛡️ 보호막!','#60a5fa'); }
  else if (dt.action==='power') { GS.hasPower=true; showFloating('⚔️ 강타 준비!','#f97316'); }
  addSkillGauge(10);
  playSfx('correct');
}

       <div class="wl-wrong">❌ 내 답: ${w.wrong}</div></div>`
    ).join('');
  } else { wl.style.display='none'; }
  document.getElementById('result').classList.add('show');
  BGM.stop();
  if (!win) setTimeout(() => playSfx('lose'), 200);
}

function showDmgFloat(text, color, side) {
  const el = document.createElement('div');
  el.className = 'dmg-float';
  el.style.cssText = `color:${color};font-size:2.2rem;left:${side==='right'?'60%':'16%'};top:38%;text-shadow:0 3px 12px rgba(0,0,0,.9),0 0 20px ${color};`;

function _flashEl(id) {

  el.className = ''; void el.offsetWidth; el.className = 'go';
}

function showFloating(text, color) {
  const el = document.createElement('div');
  el.className = 'dmg-float';
  el.style.cssText = `color:${color};font-size:1.6rem;font-weight:900;left:50%;transform:translateX(-50%);top:32%;text-shadow:0 3px 12px rgba(0,0,0,.9),0 0 18px ${color};white-space:nowrap;`;

  setTimeout(() => el.remove(), 1100);
}

let _sfxAC = null;
function _ac() { if (!_sfxAC) _sfxAC = new (window.AudioContext||window.webkitAudioContext)(); return _sfxAC; }
function playSfx(type) {
  try {
    const ac = _ac();
    if (type === 'correct') {
      [[660,.08],[880,.12],[1100,.12]].forEach(([f,t],i) => {
        const o=ac.createOscillator(), g=ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type='sine'; o.frequency.value=f;
        const s=ac.currentTime+i*.08;
        g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.25,s+.02);
        g.gain.exponentialRampToValueAtTime(.001,s+t+.06);
        o.start(s); o.stop(s+t+.08);
      });
    } else if (type === 'wrong') {
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sawtooth'; o.frequency.setValueAtTime(280,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(120,ac.currentTime+.3);
      g.gain.setValueAtTime(.3,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);
      o.start(); o.stop(ac.currentTime+.36);
    } else if (type === 'win') {
      [[523,.1],[659,.1],[784,.1],[1047,.3]].forEach(([f,t],i) => {
        const o=ac.createOscillator(), g=ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type='triangle'; o.frequency.value=f;
        const s=ac.currentTime+i*.12;
        g.gain.setValueAtTime(.3,s); g.gain.exponentialRampToValueAtTime(.001,s+t+.1);
        o.start(s); o.stop(s+t+.15);
      });
    } else if (type === 'lose') {
      [[400,.1],[300,.1],[200,.4]].forEach(([f,t],i) => {
        const o=ac.createOscillator(), g=ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type='sawtooth'; o.frequency.value=f;
        const s=ac.currentTime+i*.15;
        g.gain.setValueAtTime(.25,s); g.gain.exponentialRampToValueAtTime(.001,s+t+.1);
        o.start(s); o.stop(s+t+.15);
      });
    }
  } catch(e){}
}

function shuffle(a) {
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function cancelTimers() {
  if (bossTimer) { clearTimeout(bossTimer); bossTimer=null; }
  if (qTimer) { cancelAnimationFrame(qTimer); qTimer=null; }
  if (dropTimer) { clearTimeout(dropTimer); dropTimer=null; }
  if (telIv) { clearInterval(telIv); telIv=null; }
  document.getElementById('tel').style.display='none';
  document.getElementById('qpop').classList.remove('show');
}

function buildSelect() {
  if (typeof GAME_QUESTIONS === 'undefined') return;
  const c = document.getElementById('unit-list');
  const allBtn = document.createElement('div');
  allBtn.className = 'all-card';
  allBtn.innerHTML = '⚔️ 전체 단원 보스전<br><small style="font-weight:700;opacity:.8">모든 문제로 최강 보스 도전</small>';
  allBtn.onclick = () => G.start(Object.values(GAME_QUESTIONS).flatMap(u=>u.questions), '전체 단원');
  c.appendChild(allBtn);
  Object.entries(GAME_QUESTIONS).forEach(([k,u]) => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `<div class="uc-lbl">${k.toUpperCase()}</div><h3>${u.label}</h3><div class="uc-cnt">문제 ${u.questions.length}개</div>`;
    card.onclick = () => G.start(u.questions, u.label);
    c.appendChild(card);
  });
}
buildSelect();
