<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>문법 레인저스</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#08111f;overflow:hidden;font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;color:#fff;}
button{font-family:inherit;}

/* ── 게이트 ── */
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 0%,#1b2b4d,#0c1322 70%);overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
.gate-title{font-family:'Black Han Sans',sans-serif;font-size:2.25rem;font-weight:400;letter-spacing:.02em;text-shadow:0 4px 0 #082f49,0 0 24px rgba(56,189,248,.7);}
.gate-sub{font-size:.86rem;color:#7dd3fc;margin:8px 0 18px;text-align:center;line-height:1.7;max-width:460px;}
.mode-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:520px;}
.mode-card{width:230px;background:rgba(255,255,255,.05);border:2px solid rgba(56,189,248,.35);border-radius:18px;padding:16px;cursor:pointer;color:#fff;text-align:left;transition:transform .14s,border-color .14s,box-shadow .14s;}
.mode-card.on{border-color:#38bdf8;background:rgba(56,189,248,.16);box-shadow:0 0 22px rgba(56,189,248,.4);transform:translateY(-3px);}
.mode-card .mc-icon{font-size:1.6rem;}
.mode-card .mc-name{font-weight:900;font-size:1.05rem;margin:5px 0 3px;}
.mode-card .mc-desc{font-size:.76rem;color:#bae6fd;line-height:1.5;}
.mode-card .mc-best{margin-top:8px;font-size:.74rem;color:#fde68a;font-weight:700;}
#unit-pick{display:none;margin-top:14px;max-width:520px;width:100%;}
#unit-pick.show{display:block;}
.up-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.up-label{flex-shrink:0;width:58px;text-align:right;font-size:.74rem;font-weight:900;color:#fde68a;padding-top:8px;}
.up-grid{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.uchip{border:1.5px solid rgba(56,189,248,.4);background:rgba(255,255,255,.05);color:#bae6fd;border-radius:99px;padding:6px 12px;font-size:.76rem;font-weight:800;cursor:pointer;transition:all .12s;}
.uchip.on{background:linear-gradient(135deg,#0284c7,#38bdf8);border-color:#38bdf8;color:#fff;}
#gate-go{margin-top:20px;font-size:1.2rem;font-weight:900;color:#04210f;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:16px;padding:15px 50px;box-shadow:0 12px 30px rgba(245,158,11,.5);cursor:pointer;transition:transform .12s;}
#gate-go:active{transform:scale(.96);}
#gate-go:disabled,.b-retry:disabled{cursor:wait;opacity:.72;transform:none;}
.gate-back{margin-top:14px;color:#94a3b8;font-size:.85rem;text-decoration:none;}
.gate-tip{margin-top:12px;color:#dbeafe;font-size:.76rem;font-weight:800;background:rgba(14,165,233,.12);border:1px solid rgba(125,211,252,.28);border-radius:10px;padding:7px 12px;text-align:center;}

/* ── 게임 ── */
#game{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;}
#hud{width:100%;max-width:900px;display:flex;align-items:center;gap:8px;padding:8px 12px 4px;}
.hud-chip{font-size:.95rem;font-weight:900;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);border-radius:11px;padding:6px 10px;line-height:1;white-space:nowrap;}
#stage-chip{color:#7dd3fc;border-color:rgba(56,189,248,.45);}
#best-chip2{color:#ddd6fe;font-size:.74rem;}
#energy-wrap{flex:1;min-width:80px;}
#energy-track{height:16px;background:#0a0f1c;border:1.5px solid rgba(251,191,36,.4);border-radius:99px;overflow:hidden;position:relative;}
#energy-fill{height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#fde68a);transition:width .12s;}
#energy-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:#1a1206;text-shadow:0 1px 0 rgba(255,255,255,.3);}
#spd-btn,#bgm-btn,#sfx-btn{font-size:.82rem;font-weight:900;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 9px;cursor:pointer;white-space:nowrap;}
#spd-btn{color:#fde68a;border-color:rgba(251,191,36,.45);}

#stage-wrap{position:relative;width:100%;max-width:900px;}
#field{display:block;width:100%;height:auto;border-radius:16px;border:2px solid rgba(125,211,252,.5);background:#1a2f1c;box-shadow:0 12px 34px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.14);}
#wave-banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.8);background:linear-gradient(135deg,rgba(2,132,199,.95),rgba(56,189,248,.92));padding:11px 24px;border-radius:14px;font-weight:900;font-size:1.1rem;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;border:1.5px solid rgba(255,255,255,.4);text-align:center;}
#wave-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* 강화 + 소환 바 */
#tower-bar{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:7px 10px 0;}
.tower-btn{min-height:44px;border:1.5px solid rgba(125,211,252,.38);border-radius:12px;background:linear-gradient(160deg,rgba(30,58,95,.96),rgba(10,25,49,.96));color:#fff;padding:6px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.tower-btn:active,.upgrade-btn:active,.summon-btn:active{transform:scale(.96);}
.tower-btn.poor,.upgrade-btn.poor,.summon-btn.poor{opacity:.4;}
.tower-btn.maxed,.upgrade-btn.maxed{border-color:#fbbf24;background:linear-gradient(160deg,rgba(120,74,12,.8),rgba(54,35,10,.9));}
.tower-icon{font-size:1.25rem}.tower-copy{display:flex;flex-direction:column;text-align:left;line-height:1.15}.tower-name{font-size:.72rem;font-weight:900}.tower-cost{font-size:.63rem;color:#fde68a;font-weight:800;margin-top:3px}
#summon-bar{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px 10px 2px;}
.unit-card{min-width:0;background:rgba(10,25,49,.92);border:1.5px solid rgba(56,189,248,.32);border-radius:13px;padding:5px;display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto auto;gap:3px 5px;align-items:center;}
.unit-card canvas{width:44px;height:44px;grid-row:1/4;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));}
.unit-role{font-size:.55rem;line-height:1;color:#7dd3fc;font-weight:900;letter-spacing:.02em;text-align:left;}
.summon-btn,.upgrade-btn{border:0;border-radius:8px;color:#fff;font-weight:900;cursor:pointer;transition:transform .1s,opacity .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.summon-btn{background:linear-gradient(135deg,#0369a1,#0284c7);font-size:.67rem;padding:5px 4px;min-height:28px;}
.s-short{display:none}
.upgrade-btn{background:linear-gradient(135deg,#92400e,#d97706);font-size:.59rem;padding:4px 3px;color:#fff7d6;min-height:25px;}
.unit-card.lv3{border-color:#fbbf24;box-shadow:0 0 13px rgba(251,191,36,.22);}
#army-count{font-size:.69rem;color:#bae6fd;text-align:center;grid-column:1/-1;margin-bottom:-1px;}

/* 문제 카드 */
#qcard{width:100%;max-width:900px;margin:6px auto 10px;background:linear-gradient(170deg,#10233f,#0b1830);border:2px solid #0ea5e9;border-radius:16px;padding:10px 13px 12px;box-shadow:0 6px 26px rgba(0,0,0,.6);}
#q-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
#q-unit{font-size:.64rem;font-weight:800;color:#bae6fd;background:rgba(14,165,233,.25);border-radius:7px;padding:2px 8px;}
#q-combo{font-size:.72rem;font-weight:900;color:#fde68a;margin-left:auto;display:none;}
#q-eng{font-size:1.02rem;font-weight:800;line-height:1.4;}
#q-eng b{color:#fde68a;}
#q-kor{font-size:.79rem;color:#93c5fd;margin:3px 0 8px;}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.opt{background:rgba(255,255,255,.06);border:2px solid rgba(56,189,248,.32);border-radius:11px;padding:10px 9px;font-size:.94rem;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s,border-color .1s;}
.opt:active{transform:scale(.97);}
.opt.ok{background:rgba(34,197,94,.3);border-color:#22c55e;}
.opt.ng{background:rgba(239,68,68,.3);border-color:#ef4444;animation:shake .35s;}
.opt:disabled{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#q-reward{text-align:center;font-size:.8rem;font-weight:800;color:#86efac;margin-top:7px;min-height:1em;}

/* 결과 */
#result{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(4,8,18,.92);}
.res-card{text-align:center;padding:28px 30px 24px;background:linear-gradient(180deg,rgba(20,35,60,.97),rgba(9,16,30,.98));border:2px solid rgba(56,189,248,.5);border-radius:22px;max-width:380px;width:90%;box-shadow:0 0 46px rgba(56,189,248,.22);animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(.7) translateY(28px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.res-icon{font-size:3.4rem;}
.res-stage{font-size:2.5rem;font-weight:900;color:#7dd3fc;text-shadow:0 0 20px rgba(56,189,248,.6);margin:2px 0;}
.res-sub{font-size:.85rem;color:#bae6fd;margin-bottom:6px;}
.res-new{display:inline-block;font-size:.8rem;font-weight:900;color:#04210f;background:linear-gradient(135deg,#fde68a,#fbbf24);border-radius:10px;padding:4px 14px;margin-bottom:12px;animation:pulse2 .9s infinite;}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.res-best{font-size:.82rem;color:#ddd6fe;margin-bottom:16px;line-height:1.7;}
.res-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.res-btn{border:none;border-radius:12px;padding:12px 20px;font-size:.95rem;font-weight:900;cursor:pointer;color:#fff;}
.b-retry{background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 6px 16px rgba(14,165,233,.45);}
.b-list{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);color:#cbd5e1;}

@media (max-width:560px){
  #game{overflow-y:auto;justify-content:flex-start;padding-bottom:6px;}
  #q-eng{font-size:.92rem;} .gate-title{font-size:1.8rem;} .mode-card{width:100%;max-width:320px;}
  #hud{gap:4px;padding:5px 6px 3px}.hud-chip{padding:6px;font-size:.76rem}#best-chip2{display:none}
  #spd-btn,#bgm-btn,#sfx-btn{min-width:44px;min-height:44px;padding:5px;}
  #stage-wrap{width:calc(100% - 8px);}
  #field{width:100%;height:clamp(170px,23vh,205px);border-radius:13px;}
  #tower-bar{padding:6px 6px 0;gap:5px}.tower-btn{min-height:48px;padding:5px 3px;gap:3px}.tower-icon{font-size:1rem}.tower-name{font-size:.64rem}.tower-cost{font-size:.57rem}
  #summon-bar{grid-template-columns:repeat(2,1fr);padding:6px 6px 1px;gap:6px}.unit-card{grid-template-columns:48px 1fr;padding:5px;gap:3px 5px}.unit-card canvas{width:48px;height:48px}.unit-role{font-size:.56rem}.summon-btn{font-size:.68rem;min-height:44px;padding:6px 3px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.18}.upgrade-btn{font-size:.62rem;min-height:44px;padding:5px 3px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.18}
  .s-full{display:inline}.s-short{display:none}
  #army-count{font-size:.67rem;margin:0;}
  #qcard{width:calc(100% - 12px);margin:5px 6px 3px;padding:8px 9px 9px}.opt{min-height:44px;padding:8px 6px;font-size:.86rem}
}
@media (min-width:561px) and (max-height:760px){
  #hud,#stage-wrap,#tower-bar,#summon-bar,#qcard{max-width:800px}
  #tower-bar{padding-top:5px}.tower-btn{min-height:40px}.unit-card{padding:3px}.unit-card canvas{width:38px;height:38px}.summon-btn{padding:4px}.upgrade-btn{padding:3px}
  #qcard{padding-top:8px;margin-top:4px}.opt{padding:7px}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-title">⚔️ 문법 레인저스</div>
  <div class="gate-sub">문제를 맞혀 ⚡기력을 모으고 유닛을 소환! 부대를 진격시켜 적 본진을 부숴라.<br>틀려도 전투는 계속된다 — 정답률로 병력을 모은다. 몇 스테이지까지?</div>
  <div class="mode-cards">
    <button class="mode-card on" id="card-all">
      <div class="mc-icon">🌊</div>

    </button>
    <button class="mode-card" id="card-unit">
      <div class="mc-icon">🎯</div>

  </div>
  <div id="unit-pick">
    <div class="up-row"><span class="up-label">중1</span><div class="up-grid" id="up-grid-g1"></div></div>
    <div class="up-row"><span class="up-label">중2</span><div class="up-grid" id="up-grid-g2"></div></div>
  </div>
  <button id="gate-go">⚔️ 진격 시작!</button>
  <div class="gate-tip">① 문제 정답 → ② 병력 소환 → ③ 유닛·성벽·대포 강화</div>
  <a class="gate-back" href="../game/index.html">← 목록</a>
</div>

<div id="game">
  <div id="hud">
    <div class="hud-chip" id="stage-chip">🏰 1</div>
    <div id="energy-wrap"><div id="energy-track"><div id="energy-fill"></div><div id="energy-txt">⚡0</div></div></div>
    <div class="hud-chip" id="best-chip2">최고 -</div>
    <button id="spd-btn">▶ 1x</button>
    <button id="bgm-btn" aria-label="배경음악 켜기 또는 끄기">🎵</button>

    <div id="q-top"><span id="q-unit"></span><span id="q-combo"></span></div>

</div>

<div id="result">
  <div class="res-card">
    <div class="res-icon" id="res-icon">🏰</div>
    <div class="res-stage"><span id="res-stage">0</span> 스테이지</div>
    <div class="res-sub" id="res-sub"></div>
    <div id="res-new-wrap"></div>
    <div class="res-best" id="res-best"></div>
    <div class="res-btns">
      <button class="res-btn b-retry" id="btn-retry">⚔️ 다시 진격!</button>
      <button class="res-btn b-list" onclick="location.href='../game/index.html'">목록</button>

</div>

<audio id="bgm" src="../game2/assets/bgm/battle-theme.mp3" loop preload="none"></audio>
<script src="../game/questions.js?v=questions-20260715a"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════
//  문법 레인저스 — 측면 레인 배틀
//  에셋: OpenAI image generation으로 제작한 프로젝트 전용 HD-v1 세트.
//  정적 컷아웃 + Canvas 모션 / 유닛·본진 업그레이드 / 대포 방어.
// ═══════════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const AP='assets/hd-v1/';
const SP='assets/hd-v2/';
const SPRITE_FRAME=256;

// 사운드
let _ac=null;
let sfxOn=localStorage.getItem('egmGR.sfx')!=='off';
function ac(){if(!_ac){try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(_ac.state==='suspended')_ac.resume().catch(()=>{});return _ac;}
['pointerdown','touchstart','click'].forEach(ev=>window.addEventListener(ev,()=>ac(),{capture:true}));
function tone(f,d,t,v,w,drop){if(!sfxOn)return;const c=ac();if(!c)return;const at=c.currentTime+(w||0),o=c.createOscillator(),g=c.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,at);if(drop)o.frequency.exponentialRampToValueAtTime(Math.max(35,f*drop),at+d);g.gain.setValueAtTime(v||.1,at);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+d+.02);}
function noise(d=.08,v=.04,w=0,cut=900){if(!sfxOn)return;const c=ac();if(!c)return;const at=c.currentTime+w,b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const src=c.createBufferSource(),filter=c.createBiquadFilter(),g=c.createGain();src.buffer=b;filter.type='lowpass';filter.frequency.value=cut;g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.001,at+d);src.connect(filter);filter.connect(g);g.connect(c.destination);src.start(at);src.stop(at+d+.02);}
const soundGate={};
function allowSound(key,gap){const now=performance.now();if(now-(soundGate[key]||0)<gap)return false;soundGate[key]=now;return true;}
const sfx={
  ok(){tone(660,.08,'square',.09);tone(880,.1,'square',.09,.06);},
  coin(){tone(880,.05,'square',.07);tone(1175,.07,'square',.07,.05);},
  ng(){tone(200,.16,'sawtooth',.09);tone(150,.2,'sawtooth',.08,.09);},
  summon(){noise(.12,.035,0,1800);tone(330,.09,'sine',.08,0,1.9);tone(660,.12,'triangle',.08,.06);},
  hit(){if(!allowSound('hit',65))return;noise(.055,.055,0,650);tone(150,.075,'sawtooth',.055,0,.48);},
  arrow(){if(!allowSound('arrow',55))return;noise(.045,.025,0,3200);tone(760,.055,'triangle',.045,0,.72);},
  cannon(){noise(.18,.12,0,720);tone(92,.22,'sawtooth',.15,0,.28);tone(185,.08,'square',.05,.015,.42);},
  fort(){noise(.14,.085,0,900);tone(125,.18,'sawtooth',.11,0,.34);},
  die(){if(!allowSound('die',90))return;tone(190,.15,'sawtooth',.075,0,.42);noise(.1,.045,.02,520);},
  baseHit(){if(!allowSound('base',110))return;noise(.12,.09,0,580);tone(105,.19,'sawtooth',.13,0,.32);},
  upgrade(){[392,523,659,784].forEach((f,i)=>tone(f,.12,'triangle',.08,i*.055));noise(.08,.025,.12,2600);},
  stage(){[523,659,784,1047].forEach((f,i)=>tone(f,.13,'square',.1,i*.1));},
  over(){tone(300,.18,'sawtooth',.11);tone(220,.22,'sawtooth',.11,.16);tone(150,.4,'sawtooth',.11,.34);},
};
const bgm=$('bgm');let bgmOn=localStorage.getItem('egmGR.bgm')!=='off',bgmNeedsGesture=false;
function syncAudioButtons(){const b=$('bgm-btn');b.textContent=!bgmOn?'🎵×':bgmNeedsGesture?'🎵!':'🎵';b.setAttribute('aria-label',bgmNeedsGesture?'배경음악 재생 재시도':'배경음악 켜기 또는 끄기');$('sfx-btn').textContent=sfxOn?'💥':'💥×';}
function bgmPlay(){
  if(!bgmOn)return;
  bgm.volume=.24;
  try{
    const p=bgm.play();
    if(p&&typeof p.then==='function')p.then(()=>{bgmNeedsGesture=false;syncAudioButtons();}).catch(()=>{bgmNeedsGesture=true;syncAudioButtons();});
  }catch(e){bgmNeedsGesture=true;syncAudioButtons();}
}
function bgmStop(){bgm.pause();bgm.currentTime=0;bgmNeedsGesture=false;syncAudioButtons();}

// ── 전용 HD 에셋 ──
const IMG={sprites:{}};
const imageJobs=new Map();
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
function memoImg(src){if(!imageJobs.has(src))imageJobs.set(src,loadImg(src));return imageJobs.get(src);}

function unitDef(key){return MY_UNITS.find(u=>u.key===key)||FOE_UNITS[key];}
function loadNamedArt(key,src){
  if(Object.prototype.hasOwnProperty.call(IMG,key))return Promise.resolve(IMG[key]);
  return memoImg(src).then(i=>{IMG[key]=i;return i;});
}
function loadStaticArt(key,def){return loadNamedArt(key,AP+def.img);}
function loadSpriteArt(key,def,action){
  const bucket=IMG.sprites[key]||(IMG.sprites[key]={});
  if(Object.prototype.hasOwnProperty.call(bucket,action))return Promise.resolve(bucket[action]);
  return memoImg(SP+def.sprite+action+'.png').then(i=>{bucket[action]=i;return i;});
}
function ensureUnitArt(key,actions=['idle','run']){
  const def=unitDef(key);if(!def)return Promise.resolve();
  return Promise.all([loadStaticArt(key,def),...actions.map(a=>loadSpriteArt(key,def,a))]);
}
let coreAssetsPromise=null;
function loadCoreAssets(){
  if(coreAssetsPromise)return coreAssetsPromise;
  const imp={...FOE_UNITS.e_imp,key:'e_imp'};
  coreAssetsPromise=Promise.all([
    loadNamedArt('background',AP+'battlefield.png'),
    loadNamedArt('cannon',AP+'cannon.png'),
    ...MY_UNITS.map(u=>loadStaticArt(u.key,u)),
    ...[...MY_UNITS,imp].flatMap(u=>['idle','run'].map(a=>loadSpriteArt(u.key,u,a))),
    loadStaticArt(imp.key,imp),
  ]);
  return coreAssetsPromise;
}

function loadRec(k){try{return JSON.parse(localStorage.getItem(k))||null;}catch(e){return null;}}

// ── 게임 상태 ──
let GS=null, raf=0, lastT=0, runSeq=0, starting=false;
const runTimers=new Set();
function runLater(fn,delay,runId=GS&&GS.runId){
  const id=setTimeout(()=>{runTimers.delete(id);if(!GS||GS.runId!==runId)return;fn();},delay);
  runTimers.add(id);return id;
}
function cancelRunTimer(id){if(!id)return;clearTimeout(id);runTimers.delete(id);}
function clearRunTimers(){for(const id of runTimers)clearTimeout(id);runTimers.clear();bannerT=0;$('wave-banner').classList.remove('show');}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
function startLoop(){if(raf||!GS||GS.over||document.hidden)return;lastT=performance.now();raf=requestAnimationFrame(loop);}
function buildPool(scope){
  const keys=(scope&&scope!=='all')?[scope]:Object.keys(GAME_QUESTIONS).filter(k=>k!=='all');
  const pool=[];keys.forEach(k=>{const u=GAME_QUESTIONS[k];if(!u)return;u.questions.forEach(q=>{if(q.opts&&q.opts.length>=2)pool.push({...q,unitLabel:u.label,unitColor:u.color});});});
  return pool;
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function setStartingUI(on){
  const go=$('gate-go'),retry=$('btn-retry');
  go.disabled=retry.disabled=on;go.setAttribute('aria-busy',String(on));retry.setAttribute('aria-busy',String(on));

}
function requestRun(scope){
  if(starting)return;
  // 이 호출은 반드시 시작/재도전 클릭의 사용자 제스처 안에서 await보다 먼저 실행한다.
  bgmPlay();
  const runId=++runSeq;starting=true;setStartingUI(true);clearRunTimers();stopLoop();
  startRun(scope,runId).catch(()=>{if(runId!==runSeq)return;starting=false;setStartingUI(false);bgm.pause();$('gate-go').textContent='다시 눌러 시작';});
}
async function startRun(scope,runId){
  await loadCoreAssets();
  if(runId!==runSeq)return;
  if(!bgCanvas)renderBackground();
  const pool=buildPool(scope);
  GS={
    runId,scope, pool, qseq:shuffled(pool), qi:0,
    energy:36, energyMax:100, stage:0, combo:0, correct:0, total:0, maxCombo:0, speed:1,
    myHP:120, myHPMax:120, foeHP:0, foeHPMax:0,
    units:[], shots:[], floats:[], fxs:[],
    unitLv:{soldier:1,archer:1,warrior:1,mage:1},towerLv:{wall:0,reactor:0,cannon:0},
    cannonCool:0,foeFortCool:2.6,fortWarned:false,nextUnitId:1,foeSpawnT:0,over:false,win:false,time:0,locked:false,
  };

function startStage(s){
  const g=GS;g.stage=s;

}
// 적 스폰 풀(스테이지 따라 강해짐)
function foePick(s){
  const r=Math.random();
  if(s>=6&&r<.14)return 'e_ogre';
  if(s>=4&&r<.34)return 'e_boar';
  if(s>=2&&r<.62)return 'e_bone';
  return 'e_imp';
}
function foeSpawnInterval(s){return Math.max(1.35,3.45-s*.08);}

function spawnUnit(side,key){
  const g=GS;
  const def=side==='my'?MY_UNITS.find(u=>u.key===key):FOE_UNITS[key];
  const alive=g.units.filter(u=>!u.dead),sideAlive=alive.filter(u=>u.side===side).length;
  if(g.units.length>=MAX_TOTAL_UNITS||sideAlive>=(side==='my'?MAX_MY_UNITS:MAX_FOE_UNITS))return false;
  ensureUnitArt(key,['idle','run']);
  const lv=side==='my'?g.unitLv[key]:1;
  const stMul=side==='foe'?(1+(g.stage-1)*.09):1;
  const hpMul=side==='my'?(1+(lv-1)*.28):stMul;
  const dmgMul=side==='my'?(1+(lv-1)*.22):stMul;
  g.units.push({
    id:g.nextUnitId++,side,key,def,level:lv,x:side==='my'?MYBASE.x+18:FOEBASE.x-18,
    y: LANE_Y + (Math.random()-0.5)*LANE_H,
    hp:Math.round(def.hp*hpMul),maxHp:Math.round(def.hp*hpMul),dmg:Math.round(def.dmg*dmgMul),
    range:def.range, atkSpd:def.atkSpd, speed:def.speed, ranged:def.ranged, splash:def.splash,
    cool:0,lunge:0,ft:Math.random(),dead:false,fade:1,engaged:0,
    anim:'run',animT:Math.random()*.25,animLock:0,siege:null,
  });
  return true;
}

function setUnitAnim(u,action,lock=0){
  if(u.anim!==action){u.anim=action;u.animT=0;loadSpriteArt(u.key,u.def,action);}
  if(lock)u.animLock=Math.max(u.animLock,lock);
}

function trySummon(key){
  const g=GS;if(!g||g.over)return;
  const u=MY_UNITS.find(x=>x.key===key);
  const alive=g.units.filter(x=>x.side==='my'&&!x.dead).length;
  if(alive>=MAX_MY_UNITS){banner('병력 한도 8명! 강화하거나 전선을 정리하세요');return;}
  if(g.energy<u.cost){flashPoor(key);return;}
  if(!spawnUnit('my',key)){banner('전장이 혼잡합니다. 잠시 뒤 소환하세요');return;}
  g.energy-=u.cost;sfx.summon();updateHud();
}
function upgradeUnit(key){
  const g=GS;if(!g||g.over)return;const lv=g.unitLv[key];if(lv>=3)return;
  const cost=UNIT_UP_COST[lv];if(g.energy<cost){flashPoor(key);return;}g.energy-=cost;g.unitLv[key]++;
  for(const u of g.units){if(u.side!=='my'||u.key!==key||u.dead)continue;const oldMax=u.maxHp;u.level=g.unitLv[key];u.maxHp=Math.round(u.def.hp*(1+(u.level-1)*.28));u.hp=Math.min(u.maxHp,u.hp+(u.maxHp-oldMax));u.dmg=Math.round(u.def.dmg*(1+(u.level-1)*.22));}
  banner(MY_UNITS.find(u=>u.key===key).name+' Lv.'+g.unitLv[key]+'!');sfx.upgrade();updateHud();
}
function upgradeTower(key){
  const g=GS;if(!g||g.over)return;const def=TOWER_UPGRADES[key],lv=g.towerLv[key];if(lv>=def.max)return;const cost=def.cost[lv];if(g.energy<cost){banner('기력이 부족합니다');return;}g.energy-=cost;g.towerLv[key]++;
  if(key==='wall'){g.myHPMax=120+g.towerLv.wall*35;g.myHP=Math.min(g.myHPMax,g.myHP+35);}
  if(key==='reactor'){g.energyMax=100+g.towerLv.reactor*20;g.energy=Math.min(g.energyMax,g.energy+20);}
  if(key==='cannon')g.cannonCool=.25;
  banner(def.icon+' '+def.name+' Lv.'+g.towerLv[key]+'!');sfx.upgrade();updateHud();
}
function updateUpgradeUI(){
  const g=GS;if(!g)return;
  document.querySelectorAll('.tower-btn').forEach(b=>{const d=TOWER_UPGRADES[b.dataset.key],lv=g.towerLv[b.dataset.key],max=lv>=d.max,c=max?'최대 강화':`Lv.${lv} → ${lv+1} · ⚡${d.cost[lv]}`;b.querySelector('.tower-name').textContent=d.name+' Lv.'+lv;b.querySelector('.tower-cost').textContent=c;b.classList.toggle('maxed',max);b.classList.toggle('poor',!max&&g.energy<d.cost[lv]);});
  document.querySelectorAll('.unit-card').forEach(card=>{const u=MY_UNITS.find(x=>x.key===card.dataset.key),lv=g.unitLv[u.key],max=lv>=3,cost=UNIT_UP_COST[lv],summon=card.querySelector('.summon-btn');summon.innerHTML=`${u.emoji} <span class="s-full">${u.name}</span><span class="s-short">${u.short}</span> ⚡${u.cost}`;summon.setAttribute('aria-label',`${u.role} ${u.name} 소환, 기력 ${u.cost}`);card.querySelector('.upgrade-btn').textContent=max?'★ MAX':`Lv.${lv} 강화 ⚡${cost}`;card.classList.toggle('lv3',max);card.querySelector('.upgrade-btn').classList.toggle('maxed',max);card.querySelector('.upgrade-btn').classList.toggle('poor',!max&&g.energy<cost);summon.classList.toggle('poor',g.energy<u.cost);});
  const alive=g.units.filter(x=>x.side==='my'&&!x.dead).length;if($('army-count'))$('army-count').textContent=`출전 병력 ${alive} / ${MAX_MY_UNITS} · 스테이지 종료 시 정예 3명만 귀환`;

function flashPoor(key){const b=[...document.querySelectorAll('.unit-card')].find(x=>x.dataset.key===key);if(b){b.style.transform='translateX(-3px)';runLater(()=>b.style.transform='',120);}}

// ── 루프 ──
function loop(now){
  raf=0;const g=GS;if(!g||g.over||document.hidden)return;
  let dt=(now-lastT)/1000;lastT=now;if(dt>0.05)dt=0.05;update(dt*g.speed);render();
  if(GS===g&&!g.over&&!document.hidden)raf=requestAnimationFrame(loop);
}

function update(dt){
  const g=GS;g.time+=dt;
  // 문제 정답이 주 수급원. 자동 재생은 전투가 멈추지 않을 정도로만 제공한다.
  g.energy=Math.min(g.energyMax,g.energy+(2+g.towerLv.reactor*.45)*dt);
  // 본진 대포
  if(g.towerLv.cannon>0){g.cannonCool-=dt;if(g.cannonCool<=0){const enemies=g.units.filter(u=>u.side==='foe'&&!u.dead).sort((a,b)=>a.x-b.x);if(enemies.length){const lv=g.towerLv.cannon,t=enemies[0];g.shots.push({x:112,y:LANE_Y-58,target:t,tx:t.x,ty:t.y,spd:330,dmg:[0,22,34,48][lv],side:'my',splash:[0,42,50,60][lv],color:'#67e8f9',kind:'cannon',ang:0});g.cannonCool=[0,4.5,3.6,2.8][lv];sfx.cannon();}else g.cannonCool=.35;}}
  // 병력을 무작정 쌓아 밀어붙일 때만 적 성채가 선두를 견제한다. 소수 정예·강화 플레이는 불이익이 없다.
  const myAlive=g.units.filter(u=>u.side==='my'&&!u.dead),foeAlive=g.units.filter(u=>u.side==='foe'&&!u.dead);
  if(g.foeHP>0&&myAlive.length-foeAlive.length>=4){g.foeFortCool-=dt;if(g.foeFortCool<=0){const t=myAlive.sort((a,b)=>b.x-a.x)[0];g.shots.push({x:FOEBASE.x-20,y:LANE_Y-62,target:t,tx:t.x,ty:t.y,spd:360,dmg:10+g.stage*2,side:'foe',color:'#fb7185',kind:'fort',ang:0});g.foeFortCool=Math.max(2.2,3.4-g.stage*.05);if(!g.fortWarned){g.fortWarned=true;banner('⚠️ 병력이 몰리면 적 성채가 포격합니다!');}sfx.fort();}}else g.foeFortCool=Math.min(2.6,g.foeFortCool+dt*.5);
  // 적 스폰
  if(g.foeHP>0){g.foeSpawnT-=dt;if(g.foeSpawnT<=0){let key;if(g.stage%5===0&&!g.bossSpawned)key='e_knight';else key=foePick(g.stage);const spawned=spawnUnit('foe',key);if(spawned&&key==='e_knight')g.bossSpawned=true;g.foeSpawnT=spawned?foeSpawnInterval(g.stage):.45;}}
  for(const u of g.units)u.engaged=0;
  // 유닛 처리
  for(const u of g.units){
    if(u.dead){u.fade-=dt*2.2;continue;}
    u.animT+=dt;if(u.animLock>0)u.animLock=Math.max(0,u.animLock-dt);
    let desiredAnim='idle';
    if(u.lunge>0)u.lunge-=dt;
    // 타겟: 진행방향 앞의 가장 가까운 적 유닛
    const dir=u.side==='my'?1:-1;
    let tgt=null,td=1e9;
    for(const e of g.units){if(e.dead||e.side===u.side)continue;const d=(e.x-u.x)*dir;if(d>=-12&&d<td){td=d;tgt=e;}}
    const inRange=tgt&&Math.abs(tgt.x-u.x)<=u.range;
    let friendGap=1e9;for(const f of g.units){if(f===u||f.dead||f.side!==u.side)continue;const d=(f.x-u.x)*dir;if(d>0&&d<friendGap)friendGap=d;}
    const blockedByFriend=friendGap<46;
    // 기지 135px 전부터 공성 대형을 고정한다. 후방 병력이 매 프레임 다시 전진하는 진동을 막는다.
    if(u.side==='my'&&u.x>=FOEBASE.x-135)u.siege='foe';
    if(u.side==='foe'&&u.x<=MYBASE.x+135)u.siege='my';
    const nearFoeBase = u.side==='my' && u.siege==='foe' && (!tgt||td>u.range);
    const nearMyBase  = u.side==='foe' && u.siege==='my' && (!tgt||td>u.range);
    if(inRange){
      if(!u.ranged&&tgt.engaged>=FRONTLINE_LIMIT)continue;
      tgt.engaged++;u.cool-=dt;
      if(u.cool<=0){u.cool=u.atkSpd;u.lunge=.16;setUnitAnim(u,'attack',.34);attack(u,tgt);}
    }else if(nearFoeBase||nearMyBase){
      const siegeTarget=u.side==='my'?'foe':'my';
      const contenders=g.units.filter(v=>!v.dead&&v.side===u.side&&v.siege===siegeTarget).sort((a,b)=>a.id-b.id);
      const slot=contenders.indexOf(u);
      if(slot<BASE_ATTACKER_LIMIT){const attackX=u.side==='my'?FOEBASE.x-26:MYBASE.x+26,diff=attackX-u.x;if(Math.abs(diff)>3){u.x+=Math.sign(diff)*Math.min(Math.abs(diff),u.speed*dt);desiredAnim='run';}else{u.cool-=dt;if(u.cool<=0){u.cool=u.atkSpd;u.lunge=.16;setUnitAnim(u,'attack',.34);hitBase(u);}}}
      else{const hold=u.side==='my'?FOEBASE.x-92-(slot-2)*50:MYBASE.x+92+(slot-2)*50;u.x+=(hold-u.x)*Math.min(1,dt*6);}
    }else{
      if(!blockedByFriend){u.x+=dir*u.speed*dt;desiredAnim='run';}
      u.ft+=dt;
    }
    if(u.animLock<=0)setUnitAnim(u,desiredAnim);
  }
  // 발사체
  for(const s of g.shots){
    if(s.done)continue;
    const tg=s.target;
    const ax=(tg&&!tg.dead)?tg.x:s.tx, ay=(tg&&!tg.dead)?tg.y:s.ty;
    const ang=Math.atan2(ay-s.y,ax-s.x);s.ang=ang;
    s.x+=Math.cos(ang)*s.spd*dt;s.y+=Math.sin(ang)*s.spd*dt;
    if(Math.hypot(ax-s.x,ay-s.y)<12){s.done=true;
      if(s.splash){for(const e of g.units){if(e.dead||e.side===s.side)continue;if(Math.hypot(e.x-s.x,e.y-s.y)<=s.splash)hurt(e,s.dmg);}}
      else if(tg&&!tg.dead)hurt(tg,s.dmg);
      addFx(s.x,s.y,s.color||'#fff');
    }
  }
  for(const f of g.floats){f.life-=dt;f.y-=20*dt;}
  for(const f of g.fxs){f.t-=dt;}
  g.units=g.units.filter(u=>!u.dead||u.fade>0);
  g.shots=g.shots.filter(s=>!s.done);
  g.floats=g.floats.filter(f=>f.life>0);
  g.fxs=g.fxs.filter(f=>f.t>0);
  // 승패
  if(g.foeHP<=0 && !g.units.some(u=>u.side==='foe'&&!u.dead) && !g.stageClearing){
    g.stageClearing=true;
    banner('✅ 스테이지 '+g.stage+' 돌파!');sfx.stage();
    g.myHP=Math.min(g.myHPMax,g.myHP+15);g.energy=Math.min(g.energyMax,g.energy+15);trimSurvivors();
    runLater(()=>{if(!GS.over){g.stageClearing=false;startStage(g.stage+1);}},1600,g.runId);
  }
  if(g.myHP<=0&&!g.over)gameOver();
}

function trimSurvivors(){
  const g=GS;const keep=g.units.filter(u=>u.side==='my'&&!u.dead).sort((a,b)=>(b.level-a.level)||((b.hp/b.maxHp)-(a.hp/a.maxHp))).slice(0,3);
  keep.forEach((u,i)=>{u.x=MYBASE.x+48+i*55;u.y=LANE_Y+(i-1)*18;u.hp=Math.max(u.hp,Math.round(u.maxHp*.7));u.cool=.4;u.siege=null;});
  g.units=keep;g.shots=[];updateHud();
}

function attack(u,tgt){
  const g=GS;
  if(u.ranged){
    g.shots.push({x:u.x,y:u.y-14,target:tgt,tx:tgt.x,ty:tgt.y,spd:380,dmg:u.dmg,side:u.side,splash:u.splash,color:u.def.pcolor,ang:0});
    sfx.arrow();
  }else{hurt(tgt,u.dmg);addFx((u.x+tgt.x)/2,(u.y+tgt.y)/2-8,'#fde68a');sfx.hit();}
}
function hitBase(u){
  const g=GS;
  if(u.side==='my'){const siegeMul=u.ranged ? .55 : .78;g.foeHP=Math.max(0,g.foeHP-Math.max(1,Math.round(u.dmg*siegeMul)));addFx(FOEBASE.x,LANE_Y-30,'#fca5a5');}
  else{g.myHP=Math.max(0,g.myHP-u.dmg);addFx(MYBASE.x,LANE_Y-30,'#fca5a5');}
  sfx.baseHit();updateHud();
}
function hurt(u,dmg){
  if(u.dead)return;u.hp-=dmg;setUnitAnim(u,'hurt',.28);
  if(u.hp<=0){u.dead=true;u.fade=1;sfx.die();
    if(u.side==='foe'){const e=u.def.boss?8:3;GS.energy=Math.min(GS.energyMax,GS.energy+e);addFloat(u.x,u.y-22,'⚡+'+e,'#fde68a');}
  }
}
function addFloat(x,y,txt,c){GS.floats.push({x,y,txt,color:c,life:0.85});}
function addFx(x,y,c){GS.fxs.push({x,y,color:c,t:0.22});}

// ── 렌더 ──
function render(){
  const g=GS;fx.clearRect(0,0,FW,FH);fx.drawImage(bgCanvas,0,0);
  drawBase(MYBASE.x+30,'#60a5fa',g.myHP/g.myHPMax);
  drawBase(FOEBASE.x-30,'#f87171',g.foeHPMax?g.foeHP/g.foeHPMax:0);
  if(g.towerLv.cannon>0&&IMG.cannon){const pulse=1+Math.sin(g.time*4)*.015;fx.save();fx.translate(110,LANE_Y-2);fx.scale(pulse,pulse);fx.drawImage(IMG.cannon,-61,-112,122,122);fx.restore();fx.fillStyle='#fde68a';fx.font='900 12px Noto Sans KR';fx.fillText('대포 Lv.'+g.towerLv.cannon,110,LANE_Y+21);}
  // 유닛 (y순 정렬로 겹침 자연스럽게)
  const us=g.units.slice().sort((a,b)=>a.y-b.y);
  for(const u of us)drawUnit(u);
  // 발사체
  for(const s of g.shots){fx.save();fx.shadowColor=s.color||'#fde68a';fx.shadowBlur=s.kind==='cannon'||s.kind==='fort'?12:5;fx.beginPath();fx.arc(s.x,s.y,s.kind==='cannon'?7:s.kind==='fort'?6:4,0,Math.PI*2);fx.fillStyle=s.color||'#fde68a';fx.fill();fx.strokeStyle='rgba(255,255,255,.75)';fx.lineWidth=1.5;fx.stroke();fx.restore();}
  // 타격 FX
  for(const f of g.fxs){const a=f.t/0.22;fx.globalAlpha=a;fx.fillStyle=f.color;fx.beginPath();fx.arc(f.x,f.y,3+(1-a)*9,0,Math.PI*2);fx.fill();fx.globalAlpha=1;}
  // 플로팅 텍스트
  fx.font='800 13px Noto Sans KR, sans-serif';fx.textAlign='center';
  for(const f of g.floats){fx.globalAlpha=Math.min(1,f.life/0.5);fx.fillStyle=f.color;fx.fillText(f.txt,f.x,f.y);}
  fx.globalAlpha=1;
}
function drawBase(x,color,hpRatio){
  const bw=78;fx.fillStyle='rgba(0,0,0,.62)';fx.fillRect(x-bw/2,LANE_Y+14,bw,9);
  fx.fillStyle=color;fx.fillRect(x-bw/2,LANE_Y+14,bw*Math.max(0,hpRatio),7);
  fx.strokeStyle='rgba(255,255,255,.65)';fx.lineWidth=1;fx.strokeRect(x-bw/2,LANE_Y+14,bw,9);
}
function drawUnit(u){
  const img=IMG[u.key];
  const levelScale=u.side==='my'?1+(u.level-1)*.055:1;
  const sheet=IMG.sprites&&IMG.sprites[u.key]&&IMG.sprites[u.key][u.anim];
  const dh=u.def.drawH*levelScale*(sheet?(u.def.spriteScale||1):1),dw=sheet?dh:img?dh*(img.width/img.height):dh*.72;
  let dx=u.x, dy=u.y;
  const bob=u.dead?0:Math.sin((u.ft*8)+(u.id||0))*(u.lunge>0?.6:.9);dy+=bob;
  if(u.lunge>0){const dir=u.side==='my'?1:-1;dx+=dir*8*(u.lunge/.16);}
  fx.save();fx.globalAlpha=u.dead?Math.max(0,u.fade):1;
  fx.translate(dx,dy);
  if(u.dead){fx.rotate((1-u.fade)*0.5);fx.globalAlpha=Math.max(0,u.fade)*0.9;}
  fx.fillStyle='rgba(0,0,0,.32)';fx.beginPath();fx.ellipse(0,7,dw*.25,5,0,0,Math.PI*2);fx.fill();
  if(u.side==='my'&&u.level>=2){fx.shadowColor=u.level===3?'#fbbf24':'#7dd3fc';fx.shadowBlur=u.level===3?16:8;}
  if(sheet){const loop=u.anim==='idle'||u.anim==='run',raw=Math.floor(u.animT*(u.anim==='run'?11:10)),frame=loop?raw%4:Math.min(3,raw);fx.drawImage(sheet,frame*SPRITE_FRAME,0,SPRITE_FRAME,SPRITE_FRAME,-dw/2,-dh+10,dw,dh);}
  else if(img)fx.drawImage(img,0,0,img.width,img.height,-dw/2,-dh+10,dw,dh);
  else{fx.fillStyle=u.side==='my'?'#38bdf8':'#f87171';fx.beginPath();fx.arc(0,-dh*.38,Math.max(12,dw*.42),0,Math.PI*2);fx.fill();fx.fillStyle='#fff';fx.font=`900 ${Math.max(14,dw*.42)}px sans-serif`;fx.textAlign='center';fx.fillText(u.side==='my'?(u.def.emoji||'⚔️'):'👾',0,-dh*.29);}
  fx.restore();
  // HP 바
  if(!u.dead&&u.hp<u.maxHp){const bw=dw*0.7;fx.fillStyle='rgba(0,0,0,.55)';fx.fillRect(u.x-bw/2,u.y-dh+4,bw,3);
    fx.fillStyle=u.side==='my'?'#4ade80':'#f87171';fx.fillRect(u.x-bw/2,u.y-dh+4,bw*Math.max(0,u.hp/u.maxHp),3);}
}

// ── 문제 ──
function nextQuestion(){
  const g=GS;if(g.qi>=g.qseq.length){g.qseq=shuffled(g.pool);g.qi=0;}
  const q=g.qseq[g.qi++];g.cur=q;g.locked=false;
  $('q-unit').textContent=q.unitLabel.split('·')[0].trim();
  $('q-unit').style.background=q.unitColor?q.unitColor+'33':'';
  $('q-eng').innerHTML=q.eng.replace(/_{2,}/g,'<b>____</b>');
  $('q-kor').textContent=q.kor;$('q-reward').textContent='';
  const box=$('opts');box.innerHTML='';
  shuffled(q.opts).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>answer(b,o);box.appendChild(b);});
}
function answer(btn,val){
  const g=GS;if(!g||g.over||g.locked)return;g.locked=true;
  const correct=val===g.cur.ans;g.total++;
  [...document.querySelectorAll('.opt')].forEach(b=>{b.disabled=true;if(b.textContent===g.cur.ans)b.classList.add('ok');else if(b===btn)b.classList.add('ng');});
  if(correct){
    g.combo++;g.correct++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    const gain=16+Math.min(8,Math.floor(g.combo/3)*2);
    g.energy=Math.min(g.energyMax,g.energy+gain);sfx.ok();
    $('q-reward').innerHTML='⚡+'+gain+(g.combo>=3?' <span style="color:#fde68a">'+g.combo+'콤보!</span>':'');
  }else{g.combo=0;sfx.ng();$('q-reward').innerHTML='<span style="color:#fca5a5">정답: '+g.cur.ans+'</span>';}
  updateHud();
  runLater(()=>{if(!GS.over)nextQuestion();},correct?550:1250,g.runId);
}

function updateHud(){
  const g=GS;
  $('stage-chip').textContent='🏰 '+g.stage;
  const pct=g.energy/g.energyMax*100;
  $('energy-fill').style.width=pct+'%';$('energy-txt').textContent='⚡'+Math.floor(g.energy);
  const cb=$('q-combo');if(g.combo>=3){cb.style.display='inline';cb.textContent='🔥 '+g.combo+' 콤보';}else cb.style.display='none';
  updateUpgradeUI();
}
let bannerT=0;
function banner(t){const b=$('wave-banner');b.textContent=t;b.classList.add('show');cancelRunTimer(bannerT);bannerT=runLater(()=>{b.classList.remove('show');bannerT=0;},1400);}

function gameOver(){
  const g=GS;if(g.over)return;g.over=true;
  stopLoop();clearRunTimers();
  const reached=g.stage;const bKey=bestKey(g.scope);const prev=loadRec(bKey);
  const isNew=!prev||reached>prev.stage;if(isNew)saveRec(bKey,{stage:reached});
  $('res-icon').textContent=reached>=12?'👑':reached>=6?'🏆':'🛡️';
  $('res-stage').textContent=reached;
  $('res-sub').textContent='본진이 함락됐다… 다시 진격!';
  $('res-new-wrap').innerHTML=isNew?'<div class="res-new">🎉 최고 기록!</div>':'';
  const best=loadRec(bKey);const acc=g.total?Math.round(g.correct/g.total*100):0;
  $('res-best').innerHTML='📊 정답률 '+acc+'% ('+g.correct+'/'+g.total+') · 🔥최다 '+g.maxCombo+'콤보<br>🏆 내 최고: '+(best?best.stage+' 스테이지':'-');
  sfx.over();bgmStop();runLater(()=>$('result').style.display='flex',500,g.runId);
}
$('btn-retry').onclick=()=>requestRun(GS.scope);
$('spd-btn').onclick=()=>{if(!GS||GS.over)return;GS.speed=GS.speed===1?2:1;$('spd-btn').textContent=GS.speed===2?'▶▶ 2x':'▶ 1x';};
$('bgm-btn').onclick=()=>{if(bgmOn&&bgmNeedsGesture){bgmPlay();return;}bgmOn=!bgmOn;localStorage.setItem('egmGR.bgm',bgmOn?'on':'off');bgmNeedsGesture=false;syncAudioButtons();if(bgmOn&&GS&&!GS.over)bgmPlay();else bgm.pause();};
$('sfx-btn').onclick=()=>{sfxOn=!sfxOn;localStorage.setItem('egmGR.sfx',sfxOn?'on':'off');syncAudioButtons();if(sfxOn)sfx.coin();};
syncAudioButtons();

// 재생 정책으로 막힌 경우 다음 실제 터치에서 다시 시도한다.
window.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#bgm-btn'))return;if(bgmNeedsGesture&&bgmOn&&(starting||(GS&&!GS.over)))bgmPlay();},{capture:true});
function resumeActiveRun(){if(!GS||GS.over||$('game').style.display!=='flex')return;startLoop();if(bgmOn)bgmPlay();}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopLoop();bgm.pause();}else resumeActiveRun();});
window.addEventListener('pagehide',()=>{stopLoop();bgm.pause();});
window.addEventListener('pageshow',()=>{if(!document.hidden)resumeActiveRun();});

// ── 게이트 ──
let gateScope='all';
{const _u=new URLSearchParams(location.search).get('unit');if(_u&&_u!=='all'&&GAME_QUESTIONS[_u])gateScope=_u;}
const UNIT_KEYS=Object.keys(GAME_QUESTIONS).filter(k=>k!=='all');
function buildUnitChips(){UNIT_KEYS.forEach(k=>{const grid=k.startsWith('g1')?$('up-grid-g1'):$('up-grid-g2');const b=document.createElement('button');b.className='uchip';b.dataset.key=k;b.textContent=GAME_QUESTIONS[k].label.split('·')[0].trim().replace(/^중[12]\s*/,'');b.onclick=()=>{gateScope=k;refreshGate();};grid.appendChild(b);});}
function refreshGate(){
  const um=gateScope!=='all';
  $('card-all').classList.toggle('on',!um);$('card-unit').classList.toggle('on',um);$('unit-pick').classList.toggle('show',um);
  [...document.querySelectorAll('.uchip')].forEach(c=>c.classList.toggle('on',c.dataset.key===gateScope));
  const ba=loadRec(bestKey('all'));$('best-all').textContent=ba?'최고 '+ba.stage+'스테이지':'';
  const bu=loadRec(bestKey(um?gateScope:'all'));$('best-unit').textContent=um&&bu?'최고 '+bu.stage+'스테이지':'';
  if(um)$('unit-desc').textContent=GAME_QUESTIONS[gateScope].label+' 문제로 진격전.';
}
$('card-all').onclick=()=>{gateScope='all';refreshGate();};
$('card-unit').onclick=()=>{if(gateScope==='all')gateScope=UNIT_KEYS[0];refreshGate();};
$('gate-go').onclick=()=>requestRun(gateScope);
buildUnitChips();refreshGate();
</script>
