<style>

@keyframes pulse{50%{opacity:.48}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:5px 4px;text-align:center}.stat b{display:block;color:#f8fafc;font-size:.82rem;font-weight:900}.stat span{display:block;color:#94a3b8;font-size:.53rem;font-weight:900;letter-spacing:.4px;margin-top:1px}

.board-wrap{padding:0 14px;position:relative}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:100%;aspect-ratio:1;padding:7px;border-radius:19px;background:rgba(2,8,23,.78);border:1px solid rgba(103,232,249,.2);box-shadow:inset 0 0 24px rgba(0,0,0,.42),0 18px 36px rgba(0,0,0,.25)}
.cell{border:0;border-radius:6px;background:linear-gradient(145deg,#13284c,#0b1b38);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);cursor:pointer;min-width:0;transition:transform .08s,filter .12s}.cell:hover{filter:brightness(1.2)}.cell.filled{background:linear-gradient(145deg,var(--block-hi),var(--block));box-shadow:inset 0 3px 4px rgba(255,255,255,.3),0 0 10px color-mix(in srgb,var(--block) 35%,transparent)}.cell.preview{background:color-mix(in srgb,var(--preview) 60%,#fff);transform:scale(.9)}.cell.bad{animation:bad .22s 2}@keyframes bad{50%{transform:translateX(3px);background:#7f1d1d}}
.cell.placed{animation:block-land .28s cubic-bezier(.2,1.7,.45,1)}@keyframes block-land{0%{transform:scale(.38);filter:brightness(1.8)}68%{transform:scale(1.16)}100%{transform:scale(1)}}
.board.bonk{animation:board-bonk .2s ease-out}@keyframes board-bonk{35%{transform:scale(.985)}70%{transform:scale(1.008)}}
.impact-layer{position:absolute;inset:0 14px;overflow:hidden;border-radius:19px;pointer-events:none;z-index:4}.impact-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--dot);box-shadow:0 0 8px var(--dot);animation:impact-pop .48s ease-out forwards}@keyframes impact-pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.35)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.25)}}
.blast-flash{position:absolute;inset:0 14px;border-radius:19px;pointer-events:none;opacity:0;background:radial-gradient(circle,#fef08a 0,rgba(34,211,238,.65) 24%,transparent 67%)}.blast-flash.on{animation:blast .72s ease-out}@keyframes blast{0%{opacity:0;transform:scale(.7)}35%{opacity:1}100%{opacity:0;transform:scale(1.13)}}
.tray-title{display:flex;align-items:center;justify-content:space-between;padding:11px 17px 7px}.tray-title strong{font-family:'Jua','Noto Sans KR',sans-serif;font-size:.92rem;font-weight:400}.tray-title span{font-size:.58rem;color:#94a3b8;font-weight:900}.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}.piece{min-height:86px;border-radius:16px;border:1px solid rgba(148,163,184,.17);background:linear-gradient(150deg,#0e2347,#08162f);cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .15s,border-color .15s,opacity .15s}.piece.on{transform:translateY(-4px);border-color:var(--piece);box-shadow:0 9px 20px color-mix(in srgb,var(--piece) 24%,transparent)}.piece.used{opacity:.18;pointer-events:none}.piece small{position:absolute;right:8px;bottom:6px;font-size:.5rem;color:#94a3b8}.mini{display:grid;gap:3px}.mini i{display:block;width:14px;height:14px;border-radius:4px;background:linear-gradient(145deg,var(--piece-hi),var(--piece));box-shadow:inset 0 2px 3px rgba(255,255,255,.3)}
.tip{text-align:center;color:#64748b;font-size:.62rem;font-weight:800;padding:0 14px 20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,25px);z-index:30;padding:10px 16px;border-radius:999px;background:#fff;color:#0f172a;font-size:.76rem;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{background:#d1fae5;color:#065f46}.toast.ng{background:#ffe4e6;color:#9f1239}
.overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.78);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.card{width:min(100%,430px);border-radius:27px;background:linear-gradient(150deg,#eff6ff,#fff 46%,#ecfdf5);color:#0f172a;padding:22px 18px;box-shadow:0 28px 70px rgba(0,0,0,.52),0 0 34px rgba(52,211,153,.2);border:2px solid rgba(110,231,183,.75);animation:pop .22s cubic-bezier(.2,1.5,.5,1)}@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.challenge-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.challenge-head h2{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:1.28rem;color:#064e3b}.challenge-time{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#07142d;color:#fde68a;font-weight:900;font-size:1.05rem}

.end-card{text-align:center}.end-emoji{font-size:3.2rem}.end-card h2{font-family:'Jua','Noto Sans KR',sans-serif;font-size:1.6rem;font-weight:400;color:#0f3b5e}.final-score{font-size:2.2rem;color:#7c3aed;font-weight:900;margin:9px}.end-sub{font-size:.8rem;color:#64748b;font-weight:800;line-height:1.6}.end-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.end-actions button{border:0;border-radius:14px;padding:12px;font-weight:900;cursor:pointer}.again{background:#10b981;color:#fff}.home{background:#e2e8f0;color:#334155}

.board-wrap{padding:0 18px}.board{gap:4px;padding:7px;border-radius:12px;background:#0d376d;border:0;box-shadow:inset 0 2px 10px rgba(3,23,53,.46),0 5px 0 rgba(7,35,74,.28)}
.cell{border-radius:5px;background:#245c99;box-shadow:inset 0 2px 2px rgba(255,255,255,.07)}.cell.filled{border-radius:5px;box-shadow:inset 0 4px 4px rgba(255,255,255,.34),inset 0 -3px 3px rgba(3,23,53,.14),0 2px 2px rgba(5,30,66,.24)}.cell.preview{transform:none;filter:brightness(1.28)}

<body>
<main class="app">
  <header class="top">
    <div class="top-row">
      <button class="back" onclick="location.href='../game/'">← 메뉴</button>
      <div class="score-head"><small>SCORE</small><b id="score">0</b></div>
      <div class="audio-tools"><button class="audio-btn" id="music-btn" aria-label="배경음악 켜기 또는 끄기">🎵</button><button class="audio-btn" id="sfx-btn" aria-label="효과음 켜기 또는 끄기">💥</button><div class="time" id="time">5:00</div></div>
    </div>
    <div class="brand"><small>SENTENCE BLAST</small></div>
    <div class="stats">
      <div class="stat"><b id="lines">0</b><span>LINES</span></div>
      <div class="stat"><b id="combo">0</b><span>COMBO</span></div>
      <div class="stat"><b id="grammar">0/0</b><span>GRAMMAR</span></div>
    </div>
  </header>
  <div class="phase"><div class="phase-fill" id="phase-fill"></div><span class="phase-label" id="phase-label">문장 챌린지까지 45초</span></div>
  <section class="mission"><strong id="unit-label">블록을 채워 줄을 지워요</strong><span>45초 집중 플레이<br>문제 시간은 차감되지 않아요</span></section>
  <section class="board-wrap"><div class="board" id="board" aria-label="8×8 블록 보드"></div><div class="impact-layer" id="impact-layer"></div><div class="blast-flash" id="blast-flash"></div></section>
  <div class="tray-title"><strong>BLOCKS</strong><span>블록을 끌어 보드에 놓으세요</span></div>
  <section class="tray" id="tray"></section>
  <p class="tip">놓을 곳이 없어도 보드 구조대가 자동으로 도와줘요.</p>
</main>

<div class="toast" id="toast"></div>

<div class="overlay" id="challenge">
  <section class="card">
    <div class="challenge-head"><h2>Sentence Challenge</h2><div class="challenge-time" id="challenge-time">10</div></div>
    <div class="kor" id="challenge-kor"></div>
    <div class="guide">단어를 차례로 눌러 문장을 완성하세요.</div>
    <div class="answer-zone" id="answer-zone"></div>
    <div class="chips" id="chips"></div>
    <div class="challenge-actions"><button class="check" id="check-btn">BLAST</button><button class="reset" id="reset-btn">다시</button></div>
    <div class="feedback" id="feedback"></div>
  </section>
</div>

<div class="overlay" id="gameover">
  <section class="card end-card">
    <div class="end-emoji">🏆</div><h2>Sentence Blast 완료!</h2>
    <div class="final-score" id="final-score">0점</div>
    <div class="end-sub" id="end-sub"></div>
    <div class="end-actions"><button class="again" onclick="location.reload()">한 판 더</button><button class="home" onclick="location.href='../game/'">메뉴</button></div>
  </section>
</div>

<script>
'use strict';
const SIZE=8, PLAY_PHASE_SECONDS=45, CHALLENGE_SECONDS=10;
const COLORS=[['#0891b2','#67e8f9'],['#2563eb','#93c5fd'],['#7c3aed','#c4b5fd'],['#db2777','#f9a8d4'],['#ea580c','#fdba74'],['#059669','#6ee7b7'],['#ca8a04','#fde047']];
const SHAPES=[
  {n:'1',c:[[0,0]]},{n:'2',c:[[0,0],[0,1]]},{n:'3',c:[[0,0],[0,1],[0,2]]},{n:'4',c:[[0,0],[0,1],[0,2],[0,3]]},
  {n:'세로2',c:[[0,0],[1,0]]},{n:'세로3',c:[[0,0],[1,0],[2,0]]},{n:'네모',c:[[0,0],[0,1],[1,0],[1,1]]},
  {n:'L',c:[[0,0],[1,0],[1,1]]},{n:'큰L',c:[[0,0],[1,0],[2,0],[2,1]]},{n:'T',c:[[0,0],[0,1],[0,2],[1,1]]},
  {n:'지그재그',c:[[0,1],[0,2],[1,0],[1,1]]}
];
const params=new URLSearchParams(location.search);
const requestedUnitKey=params.get('unit')||'all';
const unitKey=GAME_QUESTIONS[requestedUnitKey]?requestedUnitKey:'all';
const duration=Math.max(60,Math.min(600,Number(params.get('seconds'))||300));
let remaining=duration, phaseRemaining=PLAY_PHASE_SECONDS, phase='play';
let board=Array(SIZE*SIZE).fill(null), tray=[], selected=-1;
let score=0, lines=0, combo=0, bestCombo=0, grammarCorrect=0, grammarTotal=0;
let challengeLeft=CHALLENGE_SECONDS, currentQuestion=null, currentSentence='', chosen=[], locked=false, timerId=null, dragState=null;
const usedSentenceIds=new Set();

const $=id=>document.getElementById(id);
const units=Object.entries(GAME_QUESTIONS).filter(([k])=>k!=='all');
const unit=GAME_QUESTIONS[unitKey]||GAME_QUESTIONS.all;
const rawQuestions=unitKey==='all'?units.flatMap(([,u])=>u.questions):unit.questions;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function formatTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg,type=''){const t=$('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(t._id);t._id=setTimeout(()=>t.className='toast',1500)}

// 원본 게임 음원을 복제하지 않고 Web Audio로 만든 짧은 버블 계열 효과와 루프입니다.
let audioCtx=null,musicTimer=null,musicStep=0;
const oldAudio=localStorage.getItem('mgSentenceBlast.audio');
let musicOn=localStorage.getItem('mgSentenceBlast.music')!=='off'&&oldAudio!=='off';
let sfxOn=localStorage.getItem('mgSentenceBlast.sfx')!=='off'&&oldAudio!=='off';
function getAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}
function gameTone(freq,dur,type='sine',vol=.04,delay=0,endFreq=0,channel='sfx'){if(channel==='music'?!musicOn:!sfxOn)return;const c=getAudio();if(!c)return;const at=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,at+dur);g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.001,at+dur);o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+dur+.02)}
function gameNoise(dur=.08,vol=.035,cut=1000){if(!sfxOn)return;const c=getAudio();if(!c)return;const b=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);src.connect(f);f.connect(g);g.connect(c.destination);src.start();src.stop(c.currentTime+dur+.02)}
const gameSfx={
  place(n=1){gameTone(190+n*12,.105,'sine',.055,0,420+n*18);gameTone(520+n*15,.075,'triangle',.035,.055,720+n*15);gameNoise(.045,.022,720);},
  bad(){gameTone(130,.12,'square',.045,0,88);},
  line(comboN,count){gameNoise(.14,.075,920);gameTone(105,.18,'sawtooth',.09,0,58);for(let i=0;i<Math.min(5,2+count+comboN);i++)gameTone(580+i*95,.09,'triangle',.05,.035+i*.045,820+i*100);},
  rescue(){[330,440,550].forEach((f,i)=>gameTone(f,.13,'sine',.045,i*.07));},
  grammar(ok){if(ok){[523,659,784,1047].forEach((f,i)=>gameTone(f,.13,'triangle',.055,i*.075));}else{gameTone(210,.17,'sawtooth',.05,0,135);}},
  blast(){gameNoise(.24,.11,1200);gameTone(115,.3,'sawtooth',.12,0,42);gameTone(720,.22,'triangle',.06,.08,1180);},
  finish(){[392,523,659,784,1047].forEach((f,i)=>gameTone(f,.16,'triangle',.055,i*.085));}
};
function musicTick(){if(!musicOn||phase==='over')return;const notes=[220,277,330,415,330,277,247,330],f=notes[musicStep++%notes.length];gameTone(f,.24,'sine',.012,0,0,'music');if(musicStep%4===1)gameTone(110,.18,'triangle',.011,0,0,'music')}
function startMusic(){if(!musicOn||musicTimer)return;getAudio();musicTick();musicTimer=setInterval(musicTick,310)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function syncAudio(){const mb=$('music-btn'),sb=$('sfx-btn');mb.textContent=musicOn?'🎵':'🎵×';sb.textContent=sfxOn?'💥':'💥×';mb.classList.toggle('off',!musicOn);sb.classList.toggle('off',!sfxOn)}
$('music-btn').onclick=()=>{musicOn=!musicOn;localStorage.setItem('mgSentenceBlast.music',musicOn?'on':'off');syncAudio();if(musicOn)startMusic();else stopMusic()};
$('sfx-btn').onclick=()=>{sfxOn=!sfxOn;localStorage.setItem('mgSentenceBlast.sfx',sfxOn?'on':'off');syncAudio();if(sfxOn)gameSfx.place(2)};
window.addEventListener('pointerdown',()=>startMusic(),{once:true,capture:true});syncAudio();

function sentenceFor(q){
  if(!q||q.ans==='O'||q.ans==='X')return '';
  const eng=String(q.eng||'').trim();
  const ans=String(q.ans||'').trim();
  if(/_{2,}/.test(eng))return eng.replace(/_{2,}/,ans);
  if(/^[A-Za-z]/.test(ans)&&ans.split(/\s+/).length>=3)return ans;
  if(/^[A-Za-z]/.test(eng)&&eng.split(/\s+/).length>=3)return eng;
  return '';
}
const sentenceQuestions=rawQuestions.filter(q=>{
  const s=sentenceFor(q),n=s.split(/\s+/).length,kor=String(q.kor||'');
  const cleanSentence=n>=3&&n<=13&&!/[가-힣]|→|[()]|_{2,}/.test(s);
  const cleanGuide=!/^오류\s*수정/.test(kor)&&!kor.includes('👉');
  return cleanSentence&&cleanGuide;
});

function renderBoard(highlight=[]){
  const fresh=new Set(highlight);
  const el=$('board');el.innerHTML='';
  board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(v!==null?' filled':'')+(fresh.has(i)?' placed':'');b.dataset.i=i;b.setAttribute('aria-label',(Math.floor(i/SIZE)+1)+'행 '+(i%SIZE+1)+'열');if(v!==null){b.style.setProperty('--block',COLORS[v][0]);b.style.setProperty('--block-hi',COLORS[v][1])}b.onclick=()=>placeAt(i);b.onmouseenter=()=>previewAt(i);b.onmouseleave=clearPreview;el.appendChild(b)});
}
function impactAt(indices,color,strong=false){const boardEl=$('board'),layer=$('impact-layer'),rect=boardEl.getBoundingClientRect(),cell=rect.width/SIZE;boardEl.classList.remove('bonk');void boardEl.offsetWidth;boardEl.classList.add('bonk');const picks=strong?indices:indices.slice(0,6);picks.forEach((idx,k)=>{const r=Math.floor(idx/SIZE),c=idx%SIZE;for(let j=0;j<(strong?3:2);j++){const d=document.createElement('i');d.className='impact-dot';d.style.left=(c*cell+cell*.5)+'px';d.style.top=(r*cell+cell*.5)+'px';d.style.setProperty('--dot',color);const angle=(k*1.7+j*2.4),dist=(strong?38:24)+j*10;d.style.setProperty('--dx',Math.cos(angle)*dist+'px');d.style.setProperty('--dy',Math.sin(angle)*dist+'px');layer.appendChild(d);setTimeout(()=>d.remove(),520)}})}
function shapeBox(shape){const rows=Math.max(...shape.c.map(x=>x[0]))+1,cols=Math.max(...shape.c.map(x=>x[1]))+1;return{rows,cols}}
function renderTray(){
  const el=$('tray');el.innerHTML='';
  tray.forEach((item,i)=>{const box=shapeBox(item.shape),b=document.createElement('button');b.className='piece'+(selected===i?' on':'')+(item.used?' used':'');b.style.setProperty('--piece',COLORS[item.color][0]);b.style.setProperty('--piece-hi',COLORS[item.color][1]);const cells=new Set(item.shape.c.map(x=>x.join(',')));let mini='';for(let r=0;r<box.rows;r++)for(let c=0;c<box.cols;c++)mini+=cells.has(r+','+c)?'<i></i>':'<span></span>';b.innerHTML=`<div class="mini" style="grid-template-columns:repeat(${box.cols},20px)">${mini}</div><small>${esc(item.shape.n)}</small>`;b.onclick=()=>{selected=item.used?-1:i;renderTray()};b.onpointerdown=e=>startDrag(e,i);el.appendChild(b)});
}
function newTray(){tray=Array.from({length:3},()=>({shape:SHAPES[Math.floor(Math.random()*SHAPES.length)],color:Math.floor(Math.random()*COLORS.length),used:false}));selected=tray.findIndex(x=>!x.used);renderTray();setTimeout(checkMoves,0)}
function cellsFor(index,shape){const row=Math.floor(index/SIZE),col=index%SIZE;return shape.c.map(([dr,dc])=>[row+dr,col+dc]).filter(([r,c])=>r>=0&&r<SIZE&&c>=0&&c<SIZE).map(([r,c])=>r*SIZE+c)}
function canPlace(index,shape){const targets=cellsFor(index,shape);return targets.length===shape.c.length&&targets.every(i=>board[i]===null)}
function previewAt(index){clearPreview();if(phase!=='play'||selected<0||!tray[selected]||tray[selected].used)return;const item=tray[selected],targets=cellsFor(index,item.shape);targets.forEach(i=>{const c=$('board').children[i];if(c){c.classList.add(canPlace(index,item.shape)?'preview':'bad');c.style.setProperty('--preview',COLORS[item.color][0])}})}
function clearPreview(){document.querySelectorAll('.cell.preview,.cell.bad').forEach(c=>c.classList.remove('preview','bad'))}
function startDrag(e,index){
  if(phase!=='play'||!tray[index]||tray[index].used)return;
  e.preventDefault();selected=index;
  const item=tray[index],box=shapeBox(item.shape),filled=new Set(item.shape.c.map(x=>x.join(','))),ghost=document.createElement('div');
  ghost.className='drag-ghost';ghost.style.gridTemplateColumns=`repeat(${box.cols},34px)`;ghost.style.setProperty('--piece',COLORS[item.color][0]);ghost.style.setProperty('--piece-hi',COLORS[item.color][1]);
  for(let r=0;r<box.rows;r++)for(let c=0;c<box.cols;c++)ghost.innerHTML+=filled.has(r+','+c)?'<i></i>':'<span></span>';
  document.body.appendChild(ghost);dragState={index,item,box,ghost,target:-1};moveDrag(e);
  document.addEventListener('pointermove',moveDrag,{passive:false});document.addEventListener('pointerup',endDrag,{once:true});document.addEventListener('pointercancel',endDrag,{once:true});
}
function moveDrag(e){
  if(!dragState)return;e.preventDefault();const d=dragState,lift=74;d.ghost.style.left=(e.clientX-d.box.cols*17)+'px';d.ghost.style.top=(e.clientY-lift-d.box.rows*17)+'px';
  const rect=$('board').getBoundingClientRect(),cell=rect.width/SIZE,originX=e.clientX-d.box.cols*cell/2,originY=e.clientY-lift-d.box.rows*cell/2,col=Math.round((originX-rect.left)/cell),row=Math.round((originY-rect.top)/cell),index=row*SIZE+col;
  clearPreview();d.target=row>=0&&col>=0&&row<SIZE&&col<SIZE&&canPlace(index,d.item.shape)?index:-1;if(d.target>=0)previewAt(d.target);
}
function endDrag(e){
  if(!dragState)return;document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointercancel',endDrag);const d=dragState;dragState=null;d.ghost.remove();clearPreview();if(d.target>=0)placeAt(d.target);else{selected=d.index;renderTray()}
}
function placeAt(index){
  if(phase!=='play'||selected<0||!tray[selected]||tray[selected].used)return;
  const item=tray[selected];if(!canPlace(index,item.shape)){gameSfx.bad();toast('여기에는 놓을 수 없어요','ng');return}
  const targets=cellsFor(index,item.shape);targets.forEach(i=>board[i]=item.color);score+=targets.length*10;item.used=true;
  const cleared=clearLines();if(cleared.count){combo++;bestCombo=Math.max(bestCombo,combo);score+=cleared.count*100*combo;gameSfx.line(combo,cleared.count);impactAt(cleared.gone,COLORS[item.color][1],true);navigator.vibrate?.([18,22,34]);toast(combo>1?`🔥 ${combo}콤보! ${cleared.count}줄 폭발`:`💥 ${cleared.count}줄 완성!`,'ok')}else{combo=0;gameSfx.place(targets.length);impactAt(targets,COLORS[item.color][1]);navigator.vibrate?.(10)}
  selected=tray.findIndex(x=>!x.used);if(tray.every(x=>x.used))newTray();else{renderTray();checkMoves()}renderBoard(cleared.count?[]:targets);updateHUD();
}
function clearLines(){
  const fullRows=[],fullCols=[];for(let r=0;r<SIZE;r++)if(Array.from({length:SIZE},(_,c)=>board[r*SIZE+c]).every(v=>v!==null))fullRows.push(r);for(let c=0;c<SIZE;c++)if(Array.from({length:SIZE},(_,r)=>board[r*SIZE+c]).every(v=>v!==null))fullCols.push(c);
  const gone=new Set();fullRows.forEach(r=>{for(let c=0;c<SIZE;c++)gone.add(r*SIZE+c)});fullCols.forEach(c=>{for(let r=0;r<SIZE;r++)gone.add(r*SIZE+c)});gone.forEach(i=>board[i]=null);lines+=fullRows.length+fullCols.length;return{count:fullRows.length+fullCols.length,gone:[...gone]};
}
function hasAnyMove(){return tray.some(item=>!item.used&&board.some((_,i)=>canPlace(i,item.shape)))}
function checkMoves(){if(phase!=='play'||hasAnyMove())return;const filled=board.map((v,i)=>v!==null?i:null).filter(i=>i!==null);shuffle(filled).slice(0,Math.max(8,Math.ceil(filled.length*.35))).forEach(i=>board[i]=null);combo=0;gameSfx.rescue();newTray();renderBoard();updateHUD();toast('🛟 보드 구조대! 막힌 칸을 정리했어요','ok')}

function updateHUD(){
  $('score').textContent=score.toLocaleString();$('lines').textContent=lines;$('combo').textContent=combo;$('grammar').textContent=grammarCorrect+'/'+grammarTotal;$('time').textContent=formatTime(remaining);$('time').classList.toggle('crit',remaining<=20);
  const pct=Math.max(0,phaseRemaining/PLAY_PHASE_SECONDS*100);$('phase-fill').style.width=pct+'%';$('phase-label').textContent=`문장 챌린지까지 ${phaseRemaining}초`;
}
function tick(){
  if(phase==='play'){
    remaining--;phaseRemaining--;updateHUD();
    if(remaining<=0){finish();return}
    if(phaseRemaining<=0)openChallenge();
  }else if(phase==='challenge'&&!locked){challengeLeft--;$('challenge-time').textContent=challengeLeft;if(challengeLeft<=0)resolveChallenge(false,true)}
}
function openChallenge(){
  if(!sentenceQuestions.length){phaseRemaining=PLAY_PHASE_SECONDS;return}
  phase='challenge';locked=false;chosen=[];
  let pool=sentenceQuestions.filter(q=>!usedSentenceIds.has(q.id));if(!pool.length){usedSentenceIds.clear();pool=sentenceQuestions.slice()}
  if(grammarTotal<2){const intro=pool.filter(q=>Number(q.level||1)===1);if(intro.length)pool=intro}
  currentQuestion=pool[Math.floor(Math.random()*pool.length)];usedSentenceIds.add(currentQuestion.id);currentSentence=sentenceFor(currentQuestion).replace(/\s+/g,' ').trim();grammarTotal++;
  const wordCount=currentSentence.split(' ').length;challengeLeft=(wordCount<=7?12:wordCount<=10?18:24)+(Number(currentQuestion.level||1)>=2?2:0);
  $('challenge-time').textContent=challengeLeft;$('challenge-kor').textContent=currentQuestion.kor||'올바른 영어 문장을 만드세요.';$('feedback').textContent='';$('feedback').className='feedback';$('check-btn').disabled=false;$('check-btn').textContent='BLAST';$('check-btn').onclick=checkSentence;$('reset-btn').disabled=false;
  const words=currentSentence.split(' ');let shuffled=shuffle(words.map((w,i)=>({w,i})));if(shuffled.map(x=>x.w).join(' ')===currentSentence)shuffled.reverse();
  const chips=$('chips');chips.innerHTML='';shuffled.forEach(item=>{const b=document.createElement('button');b.className='word';b.textContent=item.w;b.dataset.token=item.i;b.onclick=()=>chooseWord(b,item);chips.appendChild(b)});renderChosen();$('challenge').classList.add('show');updateHUD();
}
function chooseWord(btn,item){if(locked||btn.disabled)return;chosen.push({btn,item});btn.disabled=true;renderChosen()}
function renderChosen(){const z=$('answer-zone');z.innerHTML='';chosen.forEach((entry,i)=>{const b=document.createElement('button');b.className='word';b.textContent=entry.item.w;b.onclick=()=>{if(locked)return;entry.btn.disabled=false;chosen.splice(i,1);renderChosen()};z.appendChild(b)})}
function resetWords(){if(locked)return;chosen.forEach(x=>x.btn.disabled=false);chosen=[];renderChosen()}
function normalize(s){return s.trim().toLowerCase().replace(/\s+([,.!?])/g,'$1').replace(/\s+/g,' ')}
function checkSentence(){if(locked)return;const total=currentSentence.split(' ').length;if(chosen.length!==total){toast(`단어를 모두 사용하세요 (${chosen.length}/${total})`,'ng');return}resolveChallenge(normalize(chosen.map(x=>x.item.w).join(' '))===normalize(currentSentence),false)}
function resolveChallenge(correct,timedOut){
  if(locked)return;locked=true;$('check-btn').disabled=true;$('reset-btn').disabled=true;const f=$('feedback');
  if(correct){grammarCorrect++;score+=500;gameSfx.grammar(true);f.textContent='정답! 가장 막힌 가로·세로줄을 폭파합니다. +500';f.className='feedback ok';setTimeout(()=>{applyGrammarBlast();closeChallenge()},900)}
  else{
    gameSfx.grammar(false);
    const mine=chosen.length?chosen.map(x=>x.item.w).join(' '):'(완성하지 못함)';
    f.innerHTML=`${timedOut?'시간 종료':'다시 확인해요'}<br>내 문장: ${esc(mine)}<br>정답 문장: ${esc(currentSentence)}`;f.className='feedback ng';
    $('check-btn').disabled=false;$('check-btn').textContent='계속';$('check-btn').onclick=closeChallenge;
  }
  updateHUD();
}
function applyGrammarBlast(){
  const rowCounts=Array.from({length:SIZE},(_,r)=>Array.from({length:SIZE},(_,c)=>board[r*SIZE+c]).filter(v=>v!==null).length),colCounts=Array.from({length:SIZE},(_,c)=>Array.from({length:SIZE},(_,r)=>board[r*SIZE+c]).filter(v=>v!==null).length);
  const r=rowCounts.indexOf(Math.max(...rowCounts)),c=colCounts.indexOf(Math.max(...colCounts));let removed=0;for(let x=0;x<SIZE;x++){const ri=r*SIZE+x,ci=x*SIZE+c;if(board[ri]!==null){board[ri]=null;removed++}if(board[ci]!==null){board[ci]=null;removed++}}
  gameSfx.blast();navigator.vibrate?.([25,25,45]);$('blast-flash').classList.remove('on');void $('blast-flash').offsetWidth;$('blast-flash').classList.add('on');renderBoard();toast(removed?`💥 문법 폭발! ${removed}칸 제거`:'💥 완벽한 보드! 보너스 +500','ok');
}
function closeChallenge(){$('challenge').classList.remove('show');phase='play';phaseRemaining=PLAY_PHASE_SECONDS;locked=false;renderTray();checkMoves();updateHUD()}
function finish(){phase='over';clearInterval(timerId);gameSfx.finish();setTimeout(stopMusic,700);const key=`mg_sentence_blast_best_v1_${unitKey}_${duration}`;let best=0;try{const old=JSON.parse(localStorage.getItem(key)||'null');best=old&&old.score||0;if(score>best)localStorage.setItem(key,JSON.stringify({score,lines,correct:grammarCorrect,total:grammarTotal,combo:bestCombo,date:new Date().toLocaleDateString('ko-KR')}))}catch(e){}$('final-score').textContent=score.toLocaleString()+'점';$('end-sub').innerHTML=`완성한 줄 ${lines}개 · 문법 ${grammarCorrect}/${grammarTotal}<br>최고 콤보 ${bestCombo}`+(score>best?' · <strong>신기록!</strong>':'');$('gameover').classList.add('show')}

$('check-btn').onclick=checkSentence;$('reset-btn').onclick=resetWords;
$('unit-label').textContent=(unit&&unit.label?unit.label:'전체 랜덤')+' · 줄을 완성해요';
renderBoard();newTray();updateHUD();timerId=setInterval(tick,1000);
</script>
