<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>문법 타워 디펜스</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#0c1322;overflow:hidden;font-family:'Baloo 2','Noto Sans KR',sans-serif;touch-action:manipulation;color:#fff;}
button{font-family:inherit;}

/* ── 시작 게이트 ── */
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 0%,#1b2b4d,#0c1322 70%);overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
.gate-title{font-size:2.1rem;font-weight:900;text-shadow:0 0 24px rgba(56,189,248,.7);}
.gate-sub{font-size:.86rem;color:#7dd3fc;margin:8px 0 18px;text-align:center;line-height:1.7;max-width:440px;}
.mode-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:520px;}
.mode-card{width:230px;background:rgba(255,255,255,.05);border:2px solid rgba(56,189,248,.35);border-radius:18px;padding:16px;cursor:pointer;color:#fff;text-align:left;transition:transform .14s,border-color .14s,box-shadow .14s;}
.mode-card.on{border-color:#38bdf8;background:rgba(56,189,248,.16);box-shadow:0 0 22px rgba(56,189,248,.4);transform:translateY(-3px);}
.mode-card .mc-icon{font-size:1.6rem;}
.mode-card .mc-name{font-weight:900;font-size:1.05rem;margin:5px 0 3px;}
.mode-card .mc-desc{font-size:.76rem;color:#bae6fd;line-height:1.5;}
.mode-card .mc-best{margin-top:8px;font-size:.74rem;color:#fde68a;font-weight:700;}
#unit-pick{display:none;margin-top:14px;max-width:520px;width:100%;}
#unit-pick.show{display:block;}
.up-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.up-label{flex-shrink:0;width:58px;text-align:right;font-size:.74rem;font-weight:900;color:#fde68a;padding-top:8px;}
.up-grid{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.uchip{border:1.5px solid rgba(56,189,248,.4);background:rgba(255,255,255,.05);color:#bae6fd;border-radius:99px;padding:6px 12px;font-size:.76rem;font-weight:800;cursor:pointer;transition:all .12s;}
.uchip.on{background:linear-gradient(135deg,#0284c7,#38bdf8);border-color:#38bdf8;color:#fff;}
#gate-go{margin-top:20px;font-size:1.2rem;font-weight:900;color:#04210f;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:16px;padding:15px 50px;box-shadow:0 12px 30px rgba(245,158,11,.5);cursor:pointer;transition:transform .12s;}
#gate-go:active{transform:scale(.96);}
.gate-back{margin-top:14px;color:#94a3b8;font-size:.85rem;text-decoration:none;}

/* ── 게임 ── */
#game{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;}
#hud{width:100%;max-width:760px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 4px;}
.hud-chip{font-size:1rem;font-weight:900;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);border-radius:11px;padding:6px 11px;line-height:1;white-space:nowrap;}
#hp-chip{color:#fca5a5;border-color:rgba(239,68,68,.4);}
#gold-chip{color:#fde68a;border-color:rgba(251,191,36,.45);}
#wave-chip{color:#7dd3fc;border-color:rgba(56,189,248,.45);}
#best-chip2{color:#ddd6fe;font-size:.74rem;}
#bgm-btn{font-size:1rem;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 9px;cursor:pointer;}
#speed-btn{font-size:.82rem;font-weight:900;color:#fde68a;background:rgba(251,191,36,.14);border:1.5px solid rgba(251,191,36,.45);border-radius:10px;padding:6px 9px;cursor:pointer;white-space:nowrap;}

#stage-wrap{position:relative;width:100%;max-width:760px;}
#stage{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:14px;border:2px solid rgba(56,189,248,.25);background:#1a2f1c;touch-action:manipulation;}
/* 웨이브 안내 배너 */
#wave-banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);background:linear-gradient(135deg,rgba(2,132,199,.95),rgba(56,189,248,.92));padding:12px 26px;border-radius:14px;font-weight:900;font-size:1.15rem;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;border:1.5px solid rgba(255,255,255,.4);text-align:center;}
#wave-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
/* 타워 빌드 메뉴 */
#build-menu{position:absolute;display:none;z-index:8;background:rgba(12,19,34,.97);border:2px solid rgba(56,189,248,.5);border-radius:14px;padding:10px;box-shadow:0 8px 26px rgba(0,0,0,.7);width:188px;}
#build-menu.show{display:block;}
#build-menu{max-height:60vh;overflow-y:auto;}
#build-menu .bm-title{font-size:.74rem;color:#7dd3fc;font-weight:800;margin-bottom:7px;text-align:center;}
.bm-btn{width:100%;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1.5px solid rgba(251,191,36,.4);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;color:#fff;font-weight:800;font-size:.84rem;text-align:left;}
.bm-btn:disabled{opacity:.4;cursor:default;}
.bm-btn .bm-cost{margin-left:auto;color:#fde68a;font-weight:900;}
.bm-btn.sell{border-color:rgba(148,163,184,.4);}
.bm-close{width:100%;text-align:center;color:#94a3b8;font-size:.76rem;background:none;border:none;cursor:pointer;margin-top:2px;}

/* 문제 카드 */
#qcard{width:100%;max-width:760px;margin:8px auto 10px;background:linear-gradient(170deg,#10233f,#0b1830);border:2px solid #0ea5e9;border-radius:16px;padding:11px 13px 13px;box-shadow:0 6px 26px rgba(0,0,0,.6);}
#q-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
#q-unit{font-size:.64rem;font-weight:800;color:#bae6fd;background:rgba(14,165,233,.25);border-radius:7px;padding:2px 8px;}
#q-combo{font-size:.72rem;font-weight:900;color:#fde68a;margin-left:auto;display:none;}
#q-eng{font-size:1.05rem;font-weight:800;line-height:1.4;}
#q-eng b{color:#fde68a;}
#q-kor{font-size:.8rem;color:#93c5fd;margin:3px 0 9px;}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.opt{background:rgba(255,255,255,.06);border:2px solid rgba(56,189,248,.32);border-radius:11px;padding:11px 9px;font-size:.96rem;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s,border-color .1s;}
.opt:active{transform:scale(.97);}
.opt.ok{background:rgba(34,197,94,.3);border-color:#22c55e;}
.opt.ng{background:rgba(239,68,68,.3);border-color:#ef4444;animation:shake .35s;}
.opt:disabled{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#q-reward{text-align:center;font-size:.8rem;font-weight:800;color:#86efac;margin-top:8px;min-height:1em;}

/* 결과 */
#result{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(4,8,18,.92);}
.res-card{text-align:center;padding:28px 30px 24px;background:linear-gradient(180deg,rgba(20,35,60,.97),rgba(9,16,30,.98));border:2px solid rgba(56,189,248,.5);border-radius:22px;max-width:380px;width:90%;box-shadow:0 0 46px rgba(56,189,248,.22);animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(.7) translateY(28px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.res-icon{font-size:3.4rem;}
.res-wave{font-size:2.6rem;font-weight:900;color:#7dd3fc;text-shadow:0 0 20px rgba(56,189,248,.6);margin:2px 0;}
.res-sub{font-size:.85rem;color:#bae6fd;margin-bottom:6px;}
.res-new{display:inline-block;font-size:.8rem;font-weight:900;color:#04210f;background:linear-gradient(135deg,#fde68a,#fbbf24);border-radius:10px;padding:4px 14px;margin-bottom:12px;animation:pulse2 .9s infinite;}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.res-best{font-size:.82rem;color:#ddd6fe;margin-bottom:16px;line-height:1.7;}
.res-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.res-btn{border:none;border-radius:12px;padding:12px 20px;font-size:.95rem;font-weight:900;cursor:pointer;color:#fff;}
.b-retry{background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 6px 16px rgba(14,165,233,.45);}
.b-list{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);color:#cbd5e1;}

@media (max-width:560px){
  #q-eng{font-size:.95rem;}
  .mode-card{width:100%;max-width:320px;}
  .gate-title{font-size:1.8rem;}
}
</style>
</head>
<body>

<!-- ── 시작 게이트 ── -->
<div id="gate">
  <div class="gate-title">🏰 문법 타워 디펜스</div>
  <div class="gate-sub">문제를 맞혀 💰골드를 모으고, 길목에 타워를 세워 몰려오는 적을 막아라!<br>틀려도 게임은 멈추지 않아 — 정답률로 승부한다. 몇 웨이브까지 버틸까?</div>
  <div class="mode-cards">
    <button class="mode-card on" id="card-all">
      <div class="mc-icon">🌊</div>
      <div class="mc-name">전 단원 방어전</div>
      <div class="mc-desc">중1·중2 전 단원 문제로 무한 웨이브 방어.</div>
      <div class="mc-best" id="best-all"></div>
    </button>
    <button class="mode-card" id="card-unit">
      <div class="mc-icon">🎯</div>
      <div class="mc-name">단원 선택</div>
      <div class="mc-desc" id="unit-desc">고른 단원 문제로 집중 연습 방어전.</div>
      <div class="mc-best" id="best-unit"></div>
    </button>
  </div>
  <div id="unit-pick">
    <div class="up-row"><span class="up-label">중1</span><div class="up-grid" id="up-grid-g1"></div></div>
    <div class="up-row"><span class="up-label">중2</span><div class="up-grid" id="up-grid-g2"></div></div>
  </div>
  <div id="map-pick" style="max-width:520px;width:100%;margin-top:14px;">
    <div style="font-size:.78rem;color:#7dd3fc;font-weight:800;margin-bottom:8px;text-align:center;">🗺️ 전장 선택</div>
    <div class="up-grid" id="map-grid" style="justify-content:center;"></div>
  </div>
  <button id="gate-go">🛡️ 방어 시작!</button>
  <a class="gate-back" href="../game/index.html">← 목록</a>
</div>

<!-- ── 게임 ── -->
<div id="game">
  <div id="hud">
    <div class="hud-chip" id="hp-chip">❤️ 12</div>
    <div class="hud-chip" id="gold-chip">💰 0</div>
    <div class="hud-chip" id="wave-chip">🌊 1</div>
    <div class="hud-chip" id="best-chip2">최고 -</div>
    <button id="speed-btn" title="게임 속도">▶ 1x</button>
    <button id="bgm-btn" title="배경음악">🔊</button>
  </div>
  <div id="stage-wrap">
    <canvas id="stage" width="760" height="460"></canvas>
    <div id="wave-banner"></div>
    <div id="build-menu"></div>
  </div>
  <div id="qcard">
    <div id="q-top">
      <span id="q-unit"></span>
      <span id="q-combo"></span>
    </div>
    <div id="q-eng"></div>
    <div id="q-kor"></div>
    <div id="opts"></div>
    <div id="q-reward"></div>
  </div>
</div>

<!-- ── 결과 ── -->
<div id="result">
  <div class="res-card">
    <div class="res-icon" id="res-icon">🏰</div>
    <div class="res-wave"><span id="res-wave">0</span> 웨이브</div>
    <div class="res-sub" id="res-sub"></div>
    <div id="res-new-wrap"></div>
    <div class="res-best" id="res-best"></div>
    <div class="res-btns">
      <button class="res-btn b-retry" id="btn-retry">🛡️ 다시 방어!</button>
      <button class="res-btn b-list" onclick="location.href='../game/index.html'">목록</button>
    </div>
  </div>
</div>

<audio id="bgm" src="../tower/assets/bgm/climb-epic.mp3" loop preload="none"></audio>
<script src="../game/questions.js?v=questions-20260602j"></script>
<script>
'use strict';
// ═════════════════════════════════════════════════════════
//  문법 타워 디펜스 — 무한 웨이브 방어 (진척형: "몇 웨이브?")
//  에셋: Foozle Spire (CC0). 적=측면걷기(시트 row2), 타워=96×96 6프레임.
// ═════════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const AP='assets/';

// ── 인라인 사운드 ──
let _ac=null;
function ac(){if(!_ac){try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(_ac.state==='suspended')_ac.resume().catch(()=>{});return _ac;}
['pointerdown','touchstart','click'].forEach(ev=>window.addEventListener(ev,()=>ac(),{capture:true}));
function tone(f,dur,type,vol,when){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(vol||.1,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+dur+.02);}
const sfx={
  ok(){tone(660,.08,'square',.09);tone(880,.1,'square',.09,.06);},
  coin(){tone(880,.05,'square',.08);tone(1175,.07,'square',.08,.05);},
  ng(){tone(200,.16,'sawtooth',.09);tone(150,.2,'sawtooth',.08,.09);},
  build(){tone(330,.08,'square',.1);tone(440,.08,'square',.1,.07);tone(550,.1,'square',.1,.14);},
  shoot(){tone(520,.04,'triangle',.05);},
  hit(){tone(180,.07,'sawtooth',.06);},
  leak(){tone(300,.12,'sawtooth',.1);tone(200,.16,'sawtooth',.1,.1);},
  wave(){[440,554,660].forEach((f,i)=>tone(f,.12,'square',.1,i*.09));},
  over(){tone(300,.18,'sawtooth',.11);tone(220,.22,'sawtooth',.11,.16);tone(150,.4,'sawtooth',.11,.34);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.13,'square',.11,i*.1));},
};

// ── BGM ──
const bgm=$('bgm');
let bgmOn=localStorage.getItem('egmTD.bgm')!=='off';
function syncBgmBtn(){$('bgm-btn').textContent=bgmOn?'🔊':'🔇';}
function bgmPlay(){if(bgmOn){bgm.volume=.26;bgm.play().catch(()=>{});}}
function bgmStop(){bgm.pause();bgm.currentTime=0;}

// ── 에셋 ──
const IMG={};
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
const ENEMY_TYPES={
  scorpion: {img:'enemies/ground/scorpion.png',  cw:64, ch:64, row:2, frames:8, hp:1.0, spd:1.0, bounty:3},
  leafbug:  {img:'enemies/ground/leafbug.png',   cw:64, ch:64, row:2, frames:6, hp:0.7, spd:1.45,bounty:2},
  magma:    {img:'enemies/ground/magma-crab.png',cw:64, ch:64, row:2, frames:8, hp:1.9, spd:0.78,bounty:5},
  firebug:  {img:'enemies/ground/firebug.png',   cw:128,ch:64, row:2, frames:6, hp:1.3, spd:1.0, bounty:4},
};
// 타워 6종 — 무기 스프라이트·발사체·스탯·특수효과가 모두 다르다 (프레임은 정사각, fh=프레임 한 변)
//  proj 'sprite' = 스프라이트 발사체 / 'dot' = 색 원 발사체. 특수: splash 광역 / slow 둔화 / poison 중독(DoT)
const TOWER_TYPES=[
  {key:'arrow', name:'화살탑', emoji:'🏹', desc:'균형형 · 무난한 사거리와 연사', wp:'tower-01', fh:96,
   proj:'sprite', projFile:'towers/tower-01/level-01-projectile.png', pfw:24,pfh:40, pw:10,ph:17, rot:true,
   lv:[{range:122,dmg:9, fire:0.82,cost:55},{range:138,dmg:17,fire:0.68,cost:60},{range:158,dmg:30,fire:0.56,cost:85}]},
  {key:'magic', name:'마법탑', emoji:'🔮', desc:'범위 피해 · 주변 적까지 한 방', wp:'tower-02', fh:96, splash:40,
   proj:'sprite', projFile:'towers/tower-02/level-01-projectile.png', pfw:32,pfh:32, pw:20,ph:20,
   lv:[{range:110,dmg:16,fire:1.25,cost:80},{range:122,dmg:28,fire:1.08,cost:85},{range:138,dmg:46,fire:0.92,cost:120}]},
  {key:'rapid', name:'속사탑', emoji:'⚡', desc:'초고속 연사 · 떼거리에 강함', wp:'tower-03', fh:96,
   proj:'dot', dot:'#fde68a', pr:3,
   lv:[{range:104,dmg:5, fire:0.38,cost:65},{range:114,dmg:9, fire:0.31,cost:70},{range:126,dmg:15,fire:0.25,cost:95}]},
  {key:'cannon', name:'대포탑', emoji:'💣', desc:'강력·광역 · 아주 느림', wp:'tower-04', fh:128, splash:56,
   proj:'dot', dot:'#1f2937', pr:6,
   lv:[{range:150,dmg:34,fire:1.7,cost:100},{range:165,dmg:58,fire:1.5,cost:110},{range:185,dmg:92,fire:1.3,cost:150}]},
  {key:'frost', name:'서리탑', emoji:'❄️', desc:'적을 둔화 · 길목 묶어두기', wp:'tower-06', fh:64, slow:0.5, slowT:1.4,
   proj:'dot', dot:'#7dd3fc', pr:4,
   lv:[{range:108,dmg:4, fire:0.9, cost:60},{range:120,dmg:8, fire:0.8, cost:65},{range:134,dmg:13,fire:0.7, cost:90}]},
  {key:'poison', name:'독탑', emoji:'☠️', desc:'지속 피해(중독) · 단단한 적에 강함', wp:'tower-08', fh:48, poison:true,
   proj:'dot', dot:'#a3e635', pr:4,
   lv:[{range:112,dmg:3, fire:1.0, cost:70, dps:7, dur:3},{range:124,dmg:5, fire:0.9, cost:75, dps:13,dur:3},{range:138,dmg:8, fire:0.8, cost:105,dps:22,dur:3.2}]},
];
const IMPACT='towers/tower-01/weapon-impact.png'; // 384×64 = 6프레임 64
async function loadAssets(){
  if(IMG._done)return;
  const jobs=[];
  for(const k in ENEMY_TYPES) jobs.push(loadImg(AP+ENEMY_TYPES[k].img).then(i=>IMG['e_'+k]=i));
  TOWER_TYPES.forEach((T,ti)=>{
    [1,2,3].forEach((n,li)=>jobs.push(loadImg(AP+'towers/'+T.wp+'/level-0'+n+'-weapon.png').then(im=>{IMG['tw'+ti+'_'+li]=im;T.lv[li].frames=im?Math.max(1,Math.round(im.naturalWidth/T.fh)):1;})));
    if(T.proj==='sprite')jobs.push(loadImg(AP+T.projFile).then(im=>IMG['proj'+ti]=im));
  });
  jobs.push(loadImg(AP+IMPACT).then(i=>IMG.impact=i));
  await Promise.all(jobs);
  IMG._done=true;
}

// ── 스테이지 좌표 (논리 760×460) ──
const SW=760,SH=460,TILE=40;
const GCOLS=Math.floor(SW/TILE), GROWS=Math.floor(SH/TILE);
// 맵: 경로 모양이 다른 여러 스테이지 (적은 오른쪽 밖에서 들어와 왼쪽 성으로)
const MAPS=[
  {name:'굽이 평원', emoji:'🌾', g1:'#1f3a22', g2:'#23421f',
   path:[{x:800,y:110},{x:560,y:110},{x:560,y:250},{x:300,y:250},{x:300,y:110},{x:120,y:110},{x:120,y:360},{x:60,y:360}]},
  {name:'지그재그 숲', emoji:'🌲', g1:'#1c3328', g2:'#203b2c',
   path:[{x:800,y:80},{x:650,y:80},{x:650,y:300},{x:500,y:300},{x:500,y:90},{x:350,y:90},{x:350,y:300},{x:200,y:300},{x:200,y:120},{x:60,y:120}]},
  {name:'바위 협곡', emoji:'⛰️', g1:'#33302a', g2:'#3a352c',
   path:[{x:800,y:390},{x:700,y:390},{x:700,y:90},{x:420,y:90},{x:420,y:380},{x:160,y:380},{x:160,y:150},{x:60,y:150}]},
];
let MAP=null, PATH=null, BASE=null, SEG=[], PATHLEN=0, BUILDABLE=null;
function distSeg(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;let t=l2?((px-a.x)*dx+(py-a.y)*dy)/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy));}
function distToPath(px,py){let m=1e9;for(let i=0;i<PATH.length-1;i++)m=Math.min(m,distSeg(px,py,PATH[i],PATH[i+1]));return m;}
function cellKey(cx,cy){return cx+','+cy;}
function computeBuildable(){
  const s=new Set();
  for(let cy=0;cy<GROWS;cy++)for(let cx=0;cx<GCOLS;cx++){
    const x=cx*TILE+TILE/2,y=cy*TILE+TILE/2;
    if(distToPath(x,y)>30 && Math.hypot(x-BASE.x,y-BASE.y)>40) s.add(cellKey(cx,cy));
  }
  return s;
}
function setMap(i){
  MAP=MAPS[i];PATH=MAP.path;BASE=PATH[PATH.length-1];
  SEG=[];PATHLEN=0;
  for(let k=0;k<PATH.length-1;k++){const a=PATH[k],b=PATH[k+1];const d=Math.hypot(b.x-a.x,b.y-a.y);SEG.push({a,b,d,acc:PATHLEN});PATHLEN+=d;}
  BUILDABLE=computeBuildable();
  renderBackground();
}

// ── 게임 상태 ──
let GS=null, bgCanvas=null, raf=0, lastT=0;
const cv=$('stage'), cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;

// ── 문제 풀 ──
const UNIT_KEYS=Object.keys(GAME_QUESTIONS).filter(k=>k!=='all');
function buildPool(scope){
  let keys=UNIT_KEYS;
  if(scope&&scope!=='all') keys=[scope];
  const pool=[];
  keys.forEach(k=>{const u=GAME_QUESTIONS[k];if(!u)return;u.questions.forEach(q=>{
    if(!q.opts||q.opts.length<2)return;
    pool.push({...q,unitLabel:u.label,unitColor:u.color});
  });});
  return pool;
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ── 배경 (정적 — 맵 바뀔 때만 그려 캐시) ──
function renderBackground(){
  bgCanvas=document.createElement('canvas');bgCanvas.width=SW;bgCanvas.height=SH;
  const g=bgCanvas.getContext('2d');
  for(let y=0;y<SH;y+=TILE)for(let x=0;x<SW;x+=TILE){
    g.fillStyle=((x/TILE+y/TILE)%2===0)?MAP.g1:MAP.g2;
    g.fillRect(x,y,TILE,TILE);
  }
  g.lineJoin='round';g.lineCap='round';
  g.strokeStyle='#3a2c1c';g.lineWidth=46;strokePath(g);
  g.strokeStyle='#5a4126';g.lineWidth=38;strokePath(g);
  g.strokeStyle='#6b4e2e';g.lineWidth=30;strokePath(g);
  g.setLineDash([6,10]);g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=2;strokePath(g);g.setLineDash([]);
  // 건설 가능 타일 — 옅은 점으로 표시
  BUILDABLE.forEach(k=>{const[cx,cy]=k.split(',').map(Number);const x=cx*TILE+TILE/2,y=cy*TILE+TILE/2;
    g.beginPath();g.arc(x,y,3,0,Math.PI*2);g.fillStyle='rgba(125,211,252,.22)';g.fill();});
}
function strokePath(g){
  g.beginPath();g.moveTo(PATH[0].x,PATH[0].y);
  for(let i=1;i<PATH.length;i++)g.lineTo(PATH[i].x,PATH[i].y);
  g.stroke();
}
function posAt(dist){ // 경로 시작(오른쪽)에서 dist px 진행한 좌표 + 진행방향
  if(dist<=0)return {x:PATH[0].x,y:PATH[0].y,dx:-1,dy:0};
  for(const s of SEG){
    if(dist<=s.acc+s.d){const t=(dist-s.acc)/s.d;return {x:s.a.x+(s.b.x-s.a.x)*t,y:s.a.y+(s.b.y-s.a.y)*t,dx:Math.sign(s.b.x-s.a.x),dy:Math.sign(s.b.y-s.a.y)};}
  }
  const last=PATH[PATH.length-1];return {x:last.x,y:last.y,dx:-1,dy:0,end:true};
}

// ── 기록 ──
function loadRec(k){try{return JSON.parse(localStorage.getItem(k))||null;}catch(e){return null;}}
function saveRec(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function bestKey(scope){return 'egmTD.best.'+(scope||'all');}

// ── 게임 시작 ──
async function startRun(scope, mapIdx){
  await loadAssets();
  setMap(mapIdx==null?(GS?GS.mapIdx:gateMap):mapIdx);
  const pool=buildPool(scope);
  GS={
    scope, mapIdx:MAPS.indexOf(MAP), pool, qseq:shuffled(pool), qi:0,
    gold:90, baseHP:12, wave:0, combo:0, speed:1, correct:0, total:0, maxCombo:0,
    enemies:[], towers:[], shots:[], fx:[], floats:[],
    spawnQueue:[], spawnTimer:0, betweenWave:0, waveActive:false,
    over:false, win:false, time:0,
  };
  $('gate').style.display='none';$('result').style.display='none';$('game').style.display='flex';
  $('build-menu').classList.remove('show');
  $('speed-btn').textContent='▶ 1x';
  const best=loadRec(bestKey(scope));
  $('best-chip2').textContent='최고 '+(best?best.wave+'웨이브':'-');
  bgmPlay();
  updateHud();
  nextQuestion();
  banner('🏗️ 파란 점 땅을 탭해 타워를 지어!');
  setTimeout(()=>{if(GS&&!GS.over)startWave(1);},1700);
  lastT=performance.now();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

// ── 웨이브 ──
function waveComposition(w){
  const q=[];
  const total=4+Math.floor(w*1.6);
  for(let i=0;i<total;i++){
    let type='scorpion';
    const r=Math.random();
    if(w>=3&&r<0.22)type='magma';
    else if(w>=2&&r<0.5)type='firebug';
    else if(r<0.7)type='leafbug';
    q.push(type);
  }
  return q;
}
function startWave(w){
  const g=GS;g.wave=w;g.waveActive=true;g.betweenWave=0;
  g.spawnQueue=waveComposition(w);
  g.spawnTimer=0.4;
  banner('🌊 웨이브 '+w);
  sfx.wave();
  updateHud();
}
function enemyStats(type,w){
  const t=ENEMY_TYPES[type];
  const hp=Math.round((24+w*9)*t.hp);
  const spd=(34+w*1.1)*t.spd; // px/sec
  return {hp,spd,bounty:t.bounty};
}
function spawnEnemy(type){
  const g=GS;const st=enemyStats(type,g.wave);
  g.enemies.push({type,dist:0,hp:st.hp,maxHp:st.hp,spd:st.spd,bounty:st.bounty,frame:0,ft:0,face:-1,x:PATH[0].x,y:PATH[0].y,slowT:0,slowMul:1,poison:null});
}

// ── 메인 루프 ──
function loop(now){
  const g=GS;if(!g){return;}
  let dt=(now-lastT)/1000;lastT=now;
  if(dt>0.05)dt=0.05; // 탭 비활성 후 점프 방지
  if(!g.over)update(dt);
  render();
  raf=requestAnimationFrame(loop);
}

function update(dtRaw){
  const g=GS;const dt=dtRaw*g.speed;g.time+=dt;
  // 스폰
  if(g.waveActive&&g.spawnQueue.length){
    g.spawnTimer-=dt;
    if(g.spawnTimer<=0){spawnEnemy(g.spawnQueue.shift());g.spawnTimer=Math.max(0.45,1.1-g.wave*0.03);}
  }
  // 적 이동 + 상태효과(중독·둔화)
  for(const e of g.enemies){
    if(e.dead)continue;
    if(e.poison&&e.poison.t>0){e.poison.t-=dt;e.hp-=e.poison.dps*dt;if(e.hp<=0){killEnemy(e);continue;}}
    let sp=e.spd;
    if(e.slowT>0){e.slowT-=dt;sp*=e.slowMul;}
    e.dist+=sp*dt;
    const p=posAt(e.dist);
    e.x=p.x;e.y=p.y;
    if(p.dx!==0)e.face=p.dx;
    e.ft+=dt;const fps=8;
    if(e.ft>=1/fps){e.ft=0;e.frame=(e.frame+1)%ENEMY_TYPES[e.type].frames;}
    if(p.end){
      e.dead=true;e.leaked=true;
      g.baseHP--;g.combo=0;sfx.leak();shakeBase();
      addFloat(BASE.x+20,BASE.y-30,'-1 ❤️','#fca5a5');
      if(g.baseHP<=0){gameOver(false);}
      updateHud();
    }
  }
  // 타워 사격
  for(const tw of g.towers){
    const T=TOWER_TYPES[tw.type], L=T.lv[tw.level];
    tw.cool-=dt;
    if(tw.firing){tw.ft+=dt;if(tw.ft>=1/16){tw.ft=0;tw.fframe++;if(tw.fframe>=(L.frames||6)){tw.firing=false;tw.fframe=0;}}}
    if(tw.cool<=0){
      let best=null,bestDist=-1;
      for(const e of g.enemies){if(e.dead)continue;const d=Math.hypot(e.x-tw.x,e.y-tw.y);if(d<=L.range&&e.dist>bestDist){best=e;bestDist=e.dist;}}
      if(best){
        tw.cool=L.fire;tw.firing=true;tw.fframe=0;tw.ft=0;
        g.shots.push({x:tw.x,y:tw.y-14,target:best,tx:best.x,ty:best.y,ang:0,spd:380,dmg:L.dmg,type:tw.type,lvl:tw.level});
        sfx.shoot();
      }
    }
  }
  // 발사체
  for(const s of g.shots){
    if(s.done)continue;
    const tgt=s.target;
    const aimX=(tgt&&!tgt.dead)?tgt.x:s.tx, aimY=(tgt&&!tgt.dead)?tgt.y:s.ty;
    const ang=Math.atan2(aimY-s.y,aimX-s.x);s.ang=ang;
    s.x+=Math.cos(ang)*s.spd*dt;s.y+=Math.sin(ang)*s.spd*dt;
    if(Math.hypot(aimX-s.x,aimY-s.y)<15){s.done=true;addImpact(s.x,s.y);applyHit(s);}
  }
  // 임팩트 FX
  for(const f of g.fx){f.ft+=dt;if(f.ft>=1/22){f.ft=0;f.frame++;if(f.frame>=6)f.done=true;}}
  // 떠오르는 텍스트
  for(const t of g.floats){t.life-=dt;t.y-=22*dt;}
  // 정리
  g.enemies=g.enemies.filter(e=>!e.dead||e.fade>0);
  for(const e of g.enemies)if(e.dead&&e.fade>0)e.fade-=dt*2;
  g.enemies=g.enemies.filter(e=>!e.dead||e.fade>0);
  g.shots=g.shots.filter(s=>!s.done);
  g.fx=g.fx.filter(f=>!f.done);
  g.floats=g.floats.filter(t=>t.life>0);
  // 웨이브 종료 판정
  if(g.waveActive&&g.spawnQueue.length===0&&g.enemies.every(e=>e.dead)){
    g.waveActive=false;
    g.gold+=20+g.wave*3;addFloat(BASE.x+30,BASE.y-50,'+'+(20+g.wave*3)+'💰','#fde68a');
    g.betweenWave=3.0;
    banner('✅ 웨이브 '+g.wave+' 클리어! +'+(20+g.wave*3)+'💰');
    updateHud();
  }
  if(!g.waveActive&&g.betweenWave>0){
    g.betweenWave-=dt;
    if(g.betweenWave<=0)startWave(g.wave+1);
  }
}

function killEnemy(e){
  const g=GS;if(e.dead)return;e.dead=true;e.fade=0.35;
  g.gold+=e.bounty;addFloat(e.x,e.y-26,'+'+e.bounty,'#86efac');
  sfx.coin();updateHud();
}
function hurtEnemy(e,dmg){if(e.dead)return;e.hp-=dmg;if(e.hp<=0)killEnemy(e);}
function applyHit(s){
  const g=GS,T=TOWER_TYPES[s.type],L=T.lv[s.lvl],tgt=s.target;
  if(T.splash){
    for(const e of g.enemies){if(e.dead)continue;const d=Math.hypot(e.x-s.x,e.y-s.y);if(d<=T.splash)hurtEnemy(e,e===tgt?s.dmg:Math.round(s.dmg*0.6));}
  }else if(tgt&&!tgt.dead){hurtEnemy(tgt,s.dmg);}
  if(tgt&&!tgt.dead){
    if(T.slow){tgt.slowT=T.slowT;tgt.slowMul=T.slow;}
    if(T.poison){tgt.poison={dps:L.dps,t:L.dur};}
  }
  sfx.hit();
}
function addImpact(x,y){GS.fx.push({x,y,frame:0,ft:0});}
function addFloat(x,y,txt,color){GS.floats.push({x,y,txt,color,life:0.9});}
let baseShake=0;
function shakeBase(){baseShake=8;}

// ── 렌더 ──
function render(){
  const g=GS;
  cx.clearRect(0,0,SW,SH);
  cx.drawImage(bgCanvas,0,0);
  // 성
  let bx=BASE.x;if(baseShake>0){bx+=(Math.random()-.5)*baseShake;baseShake-=0.6;}
  cx.font='44px serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('🏰',bx+8,BASE.y-6);
  // 체력 하트
  cx.font='13px serif';
  cx.fillText('❤️'.repeat(Math.max(0,g.baseHP)),bx+8,BASE.y+22);

  // 타워 사거리(선택 셀)
  if(g.selCell){const ccx=g.selCell.cx*TILE+TILE/2, ccy=g.selCell.cy*TILE+TILE/2;
    const tw=towerAt(g.selCell.cx,g.selCell.cy);
    const range=tw?TOWER_TYPES[tw.type].lv[tw.level].range:TOWER_TYPES[g.previewType||0].lv[0].range;
    cx.beginPath();cx.arc(ccx,ccy,range,0,Math.PI*2);
    cx.fillStyle='rgba(125,211,252,.10)';cx.fill();
    cx.strokeStyle='rgba(125,211,252,.55)';cx.lineWidth=2;cx.stroke();
    cx.strokeStyle='rgba(253,230,138,.8)';cx.lineWidth=2;cx.strokeRect(ccx-TILE/2,ccy-TILE/2,TILE,TILE);
  }

  // 적
  for(const e of g.enemies){
    const t=ENEMY_TYPES[e.type];const img=IMG['e_'+e.type];if(!img)continue;
    const scale=46/t.ch, dw=t.cw*scale, dh=t.ch*scale;
    // 상태효과 표시 (둔화=청록 / 중독=연두 발밑 링)
    if(!e.dead&&(e.slowT>0||(e.poison&&e.poison.t>0))){
      cx.fillStyle=e.slowT>0?'rgba(125,211,252,.5)':'rgba(163,230,53,.5)';
      cx.beginPath();cx.ellipse(e.x,e.y+2,dw*0.4,5,0,0,Math.PI*2);cx.fill();
    }
    cx.save();cx.globalAlpha=e.dead?Math.max(0,e.fade/0.35):1;
    cx.translate(e.x,e.y);
    if(e.face>0)cx.scale(-1,1); // 시트는 왼쪽 향함 — 오른쪽 이동 시 뒤집기
    cx.drawImage(img, e.frame*t.cw, t.row*t.ch, t.cw, t.ch, -dw/2, -dh+6, dw, dh);
    cx.restore();
    if(!e.dead&&e.hp<e.maxHp){
      const bw=dw*0.9;
      cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(e.x-bw/2,e.y-dh+0,bw,4);
      cx.fillStyle='#4ade80';cx.fillRect(e.x-bw/2,e.y-dh+0,bw*Math.max(0,e.hp/e.maxHp),4);
    }
  }
  // 타워
  for(const tw of g.towers){
    const T=TOWER_TYPES[tw.type], L=T.lv[tw.level], img=IMG['tw'+tw.type+'_'+tw.level];
    cx.fillStyle='rgba(30,41,59,.85)';cx.beginPath();cx.ellipse(tw.x,tw.y+8,16,7,0,0,Math.PI*2);cx.fill();
    if(img){
      const frames=L.frames||6, frame=tw.firing?Math.min(tw.fframe,frames-1):0;
      const scale=60/T.fh, dw=T.fh*scale, dh=T.fh*scale;
      cx.drawImage(img, frame*T.fh,0,T.fh,T.fh, tw.x-dw/2, tw.y-dh+14, dw, dh);
    }
    for(let i=0;i<=tw.level;i++){cx.fillStyle='#fde68a';cx.beginPath();cx.arc(tw.x-8+i*8,tw.y+16,2.4,0,Math.PI*2);cx.fill();}
  }
  // 발사체
  for(const s of g.shots){
    const T=TOWER_TYPES[s.type];
    if(T.proj==='sprite'&&IMG['proj'+s.type]){
      cx.save();cx.translate(s.x,s.y);cx.rotate(s.ang+Math.PI/2);
      cx.drawImage(IMG['proj'+s.type],0,0,T.pfw,T.pfh,-T.pw/2,-T.ph/2,T.pw,T.ph);cx.restore();
    }else{
      cx.beginPath();cx.arc(s.x,s.y,T.pr,0,Math.PI*2);cx.fillStyle=T.dot;cx.fill();
      cx.strokeStyle='rgba(255,255,255,.5)';cx.lineWidth=1;cx.stroke();
    }
  }
  // 임팩트
  for(const f of g.fx){if(!IMG.impact)continue;const fw=64;cx.drawImage(IMG.impact,f.frame*fw,0,fw,64,f.x-24,f.y-24,48,48);}
  // 떠오르는 텍스트
  cx.font='bold 15px Baloo 2, sans-serif';cx.textAlign='center';
  for(const t of g.floats){cx.globalAlpha=Math.min(1,t.life/0.5);cx.fillStyle=t.color;cx.fillText(t.txt,t.x,t.y);}
  cx.globalAlpha=1;
}
function towerAt(cxi,cyi){return GS.towers.find(t=>t.cx===cxi&&t.cy===cyi)||null;}

// ── 입력: 땅 탭(자유 배치 — 셀에 스냅) ──
cv.addEventListener('click',e=>{
  const g=GS;if(!g||g.over)return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(SW/r.width), y=(e.clientY-r.top)*(SH/r.height);
  const cxi=Math.floor(x/TILE), cyi=Math.floor(y/TILE);
  if(towerAt(cxi,cyi)||BUILDABLE.has(cellKey(cxi,cyi)))openBuildMenu(cxi,cyi);
  else closeBuildMenu();
});
function openBuildMenu(cxi,cyi){
  const g=GS;g.selCell={cx:cxi,cy:cyi};g.previewType=0;
  const tw=towerAt(cxi,cyi), m=$('build-menu');
  let html='';
  if(!tw){
    html='<div class="bm-title">🏗️ 타워 건설</div>';
    TOWER_TYPES.forEach((T,ti)=>{const c=T.lv[0].cost;
      html+=`<button class="bm-btn" ${g.gold<c?'disabled':''} data-act="build" data-t="${ti}"><span>${T.emoji} ${T.name}</span><span class="bm-cost">${c}💰</span></button>`;});
  }else{
    const T=TOWER_TYPES[tw.type];
    if(tw.level<2){const c=T.lv[tw.level+1].cost;
      html=`<div class="bm-title">${T.emoji} ${T.name} Lv.${tw.level+1}</div>`+
        `<button class="bm-btn" ${g.gold<c?'disabled':''} data-act="up"><span>⬆️ Lv.${tw.level+2} 강화</span><span class="bm-cost">${c}💰</span></button>`+
        `<button class="bm-btn sell" data-act="sell"><span>💸 철거</span><span class="bm-cost">+${sellValue(tw)}💰</span></button>`;
    }else{
      html=`<div class="bm-title">${T.emoji} ${T.name} Lv.3 (최대)</div>`+
        `<button class="bm-btn sell" data-act="sell"><span>💸 철거</span><span class="bm-cost">+${sellValue(tw)}💰</span></button>`;
    }
  }
  html+='<button class="bm-close" data-act="close">닫기</button>';
  m.innerHTML=html;
  const wrapW=$('stage-wrap').clientWidth, sc=wrapW/SW;
  let px=(cxi*TILE+TILE/2)*sc-94, py=(cyi*TILE+TILE/2)*sc+20;
  px=Math.max(6,Math.min(wrapW-194,px));py=Math.max(6,py);
  m.style.left=px+'px';m.style.top=py+'px';
  m.classList.add('show');
  m.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick=()=>doBuildAct(b.dataset.act,cxi,cyi,b.dataset.t!=null?+b.dataset.t:null);
    if(b.dataset.t!=null)b.addEventListener('pointerenter',()=>{g.previewType=+b.dataset.t;});
  });
}
function closeBuildMenu(){if(GS)GS.selCell=null;$('build-menu').classList.remove('show');}
function sellValue(tw){const lv=TOWER_TYPES[tw.type].lv;let paid=0;for(let i=0;i<=tw.level;i++)paid+=lv[i].cost;return Math.floor(paid*0.5);}
function doBuildAct(act,cxi,cyi,typeIdx){
  const g=GS;const tw=towerAt(cxi,cyi);
  if(act==='close'){closeBuildMenu();return;}
  if(act==='build'&&!tw&&typeIdx!=null){
    const c=TOWER_TYPES[typeIdx].lv[0].cost;if(g.gold<c)return;
    g.gold-=c;g.towers.push({cx:cxi,cy:cyi,x:cxi*TILE+TILE/2,y:cyi*TILE+TILE/2,type:typeIdx,level:0,cool:0,firing:false,fframe:0,ft:0});
    sfx.build();
  }else if(act==='up'&&tw&&tw.level<2){
    const c=TOWER_TYPES[tw.type].lv[tw.level+1].cost;if(g.gold<c)return;
    g.gold-=c;tw.level++;sfx.build();
  }else if(act==='sell'&&tw){
    g.gold+=sellValue(tw);g.towers=g.towers.filter(t=>t!==tw);sfx.coin();
  }
  updateHud();closeBuildMenu();
}

// ── 문제 ──
function nextQuestion(){
  const g=GS;if(g.qi>=g.qseq.length){g.qseq=shuffled(g.pool);g.qi=0;}
  const q=g.qseq[g.qi++];g.cur=q;
  $('q-unit').textContent=q.unitLabel.split('·')[0].trim();
  $('q-unit').style.background=q.unitColor?q.unitColor+'33':'';
  $('q-eng').innerHTML=q.eng.replace(/_{2,}/g,'<b>____</b>');
  $('q-kor').textContent=q.kor;
  $('q-reward').textContent='';
  const opts=shuffled(q.opts);
  const box=$('opts');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>answer(b,o);box.appendChild(b);});
}
function answer(btn,val){
  const g=GS;if(!g||g.over||g.locked)return;
  g.locked=true;
  const correct=val===g.cur.ans;
  g.total++;
  [...document.querySelectorAll('.opt')].forEach(b=>{b.disabled=true;if(b.textContent===g.cur.ans)b.classList.add('ok');else if(b===btn)b.classList.add('ng');});
  if(correct){
    g.combo++;g.correct++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    const base=14, bonus=Math.min(10,Math.floor(g.combo/3)*2);
    const gain=base+bonus;
    g.gold+=gain;sfx.ok();
    $('q-reward').innerHTML='+'+gain+'💰'+(bonus?' <span style="color:#fde68a">'+g.combo+'콤보!</span>':'');
  }else{
    g.combo=0;sfx.ng();
    $('q-reward').innerHTML='<span style="color:#fca5a5">정답: '+g.cur.ans+'</span>';
  }
  updateHud();
  setTimeout(()=>{g.locked=false;nextQuestion();},correct?620:1300);
}

// ── HUD ──
function updateHud(){
  const g=GS;
  $('hp-chip').textContent='❤️ '+Math.max(0,g.baseHP);
  $('gold-chip').textContent='💰 '+g.gold;
  $('wave-chip').textContent='🌊 '+g.wave;
  const cb=$('q-combo');
  if(g.combo>=3){cb.style.display='inline';cb.textContent='🔥 '+g.combo+' 콤보';}else cb.style.display='none';
}
let bannerT=0;
function banner(txt){
  const b=$('wave-banner');b.textContent=txt;b.classList.add('show');
  clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('show'),1500);
}

// ── 종료 ──
function gameOver(win){
  const g=GS;if(g.over)return;g.over=true;g.win=win;
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop); // 렌더는 계속(정지화면)
  const reached=g.wave;
  const bKey=bestKey(g.scope);const prev=loadRec(bKey);
  const isNew=!prev||reached>prev.wave;
  if(isNew)saveRec(bKey,{wave:reached});
  $('res-icon').textContent=reached>=15?'👑':reached>=8?'🏆':'🛡️';
  $('res-wave').textContent=reached;
  $('res-sub').textContent='적에게 성을 빼앗겼다… 다시 도전!';
  $('res-new-wrap').innerHTML=isNew?'<div class="res-new">🎉 최고 기록!</div>':'';
  const best=loadRec(bKey);
  const acc=g.total?Math.round(g.correct/g.total*100):0;
  $('res-best').innerHTML='📊 정답률 '+acc+'% ('+g.correct+'/'+g.total+') · 🔥최다 '+g.maxCombo+'콤보<br>🏆 내 최고: '+(best?best.wave+' 웨이브':'-');
  sfx.over();bgmStop();
  setTimeout(()=>$('result').style.display='flex',500);
}
$('btn-retry').onclick=()=>startRun(GS.scope,GS.mapIdx);
$('bgm-btn').onclick=()=>{bgmOn=!bgmOn;localStorage.setItem('egmTD.bgm',bgmOn?'on':'off');syncBgmBtn();if(bgmOn&&GS&&!GS.over)bgmPlay();else bgm.pause();};
$('speed-btn').onclick=()=>{if(!GS||GS.over)return;GS.speed=GS.speed===1?2:1;$('speed-btn').textContent=GS.speed===2?'▶▶ 2x':'▶ 1x';};
syncBgmBtn();

// ── 게이트 ──
let gateScope='all', gateMap=0;
{const _u=new URLSearchParams(location.search).get('unit');if(_u&&_u!=='all'&&GAME_QUESTIONS[_u])gateScope=_u;}
function buildMapChips(){
  const grid=$('map-grid');grid.innerHTML='';
  MAPS.forEach((m,i)=>{
    const b=document.createElement('button');b.className='uchip'+(i===gateMap?' on':'');b.dataset.map=i;
    b.textContent=m.emoji+' '+m.name;
    b.onclick=()=>{gateMap=i;[...grid.children].forEach(c=>c.classList.toggle('on',+c.dataset.map===i));};
    grid.appendChild(b);
  });
}
function buildUnitChips(){
  UNIT_KEYS.forEach(k=>{
    const grid=k.startsWith('g1')?$('up-grid-g1'):$('up-grid-g2');
    const b=document.createElement('button');b.className='uchip';b.dataset.key=k;
    b.textContent=GAME_QUESTIONS[k].label.split('·')[0].trim().replace(/^중[12]\s*/,'');
    b.onclick=()=>{gateScope=k;refreshGate();};
    grid.appendChild(b);
  });
}
function refreshGate(){
  const unitMode=gateScope!=='all';
  $('card-all').classList.toggle('on',!unitMode);
  $('card-unit').classList.toggle('on',unitMode);
  $('unit-pick').classList.toggle('show',unitMode);
  [...document.querySelectorAll('.uchip')].forEach(c=>c.classList.toggle('on',c.dataset.key===gateScope));
  const ba=loadRec(bestKey('all'));$('best-all').textContent=ba?'최고 '+ba.wave+'웨이브':'';
  const sel=unitMode?gateScope:null;
  const bu=loadRec(bestKey(sel||'all'));
  $('best-unit').textContent=unitMode&&bu?'최고 '+bu.wave+'웨이브':'';
  if(unitMode)$('unit-desc').textContent=GAME_QUESTIONS[gateScope].label+' 문제로 방어전.';
}
$('card-all').onclick=()=>{gateScope='all';refreshGate();};
$('card-unit').onclick=()=>{if(gateScope==='all')gateScope=UNIT_KEYS[0];refreshGate();};
$('gate-go').onclick=()=>startRun(gateScope,gateMap);
buildUnitChips();buildMapChips();refreshGate();
</script>
