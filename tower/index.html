<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>문법 무한의 탑</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#000;overflow:hidden;font-family:'Baloo 2','Noto Sans KR',sans-serif;touch-action:manipulation;color:#fff;}
button{font-family:inherit;}

/* ── 시작 게이트 ── */
#gate{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0f172a,#1e1b4b 45%,#0f172a);overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
.gate-title{font-size:2rem;font-weight:900;text-shadow:0 0 24px rgba(124,58,237,.8);}
.gate-sub{font-size:.85rem;color:#a78bfa;margin:6px 0 20px;text-align:center;line-height:1.6;}
.mode-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:560px;}
.mode-card{width:230px;background:rgba(255,255,255,.05);border:2px solid rgba(167,139,250,.35);border-radius:18px;padding:18px 16px;cursor:pointer;color:#fff;text-align:left;transition:transform .14s,border-color .14s,box-shadow .14s;}
.mode-card.on{border-color:#a855f7;background:rgba(124,58,237,.18);box-shadow:0 0 22px rgba(124,58,237,.45);transform:translateY(-3px);}
.mode-card .mc-icon{font-size:1.7rem;}
.mode-card .mc-name{font-weight:900;font-size:1.05rem;margin:6px 0 3px;}
.mode-card .mc-desc{font-size:.76rem;color:#c4b5fd;line-height:1.5;}
.mode-card .mc-best{margin-top:9px;font-size:.74rem;color:#fde68a;font-weight:700;}
/* 자유 등반 단원 선택 */
#unit-pick{display:none;margin-top:16px;max-width:560px;width:100%;}
#unit-pick.show{display:block;}
#unit-pick .up-title{font-size:.78rem;color:#a78bfa;font-weight:800;margin-bottom:8px;text-align:center;}
.up-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;}
.up-label{flex-shrink:0;width:58px;text-align:right;font-size:.74rem;font-weight:900;color:#fde68a;padding-top:9px;}
#unit-pick .up-grid{display:flex;flex-wrap:wrap;gap:7px;flex:1;}
.uchip{border:1.5px solid rgba(167,139,250,.4);background:rgba(255,255,255,.05);color:#ddd6fe;border-radius:99px;padding:7px 13px;font-size:.78rem;font-weight:800;cursor:pointer;transition:all .12s;}
.uchip.on{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:#a855f7;color:#fff;box-shadow:0 3px 12px rgba(124,58,237,.5);}
#gate-go{margin-top:22px;font-size:1.2rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:16px;padding:16px 52px;box-shadow:0 12px 32px rgba(124,58,237,.6);cursor:pointer;transition:transform .12s;}
#gate-go:active{transform:scale(.96);}
.gate-back{margin-top:16px;color:#94a3b8;font-size:.85rem;text-decoration:none;}
.gate-hero{height:142px;width:auto;filter:drop-shadow(0 8px 22px rgba(45,212,191,.55));margin-bottom:8px;}

/* ── 게임 화면 ── */
#game{position:fixed;inset:0;display:none;flex-direction:column;}
#game::after{content:'';position:absolute;z-index:2;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(2,6,23,.18),transparent 44%),radial-gradient(circle at 72% 36%,transparent 24%,rgba(2,6,23,.22) 100%);}
#bg{position:absolute;inset:0;z-index:0;}
/* 탑 벽 — 벽돌 패턴이 아래로 흐르면 영웅이 올라가는 느낌 */
#wall{position:absolute;z-index:1;top:0;bottom:0;left:0;width:30%;max-width:240px;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 4px, transparent 4px 64px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 3px, transparent 3px 54px),
    repeating-linear-gradient(0deg, transparent 0 230px, rgba(45,212,191,.09) 230px 252px),
    linear-gradient(90deg,rgba(31,47,58,.42),rgba(20,33,42,.28) 70%,rgba(12,24,34,.2));
  border-right:4px solid rgba(45,212,191,.35);
  transition:background-position-y .5s cubic-bezier(.25,.6,.3,1);}
#wall::after{content:'';position:absolute;top:0;bottom:0;right:-12px;width:8px;background:repeating-linear-gradient(0deg,rgba(110,231,183,.55) 0 14px,transparent 14px 92px);transition:inherit;background-position-y:inherit;}

/* HUD */
#hud{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;gap:10px;}
#floor-chip{font-size:2rem;font-weight:900;line-height:1;text-shadow:0 0 18px rgba(250,204,21,.65);color:#fde68a;min-width:88px;}
#floor-chip small{display:block;font-size:.62rem;color:#a78bfa;font-weight:700;letter-spacing:.12em;}
#hearts{font-size:1.25rem;letter-spacing:.1em;filter:drop-shadow(0 2px 6px rgba(239,68,68,.5));}
#best-chip{font-size:.74rem;font-weight:800;color:#ddd6fe;background:rgba(124,58,237,.25);border:1.5px solid rgba(167,139,250,.5);border-radius:10px;padding:5px 11px;text-align:center;}
#bgm-btn{font-size:1.05rem;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);border-radius:10px;padding:6px 10px;cursor:pointer;}
#streak-chip{font-size:.78rem;font-weight:900;color:#fde68a;background:rgba(251,191,36,.16);border:1.5px solid rgba(251,191,36,.5);border-radius:10px;padding:5px 11px;display:none;}

/* 탑 뷰포트 (영웅) */
#arena{position:relative;flex:1;z-index:3;min-height:120px;}
/* 석조 발코니 — 탑 벽에서 튀어나온 바닥 (떠 있는 발판 느낌 제거) */
#ledge{position:absolute;left:0;bottom:8%;width:calc(min(30%,240px) + 84px);height:16px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 3px, transparent 3px 46px),
    linear-gradient(180deg,#3a4a56,#243039);
  border-top:3px solid rgba(45,212,191,.45);border-radius:0 6px 6px 0;box-shadow:0 6px 14px rgba(0,0,0,.65);}
#ledge::after{content:'';position:absolute;right:14px;top:16px;border-left:16px solid transparent;border-right:0 solid transparent;border-top:14px solid #1c262e;}
/* 몬스터용 우측 돌출 발판 — 몬스터 있을 때만 표시 */
#mledge{position:absolute;right:0;bottom:8%;width:240px;height:16px;display:none;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 3px, transparent 3px 46px),
    linear-gradient(180deg,#3a4a56,#243039);
  border-top:3px solid rgba(239,68,68,.4);border-radius:6px 0 0 6px;box-shadow:0 6px 14px rgba(0,0,0,.65);}
#mledge::after{content:'';position:absolute;left:14px;top:16px;border-right:16px solid transparent;border-top:14px solid #1c262e;}
/* HD 4-frame sprite. Every strip is ground-aligned at y=248, so all actions share one baseline. */
#hero{position:absolute;left:0;bottom:calc(8% + 12px);width:256px;height:256px;
  background-image:url('assets/hd-v2/units/sky-climber/idle.png');background-size:1024px 256px;
  background-repeat:no-repeat;
  transform:scale(.58);transform-origin:bottom center;
  filter:drop-shadow(0 8px 20px rgba(45,212,191,.45));}
@keyframes h4{from{background-position-x:0}to{background-position-x:-1024px}}
#hero.atk  {background-image:url('assets/hd-v2/units/sky-climber/attack.png');animation:h4 .5s steps(4) 1 forwards;}
#hero.idle {background-image:url('assets/hd-v2/units/sky-climber/idle.png');animation:h4 1s steps(4) infinite;}
#hero.run  {background-image:url('assets/hd-v2/units/sky-climber/run.png');animation:h4 .56s steps(4) infinite;}
#hero.hurt {background-image:url('assets/hd-v2/units/sky-climber/hurt.png');animation:h4 .34s steps(4) 1 forwards;}
#hero.death{background-image:url('assets/hd-v2/units/sky-climber/death.png');animation:h4 .8s steps(4) 1 forwards;}

/* 몬스터 (이벤트층 — game2 CC0 몬스터 재활용) */
#mon{position:absolute;right:6%;bottom:calc(8% + 16px - 88px);width:150px;height:150px;
  background-repeat:no-repeat;image-rendering:pixelated;
  transform:scaleX(-1) scale(1.8);transform-origin:bottom center;display:none;
  filter:drop-shadow(0 8px 22px rgba(239,68,68,.5));}
@keyframes mIdle4{from{background-position-x:0}to{background-position-x:-600px}}
@keyframes mIdle8{from{background-position-x:0}to{background-position-x:-1200px}}
@keyframes mDeath4{from{background-position-x:0}to{background-position-x:-600px}}
@keyframes kIdle8{from{background-position-x:0}to{background-position-x:-1280px}}
@keyframes kDeath6{from{background-position-x:0}to{background-position-x:-960px}}
#mon.i4{animation:mIdle4 .55s steps(4) infinite;}
#mon.i8{animation:mIdle8 .8s steps(8) infinite;}
#mon.die{animation:mDeath4 .5s steps(4) 1 forwards;}
#mon.ik{animation:kIdle8 1s steps(8) infinite;}
#mon.kdie{animation:kDeath6 .7s steps(6) 1 forwards;}
#mon.boss{transform:scaleX(-1) scale(2.6);filter:drop-shadow(0 10px 30px rgba(250,204,21,.55));}
@keyframes monsterHd4{from{background-position-x:0}to{background-position-x:-1024px}}
#mon.hd{background-size:1024px 256px;image-rendering:auto;transform:scale(.72);bottom:calc(8% + 12px)!important;}
#mon.hd-mi{animation:monsterHd4 .82s steps(4) infinite;}
#mon.hd-md{animation:monsterHd4 .68s steps(4) 1 forwards;}
#mon.hd-boss{background-size:1024px 256px;image-rendering:auto;transform:scale(.92);bottom:calc(8% + 12px)!important;filter:drop-shadow(0 10px 30px rgba(192,132,252,.72));}
#mon.hd-bi{animation:monsterHd4 .88s steps(4) infinite;}
#mon.hd-bd{animation:monsterHd4 .82s steps(4) 1 forwards;}
#mon-name{position:absolute;right:6%;bottom:calc(8% + 16px + 84px);background:rgba(0,0,0,.6);border:1.5px solid rgba(239,68,68,.5);border-radius:9px;padding:3px 10px;font-size:.72rem;font-weight:900;color:#fca5a5;display:none;}

/* 이벤트층 배너 칩 */
#evt-chip{display:none;margin-bottom:8px;font-size:.78rem;font-weight:900;border-radius:10px;padding:6px 12px;text-align:center;}
#evt-chip.monster{display:block;background:rgba(239,68,68,.16);border:1.5px solid rgba(239,68,68,.55);color:#fca5a5;}
#evt-chip.treasure{display:block;background:rgba(251,191,36,.14);border:1.5px solid rgba(251,191,36,.55);color:#fde68a;}
#evt-chip.boss{display:block;background:linear-gradient(135deg,rgba(239,68,68,.22),rgba(251,191,36,.18));border:1.5px solid rgba(250,204,21,.7);color:#fde68a;animation:pulse2 .9s infinite;}
#evt-chip.wind{display:block;background:rgba(34,211,238,.13);border:1.5px solid rgba(34,211,238,.5);color:#a5f3fc;}
#evt-chip.fog{display:block;background:rgba(148,163,184,.14);border:1.5px solid rgba(148,163,184,.5);color:#cbd5e1;}
#evt-chip.rush{display:block;background:rgba(168,85,247,.16);border:1.5px solid rgba(192,132,252,.6);color:#e9d5ff;}
#q-kor.fogged{filter:blur(7px);user-select:none;}
#streak-chip.fever{background:linear-gradient(135deg,rgba(251,191,36,.35),rgba(239,68,68,.25));border-color:#fbbf24;color:#fff;animation:pulse2 .7s infinite;}
.opt.dimmed{opacity:.25;pointer-events:none;}

/* 👻 유령 / 🐦 새 — 텍스트 위를 슬라이드로 지나가며 가린다 */
#disturb{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;border-radius:20px;}
#disturb span{position:absolute;display:flex;align-items:center;justify-content:center;opacity:0;}
#disturb span::after{font-size:2.7rem;line-height:1;}
@keyframes passR{0%{left:-22%;opacity:0}9%{opacity:1}91%{opacity:1}100%{left:112%;opacity:0}}
@keyframes passL{0%{left:112%;opacity:0}9%{opacity:1}91%{opacity:1}100%{left:-22%;opacity:0}}
#disturb.ghost span{width:126px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(226,232,240,.95),rgba(203,213,225,.55) 58%,transparent);backdrop-filter:blur(5px);}
#disturb.ghost span::after{content:'👻';}
#disturb.ghost .d1{top:52%;animation:passR 3.4s linear infinite;}
#disturb.ghost .d2{top:70%;animation:passR 4.3s linear infinite 1.4s;}
#disturb.ghost .d3{top:86%;animation:passR 3.9s linear infinite .7s;}
#disturb.bird span{width:96px;height:60px;border-radius:42%;background:radial-gradient(circle,rgba(20,12,38,.9),transparent 72%);backdrop-filter:blur(4px);}
#disturb.bird span::after{content:'🐦';transform:scaleX(-1);}
#disturb.bird .d1{top:26%;animation:passL 2.7s linear infinite;}
#disturb.bird .d2{top:40%;animation:passL 3.3s linear infinite 1s;}
#disturb.bird .d3{top:20%;animation:passL 3.0s linear infinite 1.9s;}

/* 아이템 슬롯 */
#items{position:relative;z-index:5;display:flex;gap:8px;justify-content:center;margin:0 auto 8px;}
.item-btn{font-size:1.3rem;background:rgba(255,255,255,.07);border:2px solid rgba(167,139,250,.45);border-radius:12px;padding:7px 12px;cursor:pointer;transition:transform .12s;position:relative;}
.item-btn:active{transform:scale(.92);}
.item-btn .it-label{display:block;font-size:.56rem;font-weight:800;color:#c4b5fd;}
.item-btn.flash{animation:pulse2 .6s 2;}

/* 휴식층 배너 */
#rest-banner{position:absolute;left:50%;top:34%;transform:translateX(-50%) scale(.7);z-index:30;background:linear-gradient(135deg,rgba(34,197,94,.95),rgba(16,185,129,.92));padding:13px 26px;border-radius:16px;font-weight:900;font-size:1.05rem;box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;border:1.5px solid rgba(255,255,255,.4);}
#rest-banner.show{opacity:1;transform:translateX(-50%) scale(1);}

/* 문제 카드 */
#qcard{position:relative;z-index:5;margin:0 auto 14px;width:94%;max-width:640px;background:linear-gradient(170deg,#1a0533,#0f0824);border:2px solid #7c3aed;border-radius:20px;padding:12px 14px 16px;box-shadow:0 8px 36px rgba(0,0,0,.8);}
#timer-track{height:8px;background:#0a0a16;border-radius:99px;overflow:hidden;margin-bottom:10px;border:1px solid rgba(255,255,255,.14);}
#timer-fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#a78bfa);}
#timer-fill.crit{background:linear-gradient(90deg,#ef4444,#f97316);}
#q-unit{display:inline-block;font-size:.66rem;font-weight:800;color:#c4b5fd;background:rgba(124,58,237,.25);border-radius:8px;padding:2px 9px;margin-bottom:6px;}
#q-eng{font-size:1.12rem;font-weight:800;line-height:1.45;}
#q-eng b{color:#fde68a;}
#q-kor{font-size:.82rem;color:#a5b4fc;margin:4px 0 12px;}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.opt{background:rgba(255,255,255,.06);border:2px solid rgba(167,139,250,.35);border-radius:13px;padding:13px 10px;font-size:1rem;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s,border-color .1s;}
.opt:active{transform:scale(.97);}
.opt.ok{background:rgba(34,197,94,.3);border-color:#22c55e;}
.opt.ng{background:rgba(239,68,68,.3);border-color:#ef4444;animation:shake .35s;}
.opt:disabled{cursor:default;opacity:.92;}
/* 🪙 베팅 선택 버튼 */
.opt.stake{font-size:.98rem;}
.opt.stake small{display:block;font-size:.7rem;font-weight:700;margin-top:3px;color:#c4b5fd;}
.opt.st-bet{border-color:#fbbf24;background:rgba(251,191,36,.15);}
.opt.st-safe{border-color:#34d399;background:rgba(52,211,153,.13);}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 오답 확인 스트립 */
#fb{display:none;margin-top:11px;background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.45);border-radius:13px;padding:11px 13px;}
#fb.show{display:flex;align-items:center;gap:10px;flex-wrap:wrap;animation:pop .25s;}
#fb .fb-txt{flex:1;min-width:180px;font-size:.88rem;line-height:1.55;}
#fb .fb-txt b{color:#4ade80;font-size:1rem;}
#fb .fb-txt .fb-mine{color:#fca5a5;}

/* 결과 */
#result{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(4,2,12,.92);}
.res-card{text-align:center;padding:30px 34px 26px;background:linear-gradient(180deg,rgba(30,20,55,.96),rgba(11,7,22,.98));border:2px solid rgba(250,204,21,.5);border-radius:24px;max-width:420px;width:92%;box-shadow:0 0 50px rgba(250,204,21,.25);animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.res-icon{font-size:3.6rem;}
.res-floor{font-size:2.9rem;font-weight:900;color:#fde68a;text-shadow:0 0 22px rgba(250,204,21,.7);margin:4px 0;}
.res-sub{font-size:.85rem;color:#c4b5fd;margin-bottom:6px;}
.res-best{font-size:.82rem;color:#ddd6fe;margin-bottom:16px;line-height:1.7;}
.res-new{display:inline-block;font-size:.8rem;font-weight:900;color:#052e16;background:linear-gradient(135deg,#fde68a,#fbbf24);border-radius:10px;padding:4px 14px;margin-bottom:12px;animation:pulse2 .9s infinite;}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.res-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.res-btn{border:none;border-radius:13px;padding:13px 20px;font-size:.95rem;font-weight:900;cursor:pointer;color:#fff;}
.b-retry{background:linear-gradient(135deg,#8b5cf6,#7c3aed);box-shadow:0 6px 18px rgba(124,58,237,.5);}
.b-list{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);color:#cbd5e1;}

/* 오답 복습 */
.res-card{max-height:88vh;overflow-y:auto;}
#res-review{text-align:left;margin:0 0 16px;}
#res-review h4{font-size:.85rem;color:#fca5a5;margin-bottom:8px;text-align:center;}
.rv-item{background:rgba(255,255,255,.05);border:1.5px solid rgba(239,68,68,.3);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.rv-eng{font-size:.92rem;font-weight:800;line-height:1.5;}
.rv-eng b{color:#4ade80;}
.rv-kor{font-size:.76rem;color:#a5b4fc;margin-top:3px;}
.rv-mine{font-size:.76rem;color:#fca5a5;margin-top:3px;}

@media (max-width:560px){
  #gate{justify-content:flex-start;padding-top:16px;}
  .gate-hero{height:112px;flex:0 0 auto;}
  .gate-title{font-size:1.72rem;}
  #hero{transform:scale(.52);bottom:calc(8% + 12px);}
  #floor-chip{font-size:1.6rem;}
  #q-eng{font-size:1rem;}
  .mode-card{width:100%;max-width:320px;}
}
</style>
</head>
<body>

<!-- ── 시작 게이트 ── -->
<div id="gate">
  <img class="gate-hero" src="assets/hd-v2/units/sky-climber/portrait.png" alt="하늘탑 등반가">
  <div class="gate-title">🗼 문법 무한의 탑</div>
  <div class="gate-sub">한 문제 = 한 층. 목숨 3개로 어디까지 올라갈까?<br>10층마다 보스 관문 · 몬스터·보물·🪙베팅·유령·새·돌풍·안개 변수층 + 아이템!<br>올라갈수록 ⚙️가속! 시간이 점점 짧아진다.</div>
  <div class="mode-cards">
    <button class="mode-card on" id="card-daily">
      <div class="mc-icon">🗓️</div>
      <div class="mc-name">오늘의 탑</div>
      <div class="mc-desc">전 단원 통합. 오늘은 모두가 같은 문제 순서 — 친구와 층수로 승부!</div>
      <div class="mc-best" id="best-daily"></div>
    </button>
    <button class="mode-card" id="card-free">
      <div class="mc-icon">🎲</div>
      <div class="mc-name">자유 등반</div>
      <div class="mc-desc" id="free-desc">선택한 단원 문제로 랜덤 등반 연습.</div>
      <div class="mc-best" id="best-free"></div>
    </button>
  </div>
  <div id="unit-pick">
    <div class="up-title">등반할 범위를 고르세요</div>

<script>
'use strict';
// ═════════════════════════════════════════════════════════
//  문법 무한의 탑 — 데일리 시드 등반 서바이벌
//  rAF 루프 없음: 배경은 층 변경 시에만 캐시 재렌더(태블릿 성능),
//  모션은 CSS steps 스프라이트 + 벽 background-position 전환만 사용.

// ── 시드 RNG (데일리: 같은 날 = 같은 문제 순서) ──
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0;};}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeRng(seedStr){return mulberry32(xmur3(seedStr)());}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// ── 인라인 사운드 (whack 패턴, sounds.js와 독립) ──
let _ac=null;
function ac(){if(!_ac){try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(_ac.state==='suspended')_ac.resume().catch(()=>{});return _ac;}
['pointerdown','touchstart','click'].forEach(ev=>window.addEventListener(ev,()=>ac(),{once:false,capture:true}));
function tone(f,dur,type,vol,when){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+dur+.02);}
const sfx={
  ok(){tone(660,.09,'square',.1);tone(880,.12,'square',.1,.07);},
  climb(){tone(440,.06,'triangle',.12);tone(550,.06,'triangle',.12,.06);tone(660,.09,'triangle',.12,.12);},
  ng(){tone(220,.18,'sawtooth',.11);tone(160,.22,'sawtooth',.1,.1);},
  heal(){tone(523,.1,'sine',.13);tone(659,.1,'sine',.13,.09);tone(784,.16,'sine',.13,.18);},
  over(){tone(330,.18,'sawtooth',.12);tone(247,.2,'sawtooth',.12,.16);tone(165,.4,'sawtooth',.12,.34);},
  record(){[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.12,i*.1));},
};

// ── 배경 (고도 티어별 하늘 — 층 변경 시에만 그림, 프레임 루프 없음) ──
const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
// 10층 단위로 하늘이 높아진다: 새벽 틸 → 노을 → 해질녘 보라 → 밤 → 성층권 → 우주
const TIERS=[
  {sky:['#0e2a33','#155e63','#2a8f8a'],stars:0,  clouds:.9, orb:'#ffe9a8',halo:'rgba(255,222,130,.18)'},
  {sky:['#27203f','#7a3b52','#d97a4a'],stars:10, clouds:.7, orb:'#ffc46b',halo:'rgba(255,160,80,.2)'},
  {sky:['#171430','#3c2a63','#7a4a8f'],stars:40, clouds:.45,orb:'#ffd9a0',halo:'rgba(220,160,255,.14)'},
  {sky:['#070d1f','#0e1e42','#1a3563'],stars:110,clouds:.2, orb:'#dce9ff',halo:'rgba(160,200,255,.14)'},
  {sky:['#03060f','#071226','#0c1d3d'],stars:170,clouds:0,  orb:'#f3f7ff',halo:'rgba(200,220,255,.12)'},
  {sky:['#010103','#04040c','#0a0a1c'],stars:240,clouds:0,  orb:'#ffffff',halo:'rgba(255,255,255,.1)'},
];
const towerBackdrop=new Image();
towerBackdrop.src='assets/hd-v2/backgrounds/infinite-sky-tower.png';
towerBackdrop.onload=()=>{if(GS)drawSky(Math.floor(GS.floor/10));};
let _stars=null,_clouds=null,_bgTier=-1;
function drawSky(tier){
  const W=bgC.width=window.innerWidth,H=bgC.height=window.innerHeight;
  const t=TIERS[Math.min(tier,TIERS.length-1)];
  const g=bgX.createLinearGradient(0,0,0,H);
  g.addColorStop(0,t.sky[0]);g.addColorStop(.5,t.sky[1]);g.addColorStop(1,t.sky[2]);
  const hasArt=towerBackdrop.complete&&towerBackdrop.naturalWidth;
  if(hasArt){const ir=towerBackdrop.naturalWidth/towerBackdrop.naturalHeight,cr=W/H;let sx=0,sy=0,sw=towerBackdrop.naturalWidth,sh=towerBackdrop.naturalHeight;if(ir>cr){sw=sh*cr;sx=(towerBackdrop.naturalWidth-sw)/2}else{sh=sw/cr;sy=(towerBackdrop.naturalHeight-sh)/2}bgX.drawImage(towerBackdrop,sx,sy,sw,sh,0,0,W,H);bgX.save();bgX.globalAlpha=.08+Math.min(tier,5)*.07;bgX.fillStyle=g;bgX.fillRect(0,0,W,H);bgX.restore();}
  else{bgX.fillStyle=g;bgX.fillRect(0,0,W,H);}
  if(!_stars)_stars=Array.from({length:240},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.7+.4,a:.3+Math.random()*.55}));
  for(let i=0;i<t.stars;i++){const s=_stars[i];bgX.fillStyle=`rgba(255,255,255,${s.a})`;bgX.beginPath();bgX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bgX.fill();}
  if(!hasArt){
  // fallback 해/달 — 배경 에셋을 불러오지 못했을 때만 표시
  const mx=W*.78,my=H*.2,mr=Math.min(W,H)*.062;
  const halo=bgX.createRadialGradient(mx,my,mr*.4,mx,my,mr*3);
  halo.addColorStop(0,t.halo);halo.addColorStop(1,'transparent');
  bgX.fillStyle=halo;bgX.fillRect(mx-mr*3,my-mr*3,mr*6,mr*6);
  bgX.fillStyle=t.orb;bgX.beginPath();bgX.arc(mx,my,mr,0,Math.PI*2);bgX.fill();
  // 픽셀 구름 — 낮은 고도에서만, 위로 갈수록 옅어진다
  if(t.clouds>0){
    if(!_clouds)_clouds=Array.from({length:7},()=>({x:Math.random(),y:.12+Math.random()*.55,w:.1+Math.random()*.16,seg:3+Math.floor(Math.random()*3)}));
    _clouds.forEach(c=>{
      const cw=c.w*W,ch=Math.max(10,cw*.16),cx=c.x*W,cy=c.y*H,px=Math.max(6,ch*.5);
      bgX.fillStyle=`rgba(255,255,255,${(.1+.1*t.clouds).toFixed(2)})`;
      for(let s=0;s<c.seg;s++){ // 계단형 픽셀 구름 덩어리
        const sw=cw*(1-s*.22);
        bgX.fillRect(Math.round((cx-sw/2)/px)*px,Math.round((cy-s*ch*.5)/px)*px,sw,ch*.6);
      }
    });
  }}
  _bgTier=tier;
}
window.addEventListener('resize',()=>{if(GS)drawSky(Math.floor(GS.floor/10));});

// ── 문제 풀 ──
const params=new URLSearchParams(location.search);
// questions.js의 'all' 키와 허브 unit=all은 단원이 아니라 전 단원 취급
const UNIT_KEYS=Object.keys(GAME_QUESTIONS).filter(k=>k!=='all');
const _u=params.get('unit');
const unitParam=(_u&&_u!=='all'&&GAME_QUESTIONS[_u])?_u:null;
function buildPool(scope){ // null/'all'=전 단원, 'g1'/'g2'=학년 전체, 그 외=단원 키
  let keys=UNIT_KEYS;
  if(scope==='g1'||scope==='g2')keys=UNIT_KEYS.filter(k=>k.startsWith(scope+'-'));
  else if(scope)keys=[scope];
  const l1=[],l2=[];
  keys.forEach(k=>{const u=GAME_QUESTIONS[k];if(!u)return;u.questions.forEach(q=>{
    const item={...q,unitLabel:u.label,unitColor:u.color};
    (q.level>=2?l2:l1).push(item);
  });});
  return {l1,l2};
}
function shuffled(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ── 난이도 곡선 ──
function timeFor(floor){return Math.max(5,19-floor*0.32);}          // 초: 19 → 5 (44층 부근까지 계속 단축, plateau 제거)
function pLevel2(floor){return Math.min(.85,.15+floor*.025);}        // level2 비중: 15% → 85%
function speedGear(floor){return Math.min(6,1+Math.floor(floor/8));}// ⚙️ 가속 기어: 8층마다 1단, 최대 6단

// ── 기록 (localStorage) ──
function loadRec(key){try{return JSON.parse(localStorage.getItem(key))||null;}catch(e){return null;}}
function saveRec(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function bestKeyFor(mode,unit){return mode==='daily'?'egmTower.daily.best':'egmTower.free.'+(unit||'all');}
function dailyTodayKey(){return 'egmTower.daily.'+todayStr();}

// ── BGM (CC0 "Happy Adventure Loop" — assets/CREDITS.txt) ──
const bgm=document.getElementById('bgm');
let bgmOn=localStorage.getItem('egmTower.bgm')!=='off';
function syncBgmBtn(){document.getElementById('bgm-btn').textContent=bgmOn?'🔊':'🔇';}

// ── 이벤트층 & 아이템 ──
const MONSTERS=[
  {key:'mimic',     name:'🧰 가시덩굴 미믹', cls:'hd hd-mi',die:'hd hd-md',w:256,h:256,pad:8,idle:'idle.png',death:'death.png',base:'assets/hd-v2/units/thornjaw-mimic/'},
  {key:'goblin',    name:'👺 문법 고블린',   cls:'i4',die:'die', w:150,h:150,base:'../game2/assets/fighters/goblin/'},
  {key:'mushroom',  name:'🍄 문법 버섯괴물', cls:'i4',die:'die', w:150,h:150,base:'../game2/assets/fighters/mushroom/'},
  {key:'skeleton',  name:'💀 문법 해골군주', cls:'i4',die:'die', w:150,h:150,base:'../game2/assets/fighters/skeleton/'},
  {key:'flying_eye',name:'👁️ 문법 마안',    cls:'i8',die:'die', w:150,h:150,base:'../game2/assets/fighters/flying_eye/'},
];
const BOSS_MON={key:'storm_warden',name:'⚡ 폭풍의 수문장',cls:'hd-boss hd-bi',die:'hd-boss hd-bd',w:256,h:256,pad:0,idle:'idle.png',death:'death.png',base:'assets/hd-v2/units/storm-warden/'};
const ITEM_DEFS={
  shield:   {emoji:'🛡️',label:'방패',  desc:'오답 1회 방어 (자동)',     w:3},
  hourglass:{emoji:'⏳',label:'+7초', desc:'탭하면 시간 +7초',          w:5},
  fifty:    {emoji:'🔍',label:'반반',  desc:'탭하면 오답 2개 제거',       w:5},
  lantern:  {emoji:'🏮',label:'등불',  desc:'탭하면 현재 방해 효과 해제', w:4},
  wing:     {emoji:'🪽',label:'스킵',  desc:'탭하면 한 층 무료 등반',     w:2},
  potion:   {emoji:'❤️',label:'물약',  desc:'탭하면 하트 +1 (최대 3)',    w:2},
};
// 방해/패널티 층 — 등불·일반층 판정에 사용
const DISTURB=['wind','fog','ghost','bird','rush'];
// 변수층 가중 테이블 (보스는 10층마다 별도)
const EVENTS=[
  {k:'monster',w:10},{k:'treasure',w:9},{k:'bet',w:8},
  {k:'wind',w:8},{k:'fog',w:7},{k:'ghost',w:7},{k:'bird',w:7},{k:'rush',w:7},
];
function eventFor(f,rng){ // 보스(10층마다) > 4층 이전 없음 > 가중 추첨
  if(f<4)return null;
  if(f%10===0)return 'boss';
  // 올라갈수록 변수 빈도 증가: 45% → 최대 72%
  const eventChance=Math.min(.72,.45+(f-4)*0.006);
  if(rng()>=eventChance)return null;
  const tot=EVENTS.reduce((s,e)=>s+e.w,0);
  let r=rng()*tot;
  for(const e of EVENTS){r-=e.w;if(r<0)return e.k;}
  return null;
}
function addItem(kind){
  const g=GS;
  if(g.items.length>=3)return false;
  g.items.push(kind);renderItems();
  return true;
}
function renderItems(){
  const box=$('items');box.innerHTML='';
  GS.items.forEach((k,i)=>{
    const d=ITEM_DEFS[k];
    const b=document.createElement('button');
    b.className='item-btn';b.title=d.desc;
    b.innerHTML=d.emoji+'<span class="it-label">'+d.label+'</span>';
    b.onclick=()=>useItem(i);
    box.appendChild(b);
  });
}
function clearDisturb(){ // 현재 문제의 방해 효과를 모두 해제
  const g=GS;
  clearInterval(g.windIv);
  $('q-kor').classList.remove('fogged');
  $('disturb').className='';   // 유령·새 애니 정지
  g.activeDisturb=null;
}
function useItem(i){
  const g=GS;if(!g||g.over||g.locked)return;
  const k=g.items[i];
  if(k==='shield')return; // 방패는 자동 발동
  if(k==='hourglass'){g.items.splice(i,1);extendTimer(7000);sfx.heal();}
  else if(k==='wing'){g.items.splice(i,1);sfx.climb();skipClimb();}
  else if(k==='potion'){
    if(g.hearts>=3){banner('❤️ 하트가 이미 가득!');return;}
    g.items.splice(i,1);g.hearts++;updateHud();sfx.heal();banner('❤️ 하트 +1!');
  }
  else if(k==='lantern'){
    if(!g.activeDisturb){banner('🏮 지금은 방해가 없어요');return;}
    g.items.splice(i,1);clearDisturb();sfx.ok();banner('🏮 등불! 방해를 걷어냈다');
  }
  else if(k==='fifty'){
    const live=[...document.querySelectorAll('.opt')].filter(b=>!b.disabled&&!b.classList.contains('dimmed'));
    const wrongs=live.filter(b=>b.textContent!==g.cur.ans);
    if(wrongs.length<2)return; // O/X 문항 등 2지선다엔 사용 불가
    g.items.splice(i,1);
    wrongs.sort(()=>Math.random()-.5).slice(0,2).forEach(b=>b.classList.add('dimmed'));
    sfx.ok();
  }
  renderItems();
}

function startRun(mode){
  const unit=(mode==='free'&&gateUnit!=='all')?gateUnit:null;
  const seedStr=mode==='daily'?('tower-'+todayStr()):('tower-'+Math.random());
  const rng=makeRng(seedStr);
  const pool=buildPool(unit);
  GS={
    mode,unit,rng,
    seqL1:shuffled(pool.l1,rng),seqL2:shuffled(pool.l2,rng),i1:0,i2:0,
    poolL1:pool.l1,poolL2:pool.l2,
    floor:0,hearts:3,streak:0,maxStreak:0,wrongs:[],
    items:[],itemHistory:[],event:null,eventFloor:-1,monster:null,fever:0,windIv:null,activeDisturb:null,
    betStake:null,
    over:false,locked:false,timerT:null,
  };
  renderItems();
  wallY=0;wall.style.transition='none';wall.style.backgroundPositionY='0px';
  void wall.offsetWidth;wall.style.transition='';
  $('gate').style.display='none';$('result').style.display='none';$('game').style.display='flex';
  drawSky(0);
  setHero('idle');
  setMonster(null);
  bgmPlay();
  updateHud();
  const best=loadRec(bestKeyFor(mode,unit));
  $('best-num').textContent=best?best.floor:'-';
  nextQuestion();
}

function pickQuestion(){
  const g=GS;
  const wantL2=g.rng()<pLevel2(g.floor)&&g.poolL2.length>0;
  let q;
  if(wantL2||g.poolL1.length===0){
    if(g.i2>=g.seqL2.length){g.seqL2=shuffled(g.poolL2,g.rng);g.i2=0;}
    q=g.seqL2[g.i2++];
  }else{
    if(g.i1>=g.seqL1.length){g.seqL1=shuffled(g.poolL1,g.rng);g.i1=0;}
    q=g.seqL1[g.i1++];
  }
  return q;
}

  mon.style.bottom='calc(8% + 16px - '+(m.pad||88)+'px)';   // 발판 위에 발 정렬
  mon.className=m.cls;
  mon.style.display='block';
  nameEl.textContent=m.name;nameEl.style.display='block';
}
function syncEvent(){
  const g=GS,target=g.floor+1;
  if(g.eventFloor!==target){ // 새 목표 층 — 이벤트 추첨
    g.eventFloor=target;
    g.event=eventFor(target,g.rng);
    if(g.event==='monster')setMonster(MONSTERS[Math.floor(g.rng()*MONSTERS.length)]);
    else if(g.event==='boss')setMonster(BOSS_MON);
    else setMonster(null);
  }
  const chip=$('evt-chip');
  chip.className=g.event||'';
  if(g.event==='monster')chip.textContent='👹 몬스터층! 시간이 짧다 — 이기면 2층 점프!';
  else if(g.event==='boss')chip.textContent='👑 '+target+'층 보스! 이기면 ❤️회복 + 3층 점프 + 보물!';
  else if(g.event==='wind')chip.textContent='🌪️ 돌풍층! 선택지가 계속 뒤바뀐다!';
  else if(g.event==='fog')chip.textContent='🌫️ 안개층! 해석이 가려졌다 — 영어만 보고 풀어라!';
  else if(g.event==='ghost')chip.textContent='👻 유령층! 유령이 선택지를 가리며 지나간다!';
  else if(g.event==='bird')chip.textContent='🐦 새떼층! 새가 문제를 가리며 날아간다!';
  else if(g.event==='rush')chip.textContent='⚡ 가속층! 시간이 평소보다 빠르게 흐른다!';
  else if(g.event==='bet')chip.textContent='🪙 베팅층! 안전(+1층) 또는 베팅(+2층/❤️-2)을 골라라!';
}
function skipClimb(){ // 🪽 날개: 문제를 건너뛰고 한 층 등반 (연속 기록은 유지만)
  const g=GS;if(!g||g.over||g.locked)return;
  g.locked=true;
  clearTimeout(g.timerT);clearTimeout(g.critT);
  $('timer-fill').style.transition='none';
  g.floor++;
  setHero('run',560);
  wallY+=160;wall.style.backgroundPositionY=wallY+'px';
  const tier=Math.floor(g.floor/10);
  if(tier!==_bgTier)drawSky(tier);
  updateHud();
  setTimeout(nextQuestion,620);
}
function nextQuestion(){
  const g=GS;if(!g||g.over)return;
  g.locked=false;g.betStake=null;
  $('fb').classList.remove('show');
  syncEvent();
  const q=pickQuestion();
  g.cur=q;
  $('q-unit').textContent=q.unitLabel.split('·')[0].trim();
  $('q-unit').style.background=q.unitColor?q.unitColor+'33':'';
  $('q-eng').innerHTML=q.eng.replace(/_{2,}/g,'<b>____</b>');
  $('q-kor').textContent=q.kor;
  // 방해 효과 초기화
  clearInterval(g.windIv);
  $('q-kor').classList.remove('fogged');
  $('disturb').className='';
  g.activeDisturb=DISTURB.includes(g.event)?g.event:null;
  // 🌫️ 안개층: 해석 가림
  if(g.event==='fog')$('q-kor').classList.add('fogged');
  // 👻 유령 / 🐦 새: 슬라이드 애니메이션이 텍스트 위를 반복해 지나가며 가림
  if(g.event==='ghost')$('disturb').className='ghost';
  else if(g.event==='bird')$('disturb').className='bird';
  // 🪙 베팅층: 문제 풀기 전에 안전/베팅 먼저 선택 (타이머는 선택 후 시작)
  if(g.event==='bet'){showStake();return;}
  presentOptions();
}
function showStake(){
  const box=$('opts');box.innerHTML='';
  const fill=$('timer-fill');fill.style.transition='none';fill.style.width='100%';fill.classList.remove('crit');
  const mk=(html,stake,cls)=>{
    const b=document.createElement('button');
    b.className='opt stake '+cls;b.innerHTML=html;
    b.onclick=()=>{GS.betStake=stake;presentOptions();};
    box.appendChild(b);
  };
  mk('🛡️ 안전<small>+1층</small>','safe','st-safe');
  mk('🪙 베팅<small>+2층 / ❤️ -2</small>','bet','st-bet');
}
function presentOptions(){
  const g=GS,q=g.cur;
  const opts=shuffled(q.opts,g.rng);
  const box=$('opts');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=o;
    b.onclick=()=>answer(b,o);
    box.appendChild(b);
  });
  // 🌪️ 돌풍층: 2.8초마다 선택지 위치가 뒤바뀐다
  if(g.event==='wind'){
    g.windIv=setInterval(()=>{
      if(g.locked){clearInterval(g.windIv);return;}
      [...box.children].sort(()=>Math.random()-.5).forEach(b=>box.appendChild(b));
    },2800);
  }
  // 시간 단축: 몬스터 60% / 보스 70% / ⚡가속 55% (베팅은 보통 시간)
  const tScale=g.event==='monster'?0.6:g.event==='boss'?0.7:g.event==='rush'?0.55:1;
  startTimer(timeFor(g.floor)*tScale);
}

function startTimer(sec){
  const g=GS,fill=$('timer-fill');
  clearTimeout(g.timerT);clearTimeout(g.critT);
  g.timerTotal=sec*1000;g.timerEnd=Date.now()+g.timerTotal;
  fill.classList.remove('crit');
  fill.style.transition='none';fill.style.width='100%';
  void fill.offsetWidth;
  fill.style.transition='width '+sec+'s linear';fill.style.width='0%';
  g.critT=setTimeout(()=>fill.classList.add('crit'),Math.max(0,(sec-3)*1000));
  g.timerT=setTimeout(()=>{if(!g.locked)answer(null,null);},sec*1000);
}
function extendTimer(ms){ // ⏳ 모래시계 — 남은 시간에 +ms
  const g=GS;if(!g||g.locked)return;
  const rem=Math.max(0,g.timerEnd-Date.now())+ms;
  g.timerEnd=Date.now()+rem;
  g.timerTotal=Math.max(g.timerTotal,rem);
  const fill=$('timer-fill');
  clearTimeout(g.timerT);clearTimeout(g.critT);
  fill.classList.remove('crit');
  fill.style.transition='none';fill.style.width=Math.min(100,rem/g.timerTotal*100)+'%';
  void fill.offsetWidth;
  fill.style.transition='width '+(rem/1000)+'s linear';fill.style.width='0%';
  g.critT=setTimeout(()=>fill.classList.add('crit'),Math.max(0,rem-3000));
  g.timerT=setTimeout(()=>{if(!g.locked)answer(null,null);},rem);
}

function answer(btn,val){
  const g=GS;if(!g||g.locked||g.over)return;
  g.locked=true;
  clearTimeout(g.timerT);clearTimeout(g.critT);clearInterval(g.windIv);
  $('disturb').className='';   // 유령·새 정지
  $('timer-fill').style.transition='none';
  const correct=val!==null&&val===g.cur.ans;
  // 정답 표시
  [...document.querySelectorAll('.opt')].forEach(b=>{
    b.disabled=true;
    if(b.textContent===g.cur.ans)b.classList.add('ok');
    else if(b===btn)b.classList.add('ng');
  });
  if(correct)onCorrect();else onWrong(val);
}

function banner(txt){
  const rb=$('rest-banner');
  rb.textContent=txt;rb.classList.add('show');
  clearTimeout(banner._t);banner._t=setTimeout(()=>rb.classList.remove('show'),1500);
}
function randItem(){ // 같은 아이템 연속·보유 중복을 피하는 가중 추첨
  const g=GS;
  let ks=Object.keys(ITEM_DEFS).filter(k=>!g.items.includes(k));
  if(!ks.length)ks=Object.keys(ITEM_DEFS);
  const recent=new Set(g.itemHistory.slice(-2)),fresh=ks.filter(k=>!recent.has(k));
  if(fresh.length)ks=fresh;
  const tot=ks.reduce((s,k)=>s+ITEM_DEFS[k].w,0);
  let r=GS.rng()*tot;
  let picked=ks[0];for(const k of ks){r-=ITEM_DEFS[k].w;if(r<0){picked=k;break;}}
  g.itemHistory.push(picked);if(g.itemHistory.length>4)g.itemHistory.shift();
  return picked;
}

function onCorrect(){
  const g=GS;
  const ev=g.event;
  const oldGear=speedGear(g.floor);
  let climbN=ev==='monster'?2:ev==='boss'?3:1;   // 몬스터 +2 / 보스 +3
  if(ev==='bet'&&g.betStake==='bet')climbN=2;    // 🪙 베팅 성공: +2층
  if(g.fever>0){climbN+=1;g.fever--;}            // 🔥 피버: 정답마다 +1층
  // 점프(몬스터·피버)가 다음 보스층(10의 배수)을 건너뛰지 않도록 보스 직전에서 멈춤
  if(ev!=='boss'){
    const ceil=Math.floor(g.floor/10)*10+9;      // 9,19,29… = 보스 직전 층
    if(g.floor+climbN>ceil)climbN=Math.max(1,ceil-g.floor);
  }
  g.floor+=climbN;g.streak++;g.maxStreak=Math.max(g.maxStreak,g.streak);
  sfx.ok();sfx.climb();
  let delay=620;
  if(ev==='monster'||ev==='boss'){
    setHero('atk',700);
    if(g.monster){
      mon.style.backgroundImage="url('"+g.monster.base+(g.monster.death||'Death.png')+"')";
      mon.className=g.monster.die;
    }
    setTimeout(()=>setMonster(null),ev==='boss'?750:550);
  }else{
    setHero('run',560);
  }
  // 보스 격파 = 관문 돌파: ❤️회복 + 보물 + 연출
  if(ev==='boss'){
    const healed=g.hearts<3;if(healed)g.hearts++;
    sfx.heal();
    const got=randItem();const gotTxt=addItem(got)?ITEM_DEFS[got].emoji+ITEM_DEFS[got].label:'';
    banner('👑 보스 격파!! '+(healed?'❤️+1 ':'')+'3층 점프'+(gotTxt?' + '+gotTxt:''));
    delay=1300;
  }else if(ev==='monster'){
    banner('⚔️ 몬스터 처치! 2층 점프!');delay=1150;
  }
  if(ev==='treasure'){
    const got=randItem();
    banner(addItem(got)?'💰 '+ITEM_DEFS[got].emoji+' '+ITEM_DEFS[got].label+' 획득!':'💰 가방이 가득! (최대 3개)');
    delay=1150;
  }
  if(ev==='bet'){
    banner(g.betStake==='bet'?('🪙 베팅 성공! +'+climbN+'층!'):('🛡️ 안전하게 +'+climbN+'층'));
    delay=Math.max(delay,1050);
  }
  // 콤보 보상: 5연속마다 아이템, 7연속 도달 시 피버(5문제 동안 +1층)
  if(ev!=='boss'&&g.streak%5===0){
    const got=randItem();
    if(addItem(got)){banner('🔥 '+g.streak+'연속! '+ITEM_DEFS[got].emoji+' '+ITEM_DEFS[got].label+' 획득!');delay=Math.max(delay,1150);}
  }
  if(g.streak>0&&g.streak%7===0){
    g.fever=5;
    banner('🔥🔥 피버 타임! 5문제 동안 정답마다 +1층!');delay=Math.max(delay,1200);
  }
  // ⚙️ 가속 기어 상승 — 제한시간이 더 짧아진다
  const newGear=speedGear(g.floor);
  if(newGear>oldGear){
    banner('⏩ '+newGear+'단 가속! 제한시간이 더 짧아진다');delay=Math.max(delay,1100);
  }
  wallY+=160*climbN;wall.style.backgroundPositionY=wallY+'px';
  const tier=Math.floor(g.floor/10);
  if(tier!==_bgTier)drawSky(tier);
  updateHud();
  setTimeout(nextQuestion,delay);
}

function onWrong(picked){
  const g=GS;
  g.wrongs.push({eng:g.cur.eng,kor:g.cur.kor,ans:g.cur.ans,picked});
  // 🛡️ 방패 자동 발동 — 하트 보호 (연속 기록은 끊김)
  const si=g.items.indexOf('shield');
  if(si>=0){
    g.items.splice(si,1);renderItems();
    g.streak=0;g.fever=0;
    banner('🛡️ 방패가 막아줬다!');
    sfx.ng();
    updateHud();
    const mine0=picked===null?'⏰ 시간 초과':'내 답: '+picked;
    $('fb-txt').innerHTML='정답은 <b>'+g.cur.ans+'</b> <span class="fb-mine">('+mine0+')</span>';
    $('fb').classList.add('show');
    setTimeout(nextQuestion,2400);
    return;
  }
  g.hearts-=(g.event==='bet'&&g.betStake==='bet')?2:1; // 🪙 베팅 실패: 하트 -2
  if(g.hearts<0)g.hearts=0;
  g.streak=0;g.fever=0;   // 피버는 오답으로 종료
  sfx.ng();
  setHero('hurt',420);
  updateHud();
  const dead=g.hearts<=0;
  if(dead){
    g.over=true;
    setTimeout(()=>{setHero('death');sfx.over();},420);
  }
  // 오답 확인: 정답을 몇 초 보여주고 자동 진행 (다른 게임들과 동일)
  const mine=picked===null?'⏰ 시간 초과':'내 답: '+picked;
  $('fb-txt').innerHTML='정답은 <b>'+g.cur.ans+'</b> <span class="fb-mine">('+mine+')</span>';
  $('fb').classList.add('show');
  setTimeout(()=>{ if(dead)showResult();else nextQuestion(); },2400);
}

function updateHud(){
  const g=GS;
  $('floor-num').textContent=g.floor;
  const gear=speedGear(g.floor);
  $('floor-tag').textContent=gear>1?'⚙️ '+gear+'단':'FLOOR';
  $('hearts').textContent='❤️'.repeat(g.hearts)+'🖤'.repeat(3-g.hearts);
  const sc=$('streak-chip');
  if(g.fever>0){
    sc.style.display='block';sc.classList.add('fever');
    sc.innerHTML='🔥 FEVER ×'+g.fever;
  }else if(g.streak>=3){
    sc.style.display='block';sc.classList.remove('fever');
    sc.innerHTML='🔥 <span id="streak-num">'+g.streak+'</span> 연속';
  }else{sc.style.display='none';sc.classList.remove('fever');}
}

// ── 결과 ──
function showResult(){
  const g=GS;
  const bKey=bestKeyFor(g.mode,g.unit);
  const prev=loadRec(bKey);
  const isNew=!prev||g.floor>prev.floor;
  if(isNew)saveRec(bKey,{floor:g.floor,date:todayStr()});
  if(g.mode==='daily'){
    const dk=dailyTodayKey(),dPrev=loadRec(dk);
    if(!dPrev||g.floor>dPrev.floor)saveRec(dk,{floor:g.floor});
  }
  $('res-floor').textContent=g.floor;
  $('res-icon').textContent=g.floor>=30?'🏆':g.floor>=15?'🗼':'⛰️';
  const scopeTxt=g.unit?(SCOPE_LABEL[g.unit]||(GAME_QUESTIONS[g.unit]||{}).label||''):'';
  $('res-sub').textContent=(g.mode==='daily'?'오늘의 탑 '+todayStr():'자유 등반'+(scopeTxt?' · '+scopeTxt:''))+' · 🔥최대 '+g.maxStreak+'연속';
  $('res-new-wrap').innerHTML=isNew&&g.floor>0?'<div class="res-new">🎉 신기록!</div>':'';
  const best=loadRec(bKey);
  $('res-best').textContent='내 최고 기록: '+(best?best.floor+'층 ('+best.date+')':'-');
  // 오답 복습
  const rv=$('res-review');
  if(g.wrongs.length){
    rv.innerHTML='<h4>📝 오답 복습 ('+g.wrongs.length+'문제)</h4>'+g.wrongs.map(w=>{
      const eng=/_{2,}/.test(w.eng)?w.eng.replace(/_{2,}/,'<b>'+w.ans+'</b>'):w.eng+' → <b>'+w.ans+'</b>';
      const mine=w.picked===null?'⏰ 시간 초과':'내 답: '+w.picked;
      return '<div class="rv-item"><div class="rv-eng">'+eng+'</div><div class="rv-kor">'+w.kor+'</div><div class="rv-mine">'+mine+'</div></div>';
    }).join('');
  }else rv.innerHTML='';
  if(isNew&&g.floor>0)sfx.record();
  bgmStop();
  $('result').style.display='flex';
}
$('btn-retry').onclick=()=>startRun(GS.mode);
$('bgm-btn').onclick=()=>{
  bgmOn=!bgmOn;
  localStorage.setItem('egmTower.bgm',bgmOn?'on':'off');
  syncBgmBtn();
  if(bgmOn&&GS&&!GS.over)bgmPlay();else bgm.pause();
};
syncBgmBtn();

// ── 게이트 ──
let gateMode='daily';
let gateUnit=unitParam||'all';   // 자유 등반 단원 (all=전 단원)
function buildUnitChips(){
  const mk=(grid,key,label)=>{
    const b=document.createElement('button');
    b.className='uchip'+(gateUnit===key?' on':'');
    b.textContent=label;b.dataset.key=key;
    b.onclick=()=>{gateUnit=key;gateMode='free';refreshGate();};
    grid.appendChild(b);
  };
  const rand=$('up-grid-rand');
  mk(rand,'all','전체');mk(rand,'g1','중1 전체');mk(rand,'g2','중2 전체');
  UNIT_KEYS.forEach(k=>{
    const grid=k.startsWith('g1')?$('up-grid-g1'):$('up-grid-g2');
    mk(grid,k,GAME_QUESTIONS[k].label.split('·')[0].trim().replace(/^중[12]\s*/,''));
  });
}
const SCOPE_LABEL={all:'전 단원 랜덤',g1:'중1 전체 랜덤',g2:'중2 전체 랜덤'};
function refreshGate(){
  $('card-daily').classList.toggle('on',gateMode==='daily');
  $('card-free').classList.toggle('on',gateMode==='free');
  $('unit-pick').classList.toggle('show',gateMode==='free');
  [...document.querySelectorAll('.uchip')].forEach(c=>c.classList.toggle('on',c.dataset.key===gateUnit));
  const db=loadRec('egmTower.daily.best');
  const dt=loadRec(dailyTodayKey());
  $('best-daily').textContent=(dt?'오늘 '+dt.floor+'층':'오늘 미등반')+(db?' · 역대 '+db.floor+'층':'');
  const sel=gateUnit!=='all'?gateUnit:null;
  const fb=loadRec(bestKeyFor('free',sel));
  $('best-free').textContent=fb?'최고 '+fb.floor+'층':'';
  $('free-desc').textContent=SCOPE_LABEL[gateUnit]?SCOPE_LABEL[gateUnit]+' 등반 연습.':GAME_QUESTIONS[gateUnit].label+' 문제로 등반 연습.';
}
$('card-daily').onclick=()=>{gateMode='daily';refreshGate();};
$('card-free').onclick=()=>{gateMode='free';refreshGate();};
$('gate-go').onclick=()=>startRun(gateMode);
// 허브에서 ?unit=으로 들어오면 자유 등반을 기본 선택
if(unitParam)gateMode='free';
buildUnitChips();
refreshGate();
</script>
