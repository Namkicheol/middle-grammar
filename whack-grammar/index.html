<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>두더지 문법 잡기</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#7dd3fc;--sky2:#bae6fd;--grass1:#86efac;--grass2:#4ade80;--earth1:#7c2d12;--earth2:#a16207;
  --earth3:#451a03;--mole:#92400e;--mole2:#78350f;--mole3:#fde68a;--accent:#f97316;--ink:#0c4a6e;
  --ok:#16a34a;--ng:#dc2626;--white:#fff;--bg:#dbeafe;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Baloo 2','Noto Sans KR',sans-serif;
  background:linear-gradient(180deg,#7dd3fc 0%,#bae6fd 38%,#bbf7d0 60%,#86efac 100%);
  color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;}

/* ── decorative clouds ── */
.cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:999px;pointer-events:none;
  box-shadow:0 6px 18px rgba(15,23,42,.08);animation:drift linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:inherit;}
.c1{width:78px;height:24px;top:6%;left:-90px;animation-duration:48s;}
.c1::before{width:40px;height:40px;top:-18px;left:14px;}
.c1::after{width:30px;height:30px;top:-12px;right:8px;}
.c2{width:54px;height:18px;top:14%;left:-70px;animation-duration:66s;animation-delay:-12s;opacity:.7;}
.c2::before{width:28px;height:28px;top:-12px;left:10px;}
.c2::after{width:22px;height:22px;top:-9px;right:6px;}
.c3{width:64px;height:20px;top:4%;left:-80px;animation-duration:80s;animation-delay:-30s;opacity:.85;}
.c3::before{width:34px;height:34px;top:-14px;left:12px;}
.c3::after{width:26px;height:26px;top:-10px;right:8px;}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(640px)}}

/* ── header ── */
header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;position:relative;z-index:5;}
.back{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:var(--ink);font-family:inherit;font-weight:800;font-size:.78rem;padding:6px 12px;border-radius:18px;cursor:pointer;text-decoration:none;backdrop-filter:blur(6px);}
.back:hover{background:#fff;}
.title{flex:1;text-align:center;font-weight:900;font-size:1.05rem;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.7);}
.title small{display:block;font-size:.62rem;font-weight:700;letter-spacing:1.5px;color:#0369a1;margin-bottom:1px;}

/* ── HUD ── */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 8px;}
.hud-card{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);border-radius:14px;padding:6px 10px;font-weight:900;font-size:.78rem;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px);box-shadow:0 4px 10px rgba(15,23,42,.06);}
.hud-card .lbl{font-size:.6rem;font-weight:800;color:#0369a1;letter-spacing:1px;}
.hud-card .val{font-variant-numeric:tabular-nums;color:var(--ink);}
.hp-row{display:flex;gap:3px;}
.hp-row span{width:14px;height:14px;border-radius:50%;background:linear-gradient(145deg,#fca5a5,#dc2626);box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5);transition:all .25s;}
.hp-row span.gone{background:#cbd5e1;box-shadow:inset 0 1px 2px rgba(0,0,0,.12);transform:scale(.7);}
.combo{color:#ea580c;}

/* ── quiz card ── */
.qcard{margin:2px 14px 8px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.95);border-radius:18px;padding:11px 14px;text-align:center;box-shadow:0 8px 20px rgba(15,23,42,.08);position:relative;z-index:3;min-height:96px;}
.qkor{font-size:.84rem;font-weight:700;color:#475569;margin-bottom:4px;font-family:'Noto Sans KR',sans-serif;}
.qeng{font-size:1.05rem;font-weight:900;color:var(--ink);letter-spacing:.2px;}
.qeng .qwrong{display:inline-block;padding:2px 10px;color:#dc2626;background:#fee2e2;border:2px solid #fca5a5;border-radius:9px;text-decoration:line-through;text-decoration-thickness:2px;font-weight:900;font-size:1.18em;line-height:1.15;animation:qwrong-pulse 1.4s ease-in-out infinite;}
@keyframes qwrong-pulse{0%,100%{background:#fee2e2;transform:scale(1);}50%{background:#fecaca;transform:scale(1.04);}}
.qhint{font-size:.7rem;font-weight:800;color:#dc2626;letter-spacing:.5px;margin-top:5px;}
.qmeta{display:flex;justify-content:center;gap:14px;margin-top:4px;font-size:.66rem;font-weight:800;color:#64748b;letter-spacing:.5px;}
.qmeta .qbar{display:inline-block;width:60px;height:5px;background:#e2e8f0;border-radius:99px;overflow:hidden;vertical-align:middle;margin-left:4px;}
.qmeta .qbar span{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);transform-origin:left;transform:scaleX(1);transition:transform .12s linear;}

/* ── field ── */
.field{flex:1;position:relative;margin:4px 8px 0;padding-bottom:18px;display:flex;align-items:center;justify-content:center;}
.field::before{content:'';position:absolute;left:0;right:0;bottom:0;height:48%;background:radial-gradient(ellipse at 50% 30%,rgba(34,197,94,.45) 0%,rgba(34,197,94,0) 65%);pointer-events:none;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;width:100%;max-width:480px;padding:8px;}

/* ── hole + mole ── */
.slot{position:relative;aspect-ratio:1.18/1;display:flex;align-items:flex-end;justify-content:center;}
.hole{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:90%;height:36%;
  background:radial-gradient(ellipse at 50% 35%,#1c1917 0%,#292524 38%,#44403c 78%,transparent 100%);
  border-radius:50%;box-shadow:0 6px 0 -2px rgba(15,23,42,.18),inset 0 4px 6px rgba(0,0,0,.6),inset 0 -3px 3px rgba(160,82,45,.35);
  z-index:1;
}
.hole::before{content:'';position:absolute;inset:-10% -8% -45% -8%;background:radial-gradient(ellipse at 50% 100%,#86efac 0%,#4ade80 36%,transparent 72%);z-index:-1;border-radius:50%;}
.hole::after{content:'';position:absolute;left:6%;right:6%;top:-6%;height:14%;background:linear-gradient(180deg,rgba(120,53,15,.55),rgba(120,53,15,0));border-radius:50%;filter:blur(1px);}
.mole{position:absolute;left:50%;bottom:8%;width:62%;transform:translate(-50%,75%) scaleY(.9);z-index:2;pointer-events:none;will-change:transform;}
.mole.show{pointer-events:auto;}
.mole-body{position:relative;width:100%;aspect-ratio:1.05/1;background:linear-gradient(160deg,#a16207 0%,#92400e 58%,#78350f 100%);
  border-radius:50% 50% 46% 46% / 56% 56% 44% 44%;box-shadow:0 5px 14px rgba(15,23,42,.28),inset 0 -8px 12px rgba(67,20,7,.5),inset 0 4px 0 rgba(253,224,71,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6%;}
.mole-snout{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:48%;height:36%;background:radial-gradient(ellipse at 50% 30%,#fde68a 0%,#fbbf24 65%,#d97706 100%);border-radius:50%;box-shadow:inset 0 -3px 5px rgba(120,53,15,.4);}
.mole-nose{position:absolute;top:14%;left:50%;transform:translateX(-50%);width:18%;height:22%;background:#1c1917;border-radius:50%;box-shadow:inset 0 -2px 2px rgba(255,255,255,.18);}
.mole-eye{position:absolute;top:18%;width:14%;height:18%;background:#0c0a09;border-radius:50%;box-shadow:0 1px 0 rgba(254,243,199,.15),inset 1px -1px 0 rgba(255,255,255,.5);}
.mole-eye.l{left:20%;}.mole-eye.r{right:20%;}
.mole-eye::after{content:'';position:absolute;top:18%;left:14%;width:30%;height:30%;background:#fff;border-radius:50%;}
.mole-whisker{position:absolute;bottom:32%;width:22%;height:1px;background:rgba(28,25,23,.7);box-shadow:0 4px 0 rgba(28,25,23,.5);}
.mole-whisker.l{left:6%;transform:rotate(-6deg);}
.mole-whisker.r{right:6%;transform:rotate(6deg);}
.mole-sign{position:absolute;bottom:115%;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#fef3c7,#fde68a);border:2px solid #b45309;border-radius:9px;padding:3px 9px;font-size:.86rem;line-height:1.05;font-weight:900;color:#7c2d12;box-shadow:0 4px 8px rgba(120,53,15,.32),inset 0 1px 0 rgba(255,255,255,.6);white-space:normal;max-width:140%;text-align:center;font-family:'Baloo 2',sans-serif;}
.mole-sign::after{content:'';position:absolute;top:100%;left:50%;width:3px;height:14px;background:#7c2d12;transform:translateX(-50%);border-radius:1px;}

/* ── motion phases ── */
.mole.popping{animation:molePop .42s cubic-bezier(.32,1.4,.42,1) forwards;}
.mole.up{animation:moleBob 1.6s ease-in-out infinite;animation-delay:.42s;}
.mole.submerge{animation:moleSubmerge .36s cubic-bezier(.5,.0,.7,.4) forwards;}
.mole.hit{animation:moleHit .42s cubic-bezier(.3,.5,.4,1) forwards;}
.mole.miss{animation:moleMiss .38s ease forwards;}

@keyframes molePop{
  0%  {transform:translate(-50%,90%) scaleY(.72) scaleX(1.08);}
  35% {transform:translate(-50%,-22%) scaleY(1.12) scaleX(.92);}
  62% {transform:translate(-50%,4%) scaleY(.92) scaleX(1.06);}
  82% {transform:translate(-50%,-4%) scaleY(1.04) scaleX(.98);}
  100%{transform:translate(-50%,0%)  scaleY(1)    scaleX(1);}
}
@keyframes moleBob{
  0%,100%{transform:translate(-50%,0%) rotate(-1.2deg);}
  50%    {transform:translate(-50%,-5%) rotate(1.2deg);}
}
@keyframes moleSubmerge{
  0%  {transform:translate(-50%,0%) scaleY(1) scaleX(1);}
  18% {transform:translate(-50%,-12%) scaleY(1.16) scaleX(.84);}
  55% {transform:translate(-50%,45%) scaleY(.7) scaleX(1.14);}
  100%{transform:translate(-50%,95%) scaleY(.5) scaleX(1.2);opacity:.7;}
}
@keyframes moleHit{
  0%  {transform:translate(-50%,0%) scaleY(1) scaleX(1);}
  20% {transform:translate(-50%,18%) scaleY(.42) scaleX(1.4);filter:brightness(1.45);}
  60% {transform:translate(-50%,80%) scaleY(.32) scaleX(1.2);filter:brightness(1);opacity:.85;}
  100%{transform:translate(-50%,110%) scaleY(.2) scaleX(1.05);opacity:0;}
}
@keyframes moleMiss{
  0%,100%{transform:translate(-50%,0%);}
  25%  {transform:translate(-58%,0%) rotate(-6deg);}
  60%  {transform:translate(-42%,0%) rotate(6deg);}
  82%  {transform:translate(-52%,0%) rotate(-2deg);}
}

/* ── dust puff ── */
.dust{position:absolute;left:50%;bottom:18%;width:0;height:0;pointer-events:none;z-index:3;}
.dust span{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fde68a 0%,#fbbf24 60%,rgba(251,191,36,0) 100%);transform:translate(-50%,-50%);animation:dustOut .58s ease-out forwards;}
@keyframes dustOut{
  0%  {opacity:0;transform:translate(-50%,-50%) scale(.4);}
  20% {opacity:1;}
  100%{opacity:0;transform:translate(var(--dx,40px),var(--dy,-60px)) scale(1.4);}
}

/* ── strike fx ── */
.strike{position:absolute;left:50%;bottom:55%;transform:translate(-50%,-50%);pointer-events:none;z-index:4;font-size:1.6rem;font-weight:900;font-family:'Baloo 2',sans-serif;
  color:#fef3c7;text-shadow:0 0 12px rgba(254,240,138,.9),0 3px 0 #b45309,0 0 0 transparent;letter-spacing:1px;animation:strikeOut .56s cubic-bezier(.2,1.4,.3,1) forwards;}
.strike.ok{color:#dcfce7;text-shadow:0 0 14px rgba(74,222,128,.95),0 3px 0 #166534;}
.strike.ng{color:#fee2e2;text-shadow:0 0 14px rgba(248,113,113,.95),0 3px 0 #991b1b;}
@keyframes strikeOut{
  0%  {opacity:0;transform:translate(-50%,30%) scale(.5) rotate(-8deg);}
  22% {opacity:1;transform:translate(-50%,-30%) scale(1.18) rotate(2deg);}
  62% {opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg);}
  100%{opacity:0;transform:translate(-50%,-110%) scale(.9) rotate(0deg);}
}

/* ── score pop ── */
.pop{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;
  font-family:'Baloo 2',sans-serif;font-weight:900;font-size:1.4rem;color:#fef3c7;
  text-shadow:0 0 12px rgba(254,240,138,.85),0 3px 0 #b45309;animation:popOut .8s ease-out forwards;}
@keyframes popOut{
  0%  {opacity:0;transform:translate(-50%,0%) scale(.6);}
  18% {opacity:1;transform:translate(-50%,-50%) scale(1.1);}
  100%{opacity:0;transform:translate(-50%,-130%) scale(.95);}
}

/* ── hammer cursor ── */
.field{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g transform='rotate(-30 20 20)'><rect x='17' y='14' width='6' height='22' rx='2' fill='%237c2d12'/><rect x='10' y='6' width='20' height='12' rx='3' fill='%23dc2626'/><rect x='10' y='6' width='20' height='4' rx='2' fill='%23ef4444'/></g></svg>") 14 4, pointer;}

/* ── overlays ── */
#screen-start,#screen-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.55);backdrop-filter:blur(8px);z-index:20;padding:24px;}
.panel{background:#fff;border-radius:24px;padding:24px 22px;text-align:center;width:100%;max-width:380px;box-shadow:0 24px 48px rgba(15,23,42,.32);}
.panel h2{font-family:'Baloo 2',sans-serif;font-size:1.6rem;font-weight:900;color:var(--ink);margin-bottom:6px;}
.panel p{font-size:.86rem;font-weight:700;color:#475569;margin-bottom:14px;line-height:1.55;}
.panel .units{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px;}
.panel .units button{background:#f1f5f9;border:1.5px solid #e2e8f0;color:#0c4a6e;font-family:inherit;font-weight:800;font-size:.78rem;padding:9px;border-radius:12px;cursor:pointer;transition:all .18s;}
.panel .units button:hover{background:#e0f2fe;border-color:#7dd3fc;}
.panel .units button.on{background:linear-gradient(135deg,#0ea5e9,#0369a1);border-color:#0369a1;color:#fff;box-shadow:0 6px 14px rgba(14,165,233,.32);}
.panel .go{background:linear-gradient(135deg,#16a34a 0%,#0d9488 100%);border:none;color:#fff;font-family:inherit;font-weight:900;font-size:1.05rem;padding:13px 20px;border-radius:16px;width:100%;cursor:pointer;box-shadow:0 10px 22px rgba(22,163,74,.32);transition:all .18s;}
.panel .go:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(22,163,74,.4);}
.end-actions{display:flex;flex-direction:column;gap:8px;}
.back-btn{display:block;text-align:center;padding:11px 18px;border-radius:14px;background:#f1f5f9;border:1.5px solid #cbd5e1;color:#0c4a6e;font-family:inherit;font-weight:800;font-size:.95rem;text-decoration:none;transition:all .18s;}
.back-btn:hover{background:#e0f2fe;border-color:#0ea5e9;color:#0369a1;}
.panel .stats{display:flex;justify-content:space-around;margin:12px 0;}
.panel .stats div{font-size:.78rem;font-weight:800;color:#64748b;}
.panel .stats strong{display:block;font-size:1.5rem;color:var(--ink);font-family:'Baloo 2',sans-serif;}
.hide{display:none!important;}

/* ── feedback flash ── */
.field.ok-flash::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(34,197,94,.4),transparent 65%);pointer-events:none;animation:flashOut .35s ease-out forwards;}
.field.ng-flash::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(220,38,38,.42),transparent 65%);pointer-events:none;animation:flashOut .35s ease-out forwards;}
@keyframes flashOut{from{opacity:1;}to{opacity:0;}}

/* ── impact: shake & smash ring ── */
.field.shake{animation:shakeField .38s cubic-bezier(.36,.07,.19,.97);}
@keyframes shakeField{
  0%,100%{transform:translate(0,0);}
  12%{transform:translate(-11px,5px) rotate(-1.3deg);}
  26%{transform:translate(12px,-6px) rotate(1.5deg);}
  42%{transform:translate(-9px,5px) rotate(-1deg);}
  58%{transform:translate(8px,-4px) rotate(.8deg);}
  74%{transform:translate(-5px,3px) rotate(-.4deg);}
  88%{transform:translate(3px,-1px);}
}
#app.shake-mid{animation:shakeMid .42s cubic-bezier(.36,.07,.19,.97);}
@keyframes shakeMid{
  0%,100%{transform:translate(0,0);}
  18%{transform:translate(-6px,3px) rotate(-.5deg);}
  38%{transform:translate(7px,-4px) rotate(.6deg);}
  58%{transform:translate(-4px,2px) rotate(-.3deg);}
  78%{transform:translate(3px,-1px) rotate(.2deg);}
}
.smash{position:absolute;width:18px;height:18px;border-radius:50%;border:5px solid #fef3c7;
  transform:translate(-50%,-50%);pointer-events:none;z-index:6;
  box-shadow:0 0 24px rgba(254,243,199,.85),0 0 6px rgba(217,119,6,.7);
  animation:smashRing .5s cubic-bezier(.2,.7,.3,1) forwards;}
.smash.ng{border-color:#fecaca;box-shadow:0 0 24px rgba(254,202,202,.85),0 0 6px rgba(220,38,38,.6);}
@keyframes smashRing{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2);border-width:8px;}
  18%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) scale(5.2);border-width:1px;}
}
.spark{position:absolute;width:5px;height:18px;background:linear-gradient(180deg,#fef3c7,rgba(254,243,199,0));
  transform-origin:50% 100%;pointer-events:none;z-index:6;border-radius:2px;
  animation:sparkOut .42s ease-out forwards;}
@keyframes sparkOut{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a,0deg)) scaleY(.3);}
  20%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a,0deg)) scaleY(2.4) translateY(-22px);}
}

/* ── game over sequence ── */
#app.shake-strong{animation:shakeStrong .9s cubic-bezier(.36,.07,.19,.97);}
@keyframes shakeStrong{
  0%,100%{transform:translate(0,0);}
  10%{transform:translate(-12px,5px) rotate(-1deg);}
  22%{transform:translate(13px,-8px) rotate(1.2deg);}
  35%{transform:translate(-11px,6px) rotate(-.8deg);}
  48%{transform:translate(10px,-5px) rotate(.6deg);}
  62%{transform:translate(-7px,3px) rotate(-.4deg);}
  78%{transform:translate(5px,-2px) rotate(.3deg);}
  92%{transform:translate(-2px,1px);}
}
.gover-overlay{position:absolute;inset:0;pointer-events:none;z-index:18;
  background:radial-gradient(circle at 50% 45%,rgba(127,29,29,0) 0%,rgba(76,5,25,.55) 55%,rgba(15,23,42,.78) 100%);
  opacity:0;animation:goverFade 1.5s ease-out forwards;}
@keyframes goverFade{0%{opacity:0;}25%{opacity:1;}100%{opacity:1;}}
.gover-text{position:absolute;left:50%;top:46%;
  font-family:'Baloo 2',sans-serif;font-weight:900;font-size:3rem;letter-spacing:3px;color:#fef2f2;
  text-shadow:0 0 28px rgba(254,202,202,.9),0 5px 0 #7f1d1d,0 8px 24px rgba(0,0,0,.55);
  pointer-events:none;z-index:19;white-space:nowrap;
  animation:goverDrop 1.4s cubic-bezier(.2,1.4,.3,1) forwards;}
@keyframes goverDrop{
  0%{opacity:0;transform:translate(-50%,-180%) scale(.5) rotate(-12deg);}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg);}
  55%{transform:translate(-50%,-50%) scale(.96) rotate(-1deg);}
  72%{transform:translate(-50%,-50%) scale(1.04) rotate(.6deg);}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);}
}
</style>
</head>
<body>
<div id="app">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <header>
    <a class="back" href="../index.html">← 홈</a>
    <div class="title"><small>WHACK · 문법 두더지</small>정답 두더지를 두들겨라!</div>
    <span style="width:40px;"></span>
  </header>
  <div class="hud">
    <div class="hud-card"><span class="lbl">점수</span><span class="val" id="hud-score">0</span></div>
    <div class="hud-card"><span class="lbl">콤보</span><span class="val combo" id="hud-combo">×0</span></div>
    <div class="hud-card"><span class="lbl">HP</span><div class="hp-row" id="hud-hp"><span></span><span></span><span></span></div></div>
  </div>
  <div class="qcard">
    <div class="qkor" id="q-kor">한국어 해석</div>
    <div class="qeng" id="q-eng">English sentence</div>
    <div class="qhint">⚠ 틀린 부분을 고쳐 두드리세요</div>
    <div class="qmeta"><span id="q-progress">1 / 10</span><span>제한시간 <span class="qbar"><span id="q-bar"></span></span></span></div>
  </div>
  <div class="field" id="field">
    <div class="grid" id="grid"></div>
  </div>

  <div id="screen-start">
    <div class="panel">
      <h2>두더지 문법 잡기</h2>
      <p>두더지 머리 위 단어가 답이면 두드려요.<br>오답을 두드리면 HP가 깎입니다.</p>
      <div class="units" id="unit-list"></div>
      <button class="go" id="btn-go">시작!</button>
    </div>
  </div>
  <div id="screen-end" class="hide">
    <div class="panel">
      <h2 id="end-title">잘했어요!</h2>
      <p id="end-sub">정답 두더지를 잘 골라냈네요.</p>
      <div class="stats">
        <div><strong id="end-score">0</strong>점수</div>
        <div><strong id="end-correct">0</strong>정답</div>
        <div><strong id="end-combo">0</strong>최고콤보</div>
      </div>
      <div class="end-actions">
        <button class="go" id="btn-retry">다시 도전</button>
        <a class="back-btn" href="../game/">목록으로</a>
      </div>
    </div>
  </div>
</div>

<script>function toast(msg, type){}</script>
<script src="../sounds.js"></script>
<script src="../score-popup.js"></script>
<script src="../game/questions.js"></script>
<script>
const SLOT_COUNT = 9;
const ROUND_QUESTIONS = 10;
const Q_TIME = 9500;            // per-question time limit (ms)
const MOLE_LIFE_MIN = 3000;     // mole on-screen min
const MOLE_LIFE_MAX = 4200;     // mole on-screen max
const SPAWN_INTERVAL = [780, 1180]; // ms between spawns
const MAX_LIVE_MOLES = 3;

let unitKey = 'g1-l1';
let questionPool = [];
let qIdx = 0;
let score = 0;
let combo = 0;
let bestCombo = 0;
let hp = 3;
let correctCount = 0;
let answered = false;
let qStart = 0;
let qTimerRaf = 0;
let spawnTimer = 0;
let qTimeoutTimer = 0;
let liveMoles = new Map(); // slotIdx → mole DOM
let pendingOpts = [];      // options yet to spawn for current question
let currentAns = '';
let gameRunning = false;

const grid = document.getElementById('grid');
const field = document.getElementById('field');
const qKor = document.getElementById('q-kor');
const qEng = document.getElementById('q-eng');
const qProg = document.getElementById('q-progress');
const qBar = document.getElementById('q-bar');
const hudScore = document.getElementById('hud-score');
const hudCombo = document.getElementById('hud-combo');
const hudHp = document.getElementById('hud-hp');

function buildGrid() {
  grid.innerHTML = '';
  for (let i = 0; i < SLOT_COUNT; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.idx = i;
    slot.innerHTML = '<div class="hole"></div>';
    grid.appendChild(slot);
  }
}

function buildUnitList() {
  const list = document.getElementById('unit-list');
  list.innerHTML = '';
  Object.entries(GAME_QUESTIONS).forEach(([key, info]) => {
    const btn = document.createElement('button');
    btn.textContent = info.label.replace('중1 ', '').replace('중2 ', 'g2-');
    btn.dataset.key = key;
    if (key === unitKey) btn.classList.add('on');
    btn.addEventListener('click', () => {
      list.querySelectorAll('button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      unitKey = key;
    });
    list.appendChild(btn);
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickQuestionPool(key) {
  const src = GAME_QUESTIONS[key];
  if (!src) return [];
  // whack mode needs a fill-in-blank shape; skip metas without '___'
  const playable = src.questions.filter(q => /_{3,}/.test(q.eng || ''));
  return shuffle(playable.slice()).slice(0, ROUND_QUESTIONS);
}

function startGame() {
  questionPool = pickQuestionPool(unitKey);
  if (!questionPool.length) { alert('문제를 불러올 수 없어요.'); return; }
  qIdx = 0; score = 0; combo = 0; bestCombo = 0; hp = 3; correctCount = 0;
  document.getElementById('screen-start').classList.add('hide');
  document.getElementById('screen-end').classList.add('hide');
  buildGrid();
  updateHud();
  gameRunning = true;
  nextQuestion();
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(qTimerRaf);
  clearTimeout(spawnTimer);
  clearTimeout(qTimeoutTimer);
  liveMoles.forEach((m) => m.remove());
  liveMoles.clear();
  const title = hp > 0 ? '잘했어요!' : '아쉽다!';
  document.getElementById('end-title').textContent = title;
  document.getElementById('end-sub').textContent = `${correctCount} / ${questionPool.length} 정답 · 최고 콤보 ${bestCombo}`;
  document.getElementById('end-score').textContent = score;
  document.getElementById('end-correct').textContent = correctCount;
  document.getElementById('end-combo').textContent = bestCombo;
  document.getElementById('screen-end').classList.remove('hide');
  if (typeof window.showScorePopup === 'function') {
    window.showScorePopup(correctCount, questionPool.length, { title });
  }
}

function updateHud() {
  hudScore.textContent = score;
  hudCombo.textContent = '×' + combo;
  const hpSpans = hudHp.querySelectorAll('span');
  hpSpans.forEach((sp, i) => sp.classList.toggle('gone', i >= hp));
}

function renderQuestion() {
  const q = questionPool[qIdx];
  qKor.textContent = q.kor;
  // q.eng has '___' — substitute a wrong option in red strike-through so the
  // sentence reads as an error to fix, then student picks the right answer mole
  const wrongOpt = q.opts.find(o => o !== q.ans) || '____';
  const safe = wrongOpt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // strip parenthetical hints like '(be)' / '(be, 부정형)' — they suit fill-in-blank, not error-correction
  const cleaned = q.eng.replace(/\s*\([^)]*\)/g, '');
  qEng.innerHTML = cleaned.replace(/_{3,}/g, `<span class="qwrong">${safe}</span>`);
  qProg.textContent = `${qIdx + 1} / ${questionPool.length}`;
}

function nextQuestion() {
  if (!gameRunning) return;
  if (qIdx >= questionPool.length || hp <= 0) { endGame(); return; }
  answered = false;
  const q = questionPool[qIdx];
  currentAns = q.ans;
  pendingOpts = shuffle(q.opts.slice());
  renderQuestion();
  qStart = performance.now();
  cancelAnimationFrame(qTimerRaf);
  qTimerRaf = requestAnimationFrame(tickQTimer);
  clearTimeout(qTimeoutTimer);
  qTimeoutTimer = setTimeout(onQTimeout, Q_TIME);
  scheduleSpawn(120);
}

function tickQTimer() {
  if (!gameRunning || answered) return;
  const elapsed = performance.now() - qStart;
  const left = Math.max(0, 1 - elapsed / Q_TIME);
  qBar.style.transform = `scaleX(${left})`;
  if (left > 0) qTimerRaf = requestAnimationFrame(tickQTimer);
}

function onQTimeout() {
  if (answered) return;
  answered = true;
  loseHp();
  spawnStrike('시간초과', 'ng');
  playWhackMiss();
  if (hp <= 0) { triggerGameOver(); return; }
  setTimeout(advance, 700);
}

function advance() {
  cancelAnimationFrame(qTimerRaf);
  clearTimeout(qTimeoutTimer);
  clearTimeout(spawnTimer);
  pendingOpts = [];
  liveMoles.forEach(({mole, lifeTimer}) => {
    clearTimeout(lifeTimer);
    submergeMole(mole);
  });
  liveMoles.clear();
  qIdx++;
  setTimeout(nextQuestion, 460);
}

function scheduleSpawn(delay) {
  if (!gameRunning || answered) return;
  clearTimeout(spawnTimer);
  spawnTimer = setTimeout(spawnMole, delay);
}

function spawnMole() {
  if (!gameRunning || answered) return;
  if (liveMoles.size >= MAX_LIVE_MOLES) {
    scheduleSpawn(420);
    return;
  }
  if (!pendingOpts.length) {
    // re-cycle full option set so the correct answer keeps reappearing
    const q = questionPool[qIdx];
    pendingOpts = shuffle(q.opts.slice());
  }
  // ensure the correct answer is alive or queued: if not, promote it
  const aliveWords = new Set([...liveMoles.values()].map(v => v.word));
  if (!aliveWords.has(currentAns) && !pendingOpts.includes(currentAns)) {
    pendingOpts.unshift(currentAns);
  }
  const word = pendingOpts.shift();
  // pick an empty slot (also skip slots still hosting a submerging mole in DOM)
  const occupied = new Set(liveMoles.keys());
  const avail = [];
  for (let i = 0; i < SLOT_COUNT; i++) {
    if (occupied.has(i)) continue;
    if (grid.children[i].querySelector('.mole')) continue;
    avail.push(i);
  }
  if (!avail.length) { scheduleSpawn(380); return; }
  const slotIdx = avail[Math.floor(Math.random() * avail.length)];
  const slot = grid.children[slotIdx];
  const mole = document.createElement('div');
  mole.className = 'mole show popping';
  mole.innerHTML = `
    <div class="mole-sign">${word}</div>
    <div class="mole-body">
      <div class="mole-eye l"></div><div class="mole-eye r"></div>
      <div class="mole-snout"><div class="mole-nose"></div></div>
      <div class="mole-whisker l"></div><div class="mole-whisker r"></div>
    </div>`;
  slot.appendChild(mole);
  // after pop, switch to idle bob
  setTimeout(() => {
    if (mole.parentNode) mole.classList.replace('popping', 'up');
  }, 420);
  mole.addEventListener('click', (e) => handleHit(e, mole, slotIdx, word), { once: true });
  mole.addEventListener('touchend', (e) => { e.preventDefault(); handleHit(e, mole, slotIdx, word); }, { once: true });
  const life = MOLE_LIFE_MIN + Math.random() * (MOLE_LIFE_MAX - MOLE_LIFE_MIN);
  const lifeTimer = setTimeout(() => {
    if (liveMoles.has(slotIdx)) {
      submergeMole(mole);
      liveMoles.delete(slotIdx);
    }
  }, life);
  liveMoles.set(slotIdx, { mole, lifeTimer, word });
  scheduleSpawn(SPAWN_INTERVAL[0] + Math.random() * (SPAWN_INTERVAL[1] - SPAWN_INTERVAL[0]));
}

function submergeMole(mole) {
  if (!mole || !mole.parentNode) return;
  mole.classList.remove('up', 'popping');
  mole.classList.add('submerge');
  mole.style.pointerEvents = 'none';
  setTimeout(() => mole.remove(), 380);
}

function handleHit(e, mole, slotIdx, word) {
  if (!gameRunning || answered) return;
  const correct = word === currentAns;
  // remove from live tracking
  const rec = liveMoles.get(slotIdx);
  if (rec) clearTimeout(rec.lifeTimer);
  liveMoles.delete(slotIdx);
  mole.style.pointerEvents = 'none';
  spawnSmash(mole, correct ? 'ok' : 'ng');
  shakeField();
  playWhackHit();   // 망치 충돌은 정답/오답 동일하게 들림
  if (correct) {
    answered = true;
    correctCount++;
    combo++;
    bestCombo = Math.max(bestCombo, combo);
    const gain = 100 + Math.min(combo - 1, 9) * 20;
    score += gain;
    mole.classList.remove('up', 'popping');
    mole.classList.add('hit');
    burstDust(mole);
    spawnPop(`+${gain}`);
    spawnStrike(combo > 1 ? `${combo}콤보!` : '정답!', 'ok');
    if (typeof window.toast === 'function') window.toast('맞아!', 'ok');
    setTimeout(() => mole.remove(), 420);
    updateHud();
    setTimeout(advance, 560);
  } else {
    combo = 0;
    loseHp();
    mole.classList.remove('up', 'popping');
    mole.classList.add('miss');
    spawnStrike('빗나감!', 'ng');
    playWhackMiss();  // thud 위에 whoosh 레이어
    setTimeout(() => submergeMole(mole), 380);
    updateHud();
    if (hp <= 0) { answered = true; triggerGameOver(); }
  }
}

function shakeField() {
  field.classList.remove('shake');
  // force reflow so the animation restarts
  void field.offsetWidth;
  field.classList.add('shake');
  const app = document.getElementById('app');
  app.classList.remove('shake-mid');
  void app.offsetWidth;
  app.classList.add('shake-mid');
  setTimeout(() => app.classList.remove('shake-mid'), 460);
}

// ── inline 사운드 (whack 전용, sounds.js 건드리지 않음) ──────────────
let _whackCtx = null;
function whackAC() {
  if (!_whackCtx) {
    try { _whackCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (_whackCtx.state === 'suspended') _whackCtx.resume().catch(() => {});
  return _whackCtx;
}
function _tone(c, freq, type, t0, dur, vol) {
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function _noiseBurst(c, t0, dur, vol, cutoff) {
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
  const src = c.createBufferSource();
  src.buffer = buf;
  const filt = c.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = cutoff || 1800;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
function playWhackHit() {
  const c = whackAC(); if (!c) return;
  const t = c.currentTime;
  // 저역 thud: 110→55Hz
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(110, t);
  osc.frequency.exponentialRampToValueAtTime(55, t + 0.14);
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t + 0.26);
  _noiseBurst(c, t, 0.07, 0.32, 2400);     // 상단 crack
  _tone(c, 880, 'triangle', t + 0.015, 0.08, 0.12); // 메탈릭 핑
}
function playWhackMiss() {
  const c = whackAC(); if (!c) return;
  const t = c.currentTime;
  _noiseBurst(c, t, 0.18, 0.14, 900);
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(330, t);
  osc.frequency.exponentialRampToValueAtTime(160, t + 0.22);
  g.gain.setValueAtTime(0.14, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t + 0.32);
}
function playGameOver() {
  const c = whackAC(); if (!c) return;
  const t = c.currentTime;
  const thud = c.createOscillator();
  const tg = c.createGain();
  thud.type = 'sine';
  thud.frequency.setValueAtTime(160, t);
  thud.frequency.exponentialRampToValueAtTime(50, t + 0.5);
  tg.gain.setValueAtTime(0.5, t);
  tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
  thud.connect(tg); tg.connect(c.destination);
  thud.start(t); thud.stop(t + 0.74);
  _tone(c, 523.25, 'triangle', t + 0.05, 0.18, 0.22); // C5
  _tone(c, 466.16, 'triangle', t + 0.22, 0.18, 0.22); // Bb4
  _tone(c, 369.99, 'triangle', t + 0.40, 0.22, 0.24); // F#4
  _tone(c, 311.13, 'triangle', t + 0.62, 0.40, 0.26); // Eb4
}

function spawnSmash(mole, type) {
  const slot = mole.parentNode;
  if (!slot) return;
  // 두더지 머리 기준 위치
  const ring = document.createElement('div');
  ring.className = 'smash' + (type === 'ng' ? ' ng' : '');
  ring.style.left = '50%';
  ring.style.top = '36%';
  slot.appendChild(ring);
  setTimeout(() => ring.remove(), 560);
  // 스파크 6방향 (정답일 때만)
  if (type === 'ok') {
    for (let i = 0; i < 6; i++) {
      const sp = document.createElement('div');
      sp.className = 'spark';
      sp.style.left = '50%';
      sp.style.top = '36%';
      sp.style.setProperty('--a', `${i * 60 + (Math.random() - .5) * 20}deg`);
      slot.appendChild(sp);
      setTimeout(() => sp.remove(), 480);
    }
  }
}

function triggerGameOver() {
  // 두더지/타이머 즉시 정지하지만 게임 오버 연출 후 endGame 호출
  cancelAnimationFrame(qTimerRaf);
  clearTimeout(spawnTimer);
  clearTimeout(qTimeoutTimer);
  liveMoles.forEach(({mole, lifeTimer}) => {
    clearTimeout(lifeTimer);
    submergeMole(mole);
  });
  liveMoles.clear();
  // 강한 흔들림
  const app = document.getElementById('app');
  app.classList.remove('shake-strong');
  void app.offsetWidth;
  app.classList.add('shake-strong');
  // 어두운 오버레이 + GAME OVER 텍스트
  const overlay = document.createElement('div');
  overlay.className = 'gover-overlay';
  app.appendChild(overlay);
  const text = document.createElement('div');
  text.className = 'gover-text';
  text.textContent = 'GAME OVER';
  app.appendChild(text);
  playGameOver();
  setTimeout(() => {
    overlay.remove();
    text.remove();
    app.classList.remove('shake-strong');
    endGame();
  }, 1700);
}

function loseHp() {
  hp = Math.max(0, hp - 1);
  field.classList.add('ng-flash');
  setTimeout(() => field.classList.remove('ng-flash'), 340);
  updateHud();
}

function burstDust(mole) {
  const slot = mole.parentNode;
  if (!slot) return;
  const dust = document.createElement('div');
  dust.className = 'dust';
  dust.style.left = '50%';
  dust.style.bottom = '24%';
  for (let i = 0; i < 7; i++) {
    const sp = document.createElement('span');
    const ang = -Math.PI / 2 + (Math.random() - .5) * Math.PI * .9;
    const dist = 36 + Math.random() * 30;
    sp.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
    sp.style.setProperty('--dy', `${Math.sin(ang) * dist}px`);
    sp.style.animationDelay = (i * 18) + 'ms';
    dust.appendChild(sp);
  }
  slot.appendChild(dust);
  setTimeout(() => dust.remove(), 700);
  field.classList.add('ok-flash');
  setTimeout(() => field.classList.remove('ok-flash'), 340);
}

function spawnStrike(text, type) {
  const fx = document.createElement('div');
  fx.className = 'strike ' + (type || '');
  fx.textContent = text;
  field.appendChild(fx);
  setTimeout(() => fx.remove(), 600);
}

function spawnPop(text) {
  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.textContent = text;
  field.appendChild(pop);
  setTimeout(() => pop.remove(), 820);
}

// ── debug hook (dev/test only) ──
if (location.search.includes('debug')) {
  window.__whack = { get currentAns(){return currentAns;}, get qIdx(){return qIdx;}, get score(){return score;}, get hp(){return hp;}, get combo(){return combo;} };
}
// ── boot ──
document.getElementById('btn-go').addEventListener('click', startGame);
document.getElementById('btn-retry').addEventListener('click', startGame);
const _params = new URLSearchParams(location.search);
const _unitParam = _params.get('unit');
if (_unitParam && GAME_QUESTIONS[_unitParam]) unitKey = _unitParam;
buildUnitList();
buildGrid();
if (_unitParam && GAME_QUESTIONS[_unitParam]) {
  // auto-start when arriving via mode selector
  setTimeout(startGame, 60);
}
</script>
