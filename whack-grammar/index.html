<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>두더지 문법 잡기</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#08081a;--bg1:#0f0a26;--bg2:#1a0a36;
  --neon-cyan:#22d3ee;--neon-mag:#e879f9;--neon-amber:#fbbf24;--neon-pink:#f472b6;
  --ink:#e0e7ff;--ink-dim:#94a3b8;
  --ok:#34d399;--ng:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Baloo 2','Noto Sans KR',sans-serif;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(168,85,247,.22),transparent 55%),
    radial-gradient(ellipse at 80% 100%,rgba(34,211,238,.18),transparent 50%),
    linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 50%,var(--bg2) 100%);
  color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
/* 가는 그리드(아케이드 바닥) */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;
  background-image:
    linear-gradient(rgba(34,211,238,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.16) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(180deg,transparent 0%,#000 24%,#000 78%,transparent 100%);
}
/* 스캔라인 */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;
  background:repeating-linear-gradient(180deg,transparent 0,transparent 2px,#fff 2px,#fff 3px);}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;z-index:1;}

/* ── decorative orbs ── */
.cloud{position:absolute;border-radius:50%;pointer-events:none;filter:blur(28px);opacity:.55;animation:drift linear infinite;}
.c1{width:140px;height:140px;top:8%;left:-40px;background:radial-gradient(circle,#a855f7 0%,transparent 70%);animation-duration:48s;}
.c2{width:90px;height:90px;top:32%;right:-30px;background:radial-gradient(circle,#22d3ee 0%,transparent 70%);animation-duration:66s;animation-delay:-12s;}
.c3{width:110px;height:110px;bottom:18%;left:8%;background:radial-gradient(circle,#f472b6 0%,transparent 70%);animation-duration:80s;animation-delay:-30s;}
@keyframes drift{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(28px,-22px);}
}

/* ── header ── */
header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;position:relative;z-index:5;}
.back{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.42);color:var(--neon-cyan);
  font-family:inherit;font-weight:800;font-size:.78rem;padding:6px 12px;border-radius:18px;
  cursor:pointer;text-decoration:none;backdrop-filter:blur(6px);
  text-shadow:0 0 8px rgba(34,211,238,.55);box-shadow:0 0 14px rgba(34,211,238,.18),inset 0 0 8px rgba(34,211,238,.08);}
.back:hover{background:rgba(34,211,238,.16);}
.title{flex:1;text-align:center;font-weight:900;font-size:1.05rem;color:var(--ink);
  text-shadow:0 0 10px rgba(224,231,255,.4),0 0 22px rgba(168,85,247,.35);}
.title small{display:block;font-size:.62rem;font-weight:800;letter-spacing:2.4px;color:var(--neon-cyan);margin-bottom:1px;
  text-shadow:0 0 8px rgba(34,211,238,.6);}

/* ── HUD ── */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 8px;}
.hud-card{background:rgba(15,10,38,.62);border:1px solid rgba(168,85,247,.32);border-radius:14px;
  padding:6px 12px;font-weight:900;font-size:.82rem;display:flex;align-items:center;gap:6px;
  backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(168,85,247,.16),inset 0 0 12px rgba(168,85,247,.06);}
.hud-card .lbl{font-size:.58rem;font-weight:800;color:var(--neon-cyan);letter-spacing:1.6px;
  text-shadow:0 0 6px rgba(34,211,238,.5);}
.hud-card .val{font-variant-numeric:tabular-nums;color:var(--ink);
  text-shadow:0 0 10px rgba(224,231,255,.45);}
/* 점수판 크게 강조 */
.hud-card.score-big{padding:8px 16px;background:linear-gradient(135deg,rgba(34,211,238,.14),rgba(168,85,247,.18));
  border:1.5px solid rgba(34,211,238,.55);box-shadow:0 0 22px rgba(34,211,238,.32),0 0 44px rgba(168,85,247,.22),inset 0 0 16px rgba(34,211,238,.1);}
.hud-card.score-big .val{font-size:1.5rem;color:#fff;
  text-shadow:0 0 14px rgba(255,255,255,.85),0 0 26px rgba(34,211,238,.85),0 0 40px rgba(168,85,247,.5);
  transition:transform .14s cubic-bezier(.3,1.6,.4,1);}
.hud-card.score-big .val.score-bump{transform:scale(1.22);}
/* ×2 부스트 표시 */
.hud-card.boost{background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(232,121,249,.22));
  border-color:rgba(251,191,36,.65);box-shadow:0 0 22px rgba(251,191,36,.4),0 0 38px rgba(232,121,249,.3);
  animation:boostPulse 1.05s ease-in-out infinite;}
.hud-card.boost .lbl{color:var(--neon-amber);text-shadow:0 0 8px rgba(251,191,36,.7);}
.hud-card.boost .val{color:#fff;text-shadow:0 0 12px rgba(251,191,36,.85),0 0 22px rgba(232,121,249,.6);}
@keyframes boostPulse{
  0%,100%{box-shadow:0 0 22px rgba(251,191,36,.4),0 0 38px rgba(232,121,249,.3);}
  50%{box-shadow:0 0 34px rgba(251,191,36,.7),0 0 56px rgba(232,121,249,.55);}
}
.hp-row{display:flex;gap:4px;}
.hp-row span{width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#fecdd3 0%,#f87171 50%,#dc2626 100%);
  box-shadow:0 0 10px rgba(248,113,113,.85),0 0 18px rgba(248,113,113,.45);transition:all .25s;}
.hp-row span.gone{background:radial-gradient(circle,#3f3f5a,#1e1b3a);box-shadow:inset 0 0 4px rgba(0,0,0,.5);transform:scale(.7);opacity:.35;}
.combo{color:var(--neon-amber);text-shadow:0 0 10px rgba(251,191,36,.75);}

/* ── quiz card ── */
.qcard{margin:2px 14px 8px;background:rgba(8,8,26,.72);border:1px solid rgba(34,211,238,.42);border-radius:18px;
  padding:12px 16px;text-align:center;position:relative;z-index:3;min-height:100px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 26px rgba(34,211,238,.18),0 0 50px rgba(168,85,247,.12),inset 0 0 20px rgba(34,211,238,.05);}
.qkor{font-size:.84rem;font-weight:700;color:var(--ink-dim);margin-bottom:6px;font-family:'Noto Sans KR',sans-serif;}
.qeng{font-size:1.1rem;font-weight:900;color:var(--ink);letter-spacing:.3px;
  text-shadow:0 0 12px rgba(224,231,255,.35);}
.qeng .qwrong{display:inline-block;padding:2px 12px;color:var(--ng);background:rgba(248,113,113,.1);
  border:2px solid rgba(248,113,113,.62);border-radius:9px;text-decoration:line-through;text-decoration-thickness:2px;
  font-weight:900;font-size:1.18em;line-height:1.15;
  text-shadow:0 0 14px rgba(248,113,113,.85);box-shadow:0 0 18px rgba(248,113,113,.32),inset 0 0 10px rgba(248,113,113,.12);
  animation:qwrong-pulse 1.4s ease-in-out infinite;}
@keyframes qwrong-pulse{0%,100%{box-shadow:0 0 18px rgba(248,113,113,.32),inset 0 0 10px rgba(248,113,113,.12);transform:scale(1);}50%{box-shadow:0 0 30px rgba(248,113,113,.55),inset 0 0 16px rgba(248,113,113,.22);transform:scale(1.04);}}
.qhint{font-size:.7rem;font-weight:800;color:var(--neon-pink);letter-spacing:.5px;margin-top:6px;
  text-shadow:0 0 8px rgba(244,114,182,.55);}
.qmeta{display:flex;justify-content:center;gap:14px;margin-top:5px;font-size:.66rem;font-weight:800;
  color:var(--ink-dim);letter-spacing:.5px;}
.qmeta .qbar{display:inline-block;width:60px;height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;vertical-align:middle;margin-left:4px;
  box-shadow:inset 0 0 4px rgba(0,0,0,.4);}
.qmeta .qbar span{display:block;height:100%;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-amber),var(--ng));transform-origin:left;transform:scaleX(1);transition:transform .12s linear;
  box-shadow:0 0 8px rgba(34,211,238,.6);}

/* ── field ── */
.field{flex:1;position:relative;margin:4px 8px 0;padding-bottom:18px;display:flex;align-items:center;justify-content:center;}
.field::before{content:'';position:absolute;left:0;right:0;bottom:0;height:48%;
  background:radial-gradient(ellipse at 50% 50%,rgba(168,85,247,.22) 0%,rgba(34,211,238,.08) 38%,transparent 72%);
  pointer-events:none;filter:blur(8px);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;width:100%;max-width:480px;padding:8px;z-index:2;}

/* ── hole + mole ── */
.slot{position:relative;aspect-ratio:1.18/1;display:flex;align-items:flex-end;justify-content:center;}
.hole{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:90%;height:36%;
  background:radial-gradient(ellipse at 50% 30%,#000 0%,#0a0820 38%,#1a1240 72%,transparent 100%);
  border:1.5px solid rgba(34,211,238,.45);
  border-radius:50%;
  box-shadow:
    0 0 16px rgba(34,211,238,.4),
    0 0 32px rgba(34,211,238,.22),
    inset 0 6px 14px rgba(0,0,0,.92),
    inset 0 -2px 6px rgba(34,211,238,.18);
  z-index:1;
}
/* 홀 외곽 발광 */
.hole::before{content:'';position:absolute;inset:-12% -10% -36% -10%;
  background:radial-gradient(ellipse at 50% 90%,rgba(168,85,247,.32) 0%,transparent 65%);
  z-index:-1;border-radius:50%;filter:blur(4px);}
.hole::after{content:'';position:absolute;left:8%;right:8%;top:-4%;height:22%;
  background:radial-gradient(ellipse at 50% 100%,rgba(34,211,238,.4),transparent 70%);
  border-radius:50%;filter:blur(2px);}
.mole{position:absolute;left:50%;bottom:8%;width:62%;transform:translate(-50%,75%) scaleY(.9);z-index:2;pointer-events:none;will-change:transform;}
.mole.show{pointer-events:auto;}
.mole-body{position:relative;width:100%;aspect-ratio:1.05/1;
  background:radial-gradient(ellipse at 50% 28%,#312e6b 0%,#1a1240 56%,#08081a 100%);
  border:1.5px solid rgba(168,85,247,.5);
  border-radius:50% 50% 46% 46% / 60% 60% 42% 42%;
  box-shadow:
    0 8px 18px rgba(0,0,0,.55),
    0 0 22px rgba(168,85,247,.32),
    inset 0 -10px 14px rgba(0,0,0,.65),
    inset 0 6px 0 rgba(232,121,249,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6%;}
.mole-snout{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);width:42%;height:30%;
  background:radial-gradient(ellipse at 50% 28%,rgba(232,121,249,.42) 0%,rgba(168,85,247,.18) 60%,transparent 100%);
  border-radius:50%;filter:blur(1px);}
.mole-nose{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:22%;height:26%;
  background:radial-gradient(circle at 50% 40%,#f472b6 0%,#a855f7 55%,#1a0a36 100%);
  border-radius:50%;
  box-shadow:0 0 10px rgba(244,114,182,.85),0 0 18px rgba(232,121,249,.55);}
/* 네온 눈 */
.mole-eye{position:absolute;top:22%;width:18%;height:22%;
  background:radial-gradient(circle at 50% 50%,#fff 0%,#22d3ee 30%,#0891b2 70%,transparent 100%);
  border-radius:50%;
  box-shadow:0 0 12px rgba(34,211,238,.95),0 0 24px rgba(34,211,238,.55);
  animation:eyeBlink 3.4s ease-in-out infinite;}
.mole-eye.l{left:18%;}.mole-eye.r{right:18%;animation-delay:.15s;}
.mole-eye::after{display:none;}
@keyframes eyeBlink{0%,92%,100%{opacity:1;}96%{opacity:.2;transform:scaleY(.2);}}
/* 수염 제거 — 어두운 실루엣에 안 어울림 */
.mole-whisker{display:none;}
/* ── 단어 표시: 네온 글로우 텍스트 ── */
.mole-sign{position:absolute;bottom:108%;left:50%;transform:translateX(-50%);
  font-family:'Baloo 2',sans-serif;font-weight:900;font-size:1.15rem;letter-spacing:.6px;
  color:var(--neon-amber);
  text-shadow:
    0 0 8px rgba(251,191,36,.95),
    0 0 18px rgba(251,191,36,.7),
    0 0 32px rgba(251,191,36,.45);
  white-space:nowrap;padding:0 6px;background:none;border:none;}
.mole-sign::after{display:none;}

/* ── 아이템 스킨 ── */
/* 골드: 황금색 몸통 + 황금 단어 + 별 마크 */
.mole.gold .mole-body{
  background:radial-gradient(ellipse at 50% 28%,#fde047 0%,#f59e0b 50%,#92400e 100%);
  border-color:rgba(251,191,36,.9);
  box-shadow:0 0 32px rgba(251,191,36,.75),0 0 56px rgba(251,191,36,.45),
    inset 0 -10px 14px rgba(120,53,15,.55),inset 0 6px 0 rgba(254,243,199,.45);
}
.mole.gold .mole-sign{color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.95),0 0 22px rgba(251,191,36,1),0 0 44px rgba(217,119,6,.85);}
.mole.gold .mole-sign::before{content:'⭐ ';font-size:1.1em;}
.mole.gold .mole-sign::after{content:' ⭐';display:inline;font-size:1.1em;position:static;background:none;width:auto;height:auto;}
.mole.gold .mole-eye{background:radial-gradient(circle at 50% 50%,#fff 0%,#fde047 35%,#b45309 75%,transparent 100%);
  box-shadow:0 0 14px rgba(253,224,71,.95);}

/* 다이아: 시안/하얀 다이아 빛 + 단어 */
.mole.diamond .mole-body{
  background:radial-gradient(ellipse at 50% 28%,#e0f7fa 0%,#67e8f9 45%,#0e7490 100%);
  border-color:rgba(34,211,238,1);
  box-shadow:0 0 36px rgba(34,211,238,.85),0 0 64px rgba(165,243,252,.55),
    inset 0 -10px 14px rgba(8,51,68,.55),inset 0 6px 0 rgba(224,247,250,.5);
  animation:diamondShimmer 1.2s ease-in-out infinite;
}
@keyframes diamondShimmer{
  0%,100%{filter:brightness(1) hue-rotate(0deg);}
  50%{filter:brightness(1.18) hue-rotate(-12deg);}
}
.mole.diamond .mole-sign{color:#fff;
  text-shadow:0 0 12px rgba(255,255,255,.95),0 0 24px rgba(34,211,238,1),0 0 44px rgba(165,243,252,.85);}
.mole.diamond .mole-sign::before{content:'💎 ';font-size:1.1em;}
.mole.diamond .mole-sign::after{content:' ×2';display:inline;font-size:.85em;color:var(--neon-amber);position:static;background:none;width:auto;height:auto;
  text-shadow:0 0 8px rgba(251,191,36,.85);}
.mole.diamond .mole-eye{background:radial-gradient(circle at 50% 50%,#fff 0%,#a7f3d0 30%,#0891b2 75%,transparent 100%);}

/* 폭탄: 어두운 줄무늬 + 빨간 글로우 + 도화선 */
.mole.bomb .mole-body{
  background:
    repeating-linear-gradient(135deg,#1a0a0a 0,#1a0a0a 6px,#3a0a0a 6px,#3a0a0a 12px),
    radial-gradient(ellipse at 50% 28%,#7f1d1d 0%,#0a0a0a 70%);
  border-color:rgba(248,113,113,.9);
  box-shadow:0 0 28px rgba(248,113,113,.7),0 0 52px rgba(220,38,38,.5),
    inset 0 -10px 14px rgba(0,0,0,.85),inset 0 6px 0 rgba(248,113,113,.22);
  animation:bombTick .55s steps(2) infinite;
}
@keyframes bombTick{
  0%,49%{filter:brightness(1);}
  50%,100%{filter:brightness(1.35);}
}
.mole.bomb .mole-eye{background:radial-gradient(circle at 50% 50%,#fff 0%,#f87171 28%,#7f1d1d 70%,transparent 100%);
  box-shadow:0 0 14px rgba(248,113,113,.95),0 0 24px rgba(248,113,113,.6);}
.mole.bomb .mole-snout,.mole.bomb .mole-nose{display:none;}
.mole.bomb .mole-sign{display:none;}
.mole.bomb .mole-body::before{content:'💣';position:absolute;top:-22%;left:50%;transform:translateX(-50%);
  font-size:1.6rem;filter:drop-shadow(0 0 8px rgba(248,113,113,.9));animation:bombFuse .7s ease-in-out infinite;}
@keyframes bombFuse{
  0%,100%{transform:translateX(-50%) rotate(-6deg) scale(1);}
  50%{transform:translateX(-50%) rotate(6deg) scale(1.08);}
}

/* 하트: 핑크 몸통 + 하트 마크 */
.mole.heart .mole-body{
  background:radial-gradient(ellipse at 50% 28%,#fce7f3 0%,#f472b6 45%,#831843 100%);
  border-color:rgba(244,114,182,.9);
  box-shadow:0 0 28px rgba(244,114,182,.7),0 0 50px rgba(244,114,182,.45),
    inset 0 -10px 14px rgba(131,24,67,.6),inset 0 6px 0 rgba(252,231,243,.5);
}
.mole.heart .mole-eye{background:radial-gradient(circle at 50% 50%,#fff 0%,#fbcfe8 30%,#be185d 75%,transparent 100%);}
.mole.grow .mole-body{background:radial-gradient(ellipse at 50% 28%,#d9f99d 0%,#84cc16 48%,#3f6212 100%);}
.mole.grow .mole-eye{background:radial-gradient(circle at 50% 50%,#fff 0%,#bef264 30%,#4d7c0f 75%,transparent 100%);}
.mole.shrink .mole-body{background:radial-gradient(ellipse at 50% 28%,#cbd5e1 0%,#64748b 48%,#1e293b 100%);}
.mole.shrink .mole-eye{background:radial-gradient(circle at 50% 50%,#fff 0%,#cbd5e1 30%,#475569 75%,transparent 100%);}
.mole-tool{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:3;
  font-size:clamp(1.6rem,7vw,2.4rem);pointer-events:none;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.7));line-height:1;}
.mole.heart .mole-sign{display:none;}
.mole.heart .mole-body::before{content:'❤️';position:absolute;top:-22%;left:50%;transform:translateX(-50%);
  font-size:1.7rem;filter:drop-shadow(0 0 8px rgba(244,114,182,.9));
  animation:heartBeat .65s ease-in-out infinite;}
@keyframes heartBeat{
  0%,100%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.18);}
}

/* ── motion phases ── */
.mole.popping{animation:molePop .42s cubic-bezier(.32,1.4,.42,1) forwards;}
.mole.up{animation:moleBob 1.6s ease-in-out infinite;animation-delay:.42s;}
.mole.submerge{animation:moleSubmerge .36s cubic-bezier(.5,.0,.7,.4) forwards;}
.mole.hit{animation:moleHit .42s cubic-bezier(.3,.5,.4,1) forwards;}
.mole.miss{animation:moleMiss .38s ease forwards;}

@keyframes molePop{
  0%  {transform:translate(-50%,90%) scaleY(.72) scaleX(1.08);}
  35% {transform:translate(-50%,-22%) scaleY(1.12) scaleX(.92);}
  62% {transform:translate(-50%,4%) scaleY(.92) scaleX(1.06);}
  82% {transform:translate(-50%,-4%) scaleY(1.04) scaleX(.98);}
  100%{transform:translate(-50%,0%)  scaleY(1)    scaleX(1);}
}
@keyframes moleBob{
  0%,100%{transform:translate(-50%,0%) rotate(-1.2deg);}
  50%    {transform:translate(-50%,-5%) rotate(1.2deg);}
}
@keyframes moleSubmerge{
  0%  {transform:translate(-50%,0%) scaleY(1) scaleX(1);}
  18% {transform:translate(-50%,-12%) scaleY(1.16) scaleX(.84);}
  55% {transform:translate(-50%,45%) scaleY(.7) scaleX(1.14);}
  100%{transform:translate(-50%,95%) scaleY(.5) scaleX(1.2);opacity:.7;}
}
@keyframes moleHit{
  0%  {transform:translate(-50%,0%) scaleY(1) scaleX(1);}
  20% {transform:translate(-50%,18%) scaleY(.42) scaleX(1.4);filter:brightness(1.45);}
  60% {transform:translate(-50%,80%) scaleY(.32) scaleX(1.2);filter:brightness(1);opacity:.85;}
  100%{transform:translate(-50%,110%) scaleY(.2) scaleX(1.05);opacity:0;}
}
@keyframes moleMiss{
  0%,100%{transform:translate(-50%,0%);}
  25%  {transform:translate(-58%,0%) rotate(-6deg);}
  60%  {transform:translate(-42%,0%) rotate(6deg);}
  82%  {transform:translate(-52%,0%) rotate(-2deg);}
}

/* ── dust puff ── */
.dust{position:absolute;left:50%;bottom:18%;width:0;height:0;pointer-events:none;z-index:3;}
.dust span{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle,#fef3c7 0%,var(--neon-amber) 50%,rgba(251,191,36,0) 100%);
  transform:translate(-50%,-50%);animation:dustOut .58s ease-out forwards;
  box-shadow:0 0 10px rgba(251,191,36,.6);}
@keyframes dustOut{
  0%  {opacity:0;transform:translate(-50%,-50%) scale(.4);}
  20% {opacity:1;}
  100%{opacity:0;transform:translate(var(--dx,40px),var(--dy,-60px)) scale(1.4);}
}

<script src="../game/questions.js?v=questions-20260715a"></script>
<script>
const SLOT_COUNT = 9;
const ROUND_QUESTIONS = 10;
// 난이도 변수 — 라운드가 올라갈수록 applyRoundDifficulty()가 조정 (기본값=라운드1)
let Q_TIME = 9500;            // per-question time limit (ms)
let MOLE_LIFE_MIN = 3000;     // mole on-screen min
let MOLE_LIFE_MAX = 4200;     // mole on-screen max
let SPAWN_INTERVAL = [780, 1180]; // ms between spawns
let MAX_LIVE_MOLES = 3;
let round = 1;               // 현재 라운드(스테이지)

// 라운드별 난이도: 두더지가 더 빨리 사라지고, 제한시간 짧아지고, 더 자주 나옴
function applyRoundDifficulty() {
  const r = round - 1;       // 0부터
  Q_TIME = Math.max(4500, 9500 - r * 1000);
  MOLE_LIFE_MIN = Math.max(1400, 3000 - r * 350);
  MOLE_LIFE_MAX = Math.max(2200, 4200 - r * 400);
  const lo = Math.max(380, 780 - r * 90);
  const hi = Math.max(640, 1180 - r * 110);
  SPAWN_INTERVAL = [lo, hi];
  MAX_LIVE_MOLES = Math.min(5, 3 + Math.floor(r / 2));
}

let unitKey = 'g1-l1';
let questionPool = [];
let qIdx = 0;
let score = 0;
let combo = 0;
let bestCombo = 0;
let hp = 3;
let correctCount = 0;
let whackWrongItems = [];
let answered = false;
// 틀린 문제 간단 해설: 정답 채운 완성 문장(빈칸형) / O·X 안내(OX형)
function makeHint(q, ans) {
  if (q.type === 'ox') return ans === 'O' ? '✅ 어법에 맞는 문장이에요' : '❌ 어법상 틀린 문장이에요 — 바르게 고쳐 보세요';
  if (/_{3,}/.test(q.eng || '')) return '정답 문장: ' + q.eng.replace(/_{3,}/, '<b>' + ans + '</b>');
  return '정답: <b>' + ans + '</b>';
}
let qStart = 0;
let qTimerRaf = 0;
let spawnTimer = 0;
let qTimeoutTimer = 0;
let liveMoles = new Map(); // slotIdx → mole DOM
let pendingOpts = [];      // options yet to spawn for current question
let currentAns = '';
let gameRunning = false;

const grid = document.getElementById('grid');
const field = document.getElementById('field');
const qKor = document.getElementById('q-kor');
const qEng = document.getElementById('q-eng');
const qProg = document.getElementById('q-progress');
const qBar = document.getElementById('q-bar');
const hudScore = document.getElementById('hud-score');
const hudCombo = document.getElementById('hud-combo');
const hudHp = document.getElementById('hud-hp');
const hudBoost = document.getElementById('hud-boost');
const hudBoostTime = document.getElementById('hud-boost-time');

// ── 아이템 시스템 상태 ────────────────────────────────
const MAX_HP = 3;
let scoreMultiplier = 1;
let multiplierUntil = 0;
let multiplierRaf = 0;
let bombTimer = 0;
let heartTimer = 0;
// 정답 모래에 골드/다이아 스킨 적용 확률
const GOLD_CHANCE = 0.10;
const DIAMOND_CHANCE = 0.05;
// 폭탄/하트 스폰 주기 (ms) — 매번 확률로 발동
const BOMB_INTERVAL = [4000, 7000];
const BOMB_CHANCE = 0.55;
const HEART_INTERVAL = [6000, 10000];
const HEART_CHANCE = 0.45;
const SPECIAL_LIFE_MIN = 2200;
const SPECIAL_LIFE_MAX = 3400;

function buildGrid() {
  grid.innerHTML = '';
  for (let i = 0; i < SLOT_COUNT; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.idx = i;
    slot.innerHTML = '<div class="hole"></div>';
    grid.appendChild(slot);
  }
}

function buildUnitList() {
  const list = document.getElementById('unit-list');
  list.innerHTML = '';
  Object.entries(GAME_QUESTIONS).forEach(([key, info]) => {
    const btn = document.createElement('button');
    btn.textContent = info.label.replace('중1 ', '').replace('중2 ', 'g2-');
    btn.dataset.key = key;
    if (key === unitKey) btn.classList.add('on');
    btn.addEventListener('click', () => {
      list.querySelectorAll('button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      unitKey = key;
    });
    list.appendChild(btn);
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickQuestionPool(key) {
  const src = GAME_QUESTIONS[key];
  if (!src) return [];
  // 빈칸형(___) 또는 OX(O/X 판단) 문항만 사용. OX는 빈칸이 없어도 O/X 두더지로 출제.
  const playable = src.questions.filter(q => /_{3,}/.test(q.eng || '') || q.type === 'ox');
  return shuffle(playable.slice()).slice(0, ROUND_QUESTIONS);
}

function startGame() {
  round = 1;
  applyRoundDifficulty();
  questionPool = pickQuestionPool(unitKey);
  if (!questionPool.length) { alert('문제를 불러올 수 없어요.'); return; }
  qIdx = 0; score = 0; combo = 0; bestCombo = 0; hp = MAX_HP; correctCount = 0; whackWrongItems = [];
  endHammerFx();
  updateRoundBadge();
  endBoost();
  clearTimeout(bombTimer); clearTimeout(heartTimer);
  document.getElementById('screen-start').classList.add('hide');
  document.getElementById('screen-end').classList.add('hide');
  buildGrid();
  updateHud();
  gameRunning = true;
  nextQuestion();
  // 특수 아이템 스폰 사이클 시작
  scheduleBomb();
  scheduleHeart();
  scheduleHammer();
  startWhackBgm();   // 시작 버튼 제스처 안에서 즉시 — iOS 오디오 잠금해제 보장
}

function endGame() {
  gameRunning = false;
  stopWhackBgm();
  cancelAnimationFrame(qTimerRaf);
  clearTimeout(spawnTimer);
  clearTimeout(qTimeoutTimer);
  clearTimeout(bombTimer);
  clearTimeout(heartTimer);
  endBoost();
  liveMoles.forEach((rec) => {
    if (rec.lifeTimer) clearTimeout(rec.lifeTimer);
    if (rec.mole) rec.mole.remove();
  });
  liveMoles.clear();
  const isGameOver = hp <= 0;
  const cleared = !isGameOver;   // 라운드 클리어(HP 남음)
  const title = isGameOver ? 'GAME OVER' : `ROUND ${round} 클리어!`;
  document.getElementById('end-title').textContent = title;
  document.getElementById('end-sub').textContent = isGameOver
    ? `HP 소진 · ROUND ${round}에서 종료 · ${correctCount} 정답`
    : `${correctCount} / ${questionPool.length} 정답 · 최고 콤보 ${bestCombo} · 다음 라운드는 더 빨라져요!`;
  document.getElementById('end-score').textContent = score;
  document.getElementById('end-correct').textContent = correctCount;
  document.getElementById('end-combo').textContent = bestCombo;
  const retryBtn = document.getElementById('btn-retry');
  const nextBtn = document.getElementById('btn-next-round');
  if (cleared) {
    // 클리어 → 다음 라운드 버튼 강조, 재시작은 작게
    if (nextBtn) { nextBtn.classList.remove('hide'); nextBtn.textContent = `🔥 ROUND ${round + 1} 도전!`; }
    retryBtn.classList.remove('retry-big');
    retryBtn.textContent = '처음부터';
  } else {
    if (nextBtn) nextBtn.classList.add('hide');
    retryBtn.classList.add('retry-big');
    retryBtn.textContent = '재도전';
  }
  document.getElementById('screen-end').classList.remove('hide');
  // 라운드 클리어(다음 라운드 가능) 때는 점수팝업이 '다음 라운드' 버튼을 덮으므로 게임오버에서만 표시
  if (isGameOver && typeof window.showScorePopup === 'function') {
    window.showScorePopup(correctCount, questionPool.length, { title, wrongItems: whackWrongItems });
  }
}

// 다음 라운드: 점수·기록 누적 유지, 난이도 상승, 새 문제
function nextRound() {
  round++;
  applyRoundDifficulty();
  questionPool = pickQuestionPool(unitKey);
  if (!questionPool.length) { questionPool = pickQuestionPool(unitKey); }
  qIdx = 0; combo = 0; hp = MAX_HP; whackWrongItems = [];
  // score / correctCount / bestCombo 는 누적 유지
  endBoost();
  endHammerFx();
  clearTimeout(bombTimer); clearTimeout(heartTimer);
  document.getElementById('screen-end').classList.add('hide');
  const nextBtn = document.getElementById('btn-next-round');
  if (nextBtn) nextBtn.classList.add('hide');
  buildGrid();
  updateRoundBadge();
  updateHud();
  gameRunning = true;
  nextQuestion();
  scheduleBomb();
  scheduleHeart();
  scheduleHammer();
  startWhackBgm();   // 버튼 제스처 안에서 즉시
}

function updateRoundBadge() {
  const el = document.getElementById('hud-round');
  if (el) el.textContent = 'R' + round;
}

function updateHud() {
  hudScore.textContent = score;
  hudCombo.textContent = '×' + combo;
  const hpSpans = hudHp.querySelectorAll('span');
  hpSpans.forEach((sp, i) => sp.classList.toggle('gone', i >= hp));
}

function renderQuestion() {
  const q = questionPool[qIdx];
  qKor.textContent = q.kor;
  // q.eng has '___' — substitute a wrong option in red strike-through so the
  // sentence reads as an error to fix, then student picks the right answer mole
  const hintEl = document.getElementById('q-hint');
  if (q.type === 'ox') {
    // OX: 문장을 그대로 보여주고 O/X 두더지를 고르게 한다(빈칸 치환 없음)
    qEng.textContent = q.eng;
    if (hintEl) hintEl.textContent = '맞으면 O · 틀리면 X 두더지를 두드려요';
  } else {
    const wrongOpt = q.opts.find(o => o !== q.ans) || '____';
    const safe = wrongOpt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // strip parenthetical hints like '(be)' / '(be, 부정형)' — they suit fill-in-blank, not error-correction
    const cleaned = q.eng.replace(/\s*\([^)]*\)/g, '');
    qEng.innerHTML = cleaned.replace(/_{3,}/g, `<span class="qwrong">${safe}</span>`);
    if (hintEl) hintEl.textContent = '⚠ 틀린 부분을 고쳐 두드리세요';
  }
  qProg.textContent = `${qIdx + 1} / ${questionPool.length}`;
}

function nextQuestion() {
  if (!gameRunning) return;
  if (qIdx >= questionPool.length || hp <= 0) { endGame(); return; }
  answered = false;
  const q = questionPool[qIdx];
  currentAns = q.ans;
  pendingOpts = shuffle(q.opts.slice());
  renderQuestion();
  qStart = performance.now();
  cancelAnimationFrame(qTimerRaf);
  qTimerRaf = requestAnimationFrame(tickQTimer);
  clearTimeout(qTimeoutTimer);
  qTimeoutTimer = setTimeout(onQTimeout, Q_TIME);
  scheduleSpawn(120);
}

function tickQTimer() {
  if (!gameRunning || answered) return;
  const elapsed = performance.now() - qStart;
  const left = Math.max(0, 1 - elapsed / Q_TIME);
  qBar.style.transform = `scaleX(${left})`;
  if (left > 0) qTimerRaf = requestAnimationFrame(tickQTimer);
}

function onQTimeout() {
  if (answered) return;
  answered = true;
  loseHp();
  spawnStrike('시간초과', 'ng');
  playWhackMiss();
  const curQ = questionPool[qIdx];
  if (curQ) whackWrongItems.push({ question: (curQ.kor ? curQ.kor + ' / ' : '') + curQ.eng, my: '(시간초과)', right: currentAns, hintHtml: makeHint(curQ, currentAns) });
  if (hp <= 0) { triggerGameOver(); return; }
  setTimeout(advance, 700);
}

function advance() {
  cancelAnimationFrame(qTimerRaf);
  clearTimeout(qTimeoutTimer);
  clearTimeout(spawnTimer);
  pendingOpts = [];
  liveMoles.forEach(({mole, lifeTimer}) => {
    clearTimeout(lifeTimer);
    submergeMole(mole);
  });
  liveMoles.clear();
  qIdx++;
  setTimeout(nextQuestion, 460);
}

function scheduleSpawn(delay) {
  if (!gameRunning || answered) return;
  clearTimeout(spawnTimer);
  spawnTimer = setTimeout(spawnMole, delay);
}

function spawnMole() {
  if (!gameRunning || answered) return;
  if (liveMoles.size >= MAX_LIVE_MOLES) {
    scheduleSpawn(420);
    return;
  }
  if (!pendingOpts.length) {
    // re-cycle full option set so the correct answer keeps reappearing
    const q = questionPool[qIdx];
    pendingOpts = shuffle(q.opts.slice());
  }
  // ensure the correct answer is alive or queued: if not, promote it
  const aliveWords = new Set([...liveMoles.values()].map(v => v.word));
  if (!aliveWords.has(currentAns) && !pendingOpts.includes(currentAns)) {
    pendingOpts.unshift(currentAns);
  }
  const word = pendingOpts.shift();
  // pick an empty slot (also skip slots still hosting a submerging mole in DOM)
  const occupied = new Set(liveMoles.keys());
  const avail = [];
  for (let i = 0; i < SLOT_COUNT; i++) {
    if (occupied.has(i)) continue;
    if (grid.children[i].querySelector('.mole')) continue;
    avail.push(i);
  }
  if (!avail.length) { scheduleSpawn(380); return; }
  const slotIdx = avail[Math.floor(Math.random() * avail.length)];
  const slot = grid.children[slotIdx];
  const mole = document.createElement('div');
  // 정답 단어인 경우에만 골드/다이아 스킨 추첨
  let skin = '';
  if (word === currentAns) {
    const r = Math.random();
    if (r < DIAMOND_CHANCE) skin = ' diamond';
    else if (r < DIAMOND_CHANCE + GOLD_CHANCE) skin = ' gold';
  }
  mole.className = 'mole show popping' + skin;
  mole.innerHTML = `
    <div class="mole-sign">${word}</div>
    <div class="mole-body">
      <div class="mole-eye l"></div><div class="mole-eye r"></div>
      <div class="mole-snout"><div class="mole-nose"></div></div>
      <div class="mole-whisker l"></div><div class="mole-whisker r"></div>
    </div>`;
  slot.appendChild(mole);
  // after pop, switch to idle bob
  setTimeout(() => {
    if (mole.parentNode) mole.classList.replace('popping', 'up');
  }, 420);
  mole.addEventListener('click', (e) => handleHit(e, mole, slotIdx, word), { once: true });
  mole.addEventListener('touchend', (e) => { e.preventDefault(); handleHit(e, mole, slotIdx, word); }, { once: true });
  const life = MOLE_LIFE_MIN + Math.random() * (MOLE_LIFE_MAX - MOLE_LIFE_MIN);
  const lifeTimer = setTimeout(() => {
    if (liveMoles.has(slotIdx)) {
      submergeMole(mole);
      liveMoles.delete(slotIdx);
    }
  }, life);
  liveMoles.set(slotIdx, { mole, lifeTimer, word });
  scheduleSpawn(SPAWN_INTERVAL[0] + Math.random() * (SPAWN_INTERVAL[1] - SPAWN_INTERVAL[0]));
}

// 폭탄/하트 등 특수 모래 스폰
function spawnSpecial(kind) {
  if (!gameRunning || answered) return null;
  const occupied = new Set(liveMoles.keys());
  const avail = [];
  for (let i = 0; i < SLOT_COUNT; i++) {
    if (occupied.has(i)) continue;
    if (grid.children[i].querySelector('.mole')) continue;
    avail.push(i);
  }
  if (!avail.length) return null;
  const slotIdx = avail[Math.floor(Math.random() * avail.length)];
  const slot = grid.children[slotIdx];
  const mole = document.createElement('div');
  mole.className = `mole show popping ${kind}`;
  // 🔨/🔧 아이콘을 몸통 중앙에 올림(보이는 곳=눌리는 곳). 라벨은 클릭 안 가로채게 pointer-events:none.
  const tool = kind === 'grow' ? '<div class="mole-tool">🔨</div>'
             : kind === 'shrink' ? '<div class="mole-tool">🔧</div>' : '';
  mole.innerHTML = `
    <div class="mole-body">
      <div class="mole-eye l"></div><div class="mole-eye r"></div>
    </div>
    ${tool}`;
  slot.appendChild(mole);
  setTimeout(() => {
    if (mole.parentNode) mole.classList.replace('popping', 'up');
  }, 420);
  mole.addEventListener('click', (e) => handleHit(e, mole, slotIdx, null), { once: true });
  mole.addEventListener('touchend', (e) => { e.preventDefault(); handleHit(e, mole, slotIdx, null); }, { once: true });
  const life = SPECIAL_LIFE_MIN + Math.random() * (SPECIAL_LIFE_MAX - SPECIAL_LIFE_MIN);
  const lifeTimer = setTimeout(() => {
    if (liveMoles.has(slotIdx)) {
      submergeMole(mole);
      liveMoles.delete(slotIdx);
    }
  }, life);
  liveMoles.set(slotIdx, { mole, lifeTimer, word: null, kind });
  return slotIdx;
}

function scheduleBomb() {
  clearTimeout(bombTimer);
  const delay = BOMB_INTERVAL[0] + Math.random() * (BOMB_INTERVAL[1] - BOMB_INTERVAL[0]);
  bombTimer = setTimeout(() => {
    if (!gameRunning) return;
    if (Math.random() < BOMB_CHANCE) spawnSpecial('bomb');
    scheduleBomb();
  }, delay);
}
function scheduleHeart() {
  clearTimeout(heartTimer);
  const delay = HEART_INTERVAL[0] + Math.random() * (HEART_INTERVAL[1] - HEART_INTERVAL[0]);
  heartTimer = setTimeout(() => {
    if (!gameRunning) return;
    // HP가 부족할 때만 등장
    if (hp < MAX_HP && Math.random() < HEART_CHANCE) spawnSpecial('heart');
    scheduleHeart();
  }, delay);
}

function submergeMole(mole) {
  if (!mole || !mole.parentNode) return;
  mole.classList.remove('up', 'popping');
  mole.classList.add('submerge');
  mole.style.pointerEvents = 'none';
  setTimeout(() => mole.remove(), 380);
}

function handleHit(e, mole, slotIdx, word) {
  if (!gameRunning || answered) return;
  // 특수 모래 처리
  const rec = liveMoles.get(slotIdx);
  if (rec) clearTimeout(rec.lifeTimer);
  liveMoles.delete(slotIdx);
  mole.style.pointerEvents = 'none';
  const kind = rec && rec.kind;
  if (kind === 'bomb') { onBombHit(mole); return; }
  if (kind === 'heart') { onHeartHit(mole); return; }
  if (kind === 'grow' || kind === 'shrink') { onHammerHit(mole, kind); return; }
  // 일반 정답/오답
  const correct = word === currentAns;
  spawnSmash(mole, correct ? 'ok' : 'ng');
  shakeField();
  playWhackHit();
  if (correct) {
    answered = true;
    correctCount++;
    combo++;
    bestCombo = Math.max(bestCombo, combo);
    const baseGain = 100 + Math.min(combo - 1, 9) * 20;
    const goldBonus = mole.classList.contains('gold') ? 500 : 0;
    const diamond = mole.classList.contains('diamond');
    const mult = boostActive() ? 2 : 1;
    const gain = (baseGain + goldBonus) * mult;
    score += gain;
    if (diamond) activateBoost(10);
    mole.classList.remove('up', 'popping');
    mole.classList.add('hit');
    burstDust(mole);
    const popLabel = goldBonus ? `+${gain} ⭐` : (diamond ? `+${gain} 💎×2` : `+${gain}`);
    spawnPop(popLabel);
    const strikeLabel = diamond ? '×2 부스트!' : (goldBonus ? '골드!' : (combo > 1 ? `${combo}콤보!` : '정답!'));
    spawnStrike(strikeLabel, 'ok');
    if (typeof window.toast === 'function') window.toast('맞아!', 'ok');
    setTimeout(() => mole.remove(), 420);
    bumpScoreUI();
    updateHud();
    setTimeout(advance, 560);
  } else {
    combo = 0;
    loseHp();
    mole.classList.remove('up', 'popping');
    mole.classList.add('miss');
    spawnStrike('빗나감!', 'ng');
    playWhackMiss();
    const curQ = questionPool[qIdx];
    if (curQ) whackWrongItems.push({ question: (curQ.kor ? curQ.kor + ' / ' : '') + curQ.eng, my: word || '(없음)', right: currentAns, hintHtml: makeHint(curQ, currentAns) });
    setTimeout(() => submergeMole(mole), 380);
    updateHud();
    if (hp <= 0) { answered = true; triggerGameOver(); }
  }
}

function onBombHit(mole) {
  spawnSmash(mole, 'ng');
  shakeField();
  playWhackMiss();
  score = Math.max(0, score - 200);
  hp = Math.max(0, hp - 1);
  combo = 0;
  endBoost();  // 폭탄에 부스트 해제
  mole.classList.remove('up', 'popping');
  mole.classList.add('hit');
  field.classList.add('ng-flash');
  setTimeout(() => field.classList.remove('ng-flash'), 340);
  spawnPop('−200 💣');
  spawnStrike('폭탄!', 'ng');
  setTimeout(() => mole.remove(), 420);
  bumpScoreUI();
  updateHud();
  if (hp <= 0) { answered = true; triggerGameOver(); }
}

function onHeartHit(mole) {
  shakeField();
  playWhackHit();
  hp = Math.min(MAX_HP, hp + 1);
  mole.classList.remove('up', 'popping');
  mole.classList.add('hit');
  burstDust(mole);
  field.classList.add('ok-flash');
  setTimeout(() => field.classList.remove('ok-flash'), 340);
  spawnPop('HP +1 ❤️');
  spawnStrike('회복!', 'ok');
  setTimeout(() => mole.remove(), 420);
  updateHud();
}

// ── ×2 부스트 ────────────────────────────────────────
function boostActive() { return performance.now() < multiplierUntil; }
function activateBoost(seconds) {
  multiplierUntil = performance.now() + seconds * 1000;
  scoreMultiplier = 2;
  hudBoost.classList.remove('hide');
  cancelAnimationFrame(multiplierRaf);
  tickBoost();
}
function endBoost() {
  multiplierUntil = 0;
  scoreMultiplier = 1;
  hudBoost.classList.add('hide');
  cancelAnimationFrame(multiplierRaf);
}

// ── 망치 크기 이벤트 ──────────────────────────────────
// 🔨 확대 두더지 = 망치 커짐(쉬움), 🔧 축소 두더지 = 망치 작아짐(어려움)
let hammerTimer = 0;
let hammerFxTimer = 0;
const HAMMER_INTERVAL = [7000, 12000];
const HAMMER_CHANCE = 0.5;
function hammerCursor(size) {
  const s = size, scale = size / 44;
  const off = Math.round(16 * scale);
  return `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}' viewBox='0 0 44 44'><g transform='rotate(-30 22 22)'><rect x='19' y='15' width='6' height='24' rx='2' fill='%23581c87'/><rect x='10' y='4' width='24' height='14' rx='3' fill='%23f472b6'/><rect x='10' y='4' width='24' height='5' rx='2' fill='%23fbcfe8'/></g></svg>") ${off} ${Math.round(4*scale)}, pointer`;
}
function applyHammerScale(scale, seconds, label, type) {
  clearTimeout(hammerFxTimer);
  field.style.cursor = hammerCursor(Math.round(44 * scale));
  spawnStrike(label, type);
  hammerFxTimer = setTimeout(endHammerFx, seconds * 1000);
}
function endHammerFx() {
  clearTimeout(hammerFxTimer);
  field.style.cursor = '';   // CSS 기본 망치 커서로 복귀
}
function scheduleHammer() {
  clearTimeout(hammerTimer);
  const delay = HAMMER_INTERVAL[0] + Math.random() * (HAMMER_INTERVAL[1] - HAMMER_INTERVAL[0]);
  hammerTimer = setTimeout(() => {
    if (!gameRunning) return;
    if (Math.random() < HAMMER_CHANCE) spawnSpecial(Math.random() < 0.5 ? 'grow' : 'shrink');
    scheduleHammer();
  }, delay);
}
function onHammerHit(mole, kind) {
  shakeField();
  playWhackHit();
  mole.classList.remove('up', 'popping');
  mole.classList.add('hit');
  burstDust(mole);
  if (kind === 'grow') {
    field.classList.add('ok-flash');
    setTimeout(() => field.classList.remove('ok-flash'), 340);
    spawnPop('🔨 망치 확대!');
    applyHammerScale(1.7, 8, '망치가 커졌다!', 'ok');
  } else {
    field.classList.add('ng-flash');
    setTimeout(() => field.classList.remove('ng-flash'), 340);
    spawnPop('🔧 망치 축소!');
    applyHammerScale(0.6, 8, '망치가 작아졌다!', 'ng');
  }
  setTimeout(() => mole.remove(), 420);
}
function tickBoost() {
  const left = multiplierUntil - performance.now();
  if (left <= 0) { endBoost(); return; }
  hudBoostTime.textContent = Math.ceil(left / 1000);
  multiplierRaf = requestAnimationFrame(tickBoost);
}

function bumpScoreUI() {
  hudScore.classList.remove('score-bump');
  void hudScore.offsetWidth;
  hudScore.classList.add('score-bump');
  setTimeout(() => hudScore.classList.remove('score-bump'), 240);
}

// 점수 계산식에 score-bump 자동 적용을 위해 기존 점수 변경 후 호출 보장하도록 일반 정답 외 경로 처리:
function _scoreChanged() { bumpScoreUI(); }

function shakeField() {
  field.classList.remove('shake');
  // force reflow so the animation restarts
  void field.offsetWidth;
  field.classList.add('shake');
  const app = document.getElementById('app');
  app.classList.remove('shake-mid');
  void app.offsetWidth;
  app.classList.add('shake-mid');
  setTimeout(() => app.classList.remove('shake-mid'), 460);
}

// ── inline 사운드 (whack 전용, sounds.js 건드리지 않음) ──────────────
let _whackCtx = null;
function whackAC() {
  if (!_whackCtx) {
    try { _whackCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (_whackCtx.state === 'suspended') _whackCtx.resume().catch(() => {});
  return _whackCtx;
}
// iOS Safari/크로스오리진 대응: 첫 제스처에 무음 버퍼로 AudioContext 잠금 해제
(function () {
  let unlocked = false;
  function unlock() {
    const c = whackAC(); if (!c) return;
    try {
      const buf = c.createBuffer(1, 1, 22050);
      const src = c.createBufferSource();
      src.buffer = buf; src.connect(c.destination); src.start(0);
    } catch (e) {}
    if (c.state === 'running') unlocked = true;
    if (unlocked) ['touchstart','touchend','pointerdown','mousedown','click','keydown'].forEach(ev => {
      document.removeEventListener(ev, unlock, true); window.removeEventListener(ev, unlock, true);
    });
  }
  ['touchstart','touchend','pointerdown','mousedown','click','keydown'].forEach(ev => {
    document.addEventListener(ev, unlock, true); window.addEventListener(ev, unlock, true);
  });
})();
function _tone(c, freq, type, t0, dur, vol) {
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function _noiseBurst(c, t0, dur, vol, cutoff) {
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
  const src = c.createBufferSource();
  src.buffer = buf;
  const filt = c.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = cutoff || 1800;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
function playWhackHit() {
  const c = whackAC(); if (!c) return;
  const t = c.currentTime;
  // 저역 thud: 110→55Hz
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(110, t);
  osc.frequency.exponentialRampToValueAtTime(55, t + 0.14);
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t + 0.26);
  _noiseBurst(c, t, 0.07, 0.32, 2400);     // 상단 crack
  _tone(c, 880, 'triangle', t + 0.015, 0.08, 0.12); // 메탈릭 핑
}
function playWhackMiss() {
  const c = whackAC(); if (!c) return;
  const t = c.currentTime;
  _noiseBurst(c, t, 0.18, 0.14, 900);
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(330, t);
  osc.frequency.exponentialRampToValueAtTime(160, t + 0.22);
  g.gain.setValueAtTime(0.14, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t + 0.32);
}
function playGameOver() {
  const c = whackAC(); if (!c) return;
  const t = c.currentTime;
  const thud = c.createOscillator();
  const tg = c.createGain();
  thud.type = 'sine';
  thud.frequency.setValueAtTime(160, t);
  thud.frequency.exponentialRampToValueAtTime(50, t + 0.5);
  tg.gain.setValueAtTime(0.5, t);
  tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
  thud.connect(tg); tg.connect(c.destination);
  thud.start(t); thud.stop(t + 0.74);
  _tone(c, 523.25, 'triangle', t + 0.05, 0.18, 0.22); // C5
  _tone(c, 466.16, 'triangle', t + 0.22, 0.18, 0.22); // Bb4
  _tone(c, 369.99, 'triangle', t + 0.40, 0.22, 0.24); // F#4
  _tone(c, 311.13, 'triangle', t + 0.62, 0.40, 0.26); // Eb4
}

// ── BGM (CC0 8비트 음악 — HTML5 audio, iOS 안정 재생) ──────────
let _whackBgmAudio = null;
function startWhackBgm() {
  if (!_whackBgmAudio) {
    _whackBgmAudio = new Audio('assets/bgm/whack-theme.mp3');
    _whackBgmAudio.loop = true;
    _whackBgmAudio.volume = 0.4;
    _whackBgmAudio.preload = 'auto';
  }
  // 시작 버튼 클릭(제스처) 안에서 호출되므로 iOS에서도 재생됨
  _whackBgmAudio.play().catch(() => {});
}
function stopWhackBgm() {
  if (_whackBgmAudio) { try { _whackBgmAudio.pause(); _whackBgmAudio.currentTime = 0; } catch (e) {} }
}

function spawnSmash(mole, type) {
  const slot = mole.parentNode;
  if (!slot) return;
  // 두더지 머리 기준 위치
  const ring = document.createElement('div');
  ring.className = 'smash' + (type === 'ng' ? ' ng' : '');
  ring.style.left = '50%';
  ring.style.top = '36%';
  slot.appendChild(ring);
  setTimeout(() => ring.remove(), 560);
  // 스파크 6방향 (정답일 때만)
  if (type === 'ok') {
    for (let i = 0; i < 6; i++) {
      const sp = document.createElement('div');
      sp.className = 'spark';
      sp.style.left = '50%';
      sp.style.top = '36%';
      sp.style.setProperty('--a', `${i * 60 + (Math.random() - .5) * 20}deg`);
      slot.appendChild(sp);
      setTimeout(() => sp.remove(), 480);
    }
  }
}

function triggerGameOver() {
  // 두더지/타이머 즉시 정지하지만 게임 오버 연출 후 endGame 호출
  cancelAnimationFrame(qTimerRaf);
  clearTimeout(spawnTimer);
  clearTimeout(qTimeoutTimer);
  clearTimeout(bombTimer);
  clearTimeout(heartTimer);
  endBoost();
  liveMoles.forEach(({mole, lifeTimer}) => {
    clearTimeout(lifeTimer);
    submergeMole(mole);
  });
  liveMoles.clear();
  // 강한 흔들림
  const app = document.getElementById('app');
  app.classList.remove('shake-strong');
  void app.offsetWidth;
  app.classList.add('shake-strong');
  // 어두운 오버레이 + GAME OVER 텍스트
  const overlay = document.createElement('div');
  overlay.className = 'gover-overlay';
  app.appendChild(overlay);
  const text = document.createElement('div');
  text.className = 'gover-text';
  text.textContent = 'GAME OVER';
  app.appendChild(text);
  playGameOver();
  setTimeout(() => {
    overlay.remove();
    text.remove();
    app.classList.remove('shake-strong');
    endGame();
  }, 1700);
}

function loseHp() {
  hp = Math.max(0, hp - 1);
  field.classList.add('ng-flash');
  setTimeout(() => field.classList.remove('ng-flash'), 340);
  updateHud();
}

function burstDust(mole) {
  const slot = mole.parentNode;
  if (!slot) return;
  const dust = document.createElement('div');
  dust.className = 'dust';
  dust.style.left = '50%';
  dust.style.bottom = '24%';
  for (let i = 0; i < 7; i++) {
    const sp = document.createElement('span');
    const ang = -Math.PI / 2 + (Math.random() - .5) * Math.PI * .9;
    const dist = 36 + Math.random() * 30;
    sp.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
    sp.style.setProperty('--dy', `${Math.sin(ang) * dist}px`);
    sp.style.animationDelay = (i * 18) + 'ms';
    dust.appendChild(sp);
  }
  slot.appendChild(dust);
  setTimeout(() => dust.remove(), 700);
  field.classList.add('ok-flash');
  setTimeout(() => field.classList.remove('ok-flash'), 340);
}

function spawnStrike(text, type) {
  const fx = document.createElement('div');
  fx.className = 'strike ' + (type || '');
  fx.textContent = text;
  field.appendChild(fx);
  setTimeout(() => fx.remove(), 600);
}

function spawnPop(text) {
  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.textContent = text;
  field.appendChild(pop);
  setTimeout(() => pop.remove(), 820);
}

// ── debug hook (dev/test only) ──
if (location.search.includes('debug')) {
  window.__whack = { get currentAns(){return currentAns;}, get qIdx(){return qIdx;}, get score(){return score;}, get hp(){return hp;}, get combo(){return combo;} };
}
// ── boot ──
document.getElementById('btn-go').addEventListener('click', startGame);
document.getElementById('btn-retry').addEventListener('click', startGame);
const _params = new URLSearchParams(location.search);
const _unitParam = _params.get('unit');
if (_unitParam && GAME_QUESTIONS[_unitParam]) unitKey = _unitParam;
buildUnitList();
buildGrid();
// 허브에서 ?unit=로 들어오면 시작 화면 없이 바로 게임 시작(시작 버튼이 모바일에서 화면 밖으로
// 밀리는 문제 제거). 자동 시작은 제스처가 없어 BGM이 막히므로 첫 입력에 BGM을 시작한다.
if (_unitParam && GAME_QUESTIONS[_unitParam]) {
  setTimeout(startGame, 60);
  (function () {
    function kick() {
      if (gameRunning) startWhackBgm();
      ['pointerdown','touchstart','click','keydown'].forEach(ev => {
        document.removeEventListener(ev, kick, true); window.removeEventListener(ev, kick, true);
      });
    }
    ['pointerdown','touchstart','click','keydown'].forEach(ev => {
      document.addEventListener(ev, kick, true); window.addEventListener(ev, kick, true);
    });
  })();
}
